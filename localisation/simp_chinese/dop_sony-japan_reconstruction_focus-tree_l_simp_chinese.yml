l_simp_chinese:
 dop_sonyjapan_reconsturuction_tree:0 "盛田与战后重建"
 GNG_focus_everlasting_peace:0 "永远的和平？"
 GNG_focus_everlasting_peace_desc:0 "最终，不那么令人意外的结局还是到来了：西南归于平静，龙绳武的痴心妄想彻底被埋进了坟墓，一切都结束了。\n\n尽管珠三角并未被战火过多波及，但西部地区遭到了浩劫。在联军与护国军的交火中，西部的基础设施几乎被完全破坏，农村也大多被“扫荡”；部分华人选择响应来自云南的号召，为他们的国家而战，导致我们出现了劳动力短缺的现象；此外，这次冲突让我们的社会矛盾又显现出来，原定的发展计划也被打断，我们之前的结果几乎付诸东流。\n\n好在战火已熄。现在支持我们的不仅有珠人的才干和日侨的资金，还有来自东京和南京的直接援助。我们相信，今日的广东仍是共荣圈最耀眼的明珠。"
 GNG_focus_temporary_relief:0 "……或暂时的喘息"
 GNG_focus_temporary_relief_desc:0 "好吧，我们还是太过乐观。尽管我们做好了最坏的打算，但广东的损失还是超出了预期。西部的农村地区在激战中几乎变成一片白地，当地人也因为民族主义宣传而加入了护国军，在龙绳武战败后，这些人便就地打起了游击，让我们的警察们十分头疼。更要命的是西部有大量难民逃亡到广东来，据说游击队正利用他们作为掩护渗透广东。\n\n除此之外，由于战争阻断了一部分贸易航路，广东过于依赖市场的经济遭受了毁灭性打击，加上华人外逃导致的劳动力短缺，我们的生产几乎瘫痪。\n\n我们必须抓住战后短暂的空档期，恢复广东正常的社会生活秩序，否则我们将面临更大的麻烦……"
 GNG_focus_foothold:0 "我们脚下的家园"
 GNG_focus_foothold_desc:0 "即使护国军并未过多破坏广东内地，但在游击队的攻势下，广东还是遭受了一定损失。农村地区的基础设施和农田被毁坏了绝大部分，而珠三角的不少高楼大厦被炸弹炸得千疮百孔。整个广东的电力系统陷入瘫痪，这也是阻碍我们恢复生产的问题之一。\n\n我们治下的人民更是人心惶惶。华人的民族情绪被煽动，珠人蒙受了大量损失，日侨紧急撤出他们的资产又加剧了我们经济的混乱。好在我们终于可以腾出手来，集中精力处理这些问题了。"
 GNG_focus_retrieve_the_cable:0 "拾起电缆"
 GNG_focus_retrieve_the_cable_desc:0 "李嘉诚和驹井难得有了一个合作的机会。考虑到长江实业和日立对于能源产业的投资，我们不得不让他们承担起恢复广东电力供应的义务。\n\n为了确保日立不会耍什么小聪明，我们只会让他们从事线路策划、理论指导和设备供应，而长江实业将负责建设和安全检查。在原有的电力供应基础上，我们将进一步扩大热电厂的建设，并尽力让新电网以最短时间覆盖整个广东。对于珠三角地区，要最先修复，以求最快速度恢复生产，稳固我们脆弱的经济。"
 GNG_focus_neon_signs_lit_up:0 "霓虹荧屏再亮"
 GNG_focus_neon_signs_lit_up_desc:0 "终于，在我们的不懈努力下，劳动力、资金、原料和能源问题都得到了解决。现在五巨头的工厂正全力开动，日夜不停地生产出产品，以尽快满足市场需求。\n\n当下最重要的是刺激企业的投资热情。为此，我们将对广东的企业采取减税政策，同时发放一定补助，让广东的企业有资本去投资，先将广东内部的市场盘活，为接下来的计划打下基础。\n\n开门迎客吧，财富正再次向广东涌来。"
 GNG_focus_leave_ruins_behind:0 "走出残垣断壁"
 GNG_focus_leave_ruins_behind_desc:0 "破坏亦是机遇，盛田昭夫坚信这一点。虽然战争给我们辛苦建起的基础设施留下了千疮百孔，但也同时给了我们几乎一张白纸的土地，给了我们重新规划的机会。\n\n基建工程不只吸引着行政长官，其他公司也因其有利可图而一致同意：我们不仅要恢复战争的一切破坏，还要在此基础上信手绘蓝图，在新边境之内的每一处铺就经济腾飞的新支柱。\n\n抛去轰炸机和地雷留下的废墟吧，一个新的机构将被设立，在断壁残垣铺就的蓝图之上，岭南建设总署将接管广东基建的明天。第一步，就从重建被战火摧残的广西高速公路网开始。"
 GNG_focus_fences_and_gate:0 "围栏与关口"
 GNG_focus_fences_and_gate_desc:0 "还是来了，我们终究躲不开。\n\n漫山遍野都是来逃难的人群，甚至超出了之前我们面对小股难民潮的预期。尽管之前我们就考虑过这件事发生的可能性，但我们还是惊讶于他们的到来。也是，广东离前线不算太远，他们逃到这也不无可能。\n\n但我们自身无法解决这个尴尬的问题。五巨头根本不需要那么多劳动力，而那些难民为了一口饭吃，甚至愿意强闯边境检查站，境内的华人则在呼吁我们接纳他们的同胞，这意味着我们必须解决难民问题。当务之急是先在边境修一些难民营，让他们有个滞留的地方。"
 GNG_focus_in_the_warm_sun:0 "沐浴暖阳之下"
 GNG_focus_in_the_warm_sun_desc:0 "珠人和日侨可谓是支撑广东经济的两根支柱。自盛田行政长官执政以来，珠人的经济实力得到极大提升，为广东国的成就立下汗马功劳。而日侨的投资则为广东提供了大量资金，是盛田推行改革的后备资金来源。但大东亚战争爆发后，日侨为维护自身利益撤出资产，珠人在战争中受到了巨大损失。倘若这两根支柱彻底垮塌，那广东的经济将如同沙上建塔一般脆弱。\n\n行政长官宣布将推行诸多引进外资的利好措施，希望重新吸引日侨投资，同时增加对珠人的补贴，帮助他们东山再起。\n\n问题在于经济，要想解决问题，就先解决经济。"
 GNG_focus_gazing_into_abyss:0 "凝视深渊之中"
 GNG_focus_gazing_into_abyss_desc:0 "日侨的资金正源源不断地涌向广东，充实着我们的国库。但我们也注意到一些老朋友的回归——极道，和他们的头子横井英树。\n\n在三合会和广警的通力合作下，极道早已偃旗息鼓，横井英树也极少在广东露面。然而今时不同往日，他不再以地下皇帝的名义出现在世人面前，而是一位真正的商人：横井英树的房地产企业高调进驻广东，其姿态很可能是试图挑战李嘉诚的长江实业。\n\n尽管横井以商人的身份回来，我们还是注意到极道的活动痕迹以及他们与横井的联系，但他们目前的行动我们一概不知，而在当前局势下，我们也不敢贸然对他们下手——开什么玩笑，极道可和东京不少大人物有关系。 明面上赢过横井自然没太大问题，李嘉诚的房地产帝国早已根深蒂固，但极道问题值得我们三思而后行。"
 DOP_GNG_recon_economic_conference:0 "（年份）年共荣圈经济大会"
 DOP_GNG_recon_economic_conference_desc:0 "1962年，共荣圈经济峰会在满洲国召开，彼时的广东虽成果颇丰，但经济体量仍不及满洲。日本的冷落、中国的敌视和满洲的嘲笑，让当时的行政长官铃木倍感屈辱。 时过境迁，广东的经济体量早已今非昔比，即使满洲的官僚费心尽力，也无法阻止创新之火点燃他们腐朽的钢铁巨兽。或许正是因为珠江奇迹的实现，新一届的共荣圈经济峰会将在广州召开。现在开始准备吧，展示我们最好的一面！"
 DOP_GNG_recon_status_agreement:0 "地位协定重议定"
 DOP_GNG_recon_status_agreement_desc:0 "为应对广西的紧急局势，我们被迫组建了广东自卫队，以抵御龙绳武的进攻。现在战事已毕，我们也确实要考虑一下怎么给自卫队善后了。\n\n考虑到西南才被平定，南京政府对日态度暧昧，我们完全可以借此要求保留自卫队，从而进一步减少日本对广东的影响。更重要的是，如果最坏的情况发生，自卫队可以给广东手上添些许筹码……"
 GNG_focus_new_products_old_friends:0 "新产品，老朋友"
 GNG_focus_new_products_old_friends_desc:0 "每年推出一台新产品，这是广东创新的动力，也是五巨头财富的来源。在战争期间我们被迫暂停了产品研发，但现在既然广东恢复宁静，我们也打算重启对新产品的研发和发售。\n\n好在，商业不会因战争支离破碎，我们先前的贸易网络仍可以使用，这也就意味着我们可以继续向这些地方出售产品，同时我们必须开拓新的市场。但在那之前，先去拜访下老朋友们吧。"
 DOP_GNG_recon_foundation:0 "立身之本"
 DOP_GNG_recon_foundation_desc:0 ""
 DOP_GNG_recon_swarming_investors:0 "群蚁附膻"
 DOP_GNG_recon_swarming_investors_desc:0 ""
 DOP_GNG_recon_leave_nothing_out:0 "细大无遗"
 DOP_GNG_recon_leave_nothing_out_desc:0 ""
 DOP_GNG_recon_backwardness_disaster:0 "落后即灾难"
 DOP_GNG_recon_backwardness_disaster_desc:0 ""
 DOP_GNG_recon_first_trial:0 "新硎初试"
 DOP_GNG_recon_first_trial_desc:0 ""
 DOP_GNG_recon_no_time_to_turn:0 "计不旋踵"
 DOP_GNG_recon_no_time_to_turn_desc:0 ""
 DOP_GNG_recon_grand_wall_weak_foundation:0 "丰墙硗下"
 DOP_GNG_recon_grand_wall_weak_foundation_desc:0 ""
 GNG_focus_corporate_voraciousness:0 "企业狼吞虎咽"
 GNG_focus_corporate_voraciousness_desc:0 "长时间的重建工作后，我们终于处理了战争给坎通带来的内部问题:被关闭的生产线重新开启，被炮火炸毁的工厂得到了重建，东京的投资人也恢复了对我们的信心，源源不断的投资正从本岛不断地打入我们在广东的账户！那么接下来，是时候做出实际行动以安抚那帮急红了眼的股东和企业董事们的胃口了……"
 GNG_focus_trade_union_highly_vigilant:0 "工会目光灼灼"
 GNG_focus_trade_union_highly_vigilant_desc:0 "什么赋予了广东生命？有人说，是一手“创造”了这个国家的日本；有人说，是第一批对珠三角进行投资建厂的企业家；有人说，是立法会的五大巨头和其背后的巨企。但在盛田昭夫看来，真正赋予广东生命的，是那些在流水线上兢兢业业，恪尽职守的普通工人。只要他们停产半日，广东的经济发展就要狠狠挨上一拳；要是他们罢工一周，那么全立法会都要跟着东京股票交易所的曲线抖三抖。而也正是这批工人顶着战时的炮火英勇无畏地上工，对少数居心叵测的叛乱分子的煽动置若罔闻，才保证了广东生产不中断。可以说，没有他们的忠诚，就没有共荣圈今日的胜利。忠诚自有奖赏，如今，是到了给这群效忠者论功行赏的时候了。"
 DOP_GNG_recon_civilian_officials:0 "文官登台亮相"
 DOP_GNG_recon_civilian_officials_desc:0 "遗憾的是，我们的社会在这次危机中陷入了更大的混乱。战争让一部分华人选择了倒戈，珠人不知所措四散而逃，却被告知日裔已经先行挤占了所有交通工具。族裔矛盾的激化和对战争的恐惧让广东被再度撕裂，而现在我们必须舔舐伤口。\n\n行政长官决定先重建受到严重破坏的行政体系，在底层提拔更多华人和珠人，而高层则由有经验的日裔来稳定局面。这虽然是权宜之计，但不仅能缓和社会矛盾，还能一定程度上同时讨好中日两国。让新官僚们行动起来吧，广东应该恢复稳定了。"
 DOP_GNG_recon_flying_geese:0 "属于广东的雁式经济"
 DOP_GNG_recon_flying_geese_desc:0 "得益于战争期间我们的表现，广东获得了广西作为开发地，而如何利用这块土地成了巨头们争执不休的一个话题。\n\n好在，财政司提出了一个大家都能接受的方案：先将一部分劳动密集型产业转移到广西，创造就业并恢复经济，以助力我们的重建工作。按经济学家们的说法，这叫做“雁行经济”，且这套模式在两广内部能够实现，即我们为“领头雁”，发展高新技术产业，而其他低端产业则转移给广西这只跟着的“雁”，从而促进双方的经济发展。目前来看，这套方案可行。"
 DOP_GNG_recon_opening_ceremony:0 "揭幕式"
 DOP_GNG_recon_opening_ceremony_desc:0 ""
 GNG_focus_get_to_work:0 "开工！"
 GNG_focus_get_to_work_desc:0 "尽管广东依然存在很多问题，但燃眉之急已解，我们已经具备了恢复正常生产秩序的能力。金融市场逐渐稳定，日侨和珠人的企业已经重新开张，经济终于扭亏为盈，珠三角的治安也得到了保障。\n\n不过我们也要小心提防，诸如大圈帮之类的极端民族主义组织在农村地区层出不穷，甚至还有消息称部分游击队打出了带有共产主义色彩的标语。看来短时间内对农村地区的开发要慎重考虑。\n\n但现在，我们可以喘口气了。"
 GNG_focus_return_to_Ordinary_daily_life:0 "回归平凡的日常"
 GNG_focus_return_to_Ordinary_daily_life_desc:0 "终于，在经过漫长的重建期后，广东恢复了日常生活:工人重新上工，学生重回课堂，东京的股东们从拿到了自己的那份油水，日常的生活秩序也得以恢复。虽然炮火造成的废墟还未清理干净、越过边境的难民也没有完全得到安置，但至少，广东已经恢复了它的日常生活，平凡而寡淡的日常生活。许多人相信假以时日，广东一定能顺利完成重建工作，创造广东的“新繁荣时期”。\n\n对吧……？"
 GNG_focus_decentralization_authority:0 "预备权力下放"
 GNG_focus_decentralization_authority_desc:0 "我们不得不承认的一点是，由于日侨在战争期间的混乱，致使立法会基本陷入瘫痪，从而让我们的日常工作难以维系。很难想象如果盛田没有提出《应急权力条例》，广东该怎么撑过大东亚战争。这侧面反映出我们的权力决策机制有很大的弊端。\n\n当然，这份权力不可能永远握在盛田手上。俗话说能力（对于盛田来说是权力）越大责任越大，盛田不可能全知全能到把一切都安排清楚。正好趁着立法会处于虚弱状态，我们可以把处理部分日常事务的权力下放到各部门，绕开立法会进行决策。尽管这一行为似乎和《广东国基本法》格格不入……"
 GNG_focus_go_west:0 "向西行……"
 GNG_focus_go_west_desc:0 "对中国的处理方案是灾难性的。在日本的强制切割下，中国只留下了其东部和西南的领土，而华北事实上的独立也意味着，中国事实上已经支离破碎。\n\n考虑到我们之前也高度依赖中国的原料和市场，我们得和日本联系一下，询问我们是否还能获取中国的原料。如有可能，我们还要评估一下战后中国是否仍存在开拓市场的可能性——哪怕是修基建也好，长江实业和日立对这个可老熟悉了，不是吗？"
 GNG_focus_reinvestment_talents:0 "人才再投资"
 GNG_focus_reinvestment_talents_desc:0 "虽然已经把这事干过一遍了，但考虑到未来需要，我们不得不再把这件事提出来。\n\n人才是巨头们争夺的抢手货（除了某个根本不需要考虑劳动力成本的家伙），而我们之前的教育政策虽然利好理、工、商三科，但日新月异的技术进步让我们意识到，现有的教育体系根本无法满足我们在创新上的需求。\n\n为了让我们的科研能力更强大，盛田行政长官将召集教育部门，开始建设广东的新高校体系，以求那些千里马们能受到更高等的教育，从而投身于新一轮科技革命中。"
 GNG_focus_garrison_withdrew:0 "驻军退潮时"
 GNG_focus_garrison_withdrew_desc:0 "现在西南的危机已经平定，原先来援助广东的日军部队成了一个大问题。其一是战争期间，日军驻扎广东消耗的是广东的财力物力，如果他们长期驻扎，无疑加重了我们的经济负担；其二是他们与自卫队经常出现摩擦，如果他们赖着不走，对我们未来的计划也会造成一定影响。\n\n好在，东京没有落井下石，同意让他们离开。不过据说104师和永野茂门并没有接到撤退命令，也没有离开的意思……这可能是个祸患，但我们没心思管他们了，毕竟东京可能有自己的考量。"
 GNG_focus_resource_export_plan:0 "资源出口计划表"
 GNG_focus_resource_export_plan_desc:0 "巨头们向来很反感一个东西——那就是政府的规定。铃木贞一也好，盛田昭夫也罢，每次政府尝试干预经济，都会迎来松下和富士通的“据理力争”。但现在我们不得不动用一些强制手段来……帮我们获得更长远的利益。\n\n对矿产资源的进一步开发让我们的资源储备到了爆满的地步，而广东明显用不了这么多。商人们希望能获得这些多余的资源，但我们不会这么做。相反，我们会以政府名义卖出这些矿产资源。拜托，这些东西可值钱了，共荣圈可全靠着这些原料过日子呢！为了广东的利益，我们将会动用一些……“行政手段”来干预矿产的开采。"
 GNG_focus_problem_is_economy:0 "笨蛋！问题是经济！"
 GNG_focus_problem_is_economy_desc:0 "“钱不是万能的，但没有钱是万万不能的。”这句名言至今仍在世界各地的商人中流传，而在广东，金钱则有着更进一层的意义:利润就是广东的一切。\n\n作为盛田内阁的一员，松下正治向行政长官提交了一项计划:该计划的中心旨在将重建资金的大头用于修复广东国的工业，提高广东国的生产能力，以让广东能输出更多的商品，赚取更大的利润。而只要我们的提交的年终财报显示广东的经济正蓬勃发展，东京方面和股东们的支持与新一轮投资就会如珠江水般滚滚而来！\n\n描述:松下正治将与盛田昭夫共同在立法会提出《生产恢复与外资准入条例》，这可能会激怒一些广东本土的民众，但它也许也能为我们争取到意料之外的支持……\n\n这将增加松下电器在立法会内的影响力"
 GNG_focus_promote_local_efficacy:0 "增进本地行政效能"
 GNG_focus_promote_local_efficacy_desc:0 "什么是广东发展的最大障碍？对于井深大来说，答案显而易见:那群被资本主义腐蚀的腐败分子；还有那群该死的宪兵队！如果说广东有什么人比盛田更厌恶宪兵队的话，那个人只能是井深大：勒索诚实守信的商人、收满业的五十万满元、和市民斗殴，和警察抢饭吃；还有什么是这群吃里扒外的畜生干不出来的？在厌恶宪兵队这点上，井深和盛田一拍即合：至少也该治治这群东京来的目中无人的小王八蛋，让他们守点在广东的规矩！比如说，把更多的任务交给更可靠的广东警察；或者，把资金投给反腐败部门，清洗一批广东内部的臭虫，也提醒那群飞扬跋扈的宪兵队：有人在盯着你！\n\n这将增加富士通在立法会内的影响力"
 GNG_focus_daily_necessities_and_housing:0 "内地的日用品与房屋"
 GNG_focus_daily_necessities_and_housing_desc:0 "盛田昭夫最重要的左膀右臂李嘉诚，提出了另一份更有趣的提案:为什么不把重建资金投给更缺乏开发的内地和急待重建的边境地区呢？珠三角是广东国的大脑，这句话没错；但只有大脑的“生物”，又能干出些什么呢？乡村就是广东的四肢，人民就是广东的心脏；乡村的道路让广州的政令延伸到国境内的四方、工人们每天的辛勤劳作让广东的血液保持健康的循环。现在，难道我们要冒着让四肢坏死而使广东瘫痪，让心脏过劳以使广东猝死的风险继续我们的发展政策吗？不如花点小钱，让广东的血液健康循环，也让更多的民众知道索尼-长实模式的优异之处！\n\n描述:李嘉诚将与盛田昭夫共同在立法会提出《赈济与重建条例》，这可能会激怒一些日侨，但它也许能为边境地区的重建工作带来意料之外的影响……\n\n这将增加长江实业在立法会中的影响"
