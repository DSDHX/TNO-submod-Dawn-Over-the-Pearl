 GNG_dop_debug_legco_skin_style1_desc: "将立法会的势力显示外观替换为「索长：建制·工政·营商·自贸·新民」样式。\n\n§R注意：§!此决议仅改变立法会的显示外观，不影响立法会的任何既有机制，也不会发起任何投票。再次点击此决议可恢复原版样式。"
