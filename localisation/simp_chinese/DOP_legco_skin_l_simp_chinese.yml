 GNG_dop_legco_skin_style2_tt: "§G立法会外观：样式二（建制·财界·工政·营商·硅芯）§!\n§F切换后仅改变立法会显示外观，不影响任何机制，也不会发起投票。再次点击恢复原版外观。§!"
