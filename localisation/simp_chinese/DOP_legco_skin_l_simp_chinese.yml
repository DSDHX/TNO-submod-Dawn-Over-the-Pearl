 GNG_dop_debug_legco_skin_style1: "§MDOP调试§!：立法会外观：样式一（建制·自贸·华人·珠人·新民）"
 GNG_dop_debug_legco_skin_style1_desc: "将立法会的势力显示外观替换为「建制·自贸·华人·珠人·新民」样式。\n\n§R注意：§!此决议仅改变立法会的显示外观，不影响立法会的任何既有机制，也不会发起任何投票。再次点击此决议可恢复原版样式。"
 GNG_dop_legco_skin_style1_tt: "§G立法会外观：样式一（建制·自贸·华人·珠人·新民）§!\n§F切换后仅改变立法会显示外观，不影响任何机制，也不会发起投票。再次点击恢复原版外观。§!"
