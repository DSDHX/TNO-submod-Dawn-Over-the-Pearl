 GNG_dop_legco_leader_morita: "\n\n\n\n\n\n£GNG_Morita_Akio_Success_texticon\n\n\n\n\n\n\n\n\n[GNG_dop_legco_skin_faction_color_dynamic]广东行政长官\n派系领袖 盛田昭夫§!\n\n"
 GNG_dop_legco_leader_yamashita: "\n\n\n\n\n\n£GFX_DOP_Yamashita_Toshihiko_texticon\n\n\n\n\n\n\n\n\n[GNG_dop_legco_skin_faction_color_dynamic]派系领袖 山下俊彦§!\n\n"
 GNG_dop_legco_leader_fok: "\n\n\n\n\n\n£GFX_DOP_Fok_Ying_Tung_texticon\n\n\n\n\n\n\n\n\n[GNG_dop_legco_skin_faction_color_dynamic]派系领袖 霍英东§!\n\n"
 GNG_dop_legco_leader_yang: "\n\n\n\n\n\n£GFX_DOP_Yeung_Kwong_texticon\n\n\n\n\n\n\n\n\n[GNG_dop_legco_skin_faction_color_dynamic]派系领袖 杨光§!\n\n"
 GNG_dop_legco_leader_niwa: "\n\n\n\n\n\n£GFX_DOP_Niwa_Uichiro_texticon\n\n\n\n\n\n\n\n\n[GNG_dop_legco_skin_faction_color_dynamic]派系领袖 丹羽宇一郎§!\n\n"
 GNG_dop_legco_leader_ibuka: "\n\n\n\n\n\n£GNG_Ibuka_Masaru_Compromise_texticon\n\n\n\n\n\n\n\n\n[GNG_dop_legco_skin_faction_color_dynamic]派系领袖 井深大§!\n\n"
 GNG_dop_legco_leader_li: "\n\n\n\n\n\n£GNG_Li_Ka_Shing_Success_texticon\n\n\n\n\n\n\n\n\n[GNG_dop_legco_skin_faction_color_dynamic]派系领袖 李嘉诚§!\n\n"
 GNG_dop_legco_desc_jizhi_suochang: "£GNG_legco_texticon §S立法会§!改革后，政商分离已成既定事实，而把握着政权的£GNG_Sony_texticon §V索尼§!自然能在新立法会中占据多数，这很大程度上是仰仗了官僚们对§V盛田政府§!的拥护。\n\n§V盛田昭夫§!和§C李嘉诚§!一手提拔了这些官僚，官僚们也听命于盛田，这种互助关系产生了£GFX_DOP_LegCo_Faction_Suochang_texticon §V广东新政治的建制派§!。他们延续着盛田政府的改革方针，在经济增长与劳工权益之间取得平衡，并争取日本和中国对£GFX_GNG_Guangdong_texticon §S广东§!的支持。尽管这一派系内部不时在改革方向上发生争执，但£GNG_Sony_texticon §V索尼§!和£GNG_Cheung_Kong_texticon §C长实§!的高度绑定充当了黏合剂。"
 GNG_dop_legco_desc_zimaocai_ft: "如果说旧时代的£GFX_GNG_Guangdong_texticon §S广东§!还有什么残余，那大概就是所谓的£GFX_DOP_LegCo_Faction_Zimaocai_texticon §W“自贸派”§!。这一派人中包含了不少前立法会成员——同时也是富商巨贾。他们反对广东新的政治生态，却又无可奈何，只能在§V盛田昭夫§!主导的新秩序下尽可能为自己争取利益。\n\n在§W松下正治§!回国后，§W山下俊彦§!继承了他在广东的一切，自然借£GNG_Matsushita_texticon §W松下公司§!的权势夺得了自贸派的领导权。身为一位“流放者”，山下比松下更希望干出一番事业，以证明自己有能力掌控松下公司，打破松下“家族企业”的状态。因此，他在一些问题上可能会更加吹毛求疵，需要他妥协的价码恐怕也会更高。"
 GNG_dop_legco_desc_yingshang: "一如当年的“§G广东工商联合会§!”，立法会改组后，广东的中小企业再次团结起来，对抗巨企以保护自己的利益。\n\n£GFX_DOP_LegCo_Faction_Yingshang_texticon §G营商派§!的领袖是§C李嘉诚§!和何鸿燊的老相识——§G霍英东§!。他早年也在广东靠地产和海沙生意摸爬滚打，随后因涉足博彩业结识了何鸿燊；他的华人血统也引起了李嘉诚的注意。在两位珠人的庇护下，霍英东成为广东名列前茅的地产大亨和博彩巨头，也因此成为珠人们的非官方代表之一。\n\n这一派系中既有华人和珠人，也有少量日侨。他们有些仰仗£GNG_Sony_texticon §V索尼§!和£GNG_Cheung_Kong_texticon §C长实§!的政策才得以生存，有些则靠广工联成员间的互助艰难度日。因此，派系成员的态度相当两极分化，但捍卫自身利益的目标始终一致。"
 GNG_dop_legco_desc_gongzheng: "立法会改组带来了一股新的政治力量——§C工人§!。尽管“§C华人劳工委员会§!”再没有掀起暴乱的强大力量，但其对工人群体的影响仍不可忽视；他们的倡议也使这一群体的意见代表得以入驻£GNG_legco_texticon §S立法会§!。\n\n£GFX_DOP_LegCo_Faction_Gongzheng_texticon §C工政派§!的领袖是工会领袖§C杨光§!。他从五十年代中期开始参与华人自发组织的工会，在此期间领导了多场罢工。暴乱时期，有消息表明杨光很可能是华工委骨干之一；但由于暴乱结束后调查中止，当局并未对其实施抓捕。从他在工人中的极高声望来看，相关情报恐怕并非空穴来风。\n\n这一派系更注重保护工人利益，包括更高的薪水、更短的工时和更好的工作条件。从前些年的反馈来看，§V盛田§!的改革已经让大部分人感到满意，但一直有传言称，这一派系内仍存在一些更为危险的声音。"
 GNG_dop_legco_desc_xinmin: "£GFX_GNG_Guangdong_texticon §S广东§!在“泛亚共荣”的口号中沉浮近三十年，可这光明的未来究竟在何方？这个问题困扰着不少珠人。作为中日两个族裔的“混血儿”，珠人群体在思想上更倾向于日本人许诺的“§V大东亚共荣§!”愿景，而他们自然是£GFX_DOP_LegCo_Faction_Xinmin_texticon §V新民派§!的先锋——因为他们本就是中日两种文化交融的产物。\n\n§V丹羽宇一郎§!作为广东本土企业家的代表，成为了该派系事实上的领袖。他与§V盛田昭夫§!的经历有些类似：被日本企业排挤，不得已来到广东，但个人能力却因此得到验证。他的企业不仅在广东具有一定影响力，他本人也表现出对广东而非日本的身份认同。因此，派系成员唯他马首是瞻。\n\n这一派系的主张大多集中在政治领域。他们希望广东与日本深入合作，为亚洲的“共荣”作出努力。正因这种倾向，他们与不少影响巨大的日侨有联系，也被广东本土派称为“§R东京的傀儡§!”。"
 GNG_dop_legco_desc_jizhi_suofu: "£GNG_Sony_texticon §V索尼§!与£GNG_Cheung_Kong_texticon §C长实§!的同盟破裂后，£GFX_DOP_LegCo_Faction_Suofu_texticon §V建制派§!的力量也不免被削弱。但§V盛田昭夫§!毕竟仍是广东行政长官，£GFX_GNG_Guangdong_texticon §S广东§!也依然是建制派的天下。由于大幅度的政策变动，建制派内部并不稳固，许多成员处于摇摆状态，但他们基本认同三点：在东亚的中日之间求得平衡、保持经济增长，以及在§m井深§!参与的改革中维护盛田的基业。"
 GNG_dop_legco_desc_guixin: "在与§V盛田昭夫§!实现了令人震惊的和解后，§m井深大§!在自己原有势力的基础上，得到了£GNG_Sony_texticon §V索尼§!和£GNG_Fujitsu_texticon §m富士通§!产业链相关人士的支持，从而在新立法会中站稳了脚跟。\n\n盛田对井深的支持是一笔交易：技术创新成为£GFX_GNG_Guangdong_texticon §S广东§!的基本国策之一，而井深则要帮助盛田确保在£GNG_legco_texticon §S立法会§!中的绝对多数。因此，井深和£GFX_DOP_LegCo_Faction_Guixin_texticon §m硅芯派§!在许多议题上都不得不与建制派站在一起。但在另一些问题上，他们的态度与建制派也有所不同，例如减少企业税收、扩大电子产业规模。"
 GNG_dop_legco_desc_zhuren: "珠人作为£GFX_GNG_Guangdong_texticon §S广东§!的主要族裔和§V盛田政府§!的主要支持者，在立法会中同样有着一席之地。£GFX_DOP_LegCo_Faction_Zhuren_texticon §E珠人派§!满足于现状，对§m井深§!的改革持怀疑态度；加之£GNG_Sony_texticon §V索尼§!与£GNG_Fujitsu_texticon §m富士通§!结成同盟，他们担心自己的利益受损，因而对盛田的支持比以往更为谨慎。\n\n§E丹羽宇一郎§!作为广东本土企业家的代表，成为了该派系事实上的领袖。他与盛田昭夫的经历有些类似：被日本企业排挤，不得已来到广东，但个人能力却因此得到验证。他的企业不仅在广东具有一定影响力，他本人也表现出对广东而非日本的身份认同。因此，派系成员唯他马首是瞻。"
 GNG_dop_legco_desc_zimaocai_fin: "£GNG_Sony_texticon §V索尼§!掌握大权后频繁干涉企业，让许多商人感到不满。如今£GNG_legco_texticon §S立法会§!被改组，实体经济又得到了政府支持，从事其他产业的商人更是火冒三丈。因此，他们迅速以£GNG_Matsushita_texticon §W松下公司§!为首形成了£GFX_DOP_LegCo_Faction_Zimaocai_texticon §W财界派§!，呼吁给房地产、金融等其他行业“§W保留生存空间§!”。\n\n对于初来乍到的§W山下俊彦§!而言，松下正治留下的这份“政治遗产”还算不错，让他有能力同索尼和富士通叫板。而他的想法也与这些人一致：他要为松下谋求更大的利益，从而证明自己的能力不比松下正治差。在山下的领导下，这一派系或许会更加团结，也更让政府头疼。"
 GNG_dop_legco_desc_huaren: "如果有人告诉1964年的§C李嘉诚§!，说§V盛田昭夫§!会与他闹掰，李嘉诚大概不会相信。但这件事还是发生了，让他感到痛苦和绝望。如今还有更重要的事等着他——成为华人的民意代表，捍卫华人群体的权利。\n\n盛田肯定与§m井深§!在某些方面达成了妥协，而谁都不敢确定其中是否包括盛田和李嘉诚此前推动的改革。因此，李嘉诚很快得到了华人们的支持，在£GNG_legco_texticon §S立法会§!中率领£GFX_DOP_LegCo_Faction_Huaren_texticon §C华人派§!孤军奋战，防止井深的清算。也许这一派系在立法会中不是多数，但李嘉诚会为了自己的同胞战斗到最后一刻。"
