 DOP_YUN_long_shengwu:0 "龙绳武"
 POLITICS_DOP_YUN_LONG_SHENGWU_DESC:0 "龙绳武借西南军政秩序崩塌之机，以护国军之名发动极端民族主义起事，将云贵、广西与海南拖入新的战争。"
 DOP_YUN_prepare_southwest_war_tt:0 "§YYUN§!将先完成§Y云贵合并§!，随后由§Y龙绳武§!取代§Y卢汉§!，建立§R极端民族主义护国军§!政府、载入§Y护国军国策树§!并动员§Y10个护国军师§!。§G不会§!启动本体西部起义的日期、事件链或开战效果。"
 DOP_GNG_flow.1.t: "【Placeholder】大西南战争：起事"
 DOP_GNG_flow.1.desc: "【Placeholder】此处需要由人类作者补写龙绳武起事、广西与海南响应，以及广东面对危机的事件描写。"
 DOP_GNG_flow.1.a: "【Placeholder】进入大西南战争流程"
 DOP_GNG_flow.2.t: "【Placeholder】大西南战争：广东参战"
 DOP_GNG_flow.2.desc: "【Placeholder】此处需要由人类作者补写广东被卷入战争、装甲部队损失与战时体制建立的事件描写。"
 DOP_GNG_flow.2.a: "【Placeholder】保卫广东"
 DOP_GNG_flow.3.t: "【Placeholder】大西南战争：昆明陷落"
 DOP_GNG_flow.3.desc: "【Placeholder】此处需要由人类作者补写昆明陷落、停战谈判与西南重建安排的事件描写。"
 DOP_GNG_flow.3.a: "【Placeholder】进入战后重建流程"
 DOP_GNG_flow.4.t: "【Placeholder】大西南战争：援军抵达"
 DOP_GNG_flow.4.desc: "【Placeholder】此处需要由人类作者补写茂名失守十四日后，中国与广东重返共荣圈、日本正式参战，以及十二个日本装甲师在广州登陆并发动反攻的事件描写。"
 DOP_GNG_flow.4.a: "【Placeholder】开始反攻"

