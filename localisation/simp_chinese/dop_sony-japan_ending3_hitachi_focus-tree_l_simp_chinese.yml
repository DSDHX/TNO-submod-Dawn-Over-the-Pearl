l_simp_chinese:
 dop_sonyjapan_ending3_hitachi_tree:0 "盛田与§L财界迷局§!"
 GNG_focus_weak_up_from_dream:0 "阴影之下"
 GNG_focus_weak_up_from_dream_desc:0 "过去十年，广东的经济数据屡创新高，成为东亚乃至全共荣圈的榜样。\n\n但这一切的背后是什么呢？在劳资纠纷上拉偏架、对安全隐患的忽视、对违法行为的容忍……盛田曾经为之奋斗的一切，在他对松下的妥协中渐渐化为乌有；民政派争取来的一切，被他们的领头人亲手葬送。\n\n在灾难性的恐怖袭击发生后，日侨人人自危，对广东的社会与经济稳定提出质疑，进而带动了立法会的分裂，这无疑是雪上加霜。\n\n那么，盛田昭夫还能如1964年那般，带领广东走出低谷吗？"
 GNG_focus_falling_pices:0 "分崩离析"
 GNG_focus_falling_pices_desc:0 "很明显，现在的局势一团乱麻。于内，长实依然坚持着民政派的立场，富士通也一如既往地给我们下绊子，松下新掌门人的态度并不明确，日立则更像是一头暂且安分的饿狼。\n\n于外，底层民众已经对我们失去了耐心，中国也对我们的政策转向表现出反感，而日本商人们则开始质疑我们的能力。\n\n这些足以说明我们的政策出了很大问题，而这无疑是在动摇我们的执政根基。如果想让广东平稳度过接下来的岁月，恐怕一场拨乱反正在所难免。"
 GNG_focus_fool_cheung_kong:0 "老搭档的不满"
 GNG_focus_fool_cheung_kong_desc:0 "虽然令人难以置信，但长实和富士通在近年来反而有了一定程度的合作，最大的原因自然因为索尼、松下和日立是现行政策的受益方，而他们不是。\n\n恐怖袭击发生后，富士通和长实分别站在日本人和本土人民的立场，对我们发起冲击，与他们勾结的黑帮分子和被煽动起来的人民成了他们刺向我们的利刃。\n\n为了平息民怨并在立法会中取得一定平衡，盛田行政长官将会亲自与两位老朋友谈谈，希望与他们在一些方面达成共识，从而停止他们的煽动性行为。"
 GNG_focus_show_the_fang:0 "伤口再度撕裂"
 GNG_focus_show_the_fang_desc:0 "广东存在着两大冲突，即劳资冲突和族裔冲突，而这两个问题本在盛田执政的初期有所缓解，但现在又变成了棘手的麻烦。\n\n出于对经济增长的妥协，一些企业违反相关条例的事件是被忽视了的，这本就在激化工人同企业甚至政府的矛盾。而随着以松下为代表的日企再度得势，日本人在各方面对华人和珠人的歧视也卷土重来。\n\n我们不能忘记盛田执政的目标是为了创造一个平等、和谐的广东，如果不消灭这两大矛盾，那这样的梦想也无从谈起。"
 GNG_focus_fujitsu_s_ridiculous:0 "新朋友的贪婪"
 GNG_focus_fujitsu_s_ridiculous_desc:0 "出于自身利益，松下不可能完全接受民政派的提案，这是盛田与李嘉诚推动改革时就意识到的。而在松下提出多项计划时，盛田也能理解他推翻部分政策的急切心情。只是现在来看，松下确实做得有些过火了。\n\n至于日立，三田胜茂这个趋炎附势的家伙比他的前任好不到哪去，只是和松下更臭味相投罢了。\n\n鉴于持续恶化的现状，盛田打算还是先和新来乍到的山下俊彦谈谈，看看能否让他适当转变立场。至于三田胜茂，想必他会随着山下的妥协而不攻自破的。"
 GNG_focus_the_lord_of_east:0 "对外联系重审视"
 GNG_focus_the_lord_of_east_desc:0 "作为共荣圈的一份子，我们与每一位成员国都有着或深或浅的联系，而对外则更多是依靠企业的商业网络。\n\n在各种各样的外交联络中，最为重要的无疑是我们同中国和日本，这两个大国的联系。其次是同泰国等较为稳定的国家的经济合作关系，最后则是与各国的贸易联系。考虑到中日之间的摩擦逐渐增多，加上我们内部局势日益恶化，或许是时候考虑调整我们的外交方针了。"
 GNG_focus_is_sony_ruling_the_guangdong:0 "监督各部门"
 GNG_focus_is_sony_ruling_the_guangdong_desc:0 "与松下的交易带来的是一定程度的腐败，这本身就是对反腐斗争的清算。而最大的问题在于一些部门因为腐败之风再兴，行政效率大打折扣，这是行政长官不能容忍的。\n\n出于维护改革成果的需要，盛田将以行政长官的身份，要求各部门负起责任，重振民政派的事业。"
 GNG_focus_guangdong_manchuria_friendship_agreement:0 "建立内环"
 GNG_focus_guangdong_manchuria_friendship_agreement_desc:0 "目前立法会内部互相挚肘可谓常态，我们实际上很难找到可以称得上“盟友”的团体，这同样破坏了政治机器的效率。\n\n鉴于政局现状和法律规定，如果我们想要保证广东政府不会在内斗中彻底脑死亡，最好开始调整一下决策层人员，将忠于我们的、有能力的官僚提拔上来，形成一个“内环”体系。"
 GNG_focus_who_is_the_chief_executive:0 "抛出胡萝卜"
 GNG_focus_who_is_the_chief_executive_desc:0 "民政派在广东经营多年，许多有幸攀上索尼高枝的商人都得以进入立法会，索尼也因此得到了绝大部分珠人的支持。\n\n随着对抗烈度的上升，我们必须稳固自己的基本盘，也就是同上述人群的同盟关系。我们会抓紧时间采取一些措施，让这些人尝到更多甜头，从而让他们意识到只有维护盛田的领导地位，他们才能得到更多。"
 GNG_focus_building_inner_ring_system:0 "保持经济增长"
 GNG_focus_building_inner_ring_system_desc:0 "尽管大家都已经在排兵布阵，但盛田昭夫依然不希望广东在他的手上成为一个烂摊子。广东的经济增长是其在共荣圈的安身立命之本，倘若因内斗导致经济大幅下滑，那么身死国灭只是个时间问题。\n\n因此，我们会与主要的投资者们进行会面，向他们担保广东的信用，并要求财政司拿出具体的保障措施。\n\n希望我们的计划不会出什么乱子……"
 GNG_focus_destroy_the_source_of_chaos:0 "挥舞大棒"
 GNG_focus_destroy_the_source_of_chaos_desc:0 "有支持就必定有反对。民政派的执政方针本身就饱受商界反对，现在也有一些立场摇摆不定的议员和人民团体渐渐站到我们的对立面。\n\n如果他们不吃软，那我们只有一条路可走——用一些强硬的方式来解决他们。\n\n针对商业人士，我们自然会用上一些……常规的“商业竞争”手段。而那些在街头煽动国民情绪的阴谋家，我们的警察会好好料理他们的。"
 GNG_focus_guangdong_awake:0 "众企业的角斗场"
 GNG_focus_guangdong_awake_desc:0 "尽管盛田昭夫竭力避免这一切的发生，但不幸地，他自己也在不归路上越走越远。即使他使出浑身解数，广东也已经陷入内斗的泥潭中。\n\n几乎每天，报纸上都充斥着对企业集团的口诛笔伐，广警也在街上时刻监控来往的人群，立法会则针对一项议题吵上数个小时。政府部门还在正常运转，但对盛田政府的不同态度也让政府内部蒙上了一层阴影。\n\n也许在外界看来，广东依旧繁荣稳定。但大家都明白，真正的战斗已在无声中打响……"
