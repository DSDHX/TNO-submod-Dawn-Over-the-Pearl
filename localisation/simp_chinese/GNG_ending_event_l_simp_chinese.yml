l_simp_chinese:
 GNG_ending_event.1.t: "明知山有虎……"
 GNG_ending_event.1.desc: "当门被“砰”的一声撞开时，盛田昭夫已经意识到情况不妙了。但既然他做出了这个决策，那他自然也要承担后果。\n\n“你在搞什么？”松下皱着眉头大步走进他的办公室，几乎是咬着牙在问他。“你要解散立法会？还要允许商界以外的人进来？”\n\n看来还是走漏风声了。盛田只和自己的几个心腹参进行了讨论，恐怕这些人也没管住嘴。接下来的一刻钟，松下都在批评他的这一决策，并大谈商界的领导对广东是多么有益。\n\n等松下气呼呼地坐到椅子上，盛田才让一旁的秘书给他倒了杯水。“松下，我知道这很难令你接受，但你要明白，广东的体制确实需要一场变革了。远的不说，安田危机时候可以说半个立法会处于瘫痪状态，广东差点跟着安田一块入土了。暴乱也是日立引起的，现在驹井人滚蛋了，但广工联和华工委的影响完全无法根除。一句话，企业不能高高在上了。”\n\n“这不是你准备修改基本法的理由。就算你过得了立法会这关，日本也不会同意，更别提你根本不可能争取到五十票。”\n\n松下直直地盯着盛田，目光中仍带着怒火。\n\n“……松下，你应该清楚票不是问题，立法会的珠人们对此还是持正面态度的，和我有共识的人足够让这份提案接近临界点。”\n\n“那你就打算去贿赂甚至恐吓了？”松下嘲弄似的笑了。“那好吧，你尽管打你的如意算盘去吧，立法会会让你颜面扫地的。”"
 GNG_ending_event.1.a: "松下拂袖离去，战争也一触即发"
 GNG_ending_event.2.t: "越过红线"
 GNG_ending_event.2.desc: "在立法会众人的窃窃私语声中，盛田昭夫登上主席台，深吸一口气后直接抛出了今天的主题——就《立法组织条例》进行投票。\n\n议员们的话题很快从盛田遇刺变为对条例的讨论，一部分人已经从他们的领袖那听说了大致内容，随即在会场将其传播开来。\n\n“……所以，我认为有必要提出这份条例，对广东的体制进行一些改变……”\n\n有些人开始坐不住了。\n\n“这是为了广东的长远利益考虑……”\n\n质疑声越来越大，但不少人还是选择静观其变，祈祷自己听到的只是个玩笑。\n\n“……这份条例主要规定了立法会成员的选举形式，也就是说如果条例通过，则现有的立法会应当解散……”\n\n“什么？”终于有人忍不住喊出声来。“去你的吧！你他妈想怎样？把广东送给中国人？”一名议员几乎是从座位上跳起来发出质问，类似的辱骂和质疑声随即如潮水般向盛田袭来，而总裁们和极少部分议员则沉默不语。\n\n盛田对这一切选择了无视，他看着以驹井为首的对条例持反对意见的议员们，面无表情地宣布了投票的开始。"
 GNG_ending_event.2.a: "让我们拭目以待吧……"
 GNG_ending_event.3.t: "条例通过"
 GNG_ending_event.3.desc: "当电子屏上显示赞成票的数字闪烁时，整个立法会都爆发出了怒吼，甚至一部分索尼的议员也对盛田投去震惊和愤怒的目光。\n\n“瞧瞧这叫什么事？！”一名日侨的怒吼几乎盖过了所有人的声音，“这畜牲要剥夺我们的权利，拿给那些下等人，开什么玩笑？！”这句话点燃了立法会，议员们都在互相质问和指责。随后，日立的议员们一起离场以表抗议，一部分日侨议员也跟着离开，临走前还宣称“要让提出和支持条例的人付出代价”。\n\n松下黑着脸向自己的支持者们表示会和东京商议此事，毕竟涉及基本法的变动，更重要的是冒犯了商人们的利益。可他自己心里清楚，说服盛田的概率几乎为零，他现在唯一能做的就是想办法应付选举，尽可能维护自己的利益。\n\n在一片混乱中，有人甚至冲到了盛田昭夫面前，但被一部分索尼议员拦住了。在现场安保和议员们的保护下，盛田离开了会场。"
 GNG_ending_event.3.a: "数分钟后，广警奉命驱散了议员们。"
 GNG_ending_event.4.t: "三方会谈"
 GNG_ending_event.4.desc: "茶水已经凉了，但没人打算喝一口。整个会客室的氛围很沉闷，只有在场的两名武官冷眼看着，可谓事不关己高高挂起。\n\n“我再次确认这些事不会干扰到广东的经济状况。这么多年来广东本土企业的力量已经大大上升了，他们同样可以保证广东经济的高速增长。”盛田昭夫疲惫地辩解道，他已经为这事在会议室待了大半天了。高岛推了推眼镜：“盛田，我也再次重申这和经济的关系……不大。你这次干得太过火了，我那边收到了一打抗议信，更有甚者直接联系了东京的一些大人物。你应该清楚，你要应付的不只是我和永野将军。”\n\n宋之光则接过话头：“但我认为行政长官此举不无道理。企业掌管立法会的弊端在安田危机就已经暴露出来，而在此之前的立法会不是朝令夕改就是效率低下。如果想让广东的一切更为高效，将这些唯利是图的家伙赶出立法会无疑是必行之事。”\n\n高岛本就不想趟浑水，他知道只要自己拿出几个案例和一些数据对比，一些有真知灼见的大人物就会清楚广东政改的必要性。他看向身旁的永野，后者出人意料地开了口：“那么，你们能否保证这次选举的……安全性？”\n\n会谈又陷入了死寂。许久，盛田昭夫才颤着声开口：“请您放心，我们绝对会进行严格的背景审查，绝不会让一小撮有心之人借此混入立法会。”\n\n永野用他那冰冷的目光盯了盛田几秒，便向高岛微微点了点头。“好吧，那么我会把情况上报给东京的。”高岛呼出一口气，随即开始收拾自己的公文包。宋之光则微笑着看向盛田：“我们的态度已经很明确了，南京完全支持行政长官的选择。”"
 GNG_ending_event.4.a: "盛田擦去额头上的冷汗，庆幸自己的又一次胜利"
 GNG_ending_event.5.t: "广式民主（操纵选举）"
 GNG_ending_event.5.desc: "“请各位安静，我们现在开始投票！”\n\n台上那位面带笑容的政府官员说着将投票箱拿出来，让工人们一个个上来投票。选举采用的是选区制，他们要从几位候选人中选出他们这一块的代表。\n\n在投票前，一旁同样面带微笑的经理先讲了一小段话，或者说提了个建议：“我个人觉得投给这位山崎先生就很好，我认识这位先生，和我们有不少业务往来，人也很温和。即使不是索尼旗下的一员，但他的公司福利也不比我们差到哪去……”\n\n台下的李骏和李晞不约而同地看了看对方，他们早就商量好要投那位前华工委成员，但现在情况摆明了是要让他们去投那个和索尼有利益关系的家伙。\n\n“行政长官看来也有自己的小心思啊。”李骏喃喃自语，而一旁的李晞则困惑地问哥哥，他们到底该怎么办。是啊，谁敢保证这种拿钱交的“朋友”是会为他们发声，还是为索尼和他自己的利益发声。\n\n工会领袖和各部门的领导已经起身，往山崎的票箱中投票了。看来都已经打点好了，这些人在带头呢。不出意外的话，之前这些人约谈自己手下一些小组长，估计也是为了“调动积极性”。\n\n李骏知道那名工人已不可能当选，但还是和弟弟把票投给了他，毕竟最多就是被穿小鞋，但他相信索尼不会因为这个就把他开除了，哪怕索尼和盛田或许早已有了私心。"
 GNG_ending_event.5.a: "只是长实的车队都能横冲直撞了，这又算的了什么"
 GNG_ending_event.6.t: "人民之声（公投）"
 GNG_ending_event.6.desc: "“诸位，小孙要作为我们社区的代表去参加立法会选举，希望各位投他一票，为我们华人争取些话语权啊！”\n\n带眼镜的中年男子向围着他们的居民们宣布这个消息后，所有人都很疑惑，不知道这意味着什么。\n\n“啥是选举？”“立法会不都日本人吗？”人们七嘴八舌地问，有几个年轻人则认为选举肯定被那些企业控制着，民众代表不可能当选。\n\n中年男子示意大家安静：“我知道各位不明白这有什么意义，或者不信任这次选举。我跟大家说，这个事是日本人敲定的——就那个什么行政长官。新的基本法上可写着呢，不管你是日本人还是华人，都能去参选！这可是和日本人对着干的大好机会！”\n\n这么一说，大家也都明白了：和日本人对着干，那可不就是好事吗？如果中国人能在立法会和日本人分庭抗礼，那日本人还会遂意欺侮他们吗？所以答案很明确了：选举就是为自己争利益嘛！\n\n“所以这怎么选啊？”一名中年妇女打断了台上滔滔不绝的男人。\n\n见居民们的态度从疑惑转为好奇，男人和他身旁的小朱相视一笑。看来，这个社区也拿下了。"
 GNG_ending_event.6.a: "人民在作出自己的选择"
 GNG_ending_event.7.t: "企业国家之终"
 GNG_ending_event.7.desc: "在立法会解散的消息公布后，广东各界都大跌眼镜，但随即就开始计划参加广东的第一次立法会选举。对于珠人来说，这是一个宣告他们地位的好机会；华人则希望借此扩大自己的话语权；日侨们一开始认为这只是走个形式，直到不少政府的消息流出才意识到大事不妙。\n\n尽管新条例并不排斥商人参政，但想也知道，受够了巨企主宰的人们定然不会青睐商人，于是许多社区领袖和社会活动家在民调中表现亮眼。这些人大多是珠人出身，华人也有不少。日侨则通过大量的暗箱操作和协商来推举了一些候选人，他们本希望借助日本的力量干涉选举，但东京却拒绝了他们的求助。\n\n索尼及其盟友自然有更大的优势，这迫使其他利益集团不得不以腐败等手段来保证自己的政治影响力，各阶层也在宣传攻势中结盟或结仇，从而让广东的第一次选举变得无比混乱。许多人被曝出受贿和违规操作，以至于有些广警私下开玩笑称“二十多年来抓的人还比不上今年的零头”。\n\n好在选举结果还是得以公布，且几乎没人对此提出异议——如果把那些本身对选举不满的日侨除开的话。不出所料，立法会的议员中大多是索尼的合作伙伴或盛田的亲信，而随着其他议员出于共同利益等原因结成同盟，立法会的新格局也逐渐形成。"
 GNG_ending_event.7.a: "那么，让新牌手们登台亮相吧"
