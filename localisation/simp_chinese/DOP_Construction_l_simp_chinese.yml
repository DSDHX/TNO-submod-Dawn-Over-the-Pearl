DOP_construction_guangxi_industrial_institute:0 "重整广西实业院"
DOP_construction_guangxi_industrial_institute_desc:0 "将桂柳一带的工业资源与机构逐步迁往南宁。"
DOP_GNG_construction.12.t:0 "重整广西实业院建设完成"
DOP_construction_guangxi_expressway_network:0 "广西高速公路网"
DOP_construction_guangxi_expressway_network_desc:0 "广西被民族主义军阀占据太久，即使是在当下，层出不穷的军阀残部与山贼土匪仍然盘踞在包绕广西的群峦中。为了加快我们对广西的基层控制，便于广西的发展，新的路网规划迫在眉睫。 在这一计划中，最为关键的横纵两条干线分别为柳州-来宾-南宁-钦州以及南宁-贵港-梧州-肇庆一线，在确保了我们的人员与物资都能快速在桂中桂南的平原上流通之后，对于广西剩余地区的整合才能真正开始。"
DOP_GNG_construction.13.t:0 "广西高速公路网建设完成"
DOP_construction_nanyue_folk_memorial_park:0 "“南粤之心”民俗纪念园"
DOP_construction_nanyue_folk_memorial_park_desc:0 "以南粤共同传统为主题建设民俗纪念园，缓和地方认同矛盾。"
