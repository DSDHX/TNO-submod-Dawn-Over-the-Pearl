DOP_construction_lijiang_waterway_desc:0 "改善漓江航道条件，加强桂柳与沿岸地区的沟通和商贸。"
DOP_GNG_construction.15.t:0 "漓江航道开发工程建设完成"
DOP_construction_honghe_fan_asia_friendship_pass:0 "红河泛亚友谊关"
DOP_construction_honghe_fan_asia_friendship_pass_desc:0 "强化友谊关面向红河—湄公河与印支半岛的交通和边贸联系。"
DOP_GNG_construction.16.t:0 "红河泛亚友谊关建设完成"
DOP_construction_prd_maglev:0 "珠三角磁悬浮城轨"
DOP_construction_prd_maglev_desc:0 "随着珠三角三城及其中间地带的蓬勃发展，跨市通勤的事情越来越常见，有一些城区甚至成为了被住宅区所填满的“睡城”，为了实现更加便利的通勤，在井深大的建议下，我们实验性地搭建了两条磁悬浮轨道，贯通珠三角的东西两岸，一小时内从广州到达香港从此以后将不再是工作到半夜之后的一句牢骚。"
DOP_GNG_construction.17.t:0 "珠三角磁悬浮城轨建设完成"
