DOP_construction_sky_tower:0 "白鹅新区晴空塔"
DOP_construction_sky_tower_desc:0 "广州是一座老城，老到最早的建筑在南海之畔建起时，如今人们耳熟能详的二沙岛，海珠区与番禺都尚且还是珠江上游的泥沙。它在几百年间都依水而建，顺江而修，迄今为止的所有城市规划都不过是在前人所留下的弊病上做小修小补罢了。\n\n如今，去做前无古人的大功业的责任就交到了我们的身上，我们在广佛交界的白鹅潭规划了一块名称待定的新区，在珠江北岸，一座新城将会拔地而起，国家博物馆，图书馆或是大剧院之类的文体设施将会簇拥着比东京所拥有的还要更加高大的晴空塔，让这座城市骄傲地屹立于三角洲的中心。"
DOP_GNG_construction.1.t:0 "白鹅新区晴空塔建设完成"
DOP_construction_rose_garden:0 "玫瑰园计划"
DOP_construction_rose_garden_desc:0 "香港的旧机场建得实在太早，以现代的视角审视处处都是弊病。选址太靠近市区，跑道太短，航站楼太小——要是让井深放开了骂，他能说上三天三夜。\n\n也正是因为如此，玫瑰园计划应运而生，我们拟在赤鱲角修建一个新的机场，并且配上所需要的交通设施，开通新的机场快线，跨海大桥，跨海隧道，诸如此类。这会是一项很大的建设工程，但我们相信，香港必须要延展它的边界才能得到一个崭新的未来。"
DOP_GNG_construction.2.t:0 "玫瑰园计划建设完成"
DOP_construction_alice_dream_factory:0 "粤海爱丽丝梦工厂"
DOP_construction_alice_dream_factory_desc:0 "澳门，创收之地，梦之地，它以小小几十平方米的面积为广东创造了无数活跃的现金流。在广港两地都在扩张的如今，作为珠三角的一份子，无数旅馆，红灯区以及滨海度假村沿着澳门半岛向北一路扩张，将曾经被称为香洲的地方也一并囊括入澳门，建设成了世界闻名的文旅城市。\n\n也正因如此，在这个人来人往，合贯东西的港口，我们有志于在淇澳岛上建成一座世界上最快乐的游乐园，它将欢迎世界上的所有人——与他们的假期和金钱。"
DOP_GNG_construction.3.t:0 "粤海爱丽丝梦工厂建设完成"
DOP_construction_daya_bay_nuclear_plant:0 "大亚湾核电站"
DOP_construction_daya_bay_nuclear_plant_desc:0 "珠三角的繁荣需要燃料浇筑，这里并不是指人才，金融资本，或者任何足以投机的风口。字面意思地，珠三角作为灯火通明的都市圈，每天所消耗的能源都是一个天文数字。而要是想要真正地走向独立自主，我们就必须有能力高效率地支撑起我们的能源缺口。\n\n在经过无数审批与灰色、黑色交易后，我们得到了在监督下建设商用核电站的机会。我们将核电基地选址于珠三角再向东几十公里的湾区内，使发电量的80%能方便地接入广港澳的高功率电网中。"
DOP_GNG_construction.4.t:0 "大亚湾核电站建设完成"
DOP_construction_guangdong_shinkansen:0 "广东新干线计划"
DOP_construction_guangdong_shinkansen_desc:0 "广东新干线将主要分为两段修建，旨在实现广东的沿岸地区与珠三角的快速互联。在最先修建的港汕线立项之初，以李嘉诚为首的诸多潮商的橄榄枝就伸了过来，表达出投资的意向，试图以此操纵新干线站点的选址，好实现自己的利益最大化。\n\n与之相比，连接粤西的澳湛线便稍微受人冷落了些，不过好在这一侧沿海平原比粤东更多些，修起来也不需要凿山开路，只需要与石油托拉斯做些适当的利益交换，路线规划就基本不会遇到什么难题。"
DOP_GNG_construction.5.t:0 "广东新干线计划建设完成"
