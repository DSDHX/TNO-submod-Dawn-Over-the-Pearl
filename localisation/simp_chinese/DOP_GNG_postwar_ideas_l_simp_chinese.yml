l_simp_chinese:
 DOP_GNG_first_national_crisis:0 "第一次国难"
 DOP_GNG_first_national_crisis_desc:0 "这是广东第一次作为一个国家实体面对直接的外部军事冲击，我们与广西军阀漫长的微妙平衡终于随着一场盛大的地缘危机而彻底破裂。战场上的鲜血注定会浇灌出集体记忆与伤痕；从这场劫难中活下来的，都会成为广东的孩子。"
 DOP_GNG_lingnan_spring:0 "岭南之春"
 DOP_GNG_lingnan_spring_desc:0 "卷入战争并非广东之愿，她却也因此收复法定疆界并获得广西的开发权。熬过风霜后，这个以经济实验为立国之本的政权迎来了属于它的春天；百花争艳之时，潜藏的蠹虫也不会缺席。"
 DOP_GNG_status_lee:0 "反认他乡是故乡"
 DOP_GNG_status_lee_desc:0 "盛田昭夫与李嘉诚始终站在一起，将这片土地重新变成一个可以称作家的港湾。索尼与长实推动本土企业发展，也让珠人与华人得到了本应属于他们的权利。"
 DOP_GNG_status_ibuka:0 "还有明天"
 DOP_GNG_status_ibuka_desc:0 "盛田终于舍得同井深大重修旧好。尽管不一定事事如愿，但为了广东，他们还有明天，广东也还有明天。"
 DOP_GNG_status_finance:0 "狮子山日暮"
 DOP_GNG_status_finance_desc:0 "恐袭之后，立法会前所未有地离心离德。太阳从狮子山上落下，失去增长的广东将被她的孩子们撕扯、分割，迎来黑暗时代。"
 DOP_GNG_status_1962:0 "重奏1962序曲"
 DOP_GNG_status_1962_desc:0 "历史从不重复自己的舞蹈，却总押着相似的韵脚。广东的地主从迷茫中苏醒，誓要重新占有这片土地生长出来的一切。"
 DOP_GNG_status_second_riot:0 "铅色年华"
 DOP_GNG_status_second_riot_desc:0 "这是铅一样沉重的年代。宵禁与戒严一日又一日，自卫队与民族主义者从高楼对峙到群山，无数人的家乡在炸弹火光中化为飞灰。"
 DOP_GNG_security_southwest_war:0 "西南战争安保"
 DOP_GNG_security_southwest_war_desc:0 "西南战争期间的紧急安保体制。"
 DOP_GNG_security_postwar:0 "战后安保"
 DOP_GNG_security_postwar_desc:0 "战后重整中的广东安保体系。"
 DOP_GNG_security_reformed:0 "军改成功安保"
 DOP_GNG_security_reformed_desc:0 "完成军警改革后的广东安保体系。"
 DOP_GNG_integrity_waltz:0 "珠江圆舞曲"
 DOP_GNG_integrity_waltz_desc:0 "嗒、嗒、嗒。秩序和发展是社会的主旋律，全世界投资者的目光都聚焦在行政长官和他的同僚身上。"
 DOP_GNG_integrity_chorus:0 "多声部合唱"
 DOP_GNG_integrity_chorus_desc:0 "行政长官的指挥棒调动着整个社会。尽管偶有错拍，总体而言一切仍在掌握之中。"
 DOP_GNG_integrity_dissonance:0 "不和谐音"
 DOP_GNG_integrity_dissonance_desc:0 "演出错漏百出，演员动作生硬，观众开始窃窃私语，贵宾席的耐心也正在被消磨。"
 DOP_GNG_integrity_chaos:0 "鸡飞狗跳"
 DOP_GNG_integrity_chaos_desc:0 "演员随心所欲的动作造成全面混乱，行政长官的指挥已被忽视，观众正失望离场。"
 DOP_GNG_identity_initial:0 "南国乡愁"
 DOP_GNG_identity_initial_desc:0 "广东的民族问题随着中日关系紧张而激化。华人坚持旧有认同，珠人也未能与原本身份完全切割。"
 DOP_GNG_identity_dual:0 "枯叶的漫漫归途"
 DOP_GNG_identity_dual_desc:0 "立法会将华人与珠人一并确认为法律上的主体民族，为民族问题留下了回旋余地。"
 DOP_GNG_identity_zhujin:0 "新生儿的啼哭"
 DOP_GNG_identity_zhujin_desc:0 "立法会确立珠人为广东的主体民族，并制定界定珠人身份的政策；新的认同更稳定，也会激怒大量华人。"
 DOP_GNG_wartime_triangle:0 "战火中的珠三角"
 DOP_GNG_wartime_triangle_desc:0 "战争正在撕裂广东的社会、财政和政治机器。"
 DOP_GNG_strangle_guerrillas:0 "绞杀游击队"
 DOP_GNG_strangle_guerrillas_desc:0 "广警与自卫队将切断游击队同农村社会之间的联系。"
 DOP_GNG_civil_priority:0 "民事优先"
 DOP_GNG_civil_priority_desc:0 "政府优先维持社会运转与民用物资供应。"
 DOP_GNG_civil_priority_supply:0 "民事优先：保障供应"
 DOP_GNG_civil_priority_supply_desc:0 "民事预算正在反哺前线，供应链也得到改善。"
 DOP_GNG_military_priority:0 "军事优先"
 DOP_GNG_military_priority_desc:0 "政府将有限的预算优先交给前线。"
 DOP_GNG_military_priority_industry:0 "军事优先：工业军事化"
 DOP_GNG_military_priority_industry_desc:0 "发达的民营工业正在转向军需生产。"
