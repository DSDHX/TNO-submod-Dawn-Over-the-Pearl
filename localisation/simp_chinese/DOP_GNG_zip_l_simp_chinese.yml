l_simp_chinese:
 DOP_GNG_zip.1.t:0 "善后工作"
 DOP_GNG_zip.1.d:0 "[ROOT.GetLeader]看着面前的广东地图，上面用红笔划出了三块区域：堪江、钦州和海南岛。堪江和钦州是1955年被西南军阀们夺去的，而海南岛则由于多种原因被巨企们抛弃，导致广东在当地几乎没有影响力。\n\n但现在局势有了变化。盘踞西南的军阀势力随着龙绳武的孤注一掷而烟消云散，广东也在广西获得了一定的话语权，那广东自然要从法统上恢复对堪江和钦州的管理。\n\n至于海南岛，从经济价值上看，这地方已经被中国变成了一座繁忙的港口。考虑到广东对当地本就有法律层面上的宣称，也许是时候该去分一杯羹了。\n\n更重要的是，这地方已经成为南京争取对广东施加影响的据点，且中国军队也可能将此作为基地，一旦中日开战、广东被卷入战火，海南就会成为一个不小的威胁。\n\n不过，考虑到中国对广东的态度，此事恐怕免不了和南京打交道。当然，广东也可求助于日本，让他们直接介入，强迫中国承认这些新变化。\n\n那么，该打给谁呢？"
 DOP_GNG_zip.1.a1:0 "打给宋之光，安排一次会面"
 DOP_GNG_zip.1.a1.tt:0 "我们将与中华民国谈判，以求他们承认我们对堪江和钦州的收复并交还海南岛。他们可能会借此对我们提出条件。"
 DOP_GNG_zip.1.a2:0 "打给高岛，安排一次会面"
 DOP_GNG_zip.1.a2.tt:0 "我们将与大日本帝国接触，以求他们承认我们对堪江、钦州和海南岛的收复，并强迫中华民国接受。这么做可能会引起些……不太愉快的事。"
 DOP_GNG_zip.2.t:0 "与狼共舞"
 DOP_GNG_zip.2.d:0 "当[ROOT.GetLeader]接到通知时，他知道事情已经办妥了。他不知道东京和南京之间经历了怎样的交锋，但考虑到他已经向日本说明了其中利害，想必那些家伙为了自身利益，会让广东得到本应属于她的东西的。\n\n必要的礼都送了，要让出来的利益也都让了，在如此丰厚的回报面前，应该没人会对广东的宣称提出质疑。\n\n坐在沙发上等了一会儿后，高岛从办公室里出来，脸上带着些许严肃：“行政长官阁下，关于你提出的那件事，东京已经帮你处理好了，广东只需要派出人员去接收这些地方即可。”\n\n果然。[ROOT.GetLeader]露出如释重负的笑容，向高岛表达了感谢。“老实说，你还挺有能力，能开出一个不错的价格，让那帮官僚、贵族和军官都同意满足你的诉求。”高岛轻笑一声，摘下了眼镜。“看来，商人和外交官的差距也没那么大。”\n\n确实，商人和外交官都是动嘴皮子去争取利益的活，但商业只是些许利益交换，归根结底来说还是不如外交。\n\n因为外交要付出的代价，是远超想象的。"
 DOP_GNG_zip.2.a1:0 "比如在这件事上，中国又会作何感想？"
 DOP_GNG_zip.3.t:0 "北方来信"
 DOP_GNG_zip.3.d:0 "广东行政长官敬启：\n\n您意欲收回堪江、钦州和海南三地，此事本无需多辩。然阁下竟让日方介入此事，此举无疑有损民国之颜面，亦不利于这一问题的妥善解决。\n\n自民国四十四年起，堪江、钦州便被西南军阀夺去，海南也因此经当时中、广两方商谈后划为特区，而民国仍将堪江、钦州划在广东省内，也声讨西南无端冒犯之举。今叛乱已定，民国自会将两地奉还，阁下为何出此下策？\n\n既木已成舟，我方也不愿再多辩驳，但愿行政长官日后三思而后行。中、广之事，如同家事，无需外人仲裁。勿谓言之不预也。"
 DOP_GNG_zip.3.a1:0 "中华民国总统高宗武"
 DOP_GNG_zip.4.t:0 "寻宝"
 DOP_GNG_zip.4.d:0 "当[ROOT.GetLeader]踏上广东的新领土时，他看到的是一片荒芜。西南长期以来将这里当作对抗南京和渗透广东的前哨站，几乎没有考虑过当地的发展情况。在龙绳武叛乱后，这里免不了被战火摧残一番。原本的乡村和农田化为灰烬，城镇则被临时搭建的难民营取代。\n\n尽管如此，这片土地上仍然蕴藏着商机。对广东来说，土地和人口本身就是最好的资源——珠三角不可能无限地扩张下去，土地和劳动力也并非用之不竭。而且雷州半岛存在着大量的矿产资源，海南也有中国留下的海港可以用于贸易。广东的富商巨贾们越早投资这片土地，他们得到的利益就越多。\n\n当然，这地方毕竟被西南统治数年，加上龙绳武的宣传攻势，百姓不一定服从管理，开发自然也要受影响。但对[ROOT.GetLeader]来说，这些都不是问题。[ROOT.GetLeader]能让自己的蓝图在广东变为现实，在这里自然也能。"
 DOP_GNG_zip.4.a1:0 "那么，开始工作吧"
 DOP_GNG_zip.5.t:0 "意见"
 DOP_GNG_zip.5.d:0 "一封信被放在李嘉诚的办公桌上，当李嘉诚打开这封信并仔细阅读后，他当天晚些时候将其交给了盛田昭夫。\n\n“这封信是几个有影响力的华人团体联名寄来的，你最好看看。”李嘉诚神情严肃，因为即使没有这封信，他也会向盛田提出这个问题。\n\n“所以……他们是希望在民族条例中取得主体民族的地位？”盛田皱起眉头，“我原本以为我们只会讨论如何明确珠人地位的问题。”\n\n“不，昭夫。民族条例也应该确定广东的主体民族了。广东二十多年来从未试着解决民族矛盾，只是为了便宜那些日本富豪。现在既然我们要明确珠人地位，何不一起解决华人地位的问题？你我都清楚，他们才是广东的大多数。”\n\n盛田昭夫的脸上仍挂着忧虑。的确，广东不可能让人数稀少的日本人成为主体，人数众多的华人也不应该被忽视。但宣告珠人的地位本身就是对日本的挑衅，哪怕对华人的重视会得到中国的支持，高宗武大概也不会为这样的纸面承诺而明目张胆地和日本唱反调。"
 DOP_GNG_zip.5.a1:0 "那么，到底该怎么做呢？"
 DOP_GNG_zip.5.a1.tt:0 "人数众多的华人不应当被排除在这个问题之外。我们当然可以让华人成为主体民族之一，这会极大改善中国和我们之间的关系，但日本不一定会感到开心。\n或者，我们也可以用一些手段来促进其他族裔转化为珠人的速度，但我们也可能会因此付出极大的代价……"
 DOP_GNG_zip.6.t:0 "肝胆相照"
 DOP_GNG_zip.6.d:0 "“干杯！”\n\n上一次喝得这么开心是什么时候？行政长官的就职仪式还是暴乱平息的庆功宴上？盛田昭夫这么想着，但一旁已经喝大了的李嘉诚可不管这些。\n\n在民族条例通过时，李嘉诚和长实议员们的欢呼声几乎要把立法会的屋顶掀翻，李嘉诚甚至当场邀请盛田来参与这场酒会。何鸿燊自然也在，他们这个“铁三角”向来缺一不可。至于松下，尽管松下议员们大多投了反对票，但松下本就是个“局外人”，权衡利弊后，他本人反而投了赞成票，毕竟维持广东的稳定对他并无坏处，他自己也不在意民族问题，尽管他确实反感给予华人主体地位一事。\n\n这场酒会自然都是华人和珠人。会上，李嘉诚醉醺醺地将盛田昭夫和何鸿燊拉上主席台，话语确很有力：“我们能有今天的胜利，自然还要感谢这两位。何先生大家都熟悉，不必多说；而这位——盛田昭夫行政长官，他虽然是日本人，但我敢说他和那些日本人完全不是一路人，甚至可以说是我们的同胞！”\n\n台下众人的喝彩声让盛田昭夫一时有些不好意思，但他很快注意到角落里悄悄喝酒的松下，便让何鸿燊把他也拉上来。\n\n在松下半推半就地上台后，盛田昭夫用粤语说道：“还有这位——松下电器在广东的总裁松下正治。他也是个日本人，他也在一些问题上和我们有不和，但这次他和几位盟友投下了赞成票，让我们有更大的优势。我提议大家敬他一杯！”\n\n众人的目光先是迟疑，在窃窃私语后又转为了肯定，并举起酒杯表示感谢。而松下也微笑着举起酒杯表示回应。"
 DOP_GNG_zip.6.a1:0 "看来，适当妥协也没问题，松下这么想着。"
 DOP_GNG_zip.6.a1.tt:0 "在我们立法确认华人的主体地位后，民政派同盟得到进一步巩固，盛田昭夫与李嘉诚将继续携手面对接下来的考验\n索尼席位+2\n长实席位+2"
 DOP_GNG_zip.7.t:0 "形同陌路"
 DOP_GNG_zip.7.d:0 "盛田昭夫满心欢喜地起草着新的行政令，准备将自己的计划付诸行动。但他办公室的门突然被撞开，他的朋友——李嘉诚——怒气冲冲地快步走了进来。\n\n“看到条例内容时我就想问你了，昭夫。”李嘉诚尽可能压制住自己大吼大叫的冲动。“这份民族条例是从德国东方总计划学来的？仅承认珠人的主体地位就算了，你还打算……把广东的常住人口都转变为珠人？”\n\n盛田昭夫感觉背后一凉，冷汗从他的头上冒出。他确实没和李嘉诚商量这事，李嘉诚找他算这笔账也情有可原。\n\n“嘉诚，我确实不能冒这个风险。一旦我们承认华人的地位，那么不仅日侨会对此不满，珠人身份认同也要被动摇，而中国是否会为了我们去和日本论战也是个未知数……总之，我不能冒这个险。”\n\n李嘉诚沉默了，脸已经有些发黑，这让盛田昭夫不由得咽了口口水。他想说些什么稳住眼前的老朋友，但李嘉诚那愤怒的目光让他又不敢开口。\n\n“昭夫，你怎么开始畏手畏脚的了？”李嘉诚咬着牙问道，“以前那个大胆改革的盛田昭夫上哪去了？那个倾听民意的盛田昭夫上哪去了？你听不到华人们的呐喊吗？”\n\n盛田昭夫感觉有什么堵在了喉咙口，以至于他一句话都说不出来。他只能看着李嘉诚的目光从愤怒变为失望，而后看着李嘉诚的身影扬长而去。"
 DOP_GNG_zip.7.a1:0 "接下来的几天，两人都没有见过面"
 DOP_GNG_zip.8.t:0 "艰难的抉择"
 DOP_GNG_zip.8.d:0 "李嘉诚一个人在办公室里喝闷酒，桌上还摆着对索尼与长实联盟的分析。他再次看向结论部分，上面的每一个字都在刺痛他的心。\n\n老实说，他知道和盛田昭夫撕破脸没好处，他也不愿意为了这件事放弃自己手里的一切权力。但这次盛田昭夫确实做得太过分了，不仅在未和他讨论的前提下就提交了民族条例，而且立场是那么的……让人难以接受。\n\n他今天已经让秘书把装满了被粉碎的抗议信的纸箱丢了，但他还是对那堆成小山的废纸屑感到震惊与后怕。何鸿燊也告诉他，华人社会团体已经怀疑长实是否背叛了他们。\n\n现在，皮球踢到了李嘉诚这边。如果他维护盛田的决策，长实的商业帝国第二天就会灰飞烟灭；倘若要和盛田撕破脸，那自己肯定要有所表示，比如断绝长实和索尼的往来，并辞去政务司司长一职。他已经拿这些威胁过盛田了，但没有得到回应。\n\n在内心挣扎了一阵后，他最终作出了一个足以影响整个广东，甚至可能是整个共荣圈的决定。"
 DOP_GNG_zip.8.a1:0 "“给我接香港索尼总部。”"
 DOP_GNG_zip.9.t:0 "政治地震"
 DOP_GNG_zip.9.d:0 "“号外！号外！长江实业宣布终止与索尼的一切合作！”\n\n清晨的卖报声响彻街头巷尾，宛如炸弹在人群中炸响。从底层华工到珠人市民再到日本富商，哪怕不怎么喜欢看报的人都买了一份报纸，想看看索尼与长实为何分道扬镳。\n\n与此同时，良子刚刚坐上林巧川的车，她为了这条爆炸性新闻能更早登出，在工位上待了整整一夜，而结果也正如她所愿：现在《广东妇人公刊》已经卖到脱销。\n\n见林巧川读着报纸，脸上写满了震惊，良子竟有些想笑，其一是她确实很少见林巧川这样，其二是她自己也没想到索尼与长实的分裂。或许这就是所谓的世事无常吧。\n\n……\n\n“阿慧，你知不知道这是怎么回事？”\n\n李慧看着面前的大哥，尽可能回忆她这些天在公司听到的风言风语。\n\n“据说李总那天从立法会回来就是黑着脸的，后面去了一趟行政长官办公室，回来时感觉能生吃个人。然后就听说李总要和行政长官分道扬镳了。”\n\n李骏有些不太相信，但转念一想那份刚通过的民族条例，又好像一切都能说的通。\n\n那么，行政长官到底怎么想出这份条例的？又怎么让它通过的？李骏有些想不通了。\n\n……\n\n“今日立法会例会现惊人一幕。据知情人士透露，在长实正式宣布断绝与索尼的一切联系后，两派人马甚至连位置也由松下成员从中隔开，这无疑是民政派分裂的证明……”\n\n“据悉，李嘉诚和何鸿燊已分别辞去政务司司长和财政司司长的职位，以抗议新的民族融合条例……”\n\n“目前，盛田昭夫行政长官并未对这一系列事件作出回应，而政务司和财务司的日常工作正由其下属各部自主分担执行。目前，尚未有提名新任政务司司长和财政司司长的消息流出……”"
 DOP_GNG_zip.9.a1:0 "天翻地覆"
 DOP_GNG_zip.9.a1.tt:0 "民政派已同索尼和长实的联盟一同崩溃）\n为了在立法会确保绝对多数以及维系政府稳定，我们必须寻找一位新盟友，这意味着我们要和其他人打好关系……\n索尼席位-3，转交给长实"
 DOP_GNG_zip.10.t:0 "时来运转？"
 DOP_GNG_zip.10.d:0 "得知民政派解体，井深大巴不得直接跑街上吹锣打鼓庆祝一番。也正因此，他会请来松下正治和三田胜茂，两位在他看来平庸却可联合的总裁来广东轩小聚。\n\n“我早说过他会再搞砸一次的，”井深大说这话的语气像一位老教授，表情却像刚有了重大发现的研究员一样喜悦。\n\n“话虽如此，我们一样要承担影响。”松下的表情有些忧愁，毕竟他也算接近风暴核心的人。“这两天不少中国资本撤走了，没那么在乎民族问题的也打电话过来，希望我透露点内幕。甚至有些日本投资者也担心这会导致铃木倒台那样的政治危机，计划提前撤资。”\n\n听到这，井深的表情也平静下来，但他的话语中还是带着些许愉悦：“总之，我就等着看盛田昭夫什么时候卷铺盖走人，这个无能的蠢蛋甚至连索尼内部都稳不住了，好像今天早上还有人来联系你吧？”\n\n松下点了点头，这确实是不幸中的万幸。现在站在索尼一边的议员已经有了找下家的打算，他自然也乐意接纳他们。\n\n“这样一来，我们是不是能借这个机会，动摇一下这位行政长官？”一旁的三田胜茂突然开口问道。这句话点醒了两人，而三田也因此收获了赞许的目光。虽然日立跟着驹井一起名誉扫地，但松下和井深还挺喜欢这家伙的。主要他看起来比驹井更守规矩些，不管是生意上还是政治上。\n\n“……既然如此，我想虽然我们的目标不一致，但至少我们目前都打算干一件事。”松下露出一个狡黠的笑容，“让我们去和索尼的朋友们谈谈吧。”"
 DOP_GNG_zip.10.a1:0 "三人将酒杯碰在一起，仿佛达成了某种协议"
 DOP_GNG_zip.10.a1.tt:0 "索尼席位-3，转交给松下\n索尼席位-2，转交给富士通\n索尼席位-2，转交给日立"
 DOP_GNG_zip.11.t:0 "四海承平？"
 DOP_GNG_zip.11.d:0 "看着报纸上对于西南局势的报告，盛田不由得皱起眉头：“嘉诚，你觉得这是个麻烦事吗？”\n\n李嘉诚则躺在办公椅上，像是在思索些什么。许久后，他给出了回答：“我觉得不太可能。如果西南真的发生了叛乱，那么南京会帮我们处理好一切的。”\n\n盛田脸上的担忧丝毫未减：“如果南京没法处理呢？或者说，如果南京和我们一同陷入危机，而他们无力支援我们呢？”\n\n李嘉诚没有说话。\n\n……\n\n有关西南局势的风言风语正在广东的大街小巷中流传，所谓“惩罚汉奸”、“打跑日本人”之类的宣传材料也在一些边境乡村中被发现。\n\n渐渐地，西南成了新闻界的热门话题，就连安川良子也赶往一处村庄进行调查。\n\n当她和林巧川从村民手中接过那写得密密麻麻的彩纸，低声念着上面的内容时，林巧川不由得后背一凉。他的思绪回到了四十年前，儿时的他看到的那些抗日宣传。当时的他还小，不知道这意味着什么。\n\n但现在他明白了，对于现在的自己和良子来说，这意味着大祸临头。"
 DOP_GNG_zip.11.a1:0 "那么，灾祸何时会来呢？"
 DOP_GNG_zip.11.a1.tt:0 "我们要密切关注西南局势……"
 DOP_GNG_zip.12.t:0 "哨岗一刻"
 DOP_GNG_zip.12.d:0 "一辆卡车自远处开来，车上的驾驶员和副驾驶都神色严肃，而在后面的车厢中则坐了十余名衣衫褴褛的年轻人。\n\n执勤的野田警员将他们拦下：“哪来的？来干什么？”\n\n驾驶员的表情稍微缓和了一些：“我们是广西来的难民，不想跟那个什么龙绳武混，特地想借道从这里跑去北方，希望您放个行。”说着，驾驶员拿出了一小卷钱。\n\n野田有些怀疑这套说辞，正打算请示上级时，对讲机内却传来近乎嘶吼的声音：“请求支援！17号哨岗遭遇武装袭击！”\n\n听到隐约传来的枪声，野田不由得心头一紧。“17号哨岗，请报告具体情况。”调度员的声音仍然像以往一样沉稳，只是语速略快了些。“有一伙不明人员冒充广西难民要求放行，但在我们准备向上级请示时，他们向我们开枪！”\n\n接下来发生了什么，野田也没心思听了，因为在他面前就有一伙“广西难民”。\n\n“警戒！”话音刚落，驾驶员就一枪打中了野田的右手，哨岗内其他警察和车厢内的人随即冲出来向对方开枪，枪声响彻整片树林。"
 DOP_GNG_zip.12.a1:0 "与此同时，一个个哨岗与广州失去了联系"
 DOP_GNG_zip.12.a1.tt:0 "开始了。"
 DOP_GNG_zip.13.t:0 "迫在眉睫"
 DOP_GNG_zip.13.d:0 "“谁能告诉我这他妈是怎么回事！”\n\n大森宽难得在开会时拍桌子，但今天他一连拍了好几下。所有的警队高层此刻都埋着头一言不发，不仅是因为恐惧，更是因为他们本就一无所知。\n\n“现在整个粤西的哨岗，我们只能联系三成不到，其中一成还在和不明人员交火。你们谁能给我个解释？”\n\n其中一名高级警司结结巴巴地回答：“也许是广西有土匪聚众闹事……”“你告诉我土匪哪来的这么多枪支弹药？”大森粗暴地打断了他。\n\n有人提出可能是流窜到此的抵抗组织，大森也反驳道：“就算是抵抗组织，为什么广西没通知我们？现在发去的电报没一份回复的！”\n\n会议室又陷入了死一样的寂静。大森头上的青筋显眼可见，他正打算再骂几句，会议室的门却突然被推开。来人是宫崎清隆。\n\n“抱歉打断了你们的内部会议，但永野将军命令我无论如何都要通知你们这件事。”宫崎擦擦头上的汗，把手上拿着的电文交给了大森。“老实说，我一开始也不知道他为啥会想到你们，但现在我觉得这件事必须让你们知道。”\n\n大森闻言，低头看向电文，上面的一行字刺痛了他的双眼。"
 DOP_GNG_zip.13.a1:0 "“中国西南发生大规模武装叛乱，广西已投降叛军”"
 DOP_GNG_zip.13.a1.tt:0 "广东将迎来比石油危机还要严峻的灾难……"
 DOP_GNG_zip.14.t:0 "蛾摩拉的崩溃"
 DOP_GNG_zip.14.d:0 "茂名正处于一片火海当中。\n\n空气中弥漫着不知道什么东西烧焦的味道，地下横七竖八地躺着许多尸体，有的穿着广警制服，也有的穿着深绿色的军装，还有些穿着各式各样的衣服。一旁的大楼摇摇欲坠，街上的车辆撞在一起，在火焰燃烧的“哔剥”声中不时传来爆炸声和什么东西垮塌的声音。\n\n几名穿着军装的男人在城中走着，他们的脸上满是尘土，还有些伤口，手上拿着步枪。\n\n“其他部队据说进展也很顺利，不出意外的话，我们再过一周就能光复广东。”一名男人说着，从背后的背包中抽出地图。“大部队现在估计在阳江一带，最快的部队似乎已经到了肇庆市区附近，伪广警察根本无法阻止我们，鬼子也只在广州驻扎了一个师团，分身乏术。”\n\n几人继续向前走。“如果中国的旗帜能再一次在广州升起……”突然，走在最前面的男人停了下来。“……那么所有人的牺牲，就都是有意义的。”\n\n他将步枪背上，拿出手枪，枪口对准一旁正艰难挪动身躯的一名广警。“到那时，我要这群汉奸和他们的日本主子血债血偿，告慰我们死去的同胞。”\n\n枪声打破了城内寂静的氛围，广警的头上多了一个弹孔。没人为他哀悼，也没人为他收尸，而男人们继续向前走去。有朝一日，他们要让珠三角的那些叛徒和剥削者们也享受这样的待遇。"
 DOP_GNG_zip.14.a1:0 "远处的火光映红了天空，一如鲜血染红了大地"
 DOP_GNG_zip.15.t:0 "束手无策"
 DOP_GNG_zip.15.d:0 "广州今天的天空是阴暗的，不时有雷声响起，空气也变得闷热，昭示着一场大雨的到来。\n\n此时，广东最有权势的几人坐在会议室内，墙上广东地图的西部被红笔圈出，无数个叉被打在这一区域的城市上，代表广州已与该地失去联系。\n\n大森拿起笔，在“肇庆”二字上打了个叉：“肇庆已经和敌人正式交火了，这块地区的沦陷应该只是时间问题……”\n\n众人此时都垂头丧气，因为这次比广东暴乱还要让人感到恐惧和无助。数量不明的武装分子正向珠三角步步紧逼，广警即使拼尽全力也只能迟滞他们前进的脚步，为高岛和永野搬救兵争取时间。\n\n“他们还没回电吗？”盛田看向松下，但回应他的只是一个摇头的动作和一声叹息。\n\n众人陷入沉默。珠三角的广警、宪兵队再加上企业安保，估计也就只能抵抗三天左右。中国军队正和叛军在前线对垒，暂时抽不出兵力支援他们，“凰”师团面对叛军更是杯水车薪。\n\n撤离看上去也不是个好主意，除了松下和驹井，其他人的一切都在广东，放弃广东就等于放弃了一切——事发突然，他们根本来不及撤走他们的资产。\n\n“你们说……五天内会来援军吗？”李嘉诚忍不住开口问道，但没人回应他。他们现在能做的只有等待，无论是援军还是死亡。"
 DOP_GNG_zip.15.a1:0 "时钟正嘀嗒作响……"
 DOP_GNG_zip.16.t:0 "再一次……"
 DOP_GNG_zip.16.d:0 "不知是谁泄露了消息，“广东沦陷”在一天之内便传遍了大街小巷，将珠三角的宁静砸了个稀巴烂。机场和港口很快便挤满了人，原先接到布防命令的广警又不得不去维持秩序。\n\n日侨们自然能得到最先离开的权利，一些位高权重的珠人亦是如此，但交通工具显然不能一次性将他们带走。当一些珠人幸运地逃离这片土地时，被挤下来的日侨气得几乎发疯：“凭什么那些支那人能比我先走？”\n\n这一言论很快点燃了一部分珠人的怒火，而日侨们选择拒不道歉，甚至让保镖或者极道分子去把那些珠人打一顿。这不仅刺痛了珠人的自尊，也让他们开始质疑起政府宣传的“平等”来。很快，街头抗议又开始了。\n\n祸不单行的是，西南的抵抗组织似乎早就渗透了广东，时不时就会用炸弹对工厂和基建造成破坏，或者在华人聚集地散布民族主义言论。一些华人就这么被煽动起来，加入珠人的抗议，甚至加入抵抗运动的行列。\n\n盛田政府为平权所做的一切努力，此刻正化为乌有。日侨或许不会为他们的傲慢付出代价，但广东一定会承担这一切。"
 DOP_GNG_zip.16.a1:0 "老天啊，别再来了……"
 DOP_GNG_zip.16.a1.tt:0 "日侨人口将大幅下降！\n华裔人口将大幅下降！\n所有地区日侨支持率-2.50％\n所有地区珠人支持率-2.50％\n所有地区华人支持率-5.00％"
 DOP_GNG_zip.17.t:0 "领事馆一夜"
 DOP_GNG_zip.17.d:0 "又一份电报发去南京，汇报广东目前的境地。宋之光这几天一直在干这种差事，而南京却没下达让他撤离的命令，哪怕起义军已经到了佛山一带。\n\n领事馆只有一个排的安保，虽然都是“特警”出身，但他们不是以一当百的天兵，就是那位在他同志们口中无所不能的毛主席，恐怕也不会指望靠这些人挡住声势浩大的起义军。\n\n想到这，宋之光喝了口桌上的浓茶，思索着再这样下去的结果。日本的支援估计还要个两三天，南京对于增援的回复是“爱莫能助”——确实，华南的兵力全在湘西一带，南京也不可能为这事暴露“特警”部队的真实用途。\n\n看来，广东挺过这一关的希望渺茫。\n\n……\n\n汪敬煦在另一间办公室安抚自己死里逃生的家人，但按他家人的说法，起义军很可能是有组织、有计划的武装力量。如果是这样的话，前线局势可能比他想象的还要糟糕。\n\n从办公室出来后，他少见地点了根烟，思索着接下来怎么办。广东大概率是完蛋了，这地方连个像样的武装力量都没有。也许南京马上会安排他们撤离？也难说。这些武装分子哪来的？也不清楚。也许是宋之光的同志们，也许是叛乱军阀，也许是蒋介石派系的遗老遗少……反正不是土匪。\n\n心烦意乱的他就这么叼着根烟，一直坐到了天明。"
 DOP_GNG_zip.17.a1:0 "也许，这就是结局了？"
 DOP_GNG_zip.18.t:0 "去？还是留？（1）"
 DOP_GNG_zip.18.d:0 "良子手上攥着机票，在安检口排队等待上机。这张票是林巧川找人帮忙买来的，尽管林巧川说自己留了一张，但想也知道他根本走不掉。哪怕他只是名警员，他也要留下来直面那些叛乱分子。\n\n马上就要到她了，很快她就能离开这块土地，以在广日侨的身份求得庇护。但内心里，她还是有些犹豫：要不要走呢？留在这里很可能是要死的，但走了自己又剩下什么？自己过去十年得到的一切都在广东，包括她唯一算得上认识的人——林巧川——也在这里。她如果回去，恐怕也只剩一条命了。\n\n她手上的机票渐渐变皱，她的心中无比煎熬。面前的人渐渐变少，但她模糊的视线却让她感觉面前站了几百个人。她的脚仿佛灌了铅一样沉重，而后面的人正催她快向前走。当良子回过神来时，自己竟已不知不觉转过身去，面朝了出口的方向。\n\n那一刻，她下定了决心。"
 DOP_GNG_zip.18.a1:0 "机票从手中滑落，而良子跑出了机场"
 DOP_GNG_zip.19.t:0 "去？还是留？（2）"
 DOP_GNG_zip.19.d:0 "警车在空无一人的大街上飞驰，驾驶员正是林巧川。几个小混混在聚众闹事，但现状只允许他一个人出任务。很难想象这时候还在大街上打砸抢的是什么心态，就算是西南来的那群不速之客，应该也很排斥这种行为吧？\n\n他的时间不多，有几处路障的布置还需要他去检查，还有一些物资运输需要他核对，宝贵的时间不能浪费在遵守交规上，更何况已经没有交警来管这事了。\n\n正当他拐过一个路口时，一位正穿过马路的女子映入眼帘，让林巧川立马踩了刹车。幸好，车子离女子还有两三米远，但她明显被吓到了。\n\n“实在抱歉……”林巧川探头出去想道歉，却看到了一张熟悉的脸。\n\n是良子。\n\n……\n\n车上，两人都一言不发，良子看着窗外的街道，林巧川则专心开车。小混混被路过的同事处理了，林巧川也自然敢让良子搭顺风车，顺路带到安全区去。\n\n“你怎么不走？”林巧川率先打破寂静。“我……不想离开这里。”良子的脸还别在一边。“我真的不想。”\n\n“那，你的命也不要了么？我们估计是挡不住他们的。”\n\n“如果是死在这里的话，那也值得。”"
 DOP_GNG_zip.19.a1:0 "“毕竟孤身一人死去，不是很悲哀吗？”"
 DOP_GNG_zip.20.t:0 "去？还是留？（3）"
 DOP_GNG_zip.20.d:0 "“你的钱，拿好。”\n\n黄浩辉将一小卷钞票拿给面前的男人，男人接过钱道了声谢。“那个……黄先生，我想问下，你打算离开广东吗？”\n\n黄浩辉一愣，他不知道面前这人为何问这个问题，但他还是摇了摇头：“怎么可能，我全身家当都在这了，离开这我就什么也不是了。”\n\n男人若有所思地点了点头离开了，黄浩辉则收拾着自己的办公桌，心里还想着刚刚自己的那句话。\n\n……\n\n李骏领了补助金后回到家中，父母早已囤了不少物资，够他们过上一周安生日子了。在吃饭的时候，李骏还是问出了那个问题：“我们……要不要走？”\n\n父母和弟弟妹妹都看向他，脸上的神情有些莫名其妙。“东西都买好了，这时候说走……”父亲摇了摇头，表达了拒绝的意思。\n\n“我不太确定那些人怎么看待我们……如果他们把我们当作汉奸，那我们肯定活不成……”\n\n“但我们又能逃到哪呢？去北边吗？”李晞一句话问得李骏哑口无言。“去北边不也是仰人鼻息，而且我觉得那里的人可能也不待见我们，还不如留在这……”\n\n李骏的筷子停在了半空中。弟弟的话确实有道理，他们已经无路可走了。但留在这里，生的希望十分渺茫，他不愿把家人送上绝路。\n\n“行了，别说了。一家人都不走，一家人都留在这。往北边跑也不安全，万一那帮人真成事了呢？不如直接留下来，碰碰运气。”\n\n李梁的这句话终结了讨论，一家人继续默默无言地吃着饭，但每个人脸上的阴霾仍挥之不去。"
 DOP_GNG_zip.20.a1:0 "至少身边还有家人，对吧？"
 DOP_GNG_zip.21.t:0 "苦尽甘来"
 DOP_GNG_zip.21.d:0 "会议室的氛围依然很沉重，每个人身上的西装都皱巴巴的，脸上仿佛多了十来道皱纹。江门和佛山都已遭到攻击，即使有“凰”师团投入战斗，但敌众我寡，他们也很难维持战线。\n\n竹田五郎在报告中表示，即使按原定计划防御珠三角，也最多只能坚持五日，还是在理想情况下。绝望让立法会作鸟兽散，只有五巨头和他们的忠实簇拥仍在坚持。\n\n但在例会快散时，竹田突然冲了进来：“永野将军回电了！”\n\n这消息如同一道惊雷，劈开了众人心中的阴霾。盛田也顾不上客套话，急忙拿过电文来看。上面写着永野和高岛已带领援军自台湾出发，直接协防珠三角。\n\n“那看来，北方恐怕要受威胁……”大森的喃喃自语揭露了又一个问题——粤北该怎么办？南京可是把全部兵力派去了西南前线！\n\n这时，电话铃突然响起。李嘉诚顺手接起电话，随即露出惊喜的神色。\n\n“怎么了？”盛田凑过来问道。\n\n“东京和南京达成一致，同时派兵来支援广东，中国估计很快就会调兵进入粤北！”李嘉诚几乎是将这句话吼出来，而在座众人对这条消息更是欣喜若狂。\n\n“对了，还有一件事。”李嘉诚说着，看向大森。“电话里还说，给我们的军火，可以用来武装平民。”"
 DOP_GNG_zip.21.a1:0 "大森的眼里突然迸出光芒，嘴角不由得微微上扬"
 DOP_GNG_zip.22.t:0 "黎明"
 DOP_GNG_zip.22.d:0 "结束了。一切都结束了。\n\n攻克昆明的消息很快传到了广东，龙绳武尸体的照片被登在头条上，日军对外宣布护国军已不复存在，中国的危机结束了。\n\n对于广东来说，这无疑是个天大的好事。众人脸上露出了久违的笑容，宣告广东又撑过了一轮劫难。\n\n根据南京和东京方面私下达成的协议，中国得以正式进驻他们的西南边疆，但已经几乎成为白地的广西却被移交给了广东，成为中国的又一个特区。没人知道这么做的深意，就算是宋之光也大为不解。\n\n对于盛田昭夫来说，今天值得庆祝。所有人聚在一张桌子上，就连驹井也为广东的胜利举杯庆祝。但在一夜的欢声笑语后，盛田就要面对战后重建的问题：粤西受到了极大的破坏，被甩过来的广西也要广东对其负责，更别提崩溃的经济和再度分裂的社会了。\n\n不过，最危险的时刻已经过去。盛田既然能改变广东，自然有能力再把她变回去。"
 DOP_GNG_zip.22.a1:0 "新的一天又要开始了"
 DOP_GNG_zip.23.t:0 "镜花水月"
 DOP_GNG_zip.23.d:0 "晚饭后，李骏一家选择出门散步，换换心情。自从那场灾难般的恐怖袭击后，广东社会仿佛变回了安田危机和石油危机时的样子：分裂的社会、停滞的经济和几乎失能的政府。最后一项是近期社会上的流言，说盛田行政长官孤立无援，下台是早晚的事。\n\n街上几乎每隔几十米就能看到两名警察，看上去好像在监控路况，但李骏心里清楚，这是为了防止那些“聚众闹事”的人。\n\n“你们那边什么情况？”李慧突然开口问道。“最近长实内部传言说，李嘉诚要对盛田昭夫下手……”\n\n李骏和李晞没有搭话。他们听到的是盛田昭夫要对李嘉诚下手。\n\n李梁叹了口气：“这世道真怪。前些年还要好的朋友，现在成了死敌。”\n\n李晞突然想到了井深大，据说他和盛田以前也是挚友……果然，太阳底下无新事。\n\n不远处响起哨子声，周围的警察们立刻朝着声音源头赶去。一名警察不小心撞到了李梁，匆忙将他扶稳并道歉后，警察跟着他的同伴们跑开了。\n\n一家人走过去望向远方，只见一小撮人正与警察们打成一片，地上散落着各种颜色的传单。不一会儿，一队全副武装的警察到达现场，还在扭打中的警察们立马脱身跑开，随即疏散周边看热闹的群众。\n\n然后，催泪弹在抗议的人群中炸开。群众四散逃离，后来的特警小队则开始逮捕倒在地上的抗议者。\n\n李家人看着眼前的景象，思绪回到了广东暴乱时，警察镇压抗议者的场景。"
 DOP_GNG_zip.23.a1:0 "亘古不变……"
 DOP_GNG_zip.24.t:0 "自我怀疑"
 DOP_GNG_zip.24.d:0 "深夜，大森宽在两名护卫的陪同下前往行政长官府邸。到达目的地后，他将随行人员留在门外警戒，随即进入屋中。\n\n“盛田，你要的安保报告。”大森将一小沓纸从公文包内拿出，甩在盛田昭夫的桌子上。后者则匆匆看了几眼，便将其放下，疲惫地靠在椅背上。\n\n“……这么多年同事，我也给你提个醒。”大森脸上写满了无奈。“你要再和松下混下去，等哪天反对你的人——长实或者富士通——开出更高价的时候，松下绝对弃你而去，到时候就真没人愿意搭理你了。”\n\n“所以……”盛田的声音听上去很颓废，又有一丝悲伤。“我过去真的什么都做错了吗？是我亲手埋葬了我自己……和广东的未来吗？”\n\n大森没有搭话。作为警务处处长，大森极少过问和警队无关的事务。即使腐败之风再兴，警队内部问题和治安状况也还在可控范围内。至于劫持案的灾难结果，作为总指挥之一的他同样难辞其咎。所以对他而言，盛田还不算那么罪不可恕。\n\n“想个法子尽快补救吧，我和警队还站在你这边。”大森说完这句话便离开了，留下盛田昭夫一人空洞地看着窗外五光十色的霓虹灯。"
 DOP_GNG_zip.24.a1:0 "或许从一开始，这条路就不对……"
 DOP_GNG_zip.25.t:0 "重修旧好？"
 DOP_GNG_zip.25.d:0 "李嘉诚和盛田昭夫相对而坐，一言不发。\n\n尴尬的气氛促使盛田昭夫率先开口：“嘉诚，今天找你来，是希望我们俩能……再好好谈谈。”\n\n“如果你想和我谈谈，那我没什么意见。”李嘉诚的声音中透着一丝冷淡，看起来他并不在意这次会谈。\n\n“……谢谢。”盛田点了点头，随即看向自己桌上的公文。“第一件事，是我希望你能停止和一些不法团体的合作。比如说……”\n\n“这么快你就决定把何鸿燊他们定义成‘不法团体’了？”李嘉诚用嘲讽的语气问道。“你我心里都清楚，能和我们扯上关系的只有三合会。你这么做，莫不是卸磨杀驴？”\n\n“我不是这个意思……”盛田昭夫有些迟疑。确实，他口中的那些“不法团体”都隶属三合会，或者说何鸿燊。“我的意思是，你们必须停止煽动群众……”\n\n“那你就要好好考虑下法律问题。”李嘉诚的目光突然变得凌厉。“把那该死的珠人化政策取消，或者干些什么别的也好。如果你不想再来一次劫持案，那么华人就必须得到公平的对待。”\n\n……\n\n谈判持续了一个下午，最终的结果自然是一无所获。盛田昭夫拒绝在民族问题上让步，他认为太过重视华人反而会引来日本的不满，而这让李嘉诚大为光火。\n\n“好好想想吧，盛田。二十年前的你会对现在的你很失望的。”\n\n李嘉诚扔下这句话就扬长而去，而这句话让盛田昭夫的内心久久不能平静。是啊，二十年前的他看到今天这幕，会不会走过来给自己两个耳光呢？\n\n他这么想着的时候，秘书走了进来。"
 DOP_GNG_zip.25.a1:0 "“阁下，井深大拒绝了与您的会面。”"
 DOP_GNG_zip.26.t:0 "摇摇欲坠"
 DOP_GNG_zip.26.d:0 "报社给良子下达了一个任务：随机抽取一些市民，并询问他们对现状和盛田行政长官的态度。按主编的说法，政府已不像十年前那么受群众信任，一些报社已经开始报道行政长官的负面新闻，他们同样不能落后于热点。\n\n对良子来说，这个任务显得有些不太道德。行政长官为广东鞠躬尽瘁近三十年（从他进入立法会算起），此时这么对他可谓落井下石。即使劫持事件的结果令人痛心，他也不至于到人人喊打的地步，毕竟现在的广东是他一手打造的。\n\n可惜的是，调查结果恰恰相反：约一半的受调查者对现状表示不满，其中有近三成的受调查者认为行政长官应辞职或受弹劾。这些人中有日本的富商大贾，也有本地的底层工人。\n\n虽然很令人震惊且感到不可思议，但数据毕竟是不会说谎的，事实就是盛田的统治地位已经开始动摇，而他当初的支持者们正渐渐走向对立面。"
 DOP_GNG_zip.26.a1:0 "那么，他能否走过这条钢丝呢？"
 DOP_GNG_zip.27.t:0 "不太愉快的会谈"
 DOP_GNG_zip.27.d:0 "“感谢行政长官阁下的款待。”\n\n山下俊彦微笑着放下手中的茶杯。他知道盛田昭夫找他来可不只是喝杯茶，但他也清楚盛田昭夫的目的在于拉拢他，所以他有的是耐心和他耗，直到盛田松口给出最高价的那一刻。\n\n“山下先生客气了。你新来乍到，我应当尽地主之谊。”盛田回道。“不过，今天请你来，还是希望能和你商量些事……”\n\n来了。山下立马转了态度，一脸严肃地看着盛田昭夫：“阁下请说，我正好也希望了解一下现在的大政方针。”\n\n“山下先生应该清楚，松下此前主导了一些改革工作，但这些新政策明显动摇了广东的稳定……”\n\n山下忍住了嘲笑盛田的冲动。那你当初批准这些的时候又是怎么想的？他心里问道。\n\n“……所以，我希望山下先生可以帮我说服一下松下在立法会的议员们，支持我对一些改革作出回调。”\n\n此话一出，山下的眉头便扭成一团，随即提出反对：“阁下此言差矣。就松下前几年的财报而言，企业收益实际上是在逐步上升的。阁下应当清楚，广东的经济本就是其稳定的根基，当务之急是要稳定投资者信心，应该继续改革才是。”\n\n盛田愣住了。山下随即按松下正治交代的话术，反驳盛田回调改革的观点。\n\n在被一系列“放松监管有利于企业效益上升”之类的说法冲击后，盛田意识到会谈已经没有进行下去的必要了。他只能客套几句后，借口还有事在身，让秘书送山下离开。"
 DOP_GNG_zip.27.a1:0 "山下走后，盛田将脸埋在双手里，思考着接下来该怎么办"
 DOP_GNG_zip.28.t:0 "来自大阪的问候"
 DOP_GNG_zip.28.d:0 "“你好，山下先生。在广东还适应吗？”\n\n松下正治尽可能让自己的声音更像是喜悦而非嘲弄，但电话对面的山下感觉还是有些反胃。\n\n“承蒙关照，一切安好。”山下咬着牙回答。“虽然有些东西和您说的……好像不太一样啊。”\n\n“这就是你要学的第一课：随机应变。”松下嘴上这么说，心里早就乐开花了。山下一直在老松下接班人问题上唱反调，自己是该让他吃点苦头了。\n\n随后，松下问起了他最关心的问题：“盛田昭夫找你谈过了吗？”\n\n电话那头沉默了一会儿。“谈过了，我全推掉了。至少未来一段时间内，没人能改变现行政策。”\n\n很好。现在盛田昭夫孤立无援，即使反悔也来不及了，松下、富士通和日立会不约而同地拒绝一切提案，而长实有自己的议程要推动，除非盛田昭夫同意李嘉诚那激进的改革计划，但他之前出于谨慎放弃了。\n\n现在，盛田昭夫还有选择的余地吗？"
 DOP_GNG_zip.28.a1:0 "“那么请继续努力吧，山下先生。”"
 DOP_GNG_zip.29.t:0 "新官上任"
 DOP_GNG_zip.29.d:0 "外务司存在的作用是什么？山下在正式开始办公前一直思考着这个问题。字面意思上，外务司就是广东用于对外联络的部门，如果不是近几年广东地位的改变，这种联络仅局限于同中日两国。\n\n但现在不一样了。仅山下知道的一项职责，就是要统筹广东在当地的业务网络。换言之就是作为五巨头对外的代理人，为广东的外贸布局。\n\n现在的情况明显复杂得多：广东正承受劫持案带来的负面影响，一些日资的撤离迫使盛田下令扩大外贸，以应对可能的经济下滑。对山下来说，这算是个难事，毕竟要和形形色色的外国人打交道。\n\n虽然满腹怨言，但毕竟不能和盛田公开撕破脸，那会产生一些负面言论。因此，新任外务司司长山下即将开始他的工作，为盛田的政府打上几个补丁。"
 DOP_GNG_zip.29.a1:0 "那么，就先从泰国开始吧……"
 DOP_GNG_zip.30.t:0 "不太体面的作秀"
 DOP_GNG_zip.30.d:0 "黄浩辉在账本上打上几个圈后，便将账本放在一边，随即又拿起另一个账本。这些天他和多名同僚的工作便是如此：审查收集来的所有官员的财务状况，并将收支异常的人员名单交给反腐部门。\n\n即使黄浩辉已不再是一名小会计，他对这些事务也还算得上得心应手，也乐意帮自己手下人一把。况且现在盛田行政长官有拨乱反正的意向，他也应当大力支持。\n\n但在审查了上百份记录后，他感觉有一股凉意直冲脑门。因为这上百份记录里，算得上清白的竟然只靠两只手就数过来了。\n\n“去他妈的……”他骂了一句，不知道是骂贪官还是骂警察。但他突然感觉没动力再接着查下去了，因为他有些反胃。谁知道接下来这几百份里头又有几个干净的？\n\n他收拾好桌面，到窗边喘了两口气。松下确实站在反腐立场上没错，索尼以前也确实没查过自己联人，但索尼和长实不敢说出淤泥而不染，起码干的事对行政机器的运转而言无关紧要。可现在松下庇护下的权钱交易已经严重影响广东的日常运作了，那这不就等于没反腐吗？\n\n黄浩辉突然笑了，但他说不上来为什么笑，或许是无奈了吧。"
 DOP_GNG_zip.30.a1:0 "倘若广东就此沉沦，那他也束手无策"
 DOP_GNG_zip.31.t:0 "观众"
 DOP_GNG_zip.31.d:0 "驹井健一郎此刻正在山中徒步，平稳退休的他没什么事就会去户外运动，消磨一下时光。\n\n在山顶休整时，驹井向一旁的私人助理询问广东的近况，尤其是三田胜茂的动向。虽然是他亲手考核并任命了这位新社长，但他依然放心不下。\n\n助理简单说明了广东的情况：盛田找不到可信任的盟友，导致民政派军心不稳；长实随时准备接收索尼的政治资源，壮大自己在底层的影响力；松下掌握着生杀大权，但新来的山下俊彦和盛田并不是很合得来；至于井深大，他还是老样子。\n\n出乎驹井意料的是，三田虽然在一些方面和盛田达成了妥协，但日立总体上变化不大，利润\n\n也一年比一年多，原先的颓势已经一扫而空了。\n\n“看来我没选错人。”驹井微笑着打开保温瓶，喝了口水。“一会儿回去帮我和他安排一次通话，我要亲自祝贺这位栋梁。”\n\n太阳渐渐升高，驹井大步向山脚走去。一路上他都掩盖不住脸上的笑意，毕竟让自己憋屈了十年的盛田昭夫，此刻也正经历着属于自己的至暗时刻。而这次观赏他人苦痛并乐在其中的，是他驹井健一郎。"
 DOP_GNG_zip.31.a1:0 "想到这，驹井的嘴角又上扬了几分"
 DOP_GNG_zip.32.t:0 "明知山有虎……"
 DOP_GNG_zip.32.d:0 "当门被“砰”的一声撞开时，盛田昭夫已经意识到情况不妙了。但既然他做出了这个决策，那他自然也要承担后果。\n\n“你在搞什么？”松下皱着眉头大步走进他的办公室，几乎是咬着牙在问他。“你要解散立法会？还要允许商界以外的人进来？”\n\n看来还是走漏风声了。盛田只和自己的几个心腹参进行了讨论，恐怕这些人也没管住嘴。接下来的一刻钟，松下都在批评他的这一决策，并大谈商界的领导对广东是多么有益。\n\n等松下气呼呼地坐到椅子上，盛田才让一旁的秘书给他倒了杯水。“松下，我知道这很难令你接受，但你要明白，广东的体制确实需要一场变革了。远的不说，安田危机时候可以说半个立法会处于瘫痪状态，广东差点跟着安田一块入土了。暴乱也是日立引起的，现在驹井人滚蛋了，但广工联和华工委的影响完全无法根除。一句话，企业不能高高在上了。”\n\n“这不是你准备修改基本法的理由。就算你过得了立法会这关，日本也不会同意，更别提你根本不可能争取到五十票。”\n\n松下直直地盯着盛田，目光中仍带着怒火。\n\n“……松下，你应该清楚票不是问题，立法会的珠人们对此还是持正面态度的，和我有共识的人足够让这份提案接近临界点。”\n\n“那你就打算去贿赂甚至恐吓了？”松下嘲弄似的笑了。“那好吧，你尽管打你的如意算盘去吧，立法会会让你颜面扫地的。”"
 DOP_GNG_zip.32.a1:0 "松下拂袖离去，战争也一触即发"
 DOP_GNG_zip.33.t:0 "越过红线"
 DOP_GNG_zip.33.d:0 "在立法会众人的窃窃私语声中，盛田昭夫登上主席台，深吸一口气后直接抛出了今天的主题——就《立法组织条例》进行投票。\n\n议员们的话题很快从盛田遇刺变为对条例的讨论，一部分人已经从他们的领袖那听说了大致内容，随即在会场将其传播开来。\n\n“……所以，我认为有必要提出这份条例，对广东的体制进行一些改变……”\n\n有些人开始坐不住了。\n\n“这是为了广东的长远利益考虑……”\n\n质疑声越来越大，但不少人还是选择静观其变，祈祷自己听到的只是个玩笑。\n\n“……这份条例主要规定了立法会成员的选举形式，也就是说如果条例通过，则现有的立法会应当解散……”\n\n“什么？”终于有人忍不住喊出声来。“去你的吧！你他妈想怎样？把广东送给中国人？”一名议员几乎是从座位上跳起来发出质问，类似的辱骂和质疑声随即如潮水般向盛田袭来，而总裁们和极少部分议员则沉默不语。\n\n盛田对这一切选择了无视，他看着以驹井为首的对条例持反对意见的议员们，面无表情地宣布了投票的开始。"
 DOP_GNG_zip.33.a1:0 "让我们拭目以待吧……"
 DOP_GNG_zip.34.t:0 "条例通过"
 DOP_GNG_zip.34.d:0 "当电子屏上显示赞成票的数字闪烁时，整个立法会都爆发出了怒吼，甚至一部分索尼的议员也对盛田投去震惊和愤怒的目光。\n\n“瞧瞧这叫什么事？！”一名日侨的怒吼几乎盖过了所有人的声音，“这畜牲要剥夺我们的权利，拿给那些下等人，开什么玩笑？！”这句话点燃了立法会，议员们都在互相质问和指责。随后，日立的议员们一起离场以表抗议，一部分日侨议员也跟着离开，临走前还宣称“要让提出和支持条例的人付出代价”。\n\n松下黑着脸向自己的支持者们表示会和东京商议此事，毕竟涉及基本法的变动，更重要的是冒犯了商人们的利益。可他自己心里清楚，说服盛田的概率几乎为零，他现在唯一能做的就是想办法应付选举，尽可能维护自己的利益。\n\n在一片混乱中，有人甚至冲到了盛田昭夫面前，但被一部分索尼议员拦住了。在现场安保和议员们的保护下，盛田离开了会场。"
 DOP_GNG_zip.34.a1:0 "数分钟后，广警奉命驱散了议员们。"
 DOP_GNG_zip.35.t:0 "三方会谈"
 DOP_GNG_zip.35.d:0 "茶水已经凉了，但没人打算喝一口。整个会客室的氛围很沉闷，只有在场的两名武官冷眼看着，可谓事不关己高高挂起。\n\n“我再次确认这些事不会干扰到广东的经济状况。这么多年来广东本土企业的力量已经大大上升了，他们同样可以保证广东经济的高速增长。”盛田昭夫疲惫地辩解道，他已经为这事在会议室待了大半天了。高岛推了推眼镜：“盛田，我也再次重申这和经济的关系……不大。你这次干得太过火了，我那边收到了一打抗议信，更有甚者直接联系了东京的一些大人物。你应该清楚，你要应付的不只是我和永野将军。”\n\n宋之光则接过话头：“但我认为行政长官此举不无道理。企业掌管立法会的弊端在安田危机就已经暴露出来，而在此之前的立法会不是朝令夕改就是效率低下。如果想让广东的一切更为高效，将这些唯利是图的家伙赶出立法会无疑是必行之事。”\n\n高岛本就不想趟浑水，他知道只要自己拿出几个案例和一些数据对比，一些有真知灼见的大人物就会清楚广东政改的必要性。他看向身旁的永野，后者出人意料地开了口：“那么，你们能否保证这次选举的……安全性？”\n\n会谈又陷入了死寂。许久，盛田昭夫才颤着声开口：“请您放心，我们绝对会进行严格的背景审查，绝不会让一小撮有心之人借此混入立法会。”\n\n永野用他那冰冷的目光盯了盛田几秒，便向高岛微微点了点头。“好吧，那么我会把情况上报给东京的。”高岛呼出一口气，随即开始收拾自己的公文包。宋之光则微笑着看向盛田：“我们的态度已经很明确了，南京完全支持行政长官的选择。”"
 DOP_GNG_zip.35.a1:0 "盛田擦去额头上的冷汗，庆幸自己的又一次胜利"
 DOP_GNG_zip.36.t:0 "广式民主"
 DOP_GNG_zip.36.d:0 "“请各位安静，我们现在开始投票！”\n\n台上那位面带笑容的政府官员说着将投票箱拿出来，让工人们一个个上来投票。选举采用的是选区制，他们要从几位候选人中选出他们这一块的代表。\n\n在投票前，一旁同样面带微笑的经理先讲了一小段话，或者说提了个建议：“我个人觉得投给这位山崎先生就很好，我认识这位先生，和我们有不少业务往来，人也很温和。即使不是索尼旗下的一员，但他的公司福利也不比我们差到哪去……”\n\n台下的李骏和李晞不约而同地看了看对方，他们早就商量好要投那位前华工委成员，但现在情况摆明了是要让他们去投那个和索尼有利益关系的家伙。\n\n“行政长官看来也有自己的小心思啊。”李骏喃喃自语，而一旁的李晞则困惑地问哥哥，他们到底该怎么办。是啊，谁敢保证这种拿钱交的“朋友”是会为他们发声，还是为索尼和他自己的利益发声。\n\n工会领袖和各部门的领导已经起身，往山崎的票箱中投票了。看来都已经打点好了，这些人在带头呢。不出意外的话，之前这些人约谈自己手下一些小组长，估计也是为了“调动积极性”。\n\n李骏知道那名工人已不可能当选，但还是和弟弟把票投给了他，毕竟最多就是被穿小鞋，但他相信索尼不会因为这个就把他开除了，哪怕索尼和盛田或许早已有了私心。"
 DOP_GNG_zip.36.a1:0 "只是长实的车队都能横冲直撞了，这又算的了什么"
 DOP_GNG_zip.37.t:0 "人民之声"
 DOP_GNG_zip.37.d:0 "“诸位，小孙要作为我们社区的代表去参加立法会选举，希望各位投他一票，为我们华人争取些话语权啊！”\n\n带眼镜的中年男子向围着他们的居民们宣布这个消息后，所有人都很疑惑，不知道这意味着什么。\n\n“啥是选举？”“立法会不都日本人吗？”人们七嘴八舌地问，有几个年轻人则认为选举肯定被那些企业控制着，民众代表不可能当选。\n\n中年男子示意大家安静：“我知道各位不明白这有什么意义，或者不信任这次选举。我跟大家说，这个事是日本人敲定的——就那个什么行政长官。新的基本法上可写着呢，不管你是日本人还是华人，都能去参选！这可是和日本人对着干的大好机会！”\n\n这么一说，大家也都明白了：和日本人对着干，那可不就是好事吗？如果中国人能在立法会和日本人分庭抗礼，那日本人还会遂意欺侮他们吗？所以答案很明确了：选举就是为自己争利益嘛！\n\n“所以这怎么选啊？”一名中年妇女打断了台上滔滔不绝的男人。\n\n见居民们的态度从疑惑转为好奇，男人和他身旁的小朱相视一笑。看来，这个社区也拿下了。"
 DOP_GNG_zip.37.a1:0 "人民在作出自己的选择"
 DOP_GNG_zip.38.t:0 "企业国家之终"
 DOP_GNG_zip.38.d:0 "在立法会解散的消息公布后，广东各界都大跌眼镜，但随即就开始计划参加广东的第一次立法会选举。对于珠人来说，这是一个宣告他们地位的好机会；华人则希望借此扩大自己的话语权；日侨们一开始认为这只是走个形式，直到不少政府的消息流出才意识到大事不妙。\n\n尽管新条例并不排斥商人参政，但想也知道，受够了巨企主宰的人们定然不会青睐商人，于是许多社区领袖和社会活动家在民调中表现亮眼。这些人大多是珠人出身，华人也有不少。日侨则通过大量的暗箱操作和协商来推举了一些候选人，他们本希望借助日本的力量干涉选举，但东京却拒绝了他们的求助。\n\n索尼及其盟友自然有更大的优势，这迫使其他利益集团不得不以腐败等手段来保证自己的政治影响力，各阶层也在宣传攻势中结盟或结仇，从而让广东的第一次选举变得无比混乱。许多人被曝出受贿和违规操作，以至于有些广警私下开玩笑称“二十多年来抓的人还比不上今年的零头”。\n\n好在选举结果还是得以公布，且几乎没人对此提出异议——如果把那些本身对选举不满的日侨除开的话。不出所料，立法会的议员中大多是索尼的合作伙伴或盛田的亲信，而随着其他议员出于共同利益等原因结成同盟，立法会的新格局也逐渐形成。"
 DOP_GNG_zip.38.a1:0 "那么，让新牌手们登台亮相吧"
 DOP_GNG_zip.39.t:0 "前路何在？"
 DOP_GNG_zip.39.d:0 "盛田给李嘉诚倒上一杯酒，随后给自己也倒满了一杯。两人脸上都带着愁容，一连喝了几轮后，盛田才缓缓开口：“所以这次……那件事真的要发生了？”\n\n“我不知道，昭夫。和十年前一样，到处都是开战的传言。有人说高宗武早有反心，只是被龙绳武打乱了计划；还有人说西南叛乱就是他自导自演……”\n\n李嘉诚又喝下半杯酒，他从未这么焦虑过，哪怕是十年前也没到这种程度。毕竟现在，广东比十年前更可贵了。\n\n“不过，我更愿意相信这是个谎言。毕竟我不觉得还有比高宗武更勇敢的人。”李嘉诚勉强挤出一个微笑，但盛田依然耷拉着脸。\n\n盯着眼前的半杯酒许久后，盛田才开口问道：“如果开战，你觉得广东该怎么办？”\n\n李嘉诚挠挠头：“我觉得尽量不要卷入冲突……也许我们能凭借和中日两国的关系，暂时置身事外？”\n\n“不可能。我们这里太重要了……”\n\n两人沉默不语，又喝了几轮酒。\n\n最后，一瓶酒被喝得空空如也，两人杯中的酒也所剩无几。盛田将那一口酒喝光，脸上已渐有些红晕。\n\n在李嘉诚告辞前，他用几乎只有他们能听到的声音说了一句话：“无论如何，我们都要作出选择……”"
 DOP_GNG_zip.39.a1:0 "“毕竟枪炮可不认人。”"
 DOP_GNG_zip.39.a1.tt:0 "广东将来必定要选边站，但无论如何，盛田昭夫和李嘉诚都会携手共进，保卫广东和她的人民的利益。"
 DOP_GNG_zip.40.t:0 "直面风暴"
 DOP_GNG_zip.40.d:0 "“你把我叫来就是为了这件事？”\n\n井深皱着眉问道。尽管他的话中有苛责的语气，但他心里已经开始思考这些流言的真实性。\n\n“井深，这完全有可能。”盛田看起来很坚定。“十年前我也听到过类似的消息，虽然最后是龙绳武在西南掀起暴乱。”\n\n“那你有没有想过这可能是另一场暴乱的前奏？”井深依然保持着他那副质疑的表情。\n\n“即便如此，我们也该想想怎么办了。你我都清楚中国军队现在的实力。倘若战争爆发，广东必然处于被动和不利的境地。”\n\n两人僵持了一分钟后，井深的眉头还是舒开了：“那么，谈谈你的想法。”\n\n“大前提是我们要确定我们的立场。”盛田指着桌上的地图。“我们的盟友不同，我们面临的危险也不同。倘若要确定一个计划，恐怕还得从长计议。”\n\n“我难得同意你的意见。”井深无可奈何地点点头。“既然这样，我会考虑这事的……”"
 DOP_GNG_zip.40.a1:0 "“毕竟，广东现在是我的心血。”"
 DOP_GNG_zip.40.a1.tt:0 "工程师与手艺人可能会形成各自的看法，但对他们来说，保全他们为广东共同绘制的蓝图将是第一要务。"
 DOP_GNG_zip.41.t:0 "迟来的审判？"
 DOP_GNG_zip.41.d:0 "“号外！号外！南京就广东华人权利问题发表声明！号外！号外……”\n\n关上窗户，拉上窗帘，盛田打开电视想换换心情，但电视里还是对南京政府发言人的报道。\n\n“我们希望广东地方政府可以坚持自己原先的目标，致力于争取广东本地人的平权与合法待遇……”\n\n“近日，广东再次发生针对华人群体的恶性事件，此举与当地政府先前的主张背道而驰，但政府却无动于衷……”\n\n“据消息称，广东北逃人口日益增多，当地游行示威也接连不断……”\n\n这些报道刺痛着盛田昭夫的心，让他感到罪恶与痛苦。他从未想过要背弃自己的初心，自己当初只是走投无路，被迫和松下搭上了线。如果再给他一个回到过去的机会，他绝不会那么武断，直接大手一挥就通过了《民族融合调理》，把自己逼入绝境。\n\n可惜，这世上没有后悔药。\n\n北方的阴云日益逼近，但盛田心里仅有了一丝庆幸，或许还有办法扭转自己的错误。但他真能如愿以偿吗？松下、山下和三田会让他独自一人作出决定吗？"
 DOP_GNG_zip.41.a1:0 "但即便如此，他也希望博一把"
 DOP_GNG_zip.41.a1.tt:0 "行政长官将与自己放出的魔鬼殊死搏斗，纵使孤身一人，他也要依靠外力打破囚禁广东的牢笼。"
 DOP_GNG_zip.42.t:0 "双日凌空"
 DOP_GNG_zip.42.d:0 "稻叶将电报摔在桌子上，在办公室里生着闷气。中国朝野上下对他接管广东没什么好脸色，南京更是在电文中表示“对其地位之承认仍有待商榷”，摆明了不支持他。\n\n说实话，这个烂摊子他也不想来接。铃木的经验已经告诉他，干预当地企业不是什么好事。但没办法，东京下了命令，要他重启并完成铃木的计划，和企业起冲突在所难免。\n\n就在他想着要不要和东京通通气时，秘书着急地跑了过来：“阁下！刚刚……刚刚中国领事馆的人都撤走了！”\n\n……\n\n宋之光从车内走出，看着面前带队拦截的永野，只是一笑：“永野将军，我们两国的关系还不至于到你拦我的地步吧？”\n\n“……领事馆毫无预兆地离开，高岛领事也很关心，希望各位给出个理由。”\n\n指挥刀的寒光并没有吓到中国士兵，他们和日军举着枪对峙，正如他们的同僚在山海关做的那样。\n\n“南京下的命令。”宋之光面不改色。“个中缘由您也明白，不过您要是希望立刻开战，那尽管毙了我。”\n\n……\n\n“宋领事他们已经离开了。”李嘉诚放下话筒。“我们要怎么办？”\n\n四位总裁——连着何鸿燊——都做着咬指甲或搓手之类的小动作，但对他们来说，自己心中的答案已然明了。"
 DOP_GNG_zip.42.a1:0 "各怀鬼胎"
 DOP_GNG_zip.42.a1.tt:0 "稻叶的统治并不稳固，企业的联合也并非铁板一块，中国和日本的博弈，或许就将在广东的内部展开……"
 DOP_GNG_zip.43.t:0 "战云迫近"
 DOP_GNG_zip.43.d:0 "“中国军队正向北方集结……目前山海关一带已经全面军事化，预计情况将比1937年还要紧急……”\n\n田村秀昭将这些话读出来时，在座四人头上满是冷汗。中日之间的战争看来还是不可避免，而广东的混乱无疑对中国有利。\n\n“边境报告说每天都有几千，甚至上万人偷渡到中国……”。田村叹了口气。“我们什么时候才能杜绝这类现象啊……”\n\n正在这时，田村的副官敲门后走入了会议室：“报告各位长官，刚刚收到了……南京的最后通牒。他们要求我们立刻将广东移交军队，否则……否则中国军队将动用武力接管广东！”\n\n话还没说完，惊讶而又不安的情绪就笼罩了会议室内的众人。永野还算镇定，马上提出联系东京，但田村担心这会加剧局势。大森则提出调动自卫队应对当下的紧急情况，却又遭到赤城的反对……\n\n……\n\n“还不走？”\n\n汪敬煦提着公文包，眼里布满血丝，但面前的宋之光看上去要轻快地多。\n\n“不，我有个计划，想试试。”说着，宋之光穿上外套，叫上两名卫兵跟自己上了车。\n\n“你打算去干什么？”汽车发动时，汪敬煦站在车窗边问道。“你不回去，我也要被质问。”\n\n“……我觉得可以策反几个人，比如盛田昭夫。”宋之光脸上依旧挂着笑容。“你觉得呢？”\n\n“……你有几成把握？”\n\n“你应该知道我之前干什么的？对吧？”\n\n“好，我回南京会汇报你的打算，但你最好别干什么……出格的事情。”\n\n汪敬煦迅速上了另一辆车，随后两辆车向着相反的方向开去。"
 DOP_GNG_zip.43.a1:0 "十分钟后，领事馆就人去楼空了"
 DOP_GNG_zip.43.a1.tt:0 "中国不会容忍广东军政府的存在，广东的企业对军队也颇有怨言，这片土地未来的主人到底是谁，还是一个悬而未决的问题。"
