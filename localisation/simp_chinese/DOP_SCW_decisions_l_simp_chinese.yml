 DOP_SCW_materials_buy_crude_silicon:0 "采购工业级粗硅原料"
 DOP_SCW_materials_buy_crude_silicon_desc:0 "电子级硅的起点并不体面：煤、电与成吨的工业粗硅。与其等待现货市场抬价，不如由贸易局提前锁定东南亚和共荣圈矿冶企业的余量，先让提纯炉吃饱。"
