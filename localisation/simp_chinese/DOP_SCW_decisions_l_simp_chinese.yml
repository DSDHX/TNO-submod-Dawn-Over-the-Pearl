 DOP_SCW_materials_quartz_monopoly:0 "垄断高纯度石英矿源"
 DOP_SCW_materials_quartz_monopoly_desc:0 "坩埚里的一点杂质足以毁掉整根晶棒。商社将以长期包销、设备换矿和政治担保锁住最可靠的高纯石英来源；监制或许不喜欢这种排他手段，但他们会喜欢稳定交付。"
