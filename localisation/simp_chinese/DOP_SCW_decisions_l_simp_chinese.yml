 DOP_SCW_materials_four_inch_substrates:0 "构建四英寸硅单晶衬底标准化产线"
 DOP_SCW_materials_four_inch_substrates_desc:0 "三英寸晶圆仍能生产，但四英寸衬底可以在每次曝光中容纳更多芯片。切片、倒角、研磨与抛光设备将按统一规格重排，使广东在七十年代末真正拥有一条大直径晶圆材料线。"
