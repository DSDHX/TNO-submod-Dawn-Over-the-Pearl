 DOP_SCW_race_court_dissidents:0 "与各国科技界异见者暗通款曲"
 DOP_SCW_race_court_dissidents_desc:0 "每个技术体系都会把一批不合时宜的天才挤到边缘：预算被砍的研究员、晋升无望的工程师，以及看厌了保密协议的项目主管。广东不必认同他们的政治，只需要买下他们尚未被重视的知识。"
