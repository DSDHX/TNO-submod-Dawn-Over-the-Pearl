 DOP_SCW_materials_power_subsidy:0 "国家电网特供高耗能电费补贴"
 DOP_SCW_materials_power_subsidy_desc:0 "多晶硅提纯消耗的电力足以让财政官员心悸，也足以让工厂在普通电价下停摆。政府将以战略工业负荷的名义安排专线和阶梯补贴，把亏损留在电网账本，把产量留在企业报表。"
