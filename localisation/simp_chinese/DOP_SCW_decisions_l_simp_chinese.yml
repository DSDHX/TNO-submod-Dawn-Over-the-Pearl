 DOP_SCW_race_public_diplomacy_desc:0 "当广东芯片出现在收音机、计算器与医院设备里，产地本身便应成为一种信誉。广告公司、商会和驻外机构将共同讲述一个无害而进步的广东，使监管者更难把封锁包装成道德义务。"
