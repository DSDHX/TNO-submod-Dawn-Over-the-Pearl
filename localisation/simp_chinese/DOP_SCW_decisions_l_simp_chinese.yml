 DOP_SCW_materials_polysilicon_plant:0 "扩建电子级多晶硅提纯厂"
 DOP_SCW_materials_polysilicon_plant_desc:0 "实验室里的高纯样品无法喂饱工业体系。新的氯硅烷提纯与沉积车间将把电子级多晶硅变成连续产物，并以专门培训的工人维持那些容不得半点污染的管线。"
