 DOP_SCW_materials_czochralski_growth:0 "引进直拉法单晶硅棒技术"
 DOP_SCW_materials_czochralski_growth_desc:0 "多晶硅只是原料，稳定的单晶才是工业能力。我们将购入直拉炉、籽晶控制和氧含量测定工艺，再让本地工程师把进口参数改造成广东能够重复执行的生产纪律。"
