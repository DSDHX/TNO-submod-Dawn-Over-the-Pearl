 DOP_SCW_race_commercial_attaches:0 "派遣科技武官开展商业技术情报收集"
 DOP_SCW_race_commercial_attaches_desc:0 "驻外武官的公文包向来比军服更有用。只要经费按时汇入，散落在实验室酒会、采购目录与离职工程师口中的碎片，终会在香港拼成一张足以指导生产的蓝图。"
