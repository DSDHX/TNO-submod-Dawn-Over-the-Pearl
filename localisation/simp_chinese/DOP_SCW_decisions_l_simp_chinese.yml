 DOP_SCW_materials_export_low_grade_products:0 "对东南亚出口低端硅基产物"
 DOP_SCW_materials_export_low_grade_products_desc:0 "并非每一炉产品都配得上进入集成电路。把不够纯的批次加工成合金、耐火材料和普通电子耗材，再装船销往价格敏感的市场，至少能让废品变成现金。"
