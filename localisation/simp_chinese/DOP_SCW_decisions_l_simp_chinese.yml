 DOP_SCW_packaging_bonding_consumables:0 "采购高速引线键合消耗材料"
 DOP_SCW_packaging_bonding_consumables_desc:0 "封装良率常常败在最不起眼的地方：一段不均匀的金丝、一块受潮的塑封料，或一枚磨损过度的劈刀。统一采购和批次检验能够让高速键合机少制造一些昂贵废品。"
