 DOP_SCW_race_embargo_waivers:0 "积极参与技术禁运豁免谈判"
 DOP_SCW_race_embargo_waivers_desc:0 "走私能解决一台机器，却解决不了一整条产业链。广东必须以可靠供应商、低风险转口地和政治缓冲区的身份坐上谈判桌，把临时通融写成可重复使用的豁免条款。"
