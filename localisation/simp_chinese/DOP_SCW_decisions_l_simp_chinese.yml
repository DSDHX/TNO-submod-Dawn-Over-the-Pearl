 DOP_SCW_materials_smelter_overtime:0 "推行硅冶炼厂加班班次"
 DOP_SCW_materials_smelter_overtime_desc:0 "电弧炉停下一小时，后面的晶圆厂就会少一批原料。管理层可以把检修、换班与休息压缩到报表允许的最低限度；至于炉前工人的抱怨，宣传部门自会称之为产业升级必须支付的代价。"
