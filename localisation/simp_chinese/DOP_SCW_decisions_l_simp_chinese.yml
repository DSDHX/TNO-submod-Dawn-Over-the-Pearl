 DOP_SCW_race_tariff_lobby:0 "游说欧美监管机构减免出口关税"
 DOP_SCW_race_tariff_lobby_desc:0 "华盛顿、日耳曼尼亚与米兰的关税表格各有一套晦涩语法，而广东商会恰好熟悉每一种。几场闭门午宴和一叠措辞谨慎的备忘录，便可能让一行税号变得对我们格外宽容。"
