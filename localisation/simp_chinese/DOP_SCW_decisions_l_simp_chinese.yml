 DOP_SCW_race_shell_companies:0 "设立海外皮包公司与技术转运前哨"
 DOP_SCW_race_shell_companies_desc:0 "禁运制度依赖纸面上的终点，而纸面终点可以是一间只有信箱、电话和名义董事的公司。我们将沿几条彼此隔离的贸易路线布置前哨，让敏感设备在抵达珠江前先拥有一段体面的身世。"
