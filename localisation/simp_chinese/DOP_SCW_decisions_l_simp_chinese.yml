 DOP_SCW_race_friendly_expositions:0 "赞助友好国家举办半导体展会"
 DOP_SCW_race_friendly_expositions_desc:0 "一座灯火通明的展馆可以把枯燥的晶圆参数包装成现代生活的许诺。让广东企业站在最显眼的位置，也让合作国的记者相信，他们亲眼见证的是未来，而不是一场精心核算过的推销。"
