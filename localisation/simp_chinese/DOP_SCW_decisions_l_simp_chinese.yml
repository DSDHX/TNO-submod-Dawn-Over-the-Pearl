 DOP_SCW_race_smuggle_blueprints_desc:0 "机器可以被海关扣押，尺寸公差和工艺窗口却能藏在缩微胶片、维修手册与工程师的记忆里。专业人员将把这些图纸拆散、转译，再经数条互不相识的线路送回广东。"
