 beating_drums_tree:0 "盛田与西南战争"
 beating_drums:0 "战鼓渐响"
 beating_drums_desc:0 "是时候了。无论如何，我们终究要面对与我们站在对立面的中华民国。这头昔日的巨龙又一次发出怒吼，妄图征服昔日他掌握的土地与人民。\n\n为了我们的泛亚主义立场和精神，广东将会与我们的日本伙伴携手对华南发动致命的袭击。但在他们到来之前，我们最好先拖延住“恭候多时”的国民革命军。一旦他们进入城市地区，我们的麻烦就大了。"
 waiting_allies:0 "固守待援"
 waiting_allies_desc:0 ""
 in_the_chaotic_world:0 "乱世需用重典"
 in_the_chaotic_world_desc:0 ""
 tokyo_express:0 "东京速递"
 tokyo_express_desc:0 "预算问题事态紧急，我们不得不和东京进行联络。虽然我们并不信任日本——在安田危机和石油危机到来时，日本为了自身利益抛弃了我们。幸好我们靠自己挺过了这两次危机。现在我们为了与日本的同盟，已经牺牲了很多东西，无论是我们的人还是我们的钱。倘若这都不能换来东京的援助，那他们还想要什么呢？ 哪怕日本不会给予我们援助，我们也会想办法动用人脉，搞到我们需要的东西。"
