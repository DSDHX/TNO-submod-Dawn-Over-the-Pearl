# DOP 事件（从文案文档批量导入）
 DOP_GNG_event.1.t: "毋庸置疑的新星"
 DOP_GNG_event.1.desc: "今年的泛亚经济峰会如期召开，与共荣圈峰会不同，来参会的都是和日本有着紧密经济联系的国家，这意味着广东可以依靠这次会议开辟更多的海外市场。为此，盛田昭夫与何鸿燊出席了这场会议，准备和那些还没和广东有经济联系的国家进行贸易商谈。\n\n盛田昭夫还记得1962年铃木还是行政长官的时候，对广东的邀请函被满洲故意晚了很久才发过来，铃木去满洲也受了一肚子气。当然不久后他就下台了，然后就是满广经济竞赛……现在风水轮流转，广东成为了泛亚经济峰会的主办国，并且将由他和日方代表高岛领事共同主持会议。这次，盛田要堂堂正正地用“正当手段”击败满洲国，开展自己的新计划。\n\n在开幕式上，高岛首先代表日本进行发言。看来东京的官僚还是没什么新意，演讲稿里也都是喊了三十多年的老口号，最多提了点“第三次中日战争”的“教训”，就又开始自吹自擂。\n\n之后的内容才是重点——演讲稿中关于广东的部分被高岛特地挑了出来，绘声绘色地将广东描写成一块繁荣安定的土地。尽管这多少有点自卖自夸的嫌疑，但广东这些年来的成绩确实卓越。“……广东的生产总值较1962年已增长将近四倍，在光荣圈名列前茅。仅凭一省之地便可创造几乎领先世界绝大多数国家的经济，可以看出盛田行政长官的才能十分出众……相信在未来，广东国与大日本帝国将携手共进，继续向世人展示泛亚主义的优越性！”\n\n在代表们的掌声中，盛田上台接过高岛手中的话筒：“多谢高岛领事和大日本帝国的赞赏。在安田危机后，许多人都认为广东将会一蹶不振，但我们很快就恢复过来；在七十年代初的灾难般的日子里，也有人认为广东走到了尽头，但时至今日，珠江奇迹仍在继续。我们已经向世界证明了，广东国在其先进体制与泛亚主义领导下，取得的成绩是前无古人后无来者的。未来我们将会着手完善金融体系，让珠三角能取代上海的金融地位，为广东和在座国家的利益作出更大的贡献！”"
 DOP_GNG_event.1.a: "台下众人掌声雷动，满洲代表面色土灰"
 DOP_GNG_event.2.t: "戒严令"
 DOP_GNG_event.2.desc: "广东国临时政府告全体国民：\n\n当前，有一群极端分子妄图推翻广东政府，谋求广东脱离共荣圈，与美国及流亡在外的国民党英美派勾结，从而达到其寻求所谓“民族独立”、“民族解放”之目的。这类人明面上为华人着想，为华人发声，实际上受英美蛊惑，对东亚共荣持抵触态度，实际上已经沦为英美帝国主义和蒋介石国民党英美傀儡集团的走狗。\n\n鉴于盛田昭夫领导之文官政府无法平定暴乱，故防卫司与警务处决定，暂时接替文官政府，由田村秀昭中将代行行政长官之职，并于今日颁布戒严令。\n\n自今日始，广东实行宵禁，每晚八点后所有国民待在家中不许外出，若有外出者无论族裔、职业，一律逮捕。特殊情况经防卫司和警务处批准后凭证可外出。此外，广东对暴乱分子采取零容忍态度，望暴乱分子早日回头，不要一错再错，若对广东国民生命和财产安全造成威胁的，军警有权将其击毙。\n\n最后，希望国民为政府提供线索，协助我们尽快平叛，恢复广东秩序。"
 DOP_GNG_event.2.a: "牺牲一时自由，换来一世安宁"
 DOP_GNG_event.3.t: "金浪"
 DOP_GNG_event.3.desc: "尽管发展战略的时间是十年，但现在我们已经享受到了它的好处，并且很多目标也已经达到。\n\n随着自由贸易港的开放，无论是OFN还是团结协定都纷纷表达了与我们进行贸易的意愿，一些与他们亲近的中立国开始与我们通商，并且有意无意的透露了德美想与我们建立外交关系的消息，这也意味着外务司将面临一个巨大挑战，毕竟三大国之间的关系错综复杂，日本也不希望我们成为共荣圈的阿喀琉斯之踵。\n\n不过在此之前，我们可以小小地庆祝一下，毕竟自贸港给我们带来了比以前更多的财富，而日本那边也无须担心，只要我们拿出实打实的钞票，并告诉他们日本能从自由贸易中分到一杯羹，他们也一定会拥抱自贸港的。"
 DOP_GNG_event.3.a: "金钱自海上来！"
 DOP_GNG_event.4.t: "井深补完"
 DOP_GNG_event.4.desc: "划清界限\n\n秘书穿过一片狼藉的办公室，周围传来的嘈杂声让他皱了皱眉，但就目前的局势来看，这点反应都算小的了。\n\n推开办公室的木门，李嘉诚正坐在办公桌后面，本就稀疏的头发如今已尽数发白，皱纹爬满了这位年过半百的富商的脸，他现在的处境不算太坏，但他大概没想过会有这样的一天。\n\n“李总，您安排的我们都做好了。只是交易记录这东西……”秘书瞥了一眼外面混乱的人群，随即将门关上。“井深大要求证券交易所和其他相关金融机构提供数据进行比对，那些人我们都打点好了，但是还需要您过目一下。”\n\n李嘉诚闭上双眼，倒在办公椅上。自己这些年和各路人马斗法时候没少在金融界动手脚。所以井深大只要想，长实被起诉是早晚的事。\n\n秘书把记录表放在了办公桌上：“按您的要求进行了时间排序。”李嘉诚点点头，随即找到了几个时间点的记录，并都在最后打上了一个叉。“可以了，你按照这个再印一份交上去。”\n\n秘书走后，李嘉诚独自一人坐在办公室里，听着外面员工们打电话给其他公司的声音。长实的金融网络这时候就像一颗炸弹，随时都可能让李嘉诚和长实被炸个稀碎。该死的井深大，他这么做是为了什么？仅仅只是因为要和他作对吗？还有盛田昭夫那个背信弃义的家伙，怎么会同意这样的建议……\n\n李嘉诚吞了口唾沫，他不明白盛田为什么会和他站在对立面，两个人在风雨飘摇中打拼了三十年，这段情谊对这家伙来说就一文不值吗？如果他是这种忘恩负义的小人……"
 DOP_GNG_event.4.a: "那自己也不该给他留什么情面"
 DOP_GNG_event.5.t: "硅晶巨兽"
 DOP_GNG_event.5.desc: "盛田昭夫和井深大踏入房间内，绿色的光点在尽头闪烁着，随着一旁的科学家打开灯，一排大型机器展现在二人面前。\n\n“两位阁下，这就是我们计划的最终成果。”负责人骄傲地介绍道。盛田看着眼前被称作“超级计算机”的一个个庞然大物：“那么，说说它能干什么吧。”\n\n但开口的是井深大：“我记得我之前跟你说过，它可以干很多事。比如说之前自然灾害的问题，有了这个，我们就能推算自然灾害发生的可能性；对地质的进一步分析也可以让我们更高效地进行开发。总而言之，它巨大的算能和储存量能让我们事半功倍。”\n\n在一瞬间，井深的嘴角微微上扬，他久违地露出了笑容。这个一直走在科技前沿的家伙，9如今干成了可能是他这辈子最大的成就——一台远超世界其他国家的超级计算机，而且是广东自主研发的，最重要的是这是他提出的项目，很多理论基础和实验数据也有他的贡献。\n\n“好吧，但愿这东西真能起作用……”盛田摸了摸下巴，他还不太确定这所谓的“超级计算机”是否真的像井深所说那样全能。但如果是真的，那很多项目的成本能省下不少来。\n\n在听了负责人更细致一些的介绍后，电子科技相对不那么精通的盛田昭夫先行离开，井深则饶有兴致地和负责人交谈起来。"
 DOP_GNG_event.5.a: "也许广东真的在迈向未来……"
 DOP_GNG_event.6.t: "精密的机器"
 DOP_GNG_event.6.desc: "又是一个办公日，黄浩辉熟练地打开他的电脑，开始审批各种项目。按照以往的工作流程，一般审核后就要分类，然后交给不同部门的负责人，之后又要把它们再一份份寄回去。\n\n但现在不一样了，所有工作都可以通过一台计算机完成。自从政府推广这些又大又方的家伙以来，他省了不少麻烦事。\n\n将文件压缩后发给其他部门的负责人，他的工作基本算结束了。虽然还没到下班时间，但接下来要做的无非就是接待自己跑来来办手续的人。好在，这类人并不多。\n\n到了下班时间，黄浩辉把电脑关上，随后离开了办公室。如果每天的工作都那么简单的话，那看上去井深那家伙也没那么不近人情，自己也很乐意接受这样的“新常态”。"
 DOP_GNG_event.6.a: "今日处理项目：478个"
 DOP_GNG_event.7.t: "产量跃升"
 DOP_GNG_event.7.desc: "“记者女士，这就是我们的新生产线了。”\n\n安川良子向经理指的方向看去，生产线上的人寥寥无几，更多的是机械臂进行分装和打包，以及一些运输工作。\n\n“由于本公司对产品品质的严格管控，除了组装由人工进行外，其他流程基本实现了自动化，人力成本相较于以前大大减少。”经理脸上露出了自豪的笑容。\n\n良子微微皱起眉头：“你的意思是，你们现在只需要操纵机械臂的人和进行组装的人，其他人力已经不需要了？”见经理点头，良子在笔记本上写下几个关键词，然后点头示意他说下去。\n\n经理随即领着良子往里走：“自从实行了自动化生产方式以来，我们的产量较以前提高了百分之五十二左右，成本比以前降低了百分之五十五，不仅满足了市场需求，也让我们的收益大大增加。”\n\n采访很快结束，林巧川今天出任务，良子只能打了辆出租车回家。这次关于实体产业发展情况的调查足够出一期专栏了——前些天加强对金融业监管的决定才下达没多久，政府又开始鼓励实体经济发展，鼓励各个产业降本增效和创新产品。结合这次调查的结果，良子很快就在笔记本上写下了自己的结论："
 DOP_GNG_event.7.a: "实体产业已成为广东经济的基石"
 DOP_GNG_event.8.t: "小恩小惠"
 DOP_GNG_event.8.desc: "有时候驹井确实有种世事无常的感觉。他来广东时和井深、松下站在一起，然后是松下跳车跟了盛田，后面井深也和他划清界限，再之后他又和松下勾肩搭背。\n\n结果兜兜转转二十年，他们又坐在了一张桌子上，尽管松下的位子换成了山下，而且这次盛田昭夫也在。结合之前井深和盛田的和解，驹井觉得自己可能已经疯了。\n\n“那么，两位今天找我和驹井先生，有什么事吗？”山下不太想耽搁时间，他还要回去处理松下的事务；相比之下驹井倒有些悠闲，毕竟他没什么要忙的。\n\n井深瞟了盛田一眼，见盛田还是那副心不在焉的样子，他“啧”了一声：“我们手头上有些项目，想和你们商量一下。”\n\n不出所料，面前两人的脸上都浮现出了嘲讽的笑容。“那么，两位有何打算？”驹井勉强维持着自己的矜持，看着头上青筋已若隐若现的井深，开口问道。\n\n“开你们的厂子，或者让你们旗下的公司去办点产业……总而言之，别让李嘉诚再拿去搞什么房地产之类的了。”\n\n井深丝毫不在意一旁盛田的态度，而山下看出盛田自己不愿意这么干，心里对这位行政长官的自主权打了个问号。\n\n“驱虎吞狼么……行，我同意这笔交易。”驹井略加思索便伸出手，和井深的手握在一起。山下则表示他要先和董事会商议一下，随后便和驹井一起离开了。"
 DOP_GNG_event.8.a: "临走时，他又看了一眼低头不语的盛田"
 DOP_GNG_event.9.t: "更进一步"
 DOP_GNG_event.9.desc: "井深大打量着面前的年轻人，眼里满是欣赏。这位才高八斗的工程师在前几天突破了几个关键难题，让索尼和富士通合作开发的新收音机体积更小、更易携带。这在未来将是一大卖点。\n\n一旁的盛田昭夫拿着年轻人的简历：“李晞……你之前还接受过奖学金资助？”\n\n“是的，先生。没有您的资助，我那会儿恐怕无法继续学业。我哥哥那时候已经很吃力了。”李晞对盛田鞠了一躬，满怀感激地说道。\n\n“你哥哥在哪工作？”井深突然来了兴趣，也许他哥哥也是个被埋没的天才？\n\n“不瞒您说，他也在索尼上班。虽然从事生产工作，但我从他那学到了很多和电子产品有关的知识。”\n\n盛田听罢，得意地冲井深笑了笑：“你瞧，我的公司也是卧虎藏龙的。”\n\n井深不满地撇撇嘴，但李晞有一句话堵在了喉咙口，他正犹豫要不要把这句话讲出去——他的哥哥，李骏，是被李嘉诚挖去长实，才勉强有能力供他上学的。\n\n……\n\n李骏看着面前的一台台机器，自从引入了它们，很多事就不需要李骏管了。机器们轰隆隆地运转，只要保证它们不出故障，那它们就这么从早到晚地响着，产量则比人工高出两三倍。\n\n但是，那些被机器淘汰下来的工人，离开了他们的岗位后又去了哪？\n\n李骏不知道。他只知道，广东的工厂正一个个地启用机器生产，如果不是有点知识，他恐怕也得被开除。\n\n索尼这两年的风气和富士通有些相似，也开始看重绩效了。他有些怀念以前在长实的日子，虽然待遇没那么好，但所有的利益都有长实的保障。\n\n但人终究是要向前看的。为了维系现在的生活，他也只能这么过下去。"
 DOP_GNG_event.9.a: "……再不回望过去"
 DOP_GNG_event.10.t: "东方硅谷"
 DOP_GNG_event.10.desc: "谁能想到一座小渔村，会成为广东的“明日之都”？拔地而起的索尼-富士通研发中心成为了这座城市的中枢，交通线是它的血脉，各种产业园和其他企业的研发中心是它的关节，而科研人员们是它的细胞……\n\n这座城市，是珠三角的掌上明珠，是广东最引以为傲的第四大城，是世界瞩目的“芯片之城”，更是井深大的得意之作。\n\n现在，这座城市的设计师正满意地看着深圳取得的最新成就——一微米的芯片。这代表着广东已经击败了德美等国的电子巨头，将他们远远甩在身后。\n\n那么，下一步是什么呢？突破到纳米级？还是突破超大规模集成电路？\n\n井深将芯片郑重地放在桌上，不管接下来情况如何，他都会全力支持深圳的那群栋梁们。没有他们，广东就没有明天。"
 DOP_GNG_event.10.a: "或许还可以让他们去搞搞航天？"
 DOP_GNG_event.11.t: "传播智慧"
 DOP_GNG_event.11.desc: "“在现任政府的努力下，广东人口识字率已达到87％，受大学及以上程度教育人口已达63％，这充分证明我们的政策正让广东人口向高素质发展。”\n\n政府报告中的这一句话很快引起了立法会的讨论，大部分人都惊讶于教育的蓬勃发展，而井深大就像个得了第一名的选手一样，站在讲台上高傲地昂着头。一旁的盛田昭夫虽然脸上微笑着，却一直避开李嘉诚的目光。\n\n“未来，政府将继续致力于教育事业，保证广东民众识字率达到百分百，所有青少年都能接受职业教育或高等教育。”\n\n井深将最后一句话念出，绝大部分议员都起身鼓掌，而台上的工程师得意地将报告折成一小块放进兜里，用夸张的动作宣告着属于他的胜利。尽管对他来说，有些人根本不值得他们浪费资源，但倘若这些人中有那么一两个被埋没的天才，那他也乐意白费点功夫。"
 DOP_GNG_event.11.a: "未来，广东将成为智慧的代名词。"
 DOP_GNG_event.12.t: "尝试性交流"
 DOP_GNG_event.12.desc: "“很抱歉，井深先生，我们使用的网络协议暂时不能接入互联网。但这套协议已经在共荣圈内推行，我们可以试着和在京都的另一台计算机联系。”\n\n该死的，那些老头子们什么时候才能意识到所谓的“冷战”也没那么重要？他还指望着能试试给欧洲或者美国发消息呢。没办法，井深只好坐到电脑前，随手打下了几个字后等待回应。\n\n时间一点点流逝，理论上来说，对面不应该这么慢回消息。是传输出了问题吗？\n\n“先生，我觉得可能是对面没收到消息……”\n\n“要不然再等等？”\n\n“也许对面的计算机出了什么问题……”\n\n井深此时也有些不耐烦了，正要直接起身走人时，对面终于回了消息：\n\n“不好意思，先生。我不知道你在说什么，您能解释一下吗？”\n\n背后的工程师们欢呼起来，这意味着他们成功了。\n\n井深此时也露出了满意的微笑，在鼓励了工程师几句后，他走出房间，盛田立刻迎了上来：“如何？”\n\n“一切顺利，但我想传输速度可能还有些问题。”"
 DOP_GNG_event.12.a: "“还有，我可能得表达清晰些”"
 DOP_GNG_event.13.t: "广东问题，美式方案"
 DOP_GNG_event.13.desc: "结束在澳门的演讲后，稻叶回到酒店，和秘书核对接下来的行程。“我记得接下来我们要去香港，对吧？”稻叶揉了揉疲惫的眼睛。\n\n“是的，行政长官。明天去香港，后天再回广州讲一场，这次巡回就算结束了。”听到这话，稻叶感觉自己肩头好像还压着千斤重的担子。真正让他头疼的是明天的演讲在香港，那地方经过盛田多年苦心经营，早已成为珠人的大本营，无论盛田会不会给他下绊子，这地方对他来说都是块硬骨头。\n\n第二天的演讲果然出了岔子。不是有珠人故意弄出声响打断他，就是有人跟他唱反调。到最后稻叶有些忍无可忍了，他直接跳过了减税、保证珠人地位之类的空头支票，匆匆结尾后离开。这些人肯定是盛田昭夫派来捣乱的，要么是何鸿燊手下的小混混。等东京确定要给盛田定罪了，他一定要把盛田所有“叛国罪证”全挖出来！\n\n晚上，稻叶本想看电视平复一下心情，结果刚一打开新闻频道，就发现今天的新闻居然是盛田昭夫在胜利港举行的集会。“……行政长官将所有参与过广工联或者相关组织的珠人排挤出政府，以日侨取而代之，就是要把珠人的地位拉回到铃木时期！我们决不允许这种践踏人权的行为发生，广东的公民理应受到平等待遇……”\n\n妈的，现在这里是美国吗？盛田昭夫敢这么公开骂他？但这还没完，接下来几天他都看到五巨头在报纸和电视上活跃。盛田和李嘉诚去华人社区他倒是司空见惯了，但是就连驹井也和珠人握上了手！这帮家伙他妈要闹哪样？\n\n稻叶长叹一声，靠在办公椅上。他心里暗自发誓，如果他成功改组立法会，他一定要把这些商人整个半死。"
 DOP_GNG_event.13.a: "此时的胜利港，盛田仍在进行他的演讲"
 DOP_GNG_event.14.t: "谋事在人"
 DOP_GNG_event.14.desc: "一群灰色西装男戴着眼镜、挂着扑克脸走进会议室，分别坐在会议室两侧。井深看着这群人，笑容中满是骄傲。他们都是在各个领域的专业人才，有人甚至在富士通内任职。之所以把这些人拉出来，是为实现井深的愿景而让他们贡献力量。\n\n见会议室已经坐满，井深兴致勃勃地宣布会议开始。“各位，非常感谢你们的到来。你们的任务很简单，就是利用你们的专业知识，分析目前广东面临的问题的最优解——唯一的要求就是要遵守这些什么鬼条例……”井深脸色一沉，看着精英们翻阅桌上放着的总结出的广东法律。“简单来说，就是我们要给那些工人好脸色，还不能冒犯华人和珠人的利益，并且要注意环境保护什么的。”嘴上说得平淡，井深早在心里把盛田全家问候了一遍。不过，精英们看起来踌躇满志。\n\n办公室陷入了长久的沉默。井深看着翻阅法律的精英们，见有几人面露难色，井深的心里也有些忐忑。好在，最后还是一位城市规划方面的专家率先打破了沉默：“井深先生，考虑到这些法律不利于实现我们之前与您商议的计划，我们目前有以下两个选择：一是尊重这些法律，并尽最大可能避免违法，但这样的话结果肯定达不到预期；二是直接逼迫行政长官为我们修改法律，这无疑是让我们得到官方背书，但我觉得行政长官不太可能接受我们的要求，他能在十年前扛着巨大压力推行改革，定然不会为了我们再改回去。”\n\n“嗯……”井深摸着下巴。“无论如何，这计划都是要推行的。我会去和盛田谈谈一些他个人觉得‘荒谬至极’的点子，剩下的咱们还是尽量跟着盛田的步子走吧。今天的会议就到这里，大家可以去和相关的政府部门对接了，散会！”井深一声令下，西装男们有条不紊地走出办公室，而井深还坐在办公椅上。“要想干好工作，还得专业人士来……”说着，井深又露出了微笑——这次的笑容中带着些许狡黠。"
 DOP_GNG_event.14.a: "“无论如何，我都要让这广东改天换地”"
 DOP_GNG_event.15.t: "悔过？"
 DOP_GNG_event.15.desc: "李梁和李薇两口子这段时间总在社区里头帮忙操办丧事，最近警察总是会拉来一些尸体，大部分是跟着那些什么“领袖”“司令”跑去乡下和政府对着干的年轻人，被送到家门口时已经面目全非了。\n\n哭声时不时就从某栋楼门口传来，警察们也摇头叹息，安慰了几句便忙着通知下一家，幸好自己的三个孩子已经长大了，不至于跟这些人玩命。哪怕李骏参加广工联的活动，政府也已经把他们划入了白名单，就算李骏真的去和一些人搞和平示威，警察也只会看着，不会把他们怎么样。\n\n又一辆黑色卡车开到了小区里，车上下来两个警察，把一具白布裹着的尸体从后备箱里面抬出来，其中一人去通知家属。但接着又来了几辆警车，车上的警察下来后便走到卡车那，将尸体抬出来，一部分人则去通知家属。\n\n“这十几个都是……”“嗯……”两位老人不由得吃了一惊，警察一般来一次只会送一两具尸体，今天居然有十几具！\n\n只有一个看上去官大一点的警察走到了门口的保安亭，随后又出来帮家属认领尸体，之后警察们去下一个小区，他和几个警察留了下来。\n\n围观的人越来越多，死人对他们来说已经不再是稀奇事，政府的“平叛”命令颁布以来，这几乎是习以为常的事。但出人意料的是，那个领头的警察居然给家属道歉了。\n\n当他鞠躬的时候，很多人都在议论这个警察到底在干什么，但他在道歉后，又说了几句安慰的话，便转身离开了。"
 DOP_GNG_event.15.a: "那么，他又是怎么想的呢？"
 DOP_GNG_event.16.t: "前路何在？"
 DOP_GNG_event.16.desc: "盛田给李嘉诚倒上一杯酒，随后给自己也倒满了一杯。两人脸上都带着愁容，一连喝了几轮后，盛田才缓缓开口：“所以这次……那件事真的要发生了？”\n\n“我不知道，昭夫。和十年前一样，到处都是开战的传言。有人说高宗武早有反心，只是被龙绳武打乱了计划；还有人说西南叛乱就是他自导自演……”\n\n李嘉诚又喝下半杯酒，他从未这么焦虑过，哪怕是十年前也没到这种程度。毕竟现在，广东比十年前更可贵了。\n\n“不过，我更愿意相信这是个谎言。毕竟我不觉得还有比高宗武更勇敢的人。”李嘉诚勉强挤出一个微笑，但盛田依然耷拉着脸。\n\n盯着眼前的半杯酒许久后，盛田才开口问道：“如果开战，你觉得广东该怎么办？”\n\n李嘉诚挠挠头：“我觉得尽量不要卷入冲突……也许我们能凭借和中日两国的关系，暂时置身事外？”\n\n“不可能。我们这里太重要了……”\n\n两人沉默不语，又喝了几轮酒。\n\n最后，一瓶酒被喝得空空如也，两人杯中的酒也所剩无几。盛田将那一口酒喝光，脸上已渐有些红晕。\n\n在李嘉诚告辞前，他用几乎只有他们能听到的声音说了一句话：“无论如何，我们都要作出选择……”"
 DOP_GNG_event.16.a: "“毕竟枪炮可不认人。”"
 DOP_GNG_event.17.t: "广东将来必定要在中国和日本间选边站，但无论如何，盛田昭夫和李嘉诚都会携手共进，保卫广东和她的人民的利益"
 DOP_GNG_event.17.desc: "直面风暴\n\n“你把我叫来就是为了这件事？”\n\n井深皱着眉问道。尽管他的话中有苛责的语气，但他心里已经开始思考这些流言的真实性。\n\n“井深，这完全有可能。”盛田看起来很坚定。“十年前我也听到过类似的消息，虽然最后是龙绳武在西南掀起暴乱。”\n\n“那你有没有想过这可能是另一场暴乱的前奏？”井深依然保持着他那副质疑的表情。\n\n“即便如此，我们也该想想怎么办了。你我都清楚中国军队现在的实力。倘若战争爆发，广东必然处于被动和不利的境地。”\n\n两人僵持了一分钟后，井深的眉头还是舒开了：“那么，谈谈你的想法。”\n\n“大前提是我们要确定我们的立场。”盛田指着桌上的地图。“我们的盟友不同，我们面临的危险也不同。倘若要确定一个计划，恐怕还得从长计议。”\n\n“我难得同意你的意见。”井深无可奈何地点点头。“既然这样，我会考虑这事的……”"
 DOP_GNG_event.17.a: "“毕竟，广东现在是我的心血。”"
 DOP_GNG_event.18.t: "工程师与手艺人可能会形成各自的看法，但对他们来说，保全他们为广东共同绘制的蓝图将是第一要务"
 DOP_GNG_event.18.desc: "迟来的审判？\n\n“号外！号外！南京就广东劳工待遇一事发表声明！号外！号外……”\n\n关上窗户，拉上窗帘，盛田打开电视想换换心情，但电视里还是对南京政府发言人的报道。\n\n“我们希望广东地方政府可以坚持自己原先的目标，致力于争取广东本地人的平权与合法待遇……”\n\n“近日，广东工厂再次被曝光存在重大安全隐患，安全事故频发的情况下仍未有补救措施，此举与当地政府先前的主张背道而驰，当地政府却无动于衷……”\n\n“据消息称，广东北逃人口日益增多，当地游行示威也接连不断……”\n\n这些报道刺痛着盛田昭夫的心，让他感到罪恶与痛苦。他从未想过要背弃自己的初心，自己当初只是走投无路，被迫和松下、日立搭上了线。\n\n但换来的是什么呢？工伤事故、劳资关系失衡、频繁发生的骚乱……如果再给他一个回到过去的机会，他绝不会去打那个电话，让自己成了松下和驹井的共犯。\n\n可惜，这世上没有后悔药。\n\n北方的阴云日益逼近，但盛田心里仅有了一丝庆幸，或许还有办法扭转自己的错误。但他真能如愿以偿吗？松下、山下和驹井会让他独自一人作出决定吗？"
 DOP_GNG_event.18.a: "但即便如此，他也希望博一把"
 DOP_GNG_event.19.t: "行政长官将与自己放出的魔鬼殊死搏斗，纵使孤身一人，他也要依靠外力打破囚禁广东的牢笼"
 DOP_GNG_event.19.desc: "双日凌空\n\n稻叶将电报摔在桌子上，在办公室里生着闷气。中国朝野上下对他接管广东没什么好脸色，南京更是在电文中表示“对其地位之承认仍有待商榷”，摆明了不支持他。\n\n说实话，这个烂摊子他也不想来接。铃木的经验已经告诉他，干预当地企业不是什么好事。但没办法，东京下了命令，要他重启并完成铃木的计划，和企业起冲突在所难免。\n\n就在他想着要不要和东京通通气时，秘书着急地跑了过来：“阁下！刚刚……刚刚中国领事馆的人都撤走了！”\n\n……\n\n宋之光从车内走出，看着面前带队拦截的永野，只是一笑：“永野将军，我们两国的关系还不至于到你拦我的地步吧？”\n\n“……领事馆毫无预兆地离开，高岛领事也很关心，希望各位给出个理由。”\n\n指挥刀的寒光并没有吓到中国士兵，他们和日军举着枪对峙，正如他们的同僚在山海关做的那样。\n\n“南京下的命令。”宋之光面不改色。“个中缘由您也明白，不过您要是希望立刻开战，那尽管毙了我。”\n\n……\n\n“宋领事他们已经离开了。”李嘉诚放下话筒。“我们要怎么办？”\n\n四位总裁——连着何鸿燊——都做着咬指甲或搓手之类的小动作，但对他们来说，自己心中的答案已然明了。"
 DOP_GNG_event.19.a: "各怀鬼胎"
 DOP_GNG_event.20.t: "稻叶的统治并不稳固，企业的联合也并非铁板一块，中国和日本的博弈，或许就将在广东的内部展开……"
 DOP_GNG_event.20.desc: "战云迫近\n\n“中国军队正向北方集结……目前山海关一带已经全面军事化，预计情况将比1937年还要紧急……”\n\n田村秀昭将这些话读出来时，在座四人头上满是冷汗。中日之间的战争看来还是不可避免，而广东的混乱无疑对中国有利。\n\n“边境报告说每天都有几千，甚至上万人偷渡到中国……”。田村叹了口气。“我们什么时候才能杜绝这类现象啊……”\n\n正在这时，田村的副官敲门后走入了会议室：“报告各位长官，刚刚收到了……南京的最后通牒。他们要求我们立刻投降，否则将攻打广东。”\n\n话还没说完，惊讶而又不安的情绪就笼罩了会议室内的众人。永野还算镇定，马上提出联系东京，但田村担心这会加剧局势。大森则提出让自卫队加强边境防卫，却又遭到赤城的反对……\n\n……\n\n“还不走？”\n\n汪敬煦提着公文包，眼里布满血丝，但面前的宋之光看上去要轻快地多。\n\n“不，我有个计划，想试试。”说着，宋之光穿上外套，叫上两名卫兵跟自己上了车。\n\n“你打算去干什么？”汽车发动时，汪敬煦站在车窗边问道。“你不回去，我也要被质问。”\n\n“……我觉得可以策反几个人，比如盛田昭夫。”宋之光脸上依旧挂着笑容。“你觉得呢？”\n\n“……你有几成把握？”\n\n“你应该知道我之前干什么的？对吧？”\n\n“好，我回南京会汇报你的打算，但你最好别干什么……出格的事情。”\n\n汪敬煦迅速上了另一辆车，随后两辆车向着相反的方向开去。"
 DOP_GNG_event.20.a: "十分钟后，领事馆就人去楼空了"
 DOP_GNG_event.21.t: "人外有人"
 DOP_GNG_event.21.desc: "这次李晞人生中第一次到广州以外的地方。深圳并不像广州那么繁华，但在两三年内能建起一座初具规模的新城，可想而知广东政府耗费了多少资源。当然，最引人注目的还是眼前索尼与富士通的联合园区。而里边高耸入云的研究中心，就是李晞这次出差的目的地。\n\n李晞和一队工程师走进研究中心，一楼看起来和那些公司的前台没什么区别。众人正在找上楼的路时，一个身穿研究服的男人走了过来：“欢迎，索尼的工程师们。”他看着眼前疑惑不已的李晞等人，眼里充满了不屑。“我是半导体部门B级研究员渡边，从今天开始，我就是你们的上级。”渡边说着，领众人走进电梯。\n\n不一会儿，电梯门打开，李晞和众人惊讶地看着眼前富士通的工程师和科研人员正围在房间正中的一张大桌子上，热火朝天地讨论着一张他们看都看不懂的电路图，每个人手上的草稿纸都写满了数字和字母。“这里就是我们的办公地点。很抱歉，平常他们不会吵得这么大声。不过这副样子……估计是找到灵感了。”渡边说得很礼貌，语气里却有着一丝愉悦，也没管身后的众人就走了过去。\n\n众人不敢加入讨论，只好先看着四周小桌上的各种草稿和计算机模型。然而，一旁的讨论还是冲击着他们的大脑——这些富士通的工程师甚至能口算电路的总电阻和各支路电流！李晞看着被他们挂在大黑板上的电路图，大脑飞速旋转。他鼓起勇气走了过去：“那个……我有个想法……”\n\n所有人都转过头来，盯着这个不知道从哪儿来的毛头小子。“呃……我们也许可以考虑这这个电阻移到这里，然后……”“我们已经考虑过了，小子。把电阻移到那里去无论如何都会导致一个元件无法正常工作。”一个研究员冷冰冰地说道。“那么就把这个二极管……”“好了。”一个熟悉的声音开了口。是渡边。“我不管你以前在索尼有多优秀，但你们才第一天来，这些东西我们已经攻关了一周，你觉得你随便看两眼就能解决问题么？”这些话像针一般刺向李晞的心，他只能尴尬地把目光又移到电路图上。“其他人也一样。我给你们一天时间，你们最好赶快赶上我们的进度。否则，我不介意申请把你们调回去。这里的研究员没心思像在索尼一样帮你们，你们只能靠你们自己。现在，最好别打扰我们。”\n\n众人立马散开，而李晞仍看着那张错综复杂的电路图。"
 DOP_GNG_event.21.a: "不幸的是，他的每一个想法都在多次推理后被否定了"
 DOP_GNG_event.22.t: "李嘉诚访问纽约"
 DOP_GNG_event.22.desc: "李嘉诚以政务司司长身份造访纽约的新闻引起了美国人的热议。美日关系逐渐稳定的当下，许多人都很期待这位在日本监管下的广东华人领袖会怎么向人们展示广东人的精神面貌，尤其是流亡的中华民国政府——无论是侥幸逃走的改组政府官员还是早就在美国待了三十多年的那群人——四处宣传华人在日本治下饱受虐待的案例的情况下。\n\n负责与李嘉诚商谈合作事项的包括美国国务卿（这里看看有无代码把时任国务卿名字显示出来）和其他外事官员。按照行程，李嘉诚在到纽约的第二天就会开始对美贸易谈判，三天后会议结束，他就会去纽约各处参观，同时和当地华人对话。\n\n会议地点选在纽约市立会议中心，这里原本是宾夕法尼亚中央铁路公司大楼，但纽约当地的房地产大亨唐纳德.特朗普将其买下并进行改建。这位精明的商人在纽约还有多处房产，其旗下的凯悦酒店不久前建成，因此这位大亨希望李嘉诚能入住这家酒店，并和他进行商业谈判，李嘉诚也欣然接受。\n\n来采访这位“华人司长”的记者相当之多，大部分都是因为对中国地区的旅行禁令而无法得知中国近况的记者，他们都想从李嘉诚嘴里套出些什么，但李嘉诚只回答了与广东地区相关的问题，并表示广东正采取措施接纳难民，对于日本在中国的暴行则表示“无可奉告”——对于他来说这确实令人感到无奈，但日本绝对不可能让他说真话。\n\n机场外同样围满了抗议的中国人，他们指责李嘉诚为汉奸，不少人还冲击警察的防御想袭击李嘉诚，迫使纽约警方不得不在沿途路段增派警力，并打电话希望华府要求流亡的民国政府和华人商会撤走这些人。李嘉诚则面色铁青地上了车，到凯悦酒店下榻。\n\n特朗普在凯悦酒店门前迎接李嘉诚的到来，随后李嘉诚便入住了特朗普下令特别准备的套房，明天一早，李嘉诚就要前往市立会议中心进行谈判。"
 DOP_GNG_event.22.a: "让我们看看美国人的价码"
 DOP_GNG_event.23.t: "浮士德式交易"
 DOP_GNG_event.23.desc: "（国务卿名字）领着一群官员进入会议室，李嘉诚这边则是他精心挑选的几名外务司官员和长实高管。\n\n双方对此次会谈都很重视。对于广东来说，能和美国搭上线并完全开辟美国市场在经济上意义非凡，如果能得到美国的非正式承认就再好不过，哪怕东京对此大发雷霆，美日关系的间接缓和也会让日本接受这一事实；而对于美国，广东是一块神秘的宝地，其一定程度上代表着世界上最为先进的电子技术，与广东建立联系可以让美国企业从中获益，OFN也可以借此深入东亚，了解东亚的现状以确定新的对日政策。\n\n李嘉诚将自己的提案逐项提出：确定一个较低的关税、开放双方贸易和解除旅游限制，而美国对此全盘接受。按照国务卿的说法，这也是他们希望达到的结果。\n\n但是，（国务卿名字）却提出了一个比较危险的想法：他希望美国，甚至是所有OFN国家，可以在广东设立办事处。按照他的说法，这个办事处在广东仅限于协调双方贸易和犯罪人员引渡等外交问题，而同意设立办事处也会让其他国家对与广东建交一事更放心。考虑到OFN一直与流亡的中国政府有密切联系，且美国可能借此干预亚洲事务，李嘉诚有了些许犹豫。\n\n第二天，李嘉诚与各大电子企业代表商谈两国公司间技术共享问题时，（国务卿名字）就一直在会场坐着。会后他找到李嘉诚，希望他可以同意关于办事处的议案。虽然盛田表示出于对李嘉诚的信任，他不会将自己的意见强加给李嘉诚，但这个冒险的方案着实让李嘉诚进退两难。\n\n最后，在正式签署协定前，（国务卿名字）又一次表示办事处是必要之举，并承诺如果办事处得以设立，美国的贸易订单将优先交给广东。而李嘉诚在昨晚还是打了电话给盛田，两人讨论了一小时后，盛田终于决定同意设立办事处。而现在，李嘉诚把盛田的答复转告给了（国务卿名字）。"
 DOP_GNG_event.23.a: "当晚两人在宴会上举杯共饮，庆祝协议的达成"
 DOP_GNG_event.24.t: "纽约游记"
 DOP_GNG_event.24.desc: "谈判结束的第二天，李嘉诚去参观了纽约各处。他首先去的是自由女神像，按照他的说法，这在东方被视作美国的标志之一。这位华人司长仰望着自由女神像，神色凝重，没人知道他在想什么。事后有一些华人认为他心里还想着他的祖国，也有人认为他是在装腔作势。\n\n下一站是美国的金融中心华尔街。世人皆知李嘉诚在房地产和金融两个行业上可谓付诸心血，而李嘉诚也借此机会了解了美国金融业的发展。他在华尔街的证券市场门前留下了一张照片。\n\n午饭后，他在随行人员陪同下游览了中央公园，并惋惜地表示广东可能还要好几年才会计划这种大型公园。在此之后，他在唐人街与一些对他态度温和的华人们会面，并向当地华人商会会长表示有需要可以向他提出，长实会负责支持海外所有华人街的正常运营。\n\n在时代广场留下了几张照片后，李嘉诚在晚上回到凯悦酒店，并在餐厅以长实集团总裁身份与特朗普开始商业性会谈。不过会谈结束后，李嘉诚强颜欢笑，而特朗普则满面春风。据一位随行人员回忆，李嘉诚私下抱怨道：“他最好只是个商人，而不是什么大亨或者政治家。”\n\n次日，李嘉诚前往机场离开纽约，由纽约警察全程护送，（国务卿名字）率一众官员前往送行。"
 DOP_GNG_event.24.a: "一次成功的旅行！"
 DOP_GNG_event.25.t: "何鸿燊到达旧金山"
 DOP_GNG_event.25.desc: "广东财政司司长何鸿燊宣布他将前往旧金山后，美国新闻界都在议论广东政府官员来到美国意味着什么。很多人认为这是一次试探性接触，意味着广东开始寻求大国承认；也有人认为他是代表日本而来，是为了日美关系的进一步缓和。\n\n当地华人对这一事件大多表示愤怒，中华民国流亡政府甚至为此召开了新闻发布会，发言人在会上呼吁在美华人对何鸿燊访美一事对华府抗议，但华府对此不置可否。\n\n几日后，何鸿燊的飞机降落在旧金山国际机场，（财政部长名字）率商务部长等美国官员迎接。机场外虽然有大量华人抗议者，但在何鸿燊出现后，抗议人群内竟然内讧了起来，出现了互殴事件，抗议一事也不了了之。\n\n何鸿燊在机场短暂接受了记者采访。当被问到广东是否有意与美国建交时，他脸上的笑容有些扭曲，但仍不失体面：“广东自然希望能建立更为广泛的国际联系，但考虑到诸多历史因素，我更愿意把我这次旧金山之行当作一次尝试。”\n\n有些美国记者想问问何鸿燊是否与在美华人黑帮有联系，但总被他打哈哈似的应付过去，随后便被其他一些无关痛痒的问题打断。\n\n之后何鸿燊乘车前往酒店，按照他的行程，在谈判过后他会去旧金山参观，然后以个人名义前往拉斯维加斯，但他有整整一天时间花在旧金山唐人街上，其目的无人知晓。"
 DOP_GNG_event.25.a: "让我们看看赌王的博弈"
 DOP_GNG_event.26.t: "止步不前"
 DOP_GNG_event.26.desc: "何鸿燊的精神不是很好。尽管谈判内容很简单——无非就是人员和资本流动限制问题，但也让他感觉够呛。美国人一直希望能在谈判上更进一步，以求建立一个非正式关系。他们提出各种附加条款，但都被何鸿燊和他带来的公司高管们以各种理由推脱掉了。\n\n（财政部长名字）在后面也渐渐失去耐心，于是私底下找到何鸿燊，希望他能同广州方面联系，让谈判不要只局限于经济贸易上。“咱们要做就做到最好吧，司长先生。广东如果和美国建交，其他OFN国家自然也会联系广东，那时的收益远比现在要大，何乐而不为呢？”\n\n何鸿燊只是苦笑：“对不起，部长阁下，但如果我们真的打算建交，站在您面前的应该是行政长官本人或政务司司长了。广东目前并不打算与其他国家有太多牵连，因为一些众所周知的原因……而且贵方如果与我们建交，那流亡的国民政府又会怎么想呢？”\n\n（财政部长）摇了摇头，知道建交一事已经告吹了。广东既担心日本的压力，又疑虑孙科等人借机生事，置广东于不利境地，所以选择了最为保守的方案。不过管他的呢，自己的任务已经达成了，哪怕只能在经济上和东亚地区搭上线也并非一无所获，他们也可以让民间人士多去了解了解东亚到底都发生了些什么，至于正式建交，恐怕还得去敲打敲打日本。"
 DOP_GNG_event.26.a: "退而求其次……"
 DOP_GNG_event.27.t: "石油产业经营条例"
 DOP_GNG_event.27.desc: "“阁下请坐。”军官呵呵一笑，为面前的议员打开包厢的门。这位松下的议员唯钱是命，投票向来追求有利可图。今天帝国陆军邀请他，就是想利用这一点。\n\n酒过三巡，军官便下令让人提来一个公文包：“阁下，这就是我们这次的提案，不知意下如何？”\n\n议员见到公文包，立刻两眼放光，一把拿过后将其打开。里面装着一沓沓日元，让议员的目光更加贪婪。\n\n“那么，你们是想……”\n\n“保住我们的东西，没什么特别的。事成之后对大家都有好处，不是吗？”\n\n军官咧嘴笑着，这名议员已经被“说服”了。而不止他一个，很快将会有更多议员站在他们这边——以一种更“合规”的方式。"
 DOP_GNG_event.27.a: "钱买不来真心，但能买来支持"
 DOP_GNG_event.28.t: "法案通过"
 DOP_GNG_event.28.desc: "即使大部分代表果断投下了反对票，索尼和长实依然设法获得了多数票。于是，法案不可避免地通过了。\n\n那些投反对票的代表大多上蹿下跳地表示要和他们划清界限，表示这一行为“定会招来帝国陆军的报复”。但李嘉诚并不在乎这个，反而立马嘱咐秘书着手准备投资茂名的本土企业。\n\n出人意料的是，盛田昭夫、松下正治和井深大三人在会后碰了个头。\n\n“你们认为这个提案如何？”盛田问道。\n\n井深摇了摇头：“大胆的举措，我认可他的勇气，但我不觉得这会很顺利。”\n\n松下则摸了摸下巴：“同意。帝国陆军恐怕不会善罢甘休，但开弓没有回头箭，而且这笔生意对我们也很有利。”\n\n三人谈话时，一旁的驹井健一郎突然走了过来：“我很欣赏李司长作出了这么有魄力的举措，但这个问题我们恐怕很难解决——不仅仅是帝国陆军的问题。”\n\n“你又有什么高见？”井深翻了个白眼。他现在很讨厌和这家伙谈话。\n\n驹井则呵呵一笑：“我的线人告诉我，中国军队正向他们的西南地区集结，且南京对日态度有所缓和。倘若中国西南真出了什么乱子……”"
 DOP_GNG_event.28.a: "“到时候那里的一切，恐怕我们都要失去。”"
 DOP_GNG_event.29.t: "法案失败"
 DOP_GNG_event.29.desc: "得知投票结果后，永野只是轻松一笑。果然如他所料，广东企业没能大规模进入茂名，石油产业还在他的控制之内。\n\n窗外的烈日灼烤着广东的大地，一如104师监视着广东的一切，肃清一切不忠的可能。如果盛田昭夫和他那群狐朋狗友还想干些什么，他也一定会……\n\n电话又一次响起了。永野拿起电话，以为是属下的汇报，但听到的却是四个字：东京来电。\n\n“是……什么？中国西南？我没有接到相关的报告……是，我保证加强戒备……唔……我明白了。”\n\n挂掉电话，刚才的喜悦一扫而空，取而代之的是忧虑。中国的西南地区明显出了什么乱子，就连东京也通知他要留心……是土匪？是军队叛变？还是……"
 DOP_GNG_event.29.a: "此时，一朵云遮住了旭日。"
 DOP_GNG_event.30.t: "失业救济条例"
 DOP_GNG_event.30.desc: "“诸位！失业救济法的通过，将会为我们带来一个更稳定的广东！”\n\n“我知道你们很多人会担心开支问题，也有很多人并不关心那些失业工人的死活。但是一旦他们再次掀起暴乱，广东又要陷入何等境地？”\n\n李嘉诚的质问声在立法会回荡着，作为亲自许下承诺的那个人，他明白于情于理，这份法案都必须通过。\n\n在场的人们大多带着怀疑或鄙视的眼神看着这位“为民请命”的政务司司长，驹井更是和周围的人说他就是个同情心泛滥的疯子；井深大的脸则皱成一团，他向来对劳工权益相关的政策嗤之以鼻；松下则双手抱胸坐在座位上，像是在思考些什么。\n\n在投票时，索尼和长实的议员们几乎全部赞成，松下的议员们在其总裁的带头下也大多投下了赞成票，只有富士通和日立的议员们质疑这一法案的必要性。\n\n台上的李嘉诚满意地看着投票结果，他知道这还不够，但对他来说，今天已经是一场大胜。"
 DOP_GNG_event.30.a: "千里之行，始于足下"
 DOP_GNG_event.31.t: "法案失败"
 DOP_GNG_event.31.desc: "你辜负了他们的信任。\n\n这份法案一般来说不可能不通过。"
 DOP_GNG_event.31.a: "回档再试试？"
 DOP_GNG_event.32.t: "政府改革？"
 DOP_GNG_event.32.desc: "“都到齐了的话，那我就说一下吧。”盛田看着面前四人。“咱们今天的会议内容，主要是讨论政府的改革事项。”\n\n“额……能说得再详细些吗？”作为财界派的一员，松下明显没被通知参与讨论。实际上这个计划，盛田昭夫和李嘉诚已经私下讨论过很多次了，也分别向何鸿燊和大森宽征求了意见，最终才制定了一个初步方案。\n\n“我计划的是，成立一批部门来分担各司职责，避免你们四位操劳过度，也是为了完善广东的行政机构。”“所以你的意思是，我们的权力要被拆分？”松下的目光有些锐利，但更多是疑惑。“……你可以这么理解，或者说，这些人是来帮你的。考虑到广东的公务员大多是日侨，我们后面为了装点门面，可能还要逐渐替换成珠人和华人。你们有什么意见吗？”\n\n除了松下，自然没人有意见。“我唯一的问题是，你怎么才能保证那些商人不急眼？”“所以目前这个只是初步方案。我们后面逐步推进的同时，也会看情况来改动。不过我想，应该没人会为政府权能的扩大而不满，除非他们真觉得，目前的行政效率能满足这样那样的需求。”"
 DOP_GNG_event.32.a: "“好吧，那我没意见。”"
 DOP_GNG_event.33.t: "旧日好时光？"
 DOP_GNG_event.33.desc: "夜晚的胜利港寂静无声，在码头上，两位老人坐在一起，望着海洋，一言不发。\n\n“那么，就这样了？我想我们俩已经做了很多了。”盛田几乎要躺在长椅靠背上，井深这些天的改革可谓快刀斩乱麻，带着自己一起忙里忙外。自己已经好些日子没睡过一个安稳觉了。\n\n“……就目前而言，还有些收尾工作要做。不过没关系，这些可以稍微放松点了，但不代表我们可以拖拉。”井深的话很冰冷，似乎每次谈到他的愿景时，井深的语气都很坚决，仿佛没人能改变这一切。“那么，下一步又是什么？”盛田咬了下嘴唇，他只希望井深别再上头了。\n\n“加大金融监管，继续鼓励教育事业，还有我之前和其他人鼓捣的那个紘宇網……你想去救助贫困人群也行，但我希望最好给他们找点事做而不是只管给他们发钱。”\n\n两人又一次默默无言。少顷，盛田打破了沉默：“老实说，井深，我以为咱俩这辈子都会是死对头了，但我没想到你居然愿意退一步……”\n\n井深有些不耐烦了，毕竟他本就不想让步，只是担心松下趁虚而入不符合他的利益。现在好了，自己还要捏着鼻子和盛田一起去建设一个“人道的工程师乐园”。他是不是觉得自己很伟大？\n\n不过，盛田也确实接受了一些在他看来不该实施的改革，或许他已经屈服了？还是他以为自己只会止步于此？那他可真天真。\n\n接下来的半小时里，井深并没有仔细听盛田说了什么，他的脑海里在盘算，在思考他该怎么把广东现状往自己的理想推哪怕一步。"
 DOP_GNG_event.33.a: "但现在还不是与盛田昭夫再次撕破脸皮的时候"
 DOP_GNG_event.34.t: "观众们"
 DOP_GNG_event.34.desc: "高岛拿起装热水的壶子，往永野的茶杯里倒了半杯：“尝尝吧，中国西南运过来的。”“我以为何应钦只会让他们制毒呢。”永野轻轻摇了摇杯子。“对了，本岛对广东态度如何？国会可是让我们别影响那些蛀虫。”\n\n“真令人惊讶，你居然还知道过问。不过还好，没什么事，那些商人告诉我他们可以等一段时间，但要是等太久了，他们也会烦躁。”高岛放下水壶，随手将一张报纸递了过去：“《朝日新闻》对这事没怎么报告，只是现在民间舆论都比较关心盛田昭夫的情况。”\n\n“东京没让动他，所以我们也不能动，对吧？”永野伸了个懒腰，把报纸扔到一边。“要我说就该给他判个叛国罪……”“提醒你一下，他现在是广东籍，不存在叛国。”“……好吧，那如果要抓他该怎么办？”“除非派人暗杀，不然只能打点广东政府机关，让他们给盛田扣个帽子，然后按广东法律办。”\n\n“那不就等于奈何不了他？”高岛看到永野头上青筋暴起，只能叹口气泯一口茶。\n\n“那么你又是怎么打算的呢？这事严格意义上，咱们已经卷入其中了，你我现在也算为他们的夺权背书了。”“嗯……老实说，高岛，这次我不打算掺和，至少不会想着把他们直接拉下马。”永野的眼睛紧盯着热茶冒起的白烟。“现在最该做的就是让他们自相残杀，先把稳定带回广东。如果他们连这点小事都干不好，我估计会考虑提供一些……指导。”"
 DOP_GNG_event.34.a: "“就让我看看他们有何本事吧。”"
 DOP_GNG_event.35.t: "共荣共存？"
 DOP_GNG_event.35.desc: "李骏和李晞一同下班回家，在路上，他们看到了政府最新的宣传标语：建设三族共荣的广东国！\n\n“让我猜猜，这是日本人给他们想的标语吧。”李晞开了个玩笑，让李骏也忍不住笑起来。“不过骏哥，这标语相对于当年……你觉得这次有几成是真的？”\n\n李骏的思绪顺着弟弟的话回到了1962年，他和他的亲人们被赶出村子，被工头压榨，随后盛田昭夫让那个大隈走了人，而后他又去长实的厂里工作，直到现在他和他的弟弟在索尼上班，妹妹则在长实，父母也有养老保障……虽然一切看上去都很美好，但有个问题他一直想不明白——盛田昭夫一个日本人，居然对他们这么好，难道日本那边没意见吗？\n\n林巧川拧开一瓶汽水，“咕噜噜”喝了几口后，开始了下午的工作。听说大森马上退休，也许过段日子自己就要升职当高级警司了？\n\n他拿起本季度的报告，看到辖区犯罪率又相较上个月下降了17.5％，脸上露出一丝微笑，看来以后真的能完成日常工作就当下班了。警局内的珠人和日侨——甚至一些能力出众的华人——也不会因为种族歧视或者其他什么“玩笑话”而争吵，甚至这些现象会被大部分人鄙视。看来相当长一段时间里，广东应该没什么治安问题了。\n\n良子正在对一个三合会的外围团体作专访——当然，他们已经转型成社会团体了。他们原本是一群难民组建起来，靠暴力手段以维持生计的，但随着广东社会福利网的扩张以及对难民的公民身份予以承认后，他们的生活也安顿下来，这个组织自然也要消亡或改变。他们选择了后者。\n\n会长说，现在大量依附于三合会的小团体也在逐渐转型，因为他们和自己一样，都是为了生活才抱团取暖，但现在盛田满足了他们的需求。当被问道对盛田的政策有什么看法时，男人的表情有点复杂，半晌才吐出一句话："
 DOP_GNG_event.35.a: "“我感谢他，但我不觉得‘广东国’是我的国家”"
 DOP_GNG_event.36.t: "罪人"
 DOP_GNG_event.36.desc: "大森宽第一次站在立法会的讲台上发言，这对于他算是个难事，因为他要谈的既不是安保改革，也不是汇报治安情况，而是要宣布一个重磅消息：立法会将被临时解散，恢复时间另行通知。\n\n大森本身不太排斥去宣布什么消息，因为想也知道，他必须得去干这种事。在那些商人眼里，赤城是个不苟言笑的家伙，栗栖则是口蜜腹剑的混账，更别提永野茂门，那家伙在广东可谓人人得而诛之。所以大森必须当临时政府的排面，干着类似外务司的活。\n\n只是今天这个消息，对于他自己来说也很沉重，他甚至不敢看到盛田昭夫的眼睛——盛田那么信任他，结果他现在站在这里，不仅参与了罢免盛田，还宣告了他的政治资本的死亡。好在，他的政治遗产被自己力排众议，以“有利于安抚民众”的理由保住了，但谁知道那些当兵的会不会去落实这些法律呢？\n\n当他全程低着头，将关闭立法会的命令宣告后，议员们的咒骂声顿时冲击着他的耳膜，他甚至听到了李嘉诚的声音，但他不敢去认真听他说了什么，他现在只想赶紧走人。\n\n当他离开时，他突然回头看了一眼，刚好对上盛田昭夫的眼睛：饱含失落，两眼无光。他在想什么？算了，还是赶紧离开吧，这样说不定能让我的负罪感轻一点。大森怀着这样的想法，三步并作两步地离开了立法会。"
 DOP_GNG_event.36.a: "如同为银币而出卖耶稣的犹大……"
 DOP_GNG_event.37.t: "重症需下猛药"
 DOP_GNG_event.37.desc: "自战争开始以来，行政长官本人的办公室便成为了广东政治权力的集中点，无数影响全广东甚至整个东亚的决策就在这间屋子里随着一项项条例的修改和最终通过及一道道行政令的传达而作出。\n\n而今天，随着扼在广东的咽喉上的那只散发着血腥味的手的最终松脱，行政长官和他内阁中的家臣武士们终于得以松一口气，为斩下那只扼住广东经济命脉的妖手而群策群力。\n\n“当下，我们亟需刺激我们国内市场的资金流动，而且需要不同于以往的一般的刺激措施。关于这一点，我已经在备忘录里面做了解释。诸位有什么别的意见吗？”，盛田扫视了一圈他的同僚们，当然，如今在《紧急权力条例》的支持下，无论是立法会还是内阁，都很难对他的决策造成有效的抵制，那为什么他总是要多此一举地去发问呢？是出于礼数，还是他其实也对此缺乏信心？只有他自己知道了。\n\n非同以往的减税力度、非同以往的货币输出、非同以往的利率调整，旨在使广东的血管重新畅通无阻……\n\n而这次，“财政保守派”这个身份却落在了昔日的“财政改革派”——政务司司长李嘉诚的身上，“昭夫，我明白我们现在需要刺激市场活性和货币流通，但是我们没有办法走的太远，但贸然的减税，尤其是对拥有巨额营收的企业和高收入的国民减税，会严重影响政府的财政健康，我希望你能慎重考虑。”\n\n“我也想要提醒你，行……盛田。”，松下的神色严肃而冷峻，“不要打开潘多拉魔盒。贸然调整货币和财政政策，是会出大麻烦的，尤其是如今我们花钱如流水的情况下，如果有什么差池，通胀规模会把我们拖入泥沼。当然，我、李司长，相信还有在座的各位，都不反对你的积极作为，只是我还是要提醒你，小心行事。”\n\n“当然。”，盛田咽了口唾沫，“但我们也并非第一次面对这种局面，而我们熬过去了，不是吗？”"
 DOP_GNG_event.37.a: "“有点信心。”"
 DOP_GNG_event.38.t: "细细的蓝线"
 DOP_GNG_event.38.desc: "对于今时今日的警察来说，平衡生活与工作已经不再是一个问题，因为他们已经近乎无暇顾及自己的生活。\n\n作为荔湾方面区石围塘分区的一名巡警，张嘉文已经不记得过往平静的分区警署是什么样子了，每时每刻，他的同僚们都羁押着从街头巷尾抓捕的犯下或轻或重罪行的嫌犯在大厅里出入，审讯室与拘留室总是爆满状态，甚至连办公区间，都时常被当作临时审讯室。\n\n“阿妈，我今晚都系一样，返唔到屋企吃饭了，你地早滴休息，记得锁实滴门窗啊，系咁先。（妈，我今晚还是和以前一样，不回家吃饭了，你们早点休息，记得锁好门窗，好，再见。）”放下电话，他感到一阵头晕目眩，不知道是因为长期以来的睡眠不足，还是因为嘈杂刺耳的环境，当他再次转身，只见督察带着几位警长，面色阴沉地走向更衣室，他感到大事不妙，匆忙跟了上去。\n\n更衣室里是死一般的寂静，与外头激烈的争吵声与拍案叫骂声仿佛是两个世界。督察默默地走向一位在应对昨日一起抢劫案中遭受枪击的同事的更衣柜，取下了上面的名牌。\n\n“我地系维系秩序与混乱之间平衡唯一既分界线。（我们是维系秩序与平衡之间秩序的唯一的分界线）”这是走出更衣室之前，督察所说的唯一一句话。"
 DOP_GNG_event.38.a: "但是现在这条线快要绷断了，就如同张嘉文的神经一样"
 DOP_GNG_event.39.t: "承诺"
 DOP_GNG_event.39.desc: "“你叫我地仲点去做野啊？连支枪都打唔响啊！佢就咁比个扑街一枪打瓜佐啊！（你叫我们怎么继续工作？连枪都打不响啊！他就这样被那个混蛋一枪打死了！）”单凭道德上的责任感和制服的荣誉可能无法支撑警员们继续做下去了，他们的精神状态如同广东如今的治安状况一样，随时处于溃堤的边缘。\n\n这不仅是因为高负荷的工作和随时紧绷的精神状态，更是因为如今他们连自己的生命安全都无法得到有效保障。自从上次警务改革以来，大多数警员在一般情况下不会配备枪支，而如今为应对暴力犯罪的升级和蔓延，警队又做出决策：将军械库里一度收回的杂乱无章的枪支发放下去。\n\n这些来自世界各地、口径不一的武器不仅维护和补充弹药困难，其本身的质量也由于时间的推移而变得不敢恭维，方才宣布殉职的警员正是因此而丧命。\n\n警署里逐渐群情激愤，拒绝继续执勤的、要求改善当前工作条件的，甚至当场以离职做要挟的。张嘉文站在人群里，愤怒、委屈的嘶吼和抱怨像是在拷打他的内心，他心里也打起了鼓：是否应该继续干这份工作？如果继续干下去，下一个棺材上盖着国旗下葬的可能就是自己......\n\n“细声滴，听下佢要讲咩？（小声点，听听他要说什么？）”大厅内电视屏幕上警务处处长大森宽的身影吸引了所有人的注意，抱怨声逐渐低沉下去，大家屏息凝神，想要知道这位他们的老顶（上司），对现在的局面有什么要说的。"
 DOP_GNG_event.39.a: "“政府与警务处已经达成共识，通过了新的预算案......”"
 DOP_GNG_event.40.t: "标准化装备"
 DOP_GNG_event.40.desc: "随着《关于提高警务装备质量及标准化程度的通知》的下达过去了几周，警员们逐渐发现他们腰间挂着的各式各样来路不一的手枪和粗重的木制警棍不见了，取而代之的是带有异国色彩、却印着索尼的商标的新式手枪，以及握把覆盖着黑色橡胶外壳的金属伸缩警棍。\n\n“哇，哩支野睇住好似几咁使喔......（哇，这把枪看着好像还挺好用的样子...... ）”，张嘉文把玩着手上刚刚配发下来的新式警械，抚摸着它上面那做工精细的握把与滑轨。卸下弹匣，里面压满了黄澄澄的9发9毫米子弹。不管怎么说，这看着就比那该死的南部十四好多了。\n\n在新的个人警务装备中，与手枪一同下发的，还有一根漆黑而分量十足的警棍，握把上还贴心的装配着一根绳环以防警棍脱手。除了每天挂靠在身上的这些小件，新的警务条例还规定，在每辆巡逻车的后备箱中，将放置自动步枪或冲锋枪以应对突发的高烈度暴力犯罪事件，在关键地段步巡的警员，也会随身携带这些武器以防范暴力袭击事件。\n\n“你话哩滴野要配发到所有伙计手上，要洗几多钱？（你说这些东西要配发到所有伙计手上，得花多少钱？）”他看向自己的搭档。"
 DOP_GNG_event.40.a: "“唔知，但一套落来肯定没死个伙计要赔滴钱咁多（不知道，但一套这些东西肯定没有死个伙计要赔的钱多）”"
 DOP_GNG_event.40.b: "“为什么我们要穿这玩意”"
 DOP_GNG_event.41.t: "除了对付犯罪分子需要用到的警械，新的装备标准化采购清单里还包括了一件在危急时刻可能挽救警员生命的物品——防刺服。"
 DOP_GNG_event.41.desc: "当然，并不是所有人都对这件乌黑而又笨重的背心感兴趣。“为什么我们要穿这些东西？在本岛，我就没见过这些东西，这玩意又不能帮我们挡子弹！”日裔警长岸本尚二正对手下的警员抱怨着，“上层的那群老东西也不看看广东有多热，这要是夏天，穿上这玩意岂不是热的像狗一样！”\n\n“广东是广东，日本是日本。”珠人督察李健平出现在他身后，“日本会有这么多在街头流窜的亡命徒吗？你如果不怕挨上一刀，那你确实可以试试不要穿它出去。”，李健平带着玩味的笑容，继续道：“只不过如果你殉职了，我们会在申报抚恤金的时候，备注上你拒绝穿戴防护用品。”\n\n说完，他转头面向其他一言不发的警员，“做我地哩份工既，最紧要就系返到屋企。（做这份工作，最重要的事情就是能平安回家。）”"
 DOP_GNG_event.41.a: "做勇士，而不是烈士"
 DOP_GNG_event.42.t: "第二次机会"
 DOP_GNG_event.42.desc: "“警员连开6枪街头击毙嫌犯”、“警队是否有过度使用武力之嫌？”\n\n看着各路报纸上的大字，大森宽抿了口茶水，“大家也看到了，现在社会各界对我们警察是否在过度使用武力有很多争议，而我也走访了各地的几个城市的警察部门，他们的反映我也有听取。”\n\n“确实，如果我们的警员冒险去和暴力反抗且情绪不稳定的歹徒搏斗是有风险的，但是我们的警员也不应该习惯于依靠枪支去解决问题，这样久而久之，我们可能就不再需要看守所和监狱，只需要法医和停尸房就够了。”看着面前的几位副处长及助理处长，大森宽平静地阐述了自己的观点。\n\n“那么，您有什么高见？目前我们的警员只有射击和肉搏两个选项，如果前者对于社会大众来说显得我们很冷血，那后者就是对我们的伙计的残忍。”提出异议的是管理行动处的警务处副处长李君夏。\n\n大森宽笑了笑，开口道：“现在社会在进步，科技在发展，我们的警务手段也应该有所长进，不是吗？财委会给我们的条件可是出奇的宽裕，行政长官也在不遗余力的支持我们，我们肯定能找到办法解决这些问题的，不是吗？”\n\n说罢，他把几份文件摆在桌面上，《CS催泪气体对人体的影响及实际》、《自卫性远程电击武器》"
 DOP_GNG_event.42.a: "“我看这些东西就很有应用前景嘛。”"
 DOP_GNG_event.43.t: "艰难一日"
 DOP_GNG_event.43.desc: "“初次见面，我的名字是青岛俊作，和北方山东那个青岛一个写法的青岛。请大家多关照！”青岛深深地鞠了一躬，这是他在刑事部搜查第一课任职的首日。\n\n坐在办公桌前，青岛四周左顾右盼，“首都总区总部搜查一课……果然这里的人的感觉就和警署刑事课的人都不一样……”但是还没等他屁股坐热，管理官就开始招呼起大伙，“有案件发生了，在西关黄沙，发现一具男性遗体。当地警署已经封锁了现场，现在轮到我们开工了。”\n\n“我们是刑事部搜查一课，各位辛苦了。现在开始这起案件就交由我们负责。”带队的系长，率先穿好鞋套带上手套进入了穿过了警戒线。\"这可是我的梦想啊……\"暗暗感叹着，青岛也踏入了警戒线内的现场。在与最先抵达现场的地方警署刑警交流过后，所有人都意识到了这是一起非常恶劣且棘手的事件:死者是一名房东，死因是心脏等多个器官遭受利器伤害导致的衰竭，受害人有过比较激烈的反抗，其指甲上残留着部分皮肤组织和血液，可能来源于嫌疑人，身上的财物和贵重物品都已经消失不见，显然是被洗劫了。\n\n“所以没有目击者看到行凶过程啊……”青岛手持记事本，在上面写写画画，“说起来……系长！之前是不是也有过……”，他看向班长。“啊，是啊，同样是抢劫杀人案，大概是一个月以前吧……嫌疑人也没有落网啊……”，班长感叹着。\n\n青岛深吸一口气，但让他感叹的不仅是凶手的凶残，还有即将面临的繁重搜查工作:几周甚至几个月的高强度工作，甚至可能几天都无法回家一趟。"
 DOP_GNG_event.43.a: "能力越大，责任越大"
 DOP_GNG_event.44.t: "招兵买马"
 DOP_GNG_event.44.desc: "“果班人系咩人来噶？（那群人是什么人？）”青岛略显疲惫地操着一口带着口音的粤语，询问身边的同事，同事只是简单的看了一眼，“哦，新设立既果个咩机动搜查队嘛，上头话，等佢地系各个分区揸车巡逻，对查案效率有帮助喔。具体有没用咪睇下接住落来几个月点咯。（哦，新设立的那个什么机动搜查队嘛，上面的人说，让他们在各个分区开车巡逻，对办案效率有帮助。具体有没有用就看接下来几个月咯。）”\n\n青岛若有所思地点了点头，确实，最近各级刑事部门一直在扩张规模，不单单是原有的单位开始招募更多人手，新的隶属于刑事部的单位也在不断设立，除开刚刚提到的机搜，像什么特命搜查对策室、特殊事件搜查课，都在总部设立了自己的办公室。\n\n“点讲呢……起码对刑事课应该有用，至少可以少出几次街，你话系咪？（怎么说呢……起码对刑事课的人是有用的，至少可以少出几次门，你说是不是？）”，青岛回想起了在自己在警署刑事课的日子，如果当时署里就有机搜帮忙进行初步搜查，那对于减少工作量想必是大有帮助的。\n\n“唉，你讲得都有道理，而且话时话咁都起码说明上头同财委唔系盲既，佢地都知道我地要人手，要钱。而且我地基本人工同加班费都多佐啊……（唉，你说得也有道理。而且话说回来这起码说明上头和财委不是瞎子，他们也知道我们要人手要钱。而且我们基本工资和加班费不是也变多了嘛……）”"
 DOP_GNG_event.44.a: "“有钱能使鬼推磨”"
 DOP_GNG_event.45.t: "追凶"
 DOP_GNG_event.45.desc: "“科学搜查研究所的法医课警员通过现场遗留的疑似嫌疑人的血液，结合市内的医院的血液样本进行了比对。”\n\n搜查会议上，课长三浦和弘对着台下百余名来自刑事部及所在警署的各课警员简述着最新的搜查进展，“同时，人文科学课的同僚们也根据我们掌握的嫌疑人名单及我们对他们的搜查报告，以及尸检结果报告，对犯罪嫌疑人进行了心理侧写分析。两者结合，加上我们的刑警们对嫌疑人的不懈盯梢监视以及对周边街区的走访搜查，获得了决定性的证据，最终成功将范围缩小到一人。”\n\n“血液也可以当做证据吗？”青岛看向身边的同事，低声询问道。“现在法庭上还不能，但是我们在搜查过程中，可以把这作为一种提升工作效率的手段。只能说科技真是日新月异啊……”，同事略有所思般回答，“这也是为什么，上头要设立什么科搜研吧。”\n\n“……为了不让受害人含冤死去，和被害人遗属的愿望，一定要逮捕犯人！”课长以其独有的振奋人心的话语结束了会议。\n\n一个小时后，青岛与几位同行的刑警，身着防刺服，枪套的扣带打开，严阵以待地站在一处公屋的502号房房间门外，班长按响门铃，“你好，黄生，我地系警察，想要请你协助我地进行关于一宗谋杀案的搜查。（你好，黄先生，我们是警察，想要请你协助我们进行关于一场谋杀案的搜查。）”“又咩事啊？！（又什么事啊？！）”，嫌疑人不耐烦地打开房门，但当他看到面色不善的刑警们时，一切都已经来不及了，班长有力的大手直接推开房门，刑警们鱼贯而入，将嫌疑人控制住，果不其然，在他的屋内发现了一把带有血迹的弹簧刀。\n\n班长取出手铐，扫了一眼手臂上的手表，“黄寅松，11点27分，以抢劫罪与谋杀罪的嫌疑正式拘捕你。”，随着清脆的咔嚓声响，刑警们架着面如死灰的嫌疑人，走出房门。\n\n看着身边一脸错愕的嫌疑人，青岛想:“他是在为自己被抓捕而懊悔吗？”"
 DOP_GNG_event.45.a: "“还是在苦思自己到底是怎么被盯上的？”"
 DOP_GNG_event.46.t: "寻人"
 DOP_GNG_event.46.desc: "“请问令堂是几时走失噶？哦，晏昼3点半左右……咁佢果阵时着住点样既衫裤哩？（请问令堂是什么时候走丢的？哦，下午三点半左右……那她那个时候穿着怎么样的衣服呢？）”\n\n一名华人警员匆忙地在记事簿上记录下他面前焦急的来访市民提供的信息，时不时还要分出注意力安抚面前的来访者，让他们不要着急，慢慢地一个个说。\n\n送走了离开时还在一边抹泪一边念念有词的市民，他转过身伸了个懒腰，走进办公区，而接待处的桌子上，正竖着一块白色塑料板，上书：生活安全课。\n\n“又有一个走失的阿太，年龄67岁，最后一次见佢系龙翔道，平时个脑就唔系几清醒下，哩度系详细记录，打出来印俾巡街滴伙计，等佢地帮手分发一下。（又有个老太太走失了，年龄67岁，最后一次见到她是在龙翔道，平时脑子就不大清醒，这里是详细记录，打印出来给巡逻的伙计，让他们帮忙分发一下。）”把记事簿递给负责文书工作的同事后，他转头又对负责联络传达工作的同事道：“打个电话俾总台，叫佢地吩咐一下宜家出紧街既人，等佢地注意下附近有没符合描述的对象。（打个电话给总台，叫他们吩咐一下现在在外头的人，让他们注意下附近有没有符合描述的对象。）”\n\n诚然，尊老爱幼，扶助弱者不仅对警队公众形象有帮助，道德上也无可指摘，但是多半时候都是无用功。一半的失踪者最后被发现时，是自己返回了家中，而极少数人，则再没有关于他们下落的报告……\n\n“屌，所以话只有唔到五成可能性我地宜家做滴野系有用的……（操，所以说只有不到五成可能性我们现在做的事是有用的……）”，他叼起一根烟，点燃，默默吐出一口白雾。\n\n但每当想起那些被证明是有用的工作，那些一度浑浑噩噩的人和他们的亲人重逢的场景，好像这一切又成了无法从功利角度衡量的伟大事业。"
 DOP_GNG_event.46.a: "也许警察本就应该是民众的拐杖？"
 DOP_GNG_event.47.t: "无人知晓"
 DOP_GNG_event.47.desc: "“你话每个星期佢地都来你地铺头偷野？（你说他们每个星期都来你的店里偷东西？）”“没错！哩两个衰仔衰妹，连续偷佐几个星期噶啦，今次我特登盯实佢地，终于俾我捉到佢地！（没错！这两个臭小子，连续偷了好几个星期了，这次我特别盯着他们，终于被我抓到他们了！）”\n\n回头看向那两个“衰仔衰妹”，应该还不到初中毕业的年纪，而且都长得极其瘦小，张嘉文内心思绪万千，他回头看向店铺老板，“喇，先生你唔好劳气住先，等我地带佢地两个返差馆查清楚缘由，再答复你好唔好？（这样，先生你先不要这么生气，等我们带他们回经书查清楚缘由，再给你一个答复，好不好？）”\n\n好不容易安抚好老板，把两个孩子带回警署，询问和人口档案搜查的结果却让生活安全课少年系的警员们陷入了沉默。\n\n“抑即系话，宜家你地阿爸阿妈都唔想照顾你地？加上屋企宜家仲有两个细妹？（也就是说，现在你们爸爸妈妈都不想照顾你们？你们家里还有两个妹妹？）”，经过再次确认后，经过再三思考，他们还是想不到有什么办法。\n\n“首先肯定系要同财务果边讲声，我地贴钱报销店铺滴损失，只但系哩四个细佬点算？没理由等佢地一直系差馆噶？唔通丢佢地返去街口？咪眨等佢地继续搞到七国咁乱或者饿死？（首先肯定要和财务课那边沟通，我们倒贴钱报销店铺那边的损失，但是这四个小孩怎么办？不可能让他们一直呆在警署吧？难道把他们赶回街上，搞得鸡犬不宁或者饿死？）”一位警员站起身来，双手叉腰，好像已经对目前的局面束手无策了。\n\n课长摘下眼镜，“设立生活安全课既目的就系要等社区变得更加和谐、安全，青少年问题直接关乎到当下和未来的治安环境同社区氛围，系重中之重。我地一定要霖个办法，处理好当前的难题。（设立生活安全课的目的就是要促进社区的和谐和安全，青少牛问题事关当下和未来的治安环境和社区氛围，是重中之重，。我们一定要想个办法，处理好眼前的问题。）”\n\n“咁点算喔？上头就得把口，有咩问题仲系要我地自己揸主意。识得修滴咩高尔夫球场仲不如修滴孤儿院！（那怎么办？上面就只会动嘴皮子，有什么事我们就要自己想办法。只会在那修高尔夫球场还不如修些孤儿院！）”，另一位警员站起身抗议。\n\n“一唔系，送佢地俾果班左仔？佢地唔系有咩工人托儿所之类既咩”（要不然，把他们送给那些左派分子？他们不是有什么工人幼儿园之类的吗？），此时，一直默不作声的系长发话了，“唔好觉得我讲笑啊，我个仔果班同学，有几个就系果仲环境大噶。佢地应该会应承既。（我可不是开玩笑啊，我儿子的同学里面，有几个就是在那些人之中长大的。他们应该会答应的。）”"
 DOP_GNG_event.47.a: "这应该也算警民合作吧"
 DOP_GNG_event.48.t: "突击"
 DOP_GNG_event.48.desc: "香港的夜间，除了五光十色的霓虹灯夜景，还有城市阴暗角落那些大家心知肚明，却又无人点破的污秽，但今天，情况将有所不同。\n\n砰砰砰！“开门，警察！”门外传来急促且猛烈的敲门声，“点会有差人来噶？（怎么会有警察来？）”经营着这个地下妓院的老板心头一楞，这可不寻常，警察们一向都会对这些事情置之不理，除非你做的太招摇过市。\n\n“我地撞门噶啦哈？！（我们要撞门了啊？！）”见没有人前来应门，门外的警察随即使用了破门槌，巨大的冲击力直接将老旧残破的门锁撞飞出去。蜂拥而入的，是香港总区总部生活安全部风纪犯罪取缔课的警员。\n\n警员们手持手枪和警棍，催促着嫖妓的“恩客”们和衣衫不整的女人老老实实蹲在墙边，给他们挨个带上手铐。而指挥这次行动的高级督察，正和一脸谄媚地笑着却怎么都掩饰不了内心慌张的老板对话，“各位长官，额，我地应该没得罪过你地老顶，亦都没做咩过火的事吧？点解突然间要咁……高抬贵手啦，没必要对我地哩种……（各位长官，额，我们应该没有得罪过你们上司，也没做过过火的事情吧？为什么突然间要……）”“收声！”，督察直接打断了老板的喋喋不休，“组织性交易活动，你知不知道系可以入刑噶？（组织性交易活动是可以入刑的你知不知道？）”\n\n看到眼前的警官好像是认真的，想到可能面临的牢狱之灾，老板不禁有些急躁，“咁你地捉唔捉果班开夜总会同风俗店既黑社会同日本仔啊？（那你们抓不抓那群开夜总会和风俗店的黑社会和日本人啊？）”\n\n督察的眼睛微闭，像是有些愠怒，“唔好咁多野讲，老老实实跟我地返去！（不要多嘴，老老实实跟我们走！）”，随即给他带上手铐。\n\n在被警察架出去时，老板还在挣扎着质问：“答我啊！都系做一样既野，你地到底会不会理班黑社会同埋萝卜头？！（回答我啊！都是做一样的事，你们到底会不会管那群黑社会和鬼子？）”"
 DOP_GNG_event.48.a: "有时候你不能让屋子太脏乱，当然没必要太干净……"
 DOP_GNG_event.49.t: "警觉的眼睛"
 DOP_GNG_event.49.desc: "不知从何时开始，李骏发现，曾经一度成为席卷广东的违法犯罪浪潮，开始有了肉眼可见的衰退趋势。\n\n无论是报纸上的命案报道发生的频率，还是身边经历偷窃的人的减少，甚至是自己的弟弟妹妹在野球场上所见到的曾经三五成群的不良少年，也逐渐消失了。似乎广东的警务工作再次回到了正规，虽然由于战争带来的经济下行相关的社会问题和军火流入民间导致的暴力事件依然有待解决，但是警察们看起来并不打算任由事态恶化到十几年前的样子。\n\n更令人感到震惊的是，警察们开始进一步走近社区和大众生活，曾经困扰人们许久的公害问题、经济违法问题和那些不受管制的民间刀剑、枪支带来的威胁，如今都有了专门的警察去负责。甚至他们还会付出时间和精力去操心走失的老人儿童的问题？这在过往，尤其是十几年前可是想都不敢想的事情。\n\n李骏行走在广州的大街上，看着不远处的警亭中，那对搭档巡警，身着防刺服、腰佩手枪和警棍，身上还挂着看不出来有什么作用的装备，神态温和而又警觉地扫视着街道上那熙熙攘攘的人群和车辆。而他们身后的警亭里，似乎还挂着几张写有失踪人员和嫌疑人的相片和信息的纸。\n\n应该说有这样尽职尽责的警察监视着社会的一举一动，可能是一件幸事。但是李骏依然忍不住去想：那么他们会不会也把这份精力和专注，用在监视那些心怀不满的人，甚至是我们一般人上？"
 DOP_GNG_event.49.a: "警觉的守护者……抑或是看守者？"
 DOP_GNG_event.50.t: "《公共秩序警务手册》"
 DOP_GNG_event.50.desc: "被调到这个新的设立的所谓警备部的第一天，华人警长张振华就领到了一本黑色外封的小册子，以中文和日语双语编纂，书的封面只用中日双语写了两行大字：公共秩序警务手册。\n\n在警备部的工作与在其他部门很不一样，尤其是对于像他这样的习惯于开着巡逻车游走于街头巷尾的警员来说，一份几乎被体能训练与技能培训排满的时间表几乎是从人间掉进了地狱。\n\n“屌，我就知署长个扑街笑吟吟地来通知我话有人事调动实没好野。（操，我就知道署长那个混蛋笑咪咪地来通知我说有人事调动准没好事。）”，结束了一天的训练，在淋浴更衣室简单冲了个澡，他拖着酸痛的身体走向了家的方向。\n\n在家中刚坐下没多久，他便想起来：由于这几天都被高强度的训练安排弄得上班时间几乎没有工夫做别的事，这本小册子还没翻开来看过呢。想到这里，他拿出这本一直放在包里但却几乎没翻过的册子。\n\n“第一章：公共秩序警务的概念详解……”，都是些老生常谈的内容，培训的时候教官就已经讲过了，他继续往下阅览，“没瘾，都系平时就会同你讲既果滴野……（没意思，都是平时就会和你说的那些东西……）”。\n\n他粗略地翻阅着，翻到了倒数第三章，这一主要阐述着在应对公共秩序事件时，有哪些远距离手段可以采取，“嗯，烟雾弹，平时训练好似都有咁，用来打击对方士气或者遮蔽视觉……（嗯，烟雾弹，平时训练好像也有用到，用来打击对方士气或是遮蔽他们的视野……）”，再翻了一页，逐渐地，内容开始变得没那么“人畜无害”了，“催泪烟，塑胶子弹，哇，用到哩滴野就大剂了吧。（哇，催泪烟，塑胶子弹，如果真的用到这些那事情就大发了。）”\n\n当他看到最后一页时，他愣住了，这一页没有对该手段的详细阐述，只有序号与名称："
 DOP_GNG_event.50.a: "实弹枪械"
 DOP_GNG_event.51.t: "剧烈冲撞"
 DOP_GNG_event.51.desc: "“屌你老母盛田！”、“中华民族万岁！”、“劳动者自主！”\n\n差不多每个星期，在各大高等教育院校，激烈而混乱的事件都会反复发生：最近一次是在广州，一群由各校总学生会组织起来的激进青年，挥舞着旗帜、横幅和标语走上街头，声讨行政长官在战争时的决策、控诉我们赖以生存的资本主义体系下的社会不公。\n\n而今天的此情此景，只不过是我们当今社会日常的一部分罢了。\n\n嘭！嘭！嘭！碎石、钢珠还有各种零碎杂物如同雨点般砸在地域支援部队警员们的聚合物盾牌上，这显然无法对盾牌和它后面的人造成什么伤害。但是对于队列中那占了绝大多数的珠人和华人警员来说，却是对内心的拷问。\n\n“汉奸走狗！”、“法西斯！”、“盛田既契弟！”，这一声声怒吼，都在提醒着他们:他们在保卫一个在中日的上一场大战中站在日本那一边的政府。\n\n“哩个只系我既职责所在。（这个只是我的职责所在。）”，张振华不停地提醒自己，是啊，职责，想必那些特种联队的精锐，在参加北方的“维和”行动时，也是用这样的话语来麻痹自己的。“职责”、“恐惧”，是所有人用来逃避自己因为恐惧和自私，选择在战争中对不义视而不见甚至助纣为虐的借口。\n\n他回想起，战争时期，当未经审核删减的来自欧洲和北美的新闻报道讲述着那些骇人听闻、惨绝人寰的暴行时，无论是华人、珠人，还是那少数日本人，都为之撼动、愤怒或是沉默，既然连他们这样的吃着皇粮的人，都为所有人的沉默和为虎作伥感到不安，更何况面前的这些青年呢？\n\n几声沉闷的枪响把他的思绪从回忆中拽了回来，十余枚催泪弹在空中伴随着白雾划出的曲线，落入面前的抗议人群中，咳嗽声、叫骂声压过了减弱的来自盾牌与杂物碰撞产生的噪音。\n\n日裔总督察挥舞着指挥棒，“第1至4中队，前进！实行压制并逮捕！”。随着队形变化，持着大盾、圆盾的警员，挥舞着手中的警棍，向抗议人群发起了冲刺。\n\n张振华在短暂地一愣后，也向自己指挥的分队发出了指令:“去！”"
 DOP_GNG_event.51.a: "烟雾中，惨叫声、叫骂声、骨头断裂的声音不绝于耳"
 DOP_GNG_event.52.t: "破门而入"
 DOP_GNG_event.52.desc: "如果此时此刻，有一位准备出门丢垃圾的老人路过这条走廊，他一定会被眼前的景象吓得心脏病发作:戴着战斗头盔、防毒面具与降噪耳机，身着阻燃制服和防弹衣的持枪警员，正靠着两边的墙壁，严阵以待。\n\n带队的警长对手拿破门槌的警员点头示意后，随着一声重重的撞击声，门锁被直接撞断，门应声打开。一枚震撼弹被掷入室内，在一阵剧烈的爆鸣与强光后，手持冲锋枪的警员鱼贯而入，进入室内。映入他们视线的是四名捂着耳朵痛苦不堪的男子，其中一人目睹警员进入，在一阵急促的呵止声后依然试图把手伸向桌上那产自北方的步枪，结果被负责近卫的警员一发12号散弹当场击毙，两人见状破罐子破摔试图掏枪顽抗，也马上遭受了和他们那名同伙一样的命运。而另一人试图逃离客厅，却被另一名警员飞身扑倒制服。\n\n在搜查各个房间后，他们不仅发现了大量的赃物赃款和武器弹药，还有这群罪犯曾经使用过的土制炸弹，很显然，这应该交给CBRN及爆炸物处理部队来处置。而其他的，则是要交给刑事部和负责善后的同僚了。\n\n这是一次成功的突击搜捕，无论是作案工具、赃款赃物，还是嫌疑人都成功收入囊中，这得益于刑事部警员们的辛勤工作，也得益于新组建的应急初动对应部队的精彩表现，这支新组建的部队近来频繁活跃在广东的大街小巷，打击各类高危险的犯罪活动。像今天这样的突击搜捕行动，只是他们工作日常的一小部分。"
 DOP_GNG_event.52.a: "保护羊群，对抗狼群"
 DOP_GNG_event.53.t: "中央集权的警务模式？"
 DOP_GNG_event.53.desc: "“所以说，这个公安处，和一般的警务部门差别很大啊……”\n\n带着一丝意味不明的笑意，盛田昭夫扶了扶眼镜，将手上的公文纸放下，看向面前与他一样戴着眼镜的中年男人，“真是，就单凭纸面上的运作模式来看，都让人看了就感到有些毛骨悚然。”\n\n“诚然，与一般的部门相比，他们太集权了，甚至可以说是完完全全的从上至下而不带一点地方分权色彩。”，警务处长大森宽微微点了点头，毕竟，这个被称作公安处的新兴部门，光从它的运作模式来看，就已经让人解读出一丝极权主义的色彩。\n\n“设立在各个总区的公安部，完全听命于警务处总部的公安处……”，大森宽顿了顿，“公安处会直接绕过各地总区总部和一般情况下的任何中介人，直接对各公安部下达指令。可以说，各地公安部与总区的从属关系仅仅是个幌子罢了，他们就是中央集权的国家权力的直接延伸。”\n\n“就连财务这方面，也是不折不扣的集权啊。”，说话的是财政司司长何鸿燊，“一切预算、开支直接由财务处负责，说实话，我也完全看不出来这个部门有任何的地方属性，完完全全就是金字塔式的自上而下嘛。”\n\n“这是因为他们的性质特殊……什么公安处，说白了就是秘密警察嘛，跟本岛的特高警察简直是一个模子刻出来的。”，大森带着像是无奈，又像是自嘲的笑，“但不管怎么说，这把锋利的匕首，是握在我们手里的。”"
 DOP_GNG_event.53.a: "一切为了国家？"
 DOP_GNG_event.54.t: "非常手段"
 DOP_GNG_event.54.desc: "“你确定要这样做吗？三井副处长。”\n\n半泽助理处长手持一叠文件，正襟危坐地坐在公安处处长三井镇彦对面，“从本岛的中野学校聘请教官来指导“樱”，虽然我本人对此没有异议，但是让帝国陆军的军人如此深入参与公安警察的运作，这要是曝光出去，恐怕……”\n\n“这都是为了训练“樱”，你知道的，非常任务需要非常手段，让帝国陆军的那群……给我们最精明能干的小伙子们教授他们的技术与理念，这可谓是再好不过了。更何况，这在政治上，也有好处不是吗？无论是对内需要，还是安抚东京方面。”，三井副处长倚靠在办公椅上，双手手指交叉，“为了掌握一切可能对国家的稳定与未来构成威胁的事物的情报，我们就要跳出一般警务工作的思维范式……”，他像是对半泽阐述如此决定的必要性，又像是在自言自语。\n\n“我明白了，那么，我会和外交司方面协调，让他们出面协助我们。”半泽助理处长深深地鞠了一躬，准备转身走出办公室时，三井叫住了他。\n\n“哦对了，切记，让一课和外事课警惕一点，我们可不希望有什么脑子发热的过激派或者一些不怀好意的朋友，知道我们要推进的计划并大肆宣扬，这样我们会有大麻烦的，好事者会把我们和宪兵队那群野蛮人相比较……”，三井坐直了身体，把手肘放在办公桌上，“这可是维系国家生存的大事。”\n\n“是的，当然！”\n\n“尾随跟踪、潜伏监视等等，在今时今日的警务工作中已经是家常便饭，正常情况下的公安工作也就是在它们的基础上变本加厉罢了。但是非法入室搜查、秘密摄像和窃听，还有许多无法一一列举的显而易见属于违法犯罪行为的手段，如今却将以“国家安全”的名义，被授权于一小撮精干分子去堂皇冠冕地实行……”，行走在警务处总部的走廊上，半泽助理处长思绪万千，他想到了许多事情，尤其是在北方那苦寒之地发生的事情，“但愿我们不会重蹈覆辙。”"
 DOP_GNG_event.54.a: "警察与宪兵队的界限，越来越模糊……"
 DOP_GNG_event.55.t: "杀或被杀"
 DOP_GNG_event.55.desc: "“做哩行，最紧要迅速、灵活，仲有随机应变。（做这份工作最重要的就是迅速、灵活，还有随机应变。）”\n\n“你地以后可能要面对既对手唔系你地系初动应急对应部队既时候会撞到既果滴一心只霖住钱，佢地好少会搏晒条命。宜家唔一样，我地既对手，系好似今时今日系欧洲同中东既果瓣人咁，有好宏大既目标同埋坚定既信念，佢地可能会摞条命来搏。（你们以后要面对的对手不像你们在初动应急对应部队那时候碰到的那些一心只为了钱、很少会不要命的人一样。现在不同了，我们的对手，是好像现在欧洲和中东那些人一样，有宏大的目标和坚定的信念，他们可能会命都不要。）”，山崎警司拿着教鞭，用带着口音的粤语对着幻灯片滔滔不绝。\n\n“……从宜家开始你地唔可以仲好似以前咁，先劝降再开枪，见到佢地反抗或者只系揸住枪，你就直接怼霖佢地，唔需要考虑咁多。（从现在开始你们不可以还像以前那样，先劝降再开枪，他们只要反抗或者只是拿着枪，你就直接干掉他们，不要考虑那么多。）”\n\n“讲佐咁多，我希望你地有个心理准备：宜家我地系哩个部队，任务唔系拉人，而系防止有更多既人死系恐怖分子手上。你地从我地既命名，都应该听得出。（说了那么多，我希望你们有个心理准备：现在我们在这支部队，任务不是逮捕犯人，而是防止有更多的人死在恐怖分子手上。你从我们的命名上，都应该听得出些什么。）”"
 DOP_GNG_event.55.a: "有时候保护生命的唯一选择，是夺去另外的生命"
 DOP_GNG_event.56.t: "适可而止"
 DOP_GNG_event.56.desc: "如果说有什么话语可以形容现在总部刑事处的会议室的氛围，那一定是死一样的寂静。\n\n“相信诸君应该都已经对当下的社会状况有所耳闻，尤其是关于我们那些地下世界的朋友们的事情。”，警务处处长大森宽双手指缝合拢，凝视着面前的刑事处处长和来自广东各地总区刑事部的部长们，“我知道诸位在总部、行政长官和财委的支持下，已经竭力把恶性犯罪事件的发生率压回了正常范围，但是，近来屡屡发生的一系列黑社会组织的抗争事件，尤其是本岛来的极道的内部抗争，又让我们的努力化作泡影。”\n\n“仅仅是过去一周，一周时间啊！从湛江到广州，再到香港和汕头……对敌对帮派的枪击、纵火还有各类谋杀，这类事件已经发生了接近十几次。这些阴沟里的老鼠相互撕咬倾轧 受伤的却是我们！”，嘭的一声，只见大森一拍桌子，整个人从椅子上弹了起来，“诸君，我们过去曾经容忍这些杂碎躲在他们那阴暗的角落里守好他们的一亩三分地，但是他们却认为这是我们的让步，现在更是得寸进尺！过去我们曾经把他们踩在脚下，现在，我们一样能做到。”\n\n说罢，他拉开遮掩着身后的巨大白板的幕布，“新的警务改革将着重强化对有组织犯罪的打击能力，从今天开始，各总区刑事部有组织罪案搜查课将从刑事部独立，总部也将设立新的独立指导部门。”\n\n刑事处处长和各刑事部部长纷纷低下头去，毕竟，先不论这个决策事实上就会削弱刑事部门的势力，更是说明了总部对他们当今工作的不满意。\n\n大森没有继续说什么，只是默默盯着白板上那阐述着新的警务改革的拓扑图:有组织罪案对策处，而从这个总部的中枢机关延伸到各地的，则是设立于各总区的有组织罪案对策部，而从这些次级分支继续往外延伸的，则是针对各类有组织违法犯罪活动的专门下属部门。"
 DOP_GNG_event.56.a: "那些暴力团会知道谁才是最大的暴力机器……"
 DOP_GNG_event.57.t: "大事件"
 DOP_GNG_event.57.desc: "咔嚓，咔嚓，相机的声响与纷乱的询问声淹没了广州总区有组织罪案对策部部长刘建成，毕竟，这可能是有史以来广东最大一起查获毒品案，全广州，不，可能全广东的媒体都在聚焦报道这件丰功伟绩。\n\n“我知道各位市民对宜家我地警方取得既成果好感兴趣，但系工作有规定，我唔可以提供太多内部信息俾你地，但系我可以同你地讲，哩个绝对系有史以来广东最大既一单毒品走私案。（我知道各位市民现在对我们警方取得的成果很感兴趣，但是工作有规定，我不可以提供太多内部消息给你们，但我可以和你们讲，这绝对是广东有史以来最大的一起毒品走私案件。）”，他转头看向身后的制冰厂，身穿便衣的各部门刑警和身穿制服的警员正在进行后续工作，其中，还有许多来来回回地正在搬运一块块几乎与人等身高的冰砖的警员，而这些冰砖中，正冰封着一包又一包的可卡因，“我地既警察已经跟佐哩班人好长时间，亦都已经监视佐好耐，今日采取行动，获得了好大既成功。哩班人，以制冰既名义，将毒品冰封在冰砖入边，用运输冰制品的名义，将哩滴危害我地社会既垃圾，输送往各地。（我们的警察已经盯上这群人很长时间了，也已经监视了很久，今天采取行动，获得了巨大成功。这些人，以制冰的名义，将毒品封存在冰砖里，用运输冰制品的名义，将这些危害我们的社会的垃圾，输送到各地。）”\n\n“请问哩次事件系否同黑社会活动有关？（请问这次事件是否与黑社会活动有关？）”，提问的是广东放送协会的记者。“哩个暂时无可奉告，我地警方仍然系都搜查紧，但系若然有关联，我地势必会一查到底。（这个暂时无可奉告，我们警方依然在搜查中，但是如果发现存在联系，我们一定会一查到底。）”\n\n成为万众瞩目的焦点的，除了现正风头无量的刘建成部长，还有跪在工厂围墙墙边，双手被手铐铐在背后，头上套了黑色头套的30余名被逮捕的嫌疑人，而站在他们身边的，则是荷枪实弹，武装到牙齿的应急初动对应部队的警员。\n\n对于电视机前的观众来说，哪怕这些嫌疑人都戴了头套，也不难想象他们现在脸上的表情:他们当中罪行最轻的，也至少要在监狱里度过十年时光，而较重的，可能就要上绞刑台了。"
 DOP_GNG_event.57.a: "禁制令与黑手党？我得先看看日历"
 DOP_GNG_event.58.t: "斩首"
 DOP_GNG_event.58.desc: "警灯的闪烁将红光撒泼到了夜色里的街道各处，警笛的鸣响也吸引着好事者们的聚拢与围观？“又出什么事了？”，这是所有人的内心所想所问，但是当他们想要靠近一探究竟时，却被手持聚合物防暴盾牌的地域支援部队挡在外面，只能靠踮起脚尖、口耳相传来弄清楚发生了什么事。\n\n由暗蓝色制服组成的高墙后，是在应急初动对应部队的警员们的援护下，有组织罪案对策部对几个最为嚣张跋扈的极道组织，哦不，现在该叫暴力团了，旗下的“企业”办公楼的搜查行动。曾经不可一世的极道成员们被带上手铐，举起双手，在刑警们的押送下几乎是被推着走出大楼，然后塞进押送客车。\n\n如果说只有一处有这样的景象，那也许是某个极道头子实在没有眼力见，选择了与警方暴力对抗导致了自身的毁灭，但是，此情此景，正在广东的各个角落发生:凡是对行政长官和警务处下达的最后通牒报以蔑视态度的极道和三合会组织，都遭受到了报复性的扫荡打击。\n\n新出台的《有组织犯罪组织成员及其违法行为防止法》，俗称《暴力团对策法》为警方的行动提供了绝对的法律依据，被认定为有组织犯罪组织的社会团体无不受到了毁灭性的扫荡，甚至无需其他违法犯罪活动的证据，只要你被查明为该组织的成员，你就会面临刑事指控。\n\n在这一轮被称作“顶上作战”的扫黑行动后，那些选择拒绝政府最后的忍让的三合会和极道组织的头目都被逐一逮捕羁押，而依靠查获的线索，其他的主要成员也在后续的搜捕中陆续落网。"
 DOP_GNG_event.58.a: "地下世界的产物就应该老老实实待在地下"
 DOP_GNG_event.59.t: "守护者？监视者？"
 DOP_GNG_event.59.desc: "人人都在谈论着治安环境恢复到了战前水准、盛赞着警务处和行政长官的魄力与付出的决心，在旭日章的映照下，广东的街道上，无论是一般的违法活动还是刑事犯罪，亦或是黑社会活动或是政治颠覆活动，都被有效的遏制了。\n\n但是，警察是否也变得有些不一样了？\n\n眼界最浅的人会感叹每日日常可见的巡警们重新武装起来了，一度只挂着一根木制警棍的他们现在配备了现代化的装备与武器，这可与近十年前的那次改革截然相反。\n\n对社会的运作有着更深入的见闻的人，则更为之恐惧，在各个社会团体中，四处流传着警察正在监视他们的流言，更甚者直言每时每刻都有无数的报告通过电报和电话，直达警务处总部那深不见底的黑暗世界。\n\n如果，你实在走的太过于深入，那么，可能最后一层温和的外衣都会消失:有政治颠覆嫌疑的人员被以各种难以置信的轻度违法犯罪活动逮捕或被迫“接受搜查”、全副武装的特殊部队在半夜三更闯入一个又一个有破坏活动嫌疑的人或组织的巢穴，他们的面目与他们所带着的警犬一样凶恶可憎，但你却深知最好不要在他们面前展露出一丝不满。\n\n审阅着面前的来自警务处的白皮书，盛田瘫坐在办公椅上，望着洁白的天花板，他想到上一次如此大刀阔斧的警务改革期间，他曾经花大量精力审阅了来自北方那霜雪满天的满洲的报告文件，并决心不能让那样的事情在广东重演。"
 DOP_GNG_event.59.a: "但现在看来，可能自己只是比他们做的更体面和隐秘罢了"
 DOP_GNG_event.60.t: "海外贸易发展战略"
 DOP_GNG_event.60.desc: "在行政长官和政务司、财政司相关人员开会后，广东政府正式制定并公布了未来十年的海外贸易发展战略计划。\n\n该战略的核心是对胜利港——广东最大港口的扩建，这一项目旨在加强胜利港在广东对外贸易中的地位，同时提高其经济效益，并对基础设施进行翻新。\n\n此外，广东还将新建数个港口，为沿海居民提供就业机会的同时带动地区经济发展，同时起分担胜利港负担的作用，按照发言人的说法，这是为了“不让鸡蛋被放在一个篮子里”。"
 DOP_GNG_event.60.a: "广东将成为新的“海上马车夫”！"
 DOP_GNG_event.61.t: "另一半天空"
 DOP_GNG_event.61.desc: "“诶，李生！早晨啊！（李先生，早上好啊！）”\n\n“嗯，早晨。”\n\n说实话，李骏并不喜欢眼前这个满脸堆笑的经理，他那仿佛画上去的笑颜总让他感到浑身不舒服，像是回忆起来了什么事情，但是他一时之间却又想不起来了。\n\n这项业务本身也不是他的日常工作的一部分，但是现在他被抓过来临时顶板，“就当换下环境、见识多滴咯”，他的上司是这么说的。\n\n“神经病，工厂我见得少啊……（神经病，说的好像工厂我见得少了一样……）”，李骏在心里暗自念叨着，跟随着前面那矮胖经理的步伐走进厂房。\n\n“啦，如你所见呢，作为索尼同长江实业既合作伙伴，我地……（就如你所见，作为索尼和长江实业的合作伙伴，我们……）”\n\n李骏似听非听地点着头——反正重要事项都事先记在备忘录里了，这些没用的自卖自夸他简直不想浪费一点心机。\n\n直到一道身影吸引了他的注意力，“咪住，果条伶仔几大啊？（等等，那小子几岁啊？）”\n\n经理一下子愣住了，原本口若悬河的嘴巴也一下子变得有些磕磕巴巴，“哦，你话佢啊。佢18啦。（哦，你说他啊。他已经18啦。）”\n\n“呃鬼吃豆腐啊！（骗鬼吃豆腐呢！）”，李骏差点没忍住当场发作，自己弟弟15岁的时候都比这小子要高上半个头，但他只是默不作声地点了点头，他相信这只会是冰山的一角。\n\n……\n\n回到自己的办公桌前，李骏松了松自己的衣领，由衷地赞美了一下空调的发明者，但他的思绪又回到了那个闷热的厂房：除了那个孩子以外，还有多少孩子在那里、在整个广东还有多少孩子在他们理应享受自己的花季的时候，被繁重的劳动和恶劣的环境摧残？\n\n他不知道、也没办法管到整个广东的情况，但是至少现在，他可以让那个人形马铃薯吃不了兜着走。他在打字机的键盘上来回敲动，起草了一份关于自己见闻的报告。\n\n在办公桌的一旁，是他今早买早餐时顺带买的还没来得及看的报纸。"
 DOP_GNG_event.61.a: "“《劳动基准条例》修订案被送交立法会讨论”"
 DOP_GNG_event.62.t: "危险地带"
 DOP_GNG_event.62.desc: "坏消息，那些混蛋们暂时放下了彼此间的恩怨形成了同盟来抵制我们的议案，其中最受诟病的条款便是决策层面的强制性工会代表相关条例。\n\n松下抱怨着这对企业活力的破坏、富士通咆哮着这是“通往社会主义的临门一脚”，而日立？用脚趾头都知道他们会有什么反应。\n\n现在球又被踢回了我们脚下，也许这对于我们的国家来说还是太早了？"
 DOP_GNG_event.62.a: "1、让这帮趴在国民身上吸血的混蛋难受去吧。"
 DOP_GNG_event.63.t: "《劳动基准条例》修订案通过！"
 DOP_GNG_event.63.desc: "对于眼前的一切，盛田并不感到陌生：台面上的言辞攻守、台面下的金钱暗涌以及人际关系支撑起来的“跨派系合作”。正是这些肮脏的东西构成了广东立国的基础，但讽刺地是，这也是他推动这个国家向前迈进的助力。\n\n在不知道持续了多久的争吵和上一次见已经不知道是多久之前的冗长发言以后，随着修订案的最后一次宣读，他可以放心地向国民宣告：自己为他们带来了又一次的胜利，一次不亚于任何一次他以往的壮举的大胜！\n\n而就像任何立法一样，自然是有人欢喜有人愁：索尼系与长实系的议员们为这场不见血的拉锯战的胜利而欢呼雀跃、讥讽奚落着那些到坚持到最后一刻却依然一败涂地的保守派们。而后者只是一言不发，在苦涩中思考着在新环境下他们的对策。\n\n立法会大楼之外，被动员起来或自发组织的支持立法的集会人群中，已经充斥着“权力归于国民！”的呐喊，其中不乏有来自各高校的知识分子和学生组织。在那些相对比较“政治冷感”的各色工会的俱乐部里，可想而知是一片沸腾，即便是昔日被繁重劳动压得抬不起头来的“新移民”，也被这欢喜的氛围和可预见的更好的未来而面露欢颜。\n\n而工会的管理层们更是为他们话语权的空前膨胀而喜上眉梢，他们现在有了和企业主掰手腕的法律背景，这不管是对他们的钱包还是他们手底下的弟兄们来说，都毋庸置疑是件大好事。"
 DOP_GNG_event.63.a: "广东的经济由国民共有共治共享！"
 DOP_GNG_event.64.t: "放尊重些！"
 DOP_GNG_event.64.desc: "永野茂门的大名，稻叶是多多少少听说过的。抛开卷宗里“涉及日立政变一事”、“暴乱期间意图武力颠覆广东”那些他自己也不知道是真是假的罪名，永野最出名的恐怕就是劫持立法会一事了。尽管当时日本政府企图将其归为军官独走，但奈何盛田公布了所有证据，才让永野上了法庭。老实说，稻叶觉得这事还挺震撼的，比他单想着改组立法会激进太多了。\n\n随着电话线接通，永野的声音从话筒另一头传过来了。稻叶随即开始走流程——先问好，再稍稍自我介绍一下，然后把今天的议题提出来。今天无非就是弄清楚广东安保力量现状，然后希望永野和帝国陆军别来干预广东安保就行——他可不想宪兵队像十多年前一样胡作非为，然后把广东搞得鸡犬不宁。\n\n当他将议题叙述完后，他听到电话那头传来一声冷笑：“呵。行政长官阁下，这些问题不在我的职责范围内。或者说，你不应该自己去了解一下吗？”\n\n这下轮到稻叶发笑了。他上任第一天就让永野就安保机关现状给他交一份报告上来，结果永野别说让手下写了，连口信都没让人带一个，真把自己当铃木看了？\n\n“永野将军，你要知道对安保现状的分析对重塑广东秩序非常重要，你这么做对我的工作有很大困扰……”稻叶话锋一转，语气也变得阴冷起来。“就你现在的情况而言，我可不敢保证东京会怎么处理这事，特别是在文官、财阀、陆军和海军都不怎么待见你的情况下。”\n\n他清晰地听到永野骂了句脏话，随后是砸桌子的声音。这位将军就这么管不好自己的脾气吗？“听着，永野，你如果想报当年的仇，就照我说的做，咱们现在是一条绳上的蚂蚱。我需要你给我提供有关安保情况的资料，这样我就能剔除那些巨头在相关部门的影响；反之，你也需要我来证明你有能力作为‘首席顾问’接管广东防务——这就当我给你的好处。你现在能不能挤点时间出来，赶快把这事办了？不然等那五个家伙反应过来，咱俩后边事情都难办了。”\n\n电话那头沉寂了一会儿，随后永野无可奈何地说道：“好吧，我会让人把资料交过来的。”"
 DOP_GNG_event.64.a: "“很好，希望我们下次说话不那么……剑拔弩张”"
 DOP_GNG_event.65.t: "正当防卫"
 DOP_GNG_event.65.desc: "如果说台北峰会导致的那场造成数千万人伤亡、流离失所，且其余波至今为止依然萦绕在东亚大地上的战争对广东还有什么好处的话，也许就是臭名昭著的《广东-日本地位协定》的再修订了。如今，虽然日本帝国陆军依然驻扎着他们所谓的在广日本军，但是广东从此真正拥有了建设自己的武装部队的机会。\n\n但是……，当真正把这个一度触不可及的机遇握紧在手心的时候，其所蕴含的可能性与未知，以及所潜在的困难和风险，都让人为之激动、颤抖，以及恐惧……\n\n广东必须清醒地认识到：她几乎没有任何组建正规武装力量的经验，一个长时间寄生于日本的保护之下的企业之国，建立二十多年以来，已经养育了对战争一无所知的一代人，直到数年前的双日互相倾轧，才让先前人的记忆传承得以复活。\n\n也许，一直蛰伏于日本的阴影之下，从保守的角度来说是个明智的决定，但是，广东从不拘泥于稳妥与保守，我们将在修订后的协定允许的范围内，力求在军事领域取得与我们的经济奇迹相比拟的成就，成为共荣圈集体防务中不可或缺的一份子。\n\n当然，我们还有一个说不出的理由：那就是当我们仰望北方的处境时，我们亦注意到，我们身边的巨人，只要轻轻一动，就可能把我们推入相同的境遇。\n\n我们必须为广东确保一个安全的未来。"
 DOP_GNG_event.65.a: "Si vis pacem,para bellum."
 DOP_GNG_event.66.t: "新官上任"
 DOP_GNG_event.66.desc: "狭小的临时办公室，明显的仓促装修的痕迹，还有光杆司令一样的实权，这就是前任渔农自然护理司司长、现防卫司司长，赤城宗德先生所拥有的一切。\n\n他在想：是什么让那张公职异动辞令传到他手里？是能力吗？显然不是，他长期积累的在官僚机器巨塔中摸爬滚打的经验，几乎都来自于农林水产和环境治理领域，和防务建设这种对于广东来说属于新名词的领域完全没关系。思来想去之下，他唯一能想到的，就是那个在已经不存在的赤色北国中常用的词汇，来作为自己现在坐上这种“临时”冷板凳的原因：政治可靠，以及对他忠诚的看重。\n\n赤城笑了笑，看来行政长官实在不愿意冒着风险去选择一个在防卫领域的专业人士，因为这种选择极有可能只会导致三种结果：其人选结果得罪东京，抑或是反过来，其人选过于亲近东京，甚至可能有着自己的小算盘。\n\n倚靠在办公椅上，百无聊赖地把玩着手上的钢笔，赤城的思绪陷入了一阵像是冥想一样的空白中，让他回过神来的，则是一阵敲门声。\n\n“进来吧。”\n\n推门进入办公室的是一个年轻的珠人职员，赤城记得他，毕竟，草创不久的防卫司，人员规模和资源和其他单位相比简直少得可怜。那名职员双手呈上一份公文，“司长，这是行政长官的辞令。请您审阅，我先告辞了。”\n\n目送那年轻人走出办公室后，赤城戴上眼镜，开始扫视那份单薄而密密麻麻的公文纸。"
 DOP_GNG_event.66.a: "关于聘请退役日本军人员及对日防卫合作的报告？"
 DOP_GNG_event.67.t: "部门重整"
 DOP_GNG_event.67.desc: "《广东水系执法状况与水上执法部门改革方案简报》\n\n目前，由于战争带来的失业与社会秩序恶化，我国水上违法犯罪活动呈猖獗态势，每日都有频繁的水上走私与非法人口流通活动在我国水域及水道发生，而令人担忧的是，目前我国的水上执法部门极其分散且资源分布不均匀，大规模的警察部门拥有雄厚的水上警察资源，而较小规模的警察部门则可能根本无力建设有效运转的水上警察部门。\n\n这种情况必须被改变，而目前最为行之有效的方法，便是将水上警察从各地警察部门抽离出来，建立与警务处平级的水上执法与安全部门，而目前这一部门的建立草案规划已经完成。\n\n该部门将负责我国海域及内陆水道上的执法与安全工作，而为应对更为广阔的活动范围，新设备的购置与人员的扩充势在必行，这方面的报表亦已递交财政司。\n\n而必须提及的一点是，由于水上执法工作所应对的各类突发情况的危险系数将可预见的高于常规警务工作，对此有必要引入特化的执法装备与设备。"
 DOP_GNG_event.67.a: "海上保安厅将是遏制犯罪暗涌的安全坝"
 DOP_GNG_event.68.t: "与狼共舞……"
 DOP_GNG_event.68.desc: "“今天，是广东防卫援助司令部设立的首日，我作为防卫司司长，很高兴能与各位本岛的政府、军队同僚们在此会面。”\n\n站在演说台上，赤城注视着下方神色各异的本岛军政人员和广东政界人物，不禁感到一丝惊悚的凉意，如果他还在本岛任职，他根本不会有如此反应，但很可惜，他现在是日本的共荣圈合作伙伴国的防卫司长官，亦是广东在场的地位最高的代表之一。\n\n所幸，秘书为他准备的致辞稿并不冗长，这诡异的氛围并没有折磨他太久，他便回到了自己的席位上。\n\n接替他的是广东的权力顶峰，行政长官盛田昭夫。\n\n“正如刚才赤城先生所说的一样，我亦很高兴能在今天与诸位会面，更让我高兴的是，我们会面的原因，是防卫援助司令部的最终落成。这不仅是日本与广东进一步深化多领域合作的表现，也是台北峰会上，共荣圈所达成的伟大成就的进一步发展，是泛亚事业的无数个里程碑之一，也是下一个伟大成就的起锚点。”\n\n一番在场的广东人，包括盛田自己听了都感到内心翻江倒海的客套说辞后，便是庆祝晚会的正式开幕。\n\n就像本岛的鹿鸣馆一样，晚会少不了各式各样名贵的酒水、餐点，西洋和东方的古典音乐，还有绅士和女士们的舞蹈。"
 DOP_GNG_event.68.a: "……与魔同行"
 DOP_GNG_event.69.t: "触手可及的人力资源"
 DOP_GNG_event.69.desc: "对于警察来说，收到异动辞令，可以说是司空见惯、家常便饭一般的事情。罗岳阳本人虽然只收到过一次这种辞令，也就是把他调入特种联队的那张辞令，但他也在新训期间从前辈们那里听闻过不少异动的事例。\n\n但是这一次的异动，是整个部门的异动。\n\n“你话咩话？我地成班人要从警务处调到果个咩防卫司下属既陆上自卫队？（你说什么？我们全部人都要从警务处调到那个什么防卫司下属的警备队？）”\n\n听到这个消息的时候，他几乎夹不住手中筷子里那块炸猪排，“咁我地份当差既工点算？叫我地去当兵，话就易咯，当完之后没野做点算？（那我们警察的工作怎么办？叫我们去当兵，说的简单，当完兵之后没工作怎么办？）”\n\n“听讲话系会有相关安排喔。（听说是会有相关的安排哦。）”\n\n罗岳阳一边把猪排塞到嘴里，一边试图平复自己不安的心情，“最好系咁，唔系我实揸枪将做哩个决策既人……（最好是这样，不然我一定拿枪把做这个决策的人……）”\n\n到了下午，一份正式的通告被以书面形式传达，被张贴到布告栏上。\n\n而警员们最关心的，则是从那所谓自卫官身份退役后，自己该何去何从，所幸，上面的文字让他们都松了口气：自卫官退役后，可获得一次性的丰厚退役补助金。现就职于警务处特种联队或其他即将异动至防卫司下属的部门的人员，可在自卫官服役期满后得到转业保障，回到警务处继续任职。"
 DOP_GNG_event.69.a: "当然，资源不能用之即弃"
 DOP_GNG_event.70.t: "外行指导内行？"
 DOP_GNG_event.70.desc: "“你们这帮蠢货，这样的思路是根本行不通的！”\n\n“但是这几次推演的结果，都说明我们的组织模式和防御策略是有效的。”\n\n“他妈的，你们要么根本不是军人，要么就是连指挥一个师团的实战经验都没有，像你们这样一天天闷在实验室和书房里把脑子都闷发霉了的呆子，还有才能想出来这种东西！”\n\n如果说有什么人是观察研究军官团中的“中坚力量”——同时也是帝国陆军的骄傲们最讨厌的，莫过于索尼军事工业部门那些西装革履的技术专家，以及那些因为自己大胆的狂想而长期被冷落——现在被打发到这里的“少壮派”军官，他们缺乏对战争的实感和经验，却又喜欢在条令和编制表的编纂上对业内人士的工作指手画脚。\n\n如果说有什么是帝国陆军的老派军官团心中亘古不变的信条，那便是在部队构成中，战斗任务部队及其附属的战斗支援部分必须占有相当的占比，否则将很快在不断地损耗中失去战斗力。但是，很明显对面那群初生牛犊不怕虎的家伙，却对他们的信仰嗤之以鼻。他们认为，在当今的高烈度战争中，占比过高的战斗任务部队反而是一种畸形的发展模式，只会导致无谓的战损和物资消耗，而他们更青睐于提高战斗支援部队和所谓战斗勤务部队的占比，还要搞所谓的“诸兵种合成模式”，把像是直升机和多管火箭炮之类的乱七八糟的东西普及到陆军编制表中，甚至把目光瞄向了空军，由此延伸出了什么“空地一体战”的概念。\n\n“请诸位不要认为贵军是唯一在留心观察战争走向的团队，我们为了能够生产出更畅销且高效率的符合现代战争需求的产品，我们也有着作出自己的努力，也构思、模拟过它们的实际应用场景，因此，大可不必摆出这副模样来训斥我们。”\n\n“各位前辈，上一场战争的教训还不够明显吗？我们过去的组织模式根本无法对敌人的次梯队进行有效打击……不，我们甚至在忽视这一点，而结果就是每当我们达成了突破，就遭到对方的第二波次部队的猛烈反冲击，如果我们能做到及时削弱和干扰敌次梯队，就能有效阻滞他们的兵力集中……”\n\n砰！\n\n坐在对面的老派军官们咬牙切齿，想要用自己丰富的经验和军校中的学到那亘古不变的真理来驳斥这群纸上谈兵的家伙，但是，推演的结果却让他们有些缺乏底气，毕竟，他们切切实实是在己方拥有更多的部队批次，以及最重要的，更多的战斗任务部队的推演环境中，数次在对方那大胆的组织模式和战略布局上，撞得头破血流。"
 DOP_GNG_event.70.a: "沙盘上，仿佛能嗅到烧焦的血肉气味，以及钢铁燃烧的刺耳噪声"
 DOP_GNG_event.71.t: "海边一瞥"
 DOP_GNG_event.71.desc: "“老窦你睇！（老爸你看！）”\n\n半生以咸水为伴的老何顺着自己儿子的声音回过头去，“睇咩啊？边处啊？（看什么？哪里啊？）”\n\n“果边啊！日本仔又派新船过来啊！（那边啊！日本人又派了新的船过来啊！）”，小童抬起右手，指向海平面上正往陆地方向航行的几艘舰船，以及舰船上空伴飞的直升机。\n\n“屌那妈，死人嘎仔成日搞埋晒滴无谓野……（操你妈，该死的鬼子整天搞些有的没的……）”\n\n以上的场景，发生在了许多疍家人身边，毕竟军舰这种水上钢铁巨兽，无论在何地都足以引起一般人的轰动。但是，他们有一点搞错了，今天在广东的领海水域沿岸航行的，并不是在耀武扬威的帝国海军或是某个共荣圈伙伴国家的海军舰队，而是海上自卫队新购置的一批驱逐舰。\n\n这些驱逐舰将是海上自卫队的起点，也是广东防卫自主化的一个里程碑，目前，采购的2艘诱导弹驱逐舰和5艘驱逐舰的交付已经将近完成，而据各大滨海造船工业设施的从业者的只言片语般的流言，未来海自还将拥有一艘自主设计并生产的舰船，以作为广东军事造船业的开幕剪彩……"
 DOP_GNG_event.71.a: "小，但是极其坚实的一步"
 DOP_GNG_event.72.t: "开始的结束"
 DOP_GNG_event.72.desc: "“它，不，她，她太美了……”，透过镜片，振奋人心的画面映入盛田昭夫的眼中。\n\n船坞中，起重吊机运作的声响，钢铁焊接的呲呲声，好似在演奏着一组乐曲，其名为《重工业》。\n\n而在船坞的中心，是一艘已经将近落成的航空驱逐舰——“白云”。\n\n“这会成为广东军事工业的骄傲……”，发出赞叹的是他身边的李嘉诚，而后突然又低下头，谁也不知道他在想些什么，只能听到含糊不清的喃喃自语，陷入到自己的思绪中去。\n\n“这还不够……”，而莅临参观检查的代表团中，自然少不了自卫队系统中的顶峰之人，栗栖弘臣，他转过头，看向侧前方的行政长官。\n\n“先生，恕我直言，我们为海上防卫事业开了个好头，但是……”，盛田却打断了他，“我知道你想说什么，栗栖幕僚长。”\n\n而令人惊讶的是，盛田的眼镜后同样流露出一丝颇具魄力的眼神，“但是造舰是很昂贵奢侈的，尤其是在起步阶段，我们不能在学会行走之前就想要跑起来。”\n\n“当然，先生。”\n\n把双手搭在护栏上，面向眼前那可以载入广东史册的情形，盛田似乎有些颤抖，像是感动，又像是踌躇满志地狂想着一个新世界的可能性。\n\n“我希望有一天，我们可以完全站立起来，对那些荒谬，说不。”"
 DOP_GNG_event.72.a: "“而军事工业将是我们的腿骨。”"
 DOP_GNG_event.73.t: "未知深蓝"
 DOP_GNG_event.73.desc: "“在白云触手可及的距离，天空看起来会是怎么个模样？”\n\n现在，他可以给幼年时的自己一个回答了，如今他真的踏入了天际，映入视线的是一片深蓝、云白交织的旷野。\n\n机舱内，只有来自耳边的无线电那不曾消停的噪声，自己沉闷而急促的呼吸声，还有仿佛要从胸腔蹦出来的心脏的跃动声。\n\n后方传来的呼喊打断了像是沉浸在梦境中的他的思绪，“喂，张！你这蠢货，这么快就被天空给迷住了？”\n\n“抱歉，教官！”，他甩了甩自己的脑袋，不过从说话的口气听来，教官似乎并没有什么责备的意思，毕竟，这可是教练机上的这位年轻人第一次进入这个境界，进入这片未知深蓝中。\n\n自己为什么会加入这个什么航空自卫队？这可能是他这辈子都不会想到的决定，自己对天空的兴趣，是来自于在索尼航空工业部门工作的父亲，如果按照正常的人生规划，他应该会在大学中专修航空机械或电气电子领域，然后循规蹈矩地也进入某个企业巨头中去，去为他们生产民用甚至是军用航空器。然而造化弄人，当他在一贯熙熙攘攘的街头，看到一架漆印着青天白日徽标的飞机，像一颗倒地的巨树一样突兀地横在路面上时，似乎在他的内心，他就已经和此前的人生规划无缘了。\n\n而如今，回过头来，他已经走得太远，走得太高，已经可以俯瞰一度像壁垒一样的城市，只不过，是坐在那让他还有他的街坊们敬畏而疏远的日升之国的战争产物上。不过也没有别的路可走，方兴未艾的航空自卫队目前只能依仗这些舶来品。\n\n他侧过脸，看向萦绕在自己身边的云层和深蓝的天，霎时间，他好像有种想要把这一片天空握在手心的冲动，用广东自己的飞机。\n\n毕竟，这是广东的天空，广东人的天空。"
 DOP_GNG_event.73.a: "而广东的子女们也将倾尽所有保护她"
 DOP_GNG_event.74.t: "钢之穹顶"
 DOP_GNG_event.74.desc: "“我可以说，你们干的真不错，先生们！”\n\n赤城微笑着看着他手上的一叠报告，上面的报表无一不说明，航空自卫队的建设已经有了很明显的成效，他们在数次模拟演练中，都给予了来犯者，迎头痛击，不但有效地破除了敌掩护机群的牵制击退了攻击者，还对他们的核心——战术及战略轰炸机群造成了可观的杀伤，这都得益于各飞行队的精干技战术，以及地面防空部队对天空的敏锐且警觉的看守。\n\n“是的，小伙子们做的很好。本岛来的军人亦不愧是帝国海陆军航空部队之精英的名号，只不过……”\n\n“不过什么，栗栖先生？”，赤城看向身边这位出身于广岛的统合幕僚长，栗栖弘臣。\n\n“我不知道您可否听说过这样的话，赤城先生。”栗栖稍微停顿了一下，“孙子曾说，进攻即最好的防御。”\n\n“你的意思是……”，赤城有些发愣，他似乎能明白眼前的这位在自卫队军官巨塔中地位最高者的言语意味，但是又不太确信。\n\n“我的意思是，最好的防卫，可能就是摧毁敌人进攻的根基，尤其是对于来自天空的敌人。”，栗栖眯了眯眼睛，眼神中似乎是强烈的欲望。\n\n赤城低下头，他对身边的这位统合幕僚长的性格早有耳闻，尽管他并非什么狂热的军部支持者，但是其拥军观念却无时无刻不在显露着。\n\n而栗栖似乎也看出了身边这位出身农林水产的防卫司司长的思绪，“哈哈，没关系的。迟早你也会理解并支持我的，我相信这个国家，也相信这个世界会让我们做出此等决定，当然，是在我们翅膀硬了以后。”"
 DOP_GNG_event.74.a: "积极防御，还是先发干涉？"
 DOP_GNG_event.75.t: "意外之喜？"
 DOP_GNG_event.75.desc: "知识无价，但是获取知识有价。\n\n李文杰如今无比清楚这一点，作为他所在的中学的优等生，如果家境足够优渥，等待他的必定是任其遨游的高等教育殿堂。但很可惜，作为一个人丁兴旺，甚至可能有些过于兴旺的一个家庭的长子，高等教育对他而言似乎是一份无法承受的奢侈了，毕竟，他还能指望什么呢？父亲只是一个普通得不能再普通的装配工，而母亲只是一个百货商店的售货员，这么多年养活一大家子就已经废了大劲，好不容易熬到长子中学毕业，哪怕他们不说，李文杰也知道自己的责任，更何况，预科教育和高等的学费，对于家用都要精打细算的一家人来说，也是足以让他们喘不过气来的重担。\n\n回到家中，狭小的公屋仿佛在此时因为他低落的情绪变得更加令人窒息。他百无聊赖地从包里翻出一些自己的杂物，突然，他好像摸到了什么东西，一张传单纸？\n\n他回忆起来，这好像是中学毕业礼后，一些穿着自卫队常礼服的人在学校外面给他塞到手心的。他把因为折叠和挤压已经布满褶皱的传单拉开压平，上面是关于自卫队近来设立的军事教育设施：陆上自卫队士官学校的招生宣传。\n\n他随意地浏览着上面的信息，然而，很快，散漫的目光就变得炽热而集中，他好像发现了进一步接受教育的机会，四年学制，不仅无需学生承担学费支出，相反，还会收到来自防卫司的补助。而毕业绩点足够优秀的毕业生，还将有机会进入防卫大学，接受更高层次的教育。\n\n他高兴地从椅子上蹦起来，以至于楼下的住户一连用晾衣杆捅了好几下天花板。\n\n数个星期后，他狂奔在人行道上，街景与行人像走马灯一样闪过，他一路飞跑着，像是不知道疲惫和力竭，一路狂奔至家门前，打开家门，屋里的正等着他开饭的一家子见到他的模样，一时间竟陷入死寂。\n\n他急促地、贪婪地大口呼吸着。"
 DOP_GNG_event.75.a: "“阿妈，我得佐啦！（妈，我做到了！）”"
 DOP_GNG_event.76.t: "挽留能者"
 DOP_GNG_event.76.desc: "“阿强，你过来一下。”\n\n“做咩啊，小队长？（怎么了，小队长？）”\n\n在罗文强看来，这可真是怪事一桩，有什么事不能让陆曹和自己说吗？居然要让小队的头头——一个干部亲自来和自己说？\n\n“我哩度有个机会益你，你想不想升职，退役之前同埋退役果时捞多滴？（我这里有个给你的好机会，你想不想升职，退役之前和退役的时候多赚点钱？）”\n\n“哇，你咁讲法……有钱边个唔想赚啊。（哇，你这说的……有钱谁不想多赚啊。）”\n\n“不过事先讲明喔，你如果接受既话，就要系哩度留耐滴，最最最起码要留多一年半载，有没问题？（不过事先说清楚，你如果接受，就要在这里待久一些，最最最起码要多待一年半载，有没有意见？）”\n\n说着，王陆尉拿出了一份文件，罗文强定睛一看，这不是那个什么，什么来着……哦，陆曹培训课程吗？怎么？难道这帮家伙看上自己了，想要自己在这里继续发光发热？\n\n“培训时长大概要一个凌越，差唔多系每日都要成日上堂噶啦，搞掂之后你就升职做三等陆曹。如果仲想继续为国效力同升职，都仲有机会继续上埋下一轮课噶，点样？如果你肯既话，就同你写份推荐书。（培训时长大约为一个月，几乎是全日制课程，完成之后，你将被晋升为三等陆曹。如果你想要继续为国效力和晋升，届时也会有参与更进一步的课程的机会，怎么样？如果愿意的话我就给你写推荐信了。）”\n\n王陆尉顿了顿，而后才重新开口。\n\n“哩个都系上峰的要求，为自卫队保留精练分子，延长人员服役周期。（这个也是上级的要求，为自卫队保存精干分子，延长他们的服役周期。）”\n\n考虑到显而易见的薪资和退役待遇提升……"
 DOP_GNG_event.76.a: "“还惦我都唔赶住返警队（反正我也不急着回警队）”"
 DOP_GNG_event.77.t: "有钱能使人服鬼役"
 DOP_GNG_event.77.desc: "“繁荣进步既广东，需要精练分子，加入高度现代化既自卫队，为国家同国民服务。（繁荣进步的广东，需要精干分子，加入高度现代化的自卫队，为国家与国民服务。）”\n\n“删细滴声啦，嘈冤巴闭！（声音关小一点，吵死了！）”\n\n实际上谁都知道，电视的声音一点都不大，只不过，听起来无比刺耳罢了。\n\n韦世安默默地放下碗筷，叹了口气，选择了遵循自己父亲的意愿，或者说是发泄，把电视的声音关的小了些。\n\n说实话，他并不是不能理解自家的老头子为什么如此应激，《广东协定》塑造了地缘政治的边界和人文地理的隔阂，但是无法切断人心的连结。\n\n而在大东亚战争的硝烟落定之后，时常“北望王师又一年”的老头子，垮了，是的，尽管他还是能走能说能吃喝拉撒睡，但是，那在他的心里毫无依据，却又几乎不容置疑的真理，已经被现实碾为粉末，而当他听到电视广告里那自卫队的招募广告时，他的家人就知道，又要承受他的爆发了。\n\n“话又讲返转头了，真系会有人去加入哩个咩野自卫队咩？（话又说回来，真的会有人去加入这个什么自卫队吗？）”\n\n韦世安想到，如果说在大东亚战争期间保卫自己的家园算是在恐惧驱使下的违心的冒险，那加入这个“国家”的军队——尽管他们不这么称呼自己，又是什么呢？为广东国服务吗？那岂不是真成汉奸了……\n\n“但系，如果佢地肯俾够钱呢？（但是，如果他们钱给的够呢？）”\n\n当他转过头，瞥见电视上那还在放送的广告上，那对于一般人来说还是颇具说服力的薪资时，他的脑海中便蹦出这句话来，一个接近民政府统计的全国收入中位数的薪资，加之军营生活本就可以大幅节省个人开支，更别提退伍后的一次性退役补助金……\n\n那大概行政长官还是能找到一大群人愿意给他卖命的。"
 DOP_GNG_event.77.a: "毕竟士兵只是一个职业"
 DOP_GNG_event.78.t: "《华南武装力量发展趋势》节选"
 DOP_GNG_event.78.desc: "……\n\n而所谓“自卫队”的核心组成，就是其地面分支——陆上自卫队，结合来自我方情报外事官员及各信源的证据，我们推断其发展趋势极其令人担忧：\n\n如同它的命名一样，陆上自卫队的主要任务在于阻滞、并尽可能打败入侵的进攻者，而其设计与建设思路无疑也在围绕这一目标展开。\n\n……\n\n我方情报外事官员及情报机构所提供的照片与文字记录无不说明，这支部队似乎极度痴迷于被他们称作“机动防御作战”的战斗模式——并为止付出了巨大努力：对机械化装备的大批量采购、对远程火力的侧重，以及对战术空军与地空一体化作战这种少见的（在共荣圈内）思路的选择。\n\n……\n\n简而言之，他们认为这种对敌人第二梯队和纵深阵地与其部署资产的不断打击削弱，结合对敌第一梯队的主动防御，可以使得他们在有限的资源条件下与数量可能多于他们的敌人抗衡。而即便战斗环境或双方力量对比条件不允许进行机动防御，其似乎也展示出了依靠打击敌核心资产以削弱敌行动能力与空间的能力。\n\n而当势态扭转，他们有能力转入反攻时，他们的远程火力偏好与战术空军运用则依然意义重大：通过远程火力孤立进攻对象、打击其战略炮兵及防空资产，为地面部队和战术空军的运用提供便利，而战术空军和野战炮兵一样，起到杀伤敌人员、毁伤其资产，以及不可或缺的——打击其部队协同能力的作用。\n\n……\n\n尽管其思路显得大胆而令人印象深刻，但其现役装备大多采购自日本帝国陆军的军械库，但我们依然应该记住，对象国家具有不可忽视的军事工业设计与生产能力——这一点在多个大洲的战事都有丰富的案例记载。"
 DOP_GNG_event.78.a: "机密 复印号.257"
 DOP_GNG_event.79.t: "善意的合作……"
 DOP_GNG_event.79.desc: "“中国的诸君，大家好！\n\n我先介绍一下自己，我是广东自卫队统合幕僚长——栗栖弘臣，今日能够在南京通过电台广播，给中国的诸君致以真切的问候和诚挚的祝福，实在是鄙人的荣幸。\n\n不过我相信收听此频道的诸位大概不会是只是来听我与诸位寒暄的吧？诚然，我此番来到贵国的首都——南京，是华南联合戡乱作战的缘故。正如你们在电视电台新闻和报纸上所看到的那样，广东，作为共荣圈内一颗冉冉升起的新星、也是泛亚主义繁荣的证明，也在为捍卫我们共同的理想、价值观和生活方式尽着自己的力量。\n\n近日，陆上自卫队第2独立空艇团抵达贵国，与贵国的广大军民、以及共荣圈各国的忠勇之师一道，参与了对日前猖獗的赣州地带叛乱活动的打击。\n\n其中，第二独立空挺团表现突出，依靠其自身的特点和优势，在敌人盘踞的山地据点的后方出现，以迅雷不及掩耳之势将他们逐出了自己的巢穴，并一路乘胜追击，将他们赶入友军部队设立的伏击杀伤地带，最终将他们的主力消灭在了山野之中，使这群威胁诸位的同胞、乃至是身边的亲朋好友的身家性命安全的叛匪最终覆灭。\n\n……\n\n诸君，请回忆一下，泛亚主义的军事合作的伟大成就：我们摧毁了此前扰乱西南的龙云一部、将两面派分子高宗武和他手下所谓的“爱国主义者”赶出了南京，而今天，我们正不断地歼灭负隅顽抗的残敌，他们的活动范围与生存空间一天一天地变小，最终，他们将要像他们的前人一样，被东亚诸国和中国广大群众的怒火烧成灰烬。\n\n而对于那些依然畏畏缩缩地躲在山林里、洞窟里的叛乱分子，如果你们在聆听我的讲话，我给你们一个忠告：放下武器，走出山野，如果可能的话，劝服你的同伴和你一道向政府自首，任何人都有改过自新的机会，而我们很乐意给你们提供这个机会。但如果你们依然执迷不悟，幻想着能与历史的演进抗衡，那你们就大错特错了，我们的士兵会搜索每一片山林、每一个洞窟，摧毁你们所有的据点和交通站，就像我们的先辈们曾经做到的那样。”"
 DOP_GNG_event.79.a: "……恶意的接触"
 DOP_GNG_event.80.t: "衣食父母"
 DOP_GNG_event.80.desc: "嗒、嗒、嗒，皮鞋与军靴踏过锻造车间的走道，这座长期以来为广东的军火外贸提供“赠品”的工厂，其规模已经比初创时大了不了不知道多少——国家不幸工家幸，大东亚战争带来的长期的政府投资与订单让其生产规模与雇员规模都翻了好几番，且至今为止这些扩产部分都已经进入扩建周期的末端，数不胜数的150毫米炮弹从这里出产，之后要么提供给初创未久的自卫队，要么从胜利港输送到共荣圈甚至世界各地，其中还有不少会被消耗在华南华东的山野中。\n\n负责人咽了口唾沫，他知道，在广东的政治与经济逻辑中，像弹药工业这种依靠政府财政作为支撑的产业是异类中的异类，军工产业在过去几年的春风是一种不自然的现象，而如今防卫司和财政司想必是要来给这种不自然的现象喊停了，对吧……？\n\n“报告上说，你们一个月的产能大概是在三万发左右，是吗？”\n\n赤城的话语让负责人的身体猛地绷紧了，“果然……战争结束了之后，现在的广东已经不需要这么多富余的产能了……”，他想。\n\n“是的，司长阁下，这些都得益于我们的雇员的辛勤付出和生产技术的进步，现在我们的产能已经位居世界前列……”，说着，他看向了一旁的李嘉诚，这位华人背景的珠人财政司司长，也许他能理解自己？毕竟削减生产规模可就意味着制造失业，把一大群屁股还没坐热的工人赶出流水线。\n\n“很好。”，赤城点了点头，但他的眉头依然紧锁着——接下来该说坏消息了吧，“我们需要保持这个态势，充实我们的弹药存储。”，说出这番令人始料未及的话语后，他看向被切割整齐的钢坯，“钢铁就是国力，而炮弹……”，沉默片刻，“就是战力。”\n\n“我不是好战分子。”，自就任这个职位以来，赤城无数次如此告诫自己，但是他也不会天真到认为自己，以及自己效忠的这个国家，就可以高枕无忧了：大东亚战争的物资消耗统计报告上的天文数字至今依然刻在他的脑海中，其中弹药的消耗极为惊人，而北方的那群中国人，他们当时显然对自己的库存和生产能力有着不切实际的信心……\n\n“正因如此，所以政府将会维持后续的长期投资与采购额。”，说话的是李嘉诚，“而且老实说，你们离达成我们的乐观预期还有一段距离，希望在以后的合作中你们能超出我们的期望。”"
 DOP_GNG_event.80.a: "我们会像造螺丝钉一样制造炮弹……"
 DOP_GNG_event.81.t: "刺激脑细胞"
 DOP_GNG_event.81.desc: "“好了，我知道这在诸君听来有些痴人说梦，但是现在的事实就是这个样子，广东需要我们，她的保卫者们需要我们，所以我们要以非同以往的态度和投入程度对待手头的工作，明白了吗？”\n\n“我操……这帮当兵的到底知不知道自己在提出什么要求……”\n\n“我敢打赌这玩意在论证阶段就会花光我们所有的预算……”\n\n其中一人的抱怨被领导直接打断，“这会很昂贵没错，但是财政司和防卫司那边说，呃，反正他们的原话是：他们已经准备好了足够的空白支票，所以大家放开手脚干，不要有什么心理负担。”\n\n“什么玩意……把主炮稳定器整合进现有设计先不说，还要加强势态感知能力？”\n\n“什么叫要设计一款更为强劲但是更为紧凑的动力包？”\n\n“谁提出的这个指标？！紧凑设计的自动装弹机？不能对炮塔内其他乘员空间产生明显缩减？”\n\n众人传阅着手上的文件，摇头、晃脑、叫骂，还有……对外行人士的无知者无畏的怒极而笑……\n\n“这个本部汇聚了各个部门最优秀的大脑，我相信你们可以做到的……”，见到这副场面，项目本部的本部长一时间竟然都忘记了职场文化中的等级秩序，“别让我难做，也别让上面的那群人难做，好吗，朋友们？”\n\n“去你的吧！这可不是以前的小打小闹！”\n\n“就算我们真能达到上面的要求，想要做到让这复杂的排列组合不出乱子地运作也不知道要花多长时间去测试更新！”\n\n“是的，我明白……所以上面也提到了，参与项目的人员将得到的特别津贴与奖金……”\n\n“又想靠钱打发我们……”、“简直是把我们当神社了！”……\n\n“请诸位冷静一下！”\n\n……\n\n“我知道这些要求对诸位而言是有些不可理喻且缺乏尊重，但是，诸君，我还是希望你们能明白，我们是个很弱小的国家，我们如今的武装和周边的国家比起来简直是像婴儿一样年轻且瘦小，因而我们才需要给他们更强力的保护和支持，我们不能依仗压倒性的数量，而广东……以及索尼的精神，从来不是以盲目的数量去制胜，大家能明白吗？”\n\n……\n\n“能明白的话，就请希望诸君能够倾尽你们的才能与血汗，去为我们国家的未来保驾护航了，以上！”\n\n说着，他深深地鞠了个躬，利索地转身，头也不回的离开了这个宽敞，但也被无数广东最聪明的大脑挤满的房间。只剩下似乎被触动的众人，沉默无言。\n\n他关上房间的门，松了口气……"
 DOP_GNG_event.81.a: "“卧槽，还好我能说会道，把他们一下说懵了。”"
 DOP_GNG_event.82.t: "改头换面"
 DOP_GNG_event.82.desc: "经过实地测试，可以确定三三式装甲运输车已经满足我们设定的人员机动运输与基本保护等多项要求指标，且其引进价格与生产成本相对平价，综合来看是我方在此方面对外引进的产品的首选，但是其还有部分明显缺点，仍需我们进行自行特化改装。\n\n其中最主要的一项便是车载武备的提升，目前三三式装甲运输车依然使用一挺位于车体顶部的重机枪作为主要武备，这一点在此前的战争中已经暴露出其在火力支援方面的弱势，而军事工业部门亦已经提出了相应的特化方案，我们将采用一款由索尼重工部门设计的搭载了小口径机炮的遥控炮塔，经过论证，其安装与备弹等占用空间不会影响现有的整体布局。\n\n其次，便是其动力系统的性能同样需要提升，我国北方存在大量的山地，同时我们亦存在广西方向的部署与行动需求，因而，我们需要重新设计一款更为强力的动力包以满足我们的需要。\n\n最后，也是对于人员培训资源尚且十分紧张的我方来说，极其重要的一点，我方将对其差强人意的装甲进行额外补强，索尼重工已经在研究相关的外挂装甲包方案，这将极大降低此类车辆的毁伤率并提高乘员组与随车步兵的存活率。\n\n综上所述，确认引进该产品的生产线并投入资源进行特化升级在性价比方面将是极其优良的选择，且符合我方急需快速填充先进技术装备的现实需求。"
 DOP_GNG_event.82.a: "有时候你没办法尽善尽美"
 DOP_GNG_event.83.t: "鸟枪换炮"
 DOP_GNG_event.83.desc: "实话说，罗文强并不喜欢现在他的班组所乘坐的装甲运兵车，每次当它开动的时候，发动机总会发出令人不悦的异常噪声。不管是驾驶乘员组的机械师，抑或是后勤大队的维修中队的工程兵，都对这个问题抓耳挠腮，他们考虑过使用的燃油的问题、考虑过维修，但最后得出的结论则是：这玩意早在战争时期就受到人为损坏和维修，几乎不可能修复如初。\n\n而换掉这个东西呢？很遗憾，并不是一个可行的选择，大队本部并不愿意把这种无关紧要的士兵舒适度上的问题上报到旅团、以及更上一层的师团层面，这会带来许多不必要的文书工作——因为更换一台这种玩意需要至少师团本部级别的许可，因而只能作罢了。\n\n“听讲再过阵间我地就要派新车落来了喔？鉴定刘啊？（听说再过段时间就要发新的车辆下来了？真的假的啊？）”，下属的士兵贴在他的耳边问道，他耸了耸肩，他已经习惯了这种车内的交流模式，毕竟在如此噪声影响下，想要让对方听清楚你说的话也只有两种方式了：第一种便是靠大嗓门嘶吼，第二种便是这种悄悄话式的传音。\n\n他侧过头去，用尽可能大、却能保持最起码的体面的音量回答，“应该系卦，我听我系运输果边做既伙记讲话佢地哩排确实装紧车，但系唔知几时先至轮得到我地。（应该是吧，我听我在运输那边工作的伙计讲他们最近确实在把新车装上火车上，但是也不知道什么时候才能轮得到我们。）”\n\n“不过点讲都好，新车始终都系我地自己伙记同自己滴工厂入边整出来既，广东货既质量没理由输过班萝卜头。（不过怎么说都好，新车始终都是我们自己人和自己的工厂制造的，广东产品的质量不可能比鬼子造的差。）”\n\n但是刚说完，他便又将头侧到另外一个方向，看着脸色不佳——但明显不是因为晕车的山口陆曹开口道，“额，唔好意思，我唔系话紧你。（额，不好意思，我不是在说你）”"
 DOP_GNG_event.83.a: "“扑你个街。”"
 DOP_GNG_event.84.t: "我沿着江户川漫步，眺望西方的皇居……"
 DOP_GNG_event.84.desc: "盛田昭夫懒散地将自己整个人转回到办公桌前，办公椅发出的吱呀响动是此刻房间内唯一能听到的声音。\n\n“这么说来，我们干得不错，非常不错……”\n\n赤城接话道：“没错，我们不仅打造了一直捍卫广东的主权的强大的武装，还给共荣圈共同的事业提供了巨大的助力。有部分报道甚至认为，我们的自卫官们比本岛的军队士兵还要更为训练有素，而南京方面也向我们承认，比起日本人，他们的民众更喜欢我们的自卫官……”\n\n“嗯哼，然后呢？”\n\n“这都是自卫队的建设成就的体现啊，行政长官阁下。”，栗栖丝毫不掩饰自己的激动，“这就意味着，自卫队有能力和共荣圈最好的战士们比肩，甚至可以争取比他们做得更好！我看我们应该更积极一些，去参与共荣圈各国的合作项目，让他们都好好瞧瞧，一支真正的军队应该是什么模样……”\n\n然而盛田却打断了他的滔滔不绝，“你觉得，陆军省和海军省的那些人，现在有什么想法？”\n\n“这个嘛，我们的助力减少了他们的压力，他们应该会稍微轻松一些了……”\n\n“中华民国国军，国防现代化……”，盛田从办公椅上坐起身来，“你觉得他们忘记了吗？”这番话似乎点醒了依然沉浸在成就中的二人，“阁下，您的意思不会是……？”\n\n“我们和他们不一样，我们并不想掀翻这个棋局。”，盛田摘下了自己的眼镜，搓了搓鼻梁上那被眼镜压出的两道痕迹，“但我们需要做好准备。以防有人做出不理性的举动。”\n\n“客观事实上，我们今天所做的一切，就是他们的威胁，你瞧，他们正在失去对自己的傀儡的控制，不是吗？”，一声冷笑过后，盛田看向了一旁的墙壁上挂着的地图，上面刻画着的是东方的旭日所照耀的广袤大地与辽阔海洋，“《地位协定》带给他们的军事垄断成为过往云烟、关东军如今把控了华北，就连那些长期依仗日本、手头上没几支正儿八经的军队的国家，现在都能堂而皇之地参与共荣圈的军事行动。”\n\n“帝国的八纮一宇正在坍塌，诸君，那一天或早或晚，而我们需要为之做好准备，毕竟有些人可一辈子忘不掉他们的冒险。”，他将眼镜重新戴回到自己的脸上。"
 DOP_GNG_event.84.a: "倾听着变革的风声……"
 DOP_GNG_event.85.t: "光明再临"
 DOP_GNG_event.85.desc: "在长实和日立两家公司的技术支持下，广东的各电站均已恢复正常，整个广东除了一部分偏远地区外已经完全恢复供电。\n\n此外，在原本供电能力弱、供电不稳定的地区，我们也借此机会改造并扩大了电厂，改善了当地的供电情况。\n\n现在，广东的电力供应已经超过了战前水平，我们认为可以将电网扩大到雷州半岛和广西地区，加快当地经济建设。"
 DOP_GNG_event.85.a: "万家灯火再度被点亮"
 DOP_GNG_event.86.t: "资本归来"
 DOP_GNG_event.86.desc: "在得知广东已恢复基本稳定后，许多日本商人开始将他们的产业搬回广东，投资也随之而来。据财政司统计，日本在广企业数量已经回升到了战前的82％，而对广投资资金则较1972年增长了7％，许多日本企业家都表示，他们对在广业务发展前景非常看好。\n\n与此同时，国内珠人企业也着手开始恢复正常生产，复工企业已经达到了广东企业数量的97％，被征召的工人也基本回到了原企业继续工作。财政司已建议推动新一轮减税，鼓励企业全面恢复生产。"
 DOP_GNG_event.86.a: "广东的齿轮开始转动"
 DOP_GNG_event.87.t: "伟大创举"
 DOP_GNG_event.87.desc: "就这样吧，稻叶秀三把笔一扔，露出一个满意的微笑。在桌子上的可能是他这一生最伟大的作品——《产业重组与反垄断法》。\n\n按照这份条例，垄断将被视为违法行为，政府会得到拆分以五巨头为首的企业集团的权力，并且这些被拆分的大企业会按部门划分成一个个独立的中小企业——这意味着一旦这份条例通过，五巨头也差不多半只脚踏进棺材了。\n\n但是这份条例可不一定能通过，毕竟经过十多年的纵容和近二十年的发展，广东各企业直接早已形成了紧密纽带，牵一发而动全身。如果要一举击碎广东的利维坦，就必须先慢慢削弱他的力量，让他虚弱不堪。\n\n稻叶拉开抽屉，拿出五份档案，每一份上面都精心分析了巨头们的现状和应对方案。索尼和长实自然是最为强大的两家公司，只能想办法分而化之；松下的市场也不稳固，很可能会因为对索尼的攻势而受到牵连一同崩溃；至于富士通和日立，这两家公司本来也就是相对其他企业来说体量大一些，实际上也是外强中干。\n\n那么，就先从索尼和长实下手咯？稻叶露出自信的笑容，随即又拿出一张草稿纸，谋划着如何让索尼和长实从一个庞大的联盟，变成一群弱不禁风的虫豸。"
 DOP_GNG_event.87.a: "然后，他就能一劳永逸地解决广东的麻烦了"
 DOP_GNG_event.88.t: "紧急事项"
 DOP_GNG_event.88.desc: "“搞什么……”高岛领事一边嘟囔着，一边从繁忙的报告编写中抽出身来接电话。“是，我是高岛……什么？马上回东京？可是……好，我明白了。”\n\n电话那头是首相的秘书，他的语气让高岛意识到，首相很可能察觉到了什么。原本他还不打算在报告里边加这些内容，但现在的情况超出了他的预料。\n\n自从井深和盛田重修旧好后，研究院和学校就像从地里长出来的一样，渐渐扩散到珠三角之外的城市甚至是乡村；索尼和富士通已经开始合作推出新产品，在市场上赚得盆满钵满；广东的各部门已经开始大规模使用计算机，生产也逐渐自动化，各项经济数据持续走高。种种迹象都表明，广东已经不再满足于现状，它的经济和军事都在快速发展，依靠机器降低成本而用各种高新技术产业实现高利润，更要命的是以前这些会让大多数人不满的事，现在却因为教育的普及而被广泛接受——除了那些异见分子。\n\n倘若井深还是那个有野心的井深，那他恐怕有超过日本的想法，而盛田也可能赞成他，毕竟日本治下的华人已经连二等公民都算不上了，而广东却依然将他们视作“广东人”的一份子。如此一来，这次首相要见他的目的，恐怕也很明显了。\n\n当高岛登上专机回国时，永野也在飞机上。他也被军部召回，讨论广东的现状。“看来我们俩有同样的使命。”永野躺在座位上，看着面前忧虑不已的高岛。“你说，本岛是不是要作什么决定了？”“这我可说不准，总领事。但可以肯定的是，盛田的步子确实太大了，本岛肯定起了疑心。至少目前来看，帝国不可能直接干预一个自己承认的独立国家，毕竟这有损帝国声誉。”"
 DOP_GNG_event.88.a: "“但如果真要干预，那我乐意至极。”"
 DOP_GNG_event.89.t: "新手教程"
 DOP_GNG_event.89.desc: "这是神谷到税务局上班的第一天。自从稻叶秀三上台后，广东的官员因为背景审查被清退了不少。而新上任的官员大部分都是神谷这样的新人，用稻叶的说法，这是为了“让政府更有活力”。\n\n神谷本身什么也不懂。他以为自己的任务就是处理文书工作，但广东政治的复杂超乎他的想象，很快他就因为弄错了几份文件而被叫去了局长办公室。\n\n“神谷先生，为什么这几家公司的税款会算漏呢？”局长有些生气。“你这么一搞，可是在损害广东的利益啊！”神谷连忙鞠躬：“对不起，先生！我第一次上班，不知道该怎么做……”\n\n于是在局长臭骂了负责人事的官员一顿后，便让他第二天去参与政府的集中培训。当神谷到会场时，他发现很多人都是跟他一样，因为工作出错而被叫来培训的。待所有人落座后，一个老人走上台对他们讲话——是稻叶行政长官。稻叶勉励他们要努力学习，回到岗位上为广东作贡献，进而为帝国作贡献。\n\n随后所有人按部门分配到各个教室去培训。神谷所在的是财政司人员的教室，台上的老师据说是退休的工作人员。老师为他们讲解财政报表的元素、如何分析曲线走势、以及利用数形结合进行判断。“记住，作为财政司的工作人员，你们的数学要很扎实，因为你们必须跟图表和数字打交道！”老师在第一天上课结束时这么说道。"
 DOP_GNG_event.89.a: "“下节课我们要讲解广东的税收政策”"
 DOP_GNG_event.90.t: "无形的绳索"
 DOP_GNG_event.90.desc: "“……正因如此，我们制定了计划，即每位日本人出行时，都会有一名士兵保卫他的安全。如果是日侨聚集区，则会有一个连负责安保工作。”\n\n面前的军官面无表情地说出这一切，让良子感觉后背有些发凉。\n\n“好吧，军官先生，那么今天的采访就到这里……”没等良子说完，军官扭头就走。“额，那个……”良子叫住了他，但想说的话一时堵在了喉咙口。\n\n一旁的士兵盯着良子，军官也走了回来：“还有问题的话请快些问，我还有很多事要办。”\n\n他脸上依旧没有表情，但话语却比先前更冰冷。\n\n“我想请问，可以给我开个例外吗？”良子终于鼓起勇气提了要求。“您瞧，我是个记者……”\n\n“不。”军官的回答无情而又冷漠。“我们必须保障每一个日本人的安全。”\n\n“但我是个记者啊？有个当兵的在我旁边，人们都不敢靠近我！我难道只能采访日本人吗？”\n\n“女士，这是我们的职责，你的问题和我们无关，而且你应该配合我们，这样对我们都有好处。”\n\n良子咬了咬牙：“但我是珠人！你们没必要在我这花这么多心思！”\n\n军官打量着良子，随即扭头走开。“不行，女士。即使在广东政府那你是珠人，但我们可不认那些证件。”"
 DOP_GNG_event.90.a: "“而且，你也不可能真的当什么狗屁珠人。”"
 DOP_GNG_event.91.t: "林巧川和黄浩辉坐在一辆车上，黄浩辉的任务是去查封一些“不良资产”，林巧川除了实际的查封工作外，还要保护黄浩辉的个人安全。"
 DOP_GNG_event.91.desc: "两人开到一家工厂门前，黄浩辉跳下车，急忙进去扫了几眼，便贴起了封条。\n\n“喂，不再多看看？”林巧川仍在门口站着。\n\n“哪来这么多时间……我们还有十二家要查！”黄浩辉抱怨着将最后的几张封条贴好，随后督促着林巧川上车。\n\n“话说……这几家都是珠人的工厂吧？”林巧川问道。“嗯……你这么一说我才发现，好像真的全是珠人的资产……”黄浩辉翻着档案袋，这一现象确实引起了他的注意。\n\n“如果这真的是那帮当兵的批准的，那么……”\n\n拐过路口，是个红灯，他们不得不停下。\n\n“黄先生，你说这是不是……要对珠人动手了。”林巧川摇下车窗，点了根烟。\n\n“我估计不会……起码你还在警队，我也还在财政司……”黄浩辉虽然这么说，声音却小得几乎只有他才能听见。\n\n两人不约而同地陷入了沉默。"
 DOP_GNG_event.91.a: "绿灯亮起，汽车又开始飞驰"
 DOP_GNG_event.92.t: "有形的锁链"
 DOP_GNG_event.92.desc: "李骏看着厂房内贴着的那些宣传单，上面大多是日本人和中国人，甚至还有所谓“满洲人”的“亲善”图画。也有一些写着“泛亚共荣”之类的标语。他只感觉一阵反胃。\n\n没有人在意这些宣传，也没人去讨论。在绝大多数人看来，这些东西比盛田上台前广东政府的甜言蜜语还要虚伪。\n\n厂区内的大喇叭几乎每隔一段时间都会有宣传口号传出，每一次响起都会引起工人们的烦躁和不安。换作暴乱期间，这玩意儿早就被拆下来了。\n\n可惜，军队的枪口正抵在每个人的后脑门上。\n\n李慧和李晞的办公场所亦是如此。三兄妹每天一起下班时就抱怨那些刺耳的口号和让人忍俊不禁的宣传画，他们的父母也对此感到不解和可笑。一家人唯一感谢的就是他们没废除什么政策，除了气氛比铃木时期还要压抑外，日子终究没什么变化。"
 DOP_GNG_event.92.a: "熬一熬就过去了，对吧？"
 DOP_GNG_event.93.t: "巧妇难为无米之炊"
 DOP_GNG_event.93.desc: "财政司司长何鸿燊这两天快被折磨疯了，即使再怎么绞尽脑汁地想把曲线的下降速度再放缓一些，但事实摆在眼前，广东的经济已经支撑不起战争了。中国和日本本就是广东经济腾飞的重要金主，没了他们的支持，广东的经济崩溃是早晚的事。\n\n他绝望地把报告整理好，并在下午的紧急例会中交给了盛田昭夫。“……鸿燊，真的没办法了吗？”盛田感觉头皮有些发麻，他确实没想到何鸿燊居然能让财政撑这么久，也没想到撑不住后会崩溃得那么快。\n\n“没有。最理想的办法就是从我们的盟友那要点东西，但现在这个情况无疑是杯水车薪。如果要节流的话，我们就必须要把一个问题解决好，那就是取舍。”何鸿燊解释道。“现在我们开支最大的无非就是民生和军事，如果我们下定决心减少其中一个方面的开支，那就有希望保证赤字不会超出我们的控制范围。”\n\n所有人都知道现在的开支几乎都是最低标准，一旦进一步缩减开支，那免不了一些连环问题发生。“各位总裁，你们还有……”“别想了。”井深大打断了盛田。“富士通能给的钱都砸进来了，再给的话，股东肯定要找我算账。”\n\n一旁的松下也摇了摇头，他才帮日立摆脱了满业，早就元气大伤；李嘉诚犹豫了一下，还是摇头了。没人在乎驹井的态度，毕竟这家伙才刚刚“独立”，能维持好日立就算谢天谢地了。\n\n思索再三，盛田最终给何鸿燊下达了命令："
 DOP_GNG_event.93.a: "“我们要优先保障民生”"
 DOP_GNG_event.93.b: "“要先解决好军事问题”"
 DOP_GNG_event.94.t: "追根溯源"
 DOP_GNG_event.94.desc: "在政府成立了新的部门后，图书馆、博物馆和各种文化活动场所首先在珠三角开始兴建，刘苏在大学放假后的第一时间就去了广州市立图书馆——这里是广东目前最大的一座图书馆。\n\n作为一名历史系学生，她虽然在课上学到了很多知识，但有些老师也不知道该怎么解释，比如广东和中国的关系。\n\n按照广东官方的说法，广东国是在“日本协助”下从中国“独立”出来的一个国家，但很多逃亡来的华人和广东本地人都喊着自己“世世代代是中国人”，而历史课也着重探讨广东对中国的影响，却对广东和中国文化的高度重合闭口不谈。\n\n刘苏在图书馆里面逛了好一阵子，才勉强从角落的书堆中翻出一本图册来，上面画了中国各个时期的大致版图，并对相关朝代作了简要说明，看起来像是儿童读物。广东的图书有不少是民间捐赠，有这类书也不奇怪。但上面的内容却让她有些吃惊：从秦朝开始，广东就已经在中国版图内了，这意味着从广东成为中国的一部分，到1950年广东“独立”有两千多年的时间！\n\n在这之后，她又查阅了很多相关书籍，按照上面记载的内容，广东似乎从来就是中国的一部分，哪怕这块地区当年确实是一个独立的政权，两千多年的统治也足以让广东完全被中国同化，粤与汉两个民族也相互交融，合二为一。那么，自己到底是广东人，还是中国人？"
 DOP_GNG_event.94.a: "文化开始受到冲击……"
 DOP_GNG_event.95.t: "狡兔三窟"
 DOP_GNG_event.95.desc: "驹井踏入他全新的办公室，这地方至少比以前大了一倍，让他可以随心所欲地摆上一些让人感觉很古典的东西——比如他的大理石半身像。虽然在常人看来这多少有些奇怪，但在驹井看来这很完美。\n\n自他被日产和满洲委以重任，来到广东的土地上，作为一枚棋子对抗这一竞争对手时，他就想踩着几家巨企的尸体，坐上行政长官的宝座，然后反过来斩断满洲用来束缚他的傀儡线，成为广东的凯撒。不幸的是，他反而被索尼将了一军。此后在钢铁厂人质事件爆发时，他又坚持让日立的保安队处理。那之后的事大家都知道了。\n\n现在的他不再是以前那个“孤胆英雄”了，而且他靠着几句空话和一些表面功夫，就赢得了松下的信任，让他有资本参与索尼与松下的“新联盟”。实际上他也意识到，那些有经验的劳工和管理人员有多重要——大概是因为和满洲断了联系后，这些他以前视如粪土的东西都成了日立不可替代的宝贵财产。或许真像松下说的那样，让一个老练的员工或者比新培养一个员工值。\n\n但这不代表日立就要“变质”。驹井坐在他的新办公椅上，看着桌上摊开的广西地图，上面密密麻麻地插满了日立的旗帜。广西离广东近，运输方便，而且矿产开采和基建建设需求量大，对于日立而言算是个美差事。而且最重要的是，广西乃至未来日立要进军的西南地区，都有着广大的山区，这意味着只要日立将工厂秘密建在山中，哪怕广东政府派人来检查，他们也查不到这些工厂头上。这些人的人力成本就可以被节约下来，用于广东地区工厂改革的资金。嘿，他驹井健一郎可真是个天才！\n\n驹井起身走到窗边，望着楼下车水马龙的街道，露出了狰狞的笑。日立或许没有主宰广东的机会，但不代表日立失去了上赌桌的资格。现在，驹井还能和盛田、松下称兄道弟，而当他们自废武功时，日立自会拨乱反正。"
 DOP_GNG_event.95.a: "戴上面具，踏入舞池"
 DOP_GNG_event.96.t: "新玩伴……？"
 DOP_GNG_event.96.desc: "“喂？哦，你好啊陈生，哩边滴野我地宜家处理紧，过阵发俾你。嗯嗯，系咁，拜拜。（喂？哦，你好啊陈先生，这些东西我们现在在处理，过一会儿发给你。嗯嗯，就这样，再见。）”\n\n应付完另一个部门的人，郑孙放下话筒，靠在自己的办公椅上伸了个懒腰，年近六旬，他终于有了一间自己的办公室。当然，这也让他付出了代价：在申请珠人身份和面临“有风险的就业保障”之间，他还是退缩了。\n\n他直起腰板，身体倾向办公桌，扶了扶自己的眼镜——这份几十年的书面工作带给他的终身礼物，开始操作起眼前的办公室新标配：一台16位的富士通产FACOM V-830系列个人计算机。\n\n他的指尖在键盘上来回跃动，打开了自己属下的工作组发来的文件，一手拿起一旁的咖啡杯，抿了一口已经温了的冰咖啡，“难饮……”，一边阅览着屏幕上显示的文档。他的部门的工作是对现有建筑物和工程方案的安全标准进行审查，因此，不管是为了自己的工作，还是出于自己身为“华人”的良知——如果他们还认自己这个“叛徒”的话，他都习惯于对工作格外上心。\n\n说实话，他现在还是对现在的工作模式有些不适，单一个从握笔到打字的事情，就让这个三十多年的老文员的办事手感有些古怪。但他必须承认，现在的办事效率提高了不少：数据的核对、分析和统计不再是繁琐枯燥的工作、信息的传达和共享也从未如此简便，而这一切都归功于无数台像他眼前这台计算机这样在各个政府办公楼里高频运转的计算机，以及将它们连结到一起的行政信息网络。\n\n但这并不足以冲走他内心莫名的忧虑和诧异，他还是能感受到自从他们的头号上司变了之后，整个工作文化和环境、甚至是整个广东都跟着变了。就从他身边的体验来说，这个季度入职的新人大打折扣，而那些已经年近退休的老家伙们则被赋闲到了二线甚至是不知道有什么意义的部门去让他们老老实实度过退休前最后的几年，而这一切，毫无疑问要归咎于眼前的“玩具”。\n\n所幸，他还不算完全与时代脱节，还能在这个部门为自己的同胞们发光发热。"
 DOP_GNG_event.96.a: "抑或是对手？"
 DOP_GNG_event.97.t: "休克疗法"
 DOP_GNG_event.97.desc: "松下的提议很危险，但也很诱人。按他的这个想法，广东只需要存在两个种族——日本人和珠人。在他看来，珠人就是被驯服的华人，对广东有着身份认同，也服从盛田政府管理。但是，盛田知道这个方案最致命的缺陷在哪：日本人在民族上的傲慢与特权。 的确，把所有的华人“改造”为珠人，能避免潮汕事件那样的“民族内歧视”，但日本人还搞特权的话，那依然会加剧民族矛盾。更要命的是，这种情况本就持续已久，日侨在广东早就形成了一个”国中之国“，他们自行其是，形成了稳固广东根基的利益集团，在广东的优先地位实难撼动。\n\n盛田又很快从档案堆里边找出人口报告，即使多年来广东人口持续增长，日侨占比却始终在10％左右。这些人即使在法律上被约束，在劳资关系上与珠人和华人取得平衡后，仍是广东国体制内的大型火药桶之一，他们明摆着的政治经济特权对于民族融合，民族团结的大业来说只能是百害而无一利。换言之，倘若只消除广东国的华人民族认同，但对日侨根深蒂固的日侨民族主义秋毫无犯的话，对于广东国也只能说是意义有限。\n\n想到这里，那个疯狂的想法在盛田心里越来越清晰。他如果要把华人和珠人的界限彻底抹去，那又为什么不对日侨也这么做呢？虽然他被自己的突如其来的奇想吓到而苦笑了几声，毕竟他如果真的把这个疯狂的想法放到台面上说，东京的政客和广东的高管们能够轻易地倾覆这个企业之国，但是——他也开始认真考虑消解日侨身份的可行性。这样一来，有朝一日他也许就能向广东人民骄傲地宣布，广东实现了真正意义上的“种族平等”。\n\n放下厚厚一叠手稿，他的手止不住地颤抖，《珠日平等附加条例》成为了行政长官笔下崭新的杰作。 通过它，广东政府可以继续保持甚至加大对每个日侨个体的优待，以保证日侨及立法会对民族新政的支持，甚至误以为我们站在日侨一边。但是，日侨这一名号将会通过“珠日待遇平等”和“珠人国族构建”等口号与政策被温水煮青蛙式地一步步切削，分化。盛田昭夫很清楚，为了广东民族的长久稳定稳定，起码要让这群吃肉的日侨小声一点，或许——未来的某一天，他们能够作为珠人敞亮地和其他人一同享受广东的璀璨果实，对吧？"
 DOP_GNG_event.97.a: "沉疴当下猛药"
 DOP_GNG_event.98.t: "新民生工程"
 DOP_GNG_event.98.desc: "尽管多年来我们一直致力于使我们的社会变得不那么残酷且无情，但是在这座霓虹巨塔之下，依然是深不见底的黑暗。每天每日都有新的失意者在攀登这座巨塔的过程中失足，从此坠入万劫不复的境地。现在，我们将开始思考如何兑现战前行政长官对大众的承诺了，作为我们国家转型的关键环节，我们必须对民政府在民生领域扮演的角色的定位进行细致的考量。\n\n面对需要精打细算的预算、霓虹巨塔顶端的大亨，还有那些对未来和生活抱以希望的人们，我们必须在其中做出权衡。\n\n谁付大头？\n\n“事情就是这个样子，如你所见，盛田长官。”，社会福利署的署长带着满面愁容，沮丧地靠在椅背上，从他垂头丧气的模样，就能对如今广东的社会保障事业的前景窥知一二。\n\n“恕我直言，我们在社会保障领域起步太晚，是从零开始构建一套需要涵盖全体国民的年金制度还有各种大大小小的扶助项目，这不仅对我们的财政预算来说是一笔巨大支出，同时也是一盘需要谨慎考虑的棋局。”\n\n盛田将眼镜摘下，从桌柜中拿出眼镜布细细地擦拭着那被水雾模糊的镜片，“你们说的没错，我们是在偿还世代性的罪孽，几十年的落差和忽视，如今需要我们去承担这份重压，而且我们不能选择逃避。”\n\n“所以我们需要做出抉择，长官。”\n\n盛田看着摊开在桌面上的光是看着就让人头昏脑胀的写满了图表的纸张，脑海中大致设想出了两种预想：\n\n一种与雇佣就业高度绑定的模式，依靠公共财政收支的基础性的年金及其他各类社会项目仅能提供极其脆弱的保障，更进一步的社会保障则需要企业或雇主和雇员共同承担其主要部分。\n\n通过广泛地扩展公共财政收支项目，建立主要依赖公共财政的社会保障制度，通过公共权力的参与，为国民生活提供更坚实的保障。但是，这样的改革不仅会带来政治上的压力，也意味着为民政府增添无法卸除的重担。\n\n第一种方案无疑是压力最小，也最容易实行的。更何况，促使各企业为员工着想，让员工产生对企业的归属感，构造劳资命运共同体，这也与盛田本人的经营理念契合。但是，仅仅把这种归属感与共同体拘束于一个个企业，而不是整个社会，是否又显得过于保守了，也许广东的未来正取决于大众的协力？"
 DOP_GNG_event.98.a: "1、“我们不能操之过急。”"
 DOP_GNG_event.98.b: "“我用了十年时间重塑了这个社会，我也不害怕再来一次。”"
 DOP_GNG_event.99.t: "止步与否？"
 DOP_GNG_event.99.desc: "目前为止，广东的绝大多数公共医疗保险受益者依然为退休老年人口及低收入贫困阶层，这在道德上是完全正确的，但是，现在的现实却为这种道德正确的“偏护”招惹来不小的抨击。\n\n“哪怕对于在我们的人口占比中占多数的城市市民群体而言，参差不齐的医疗服务质量和没有兜底的医疗支出，依然对他们生活的巨大困扰，早在战争之前，就已经有不小的声音要求我们进一步扩大公共医疗保险的覆盖范围，而到了今天，这些声音只会随着问题的不断暴露而愈发强烈。”\n\n手指摩挲着手上的茶杯，广东的护国公——盛田昭夫半卧在自宅的沙发上，那标志性的眼镜没有戴在脸上。\n\n“我晚些时候再给你们答复。”，这是他今天离开自己的办公室前，对一众卫生署官员最后的留言。显然，过往的承诺和广东的社会现实不会轻易放过这个已经六旬上下的老头子，也不会放过那精打细算的公共财政算表，打发走了社会福利署，现在卫生署又找上门来，天啊，这简直是……他抿了一口茶，看着眼前的那走马花灯一样的特丽珑屏幕，屏幕上的光景通过电信号可以让全广东甚至全世界的人看清，而眼前的老人却无法辨别、不，应该说无暇辨别上面的图像，是喧嚣的声音透过音响传遍室内，却传不进老人的脑海中，也是，他现在的大脑也是一团浆糊且疲惫不堪。\n\n现在摆在他面前的显然只有两个选择:第一，忽视掉这个问题，让自由市场解决这个问题:也许某一天，发达的私营医疗保险就可以为大众提供普世实惠的医疗保障。如果实在天不遂人愿，也能籍此作为缓兵之计，当问题再次不可避免地爆发时，才再做大刀阔斧的改革。第二，现在就做好准备和立法会上的百人众摊牌:广东的公共福祉又需要他们慷慨解囊了。"
 DOP_GNG_event.99.a: "1、“我们不能轻易对国民妥协，否则迟早有一天这会吞噬我们。”"
 DOP_GNG_event.99.b: "2、“国民已经传达了他们的意愿。现在是行动的时候了。”"
 DOP_GNG_event.100.t: "国民福祉与健康保险条例通过！"
 DOP_GNG_event.100.desc: "“诸君，我不知道如今你们脑中在想什么，也可能你们从未想过有一天我们会需要进行如此立法，但是时代变了，东亚已经变了，广东也将会迎来它的巨变。”\n\n民政府权力的顶点——行政长官盛田昭夫此时双手撑着面前的木桌，几乎是俯着身体，面容冷峻地对着会场中近百名议员开口道。\n\n“去你的吧，你这个蠢货。”，不出意料，最为强烈的反对来自富士通方面，井深大几乎是嘶吼般对着正在主席台上的盛田昭夫，“你是沉浸在什么劫富济贫的童话故事里面已经分不清现实与虚幻了吗？这么多年来，自由市场原则都是广东繁荣与进步的最大引擎，让企业家与投资人能够为了他们自身与社会的利益而不受束缚地在市场上交易，这是广东的立国之本！”\n\n“井深先生，我想你千万不要忘记，”，盛田的镜片中闪烁着冷静而又不容置疑的威严的光芒，“我们之所以今天还能站在这座巨塔的顶端，是依靠驾驭国民的恐惧、向他们许诺一个更美好的未来实现的。”\n\n“话虽如此，这对于企业和公共财政，都是一笔巨大的支出啊。”，提出质疑的是松下，“更何况，我们还要面临一眼望不到头的难民危机，这只会是一个越来越沉重的负担……”\n\n“相关部门已经做过演算，如此支出对预期的财政收支和市场走势不会产生严重的打击，相反，如果我们不兑现往日的承诺，后果将远比这些咬咬牙就可以承受的支出要严重的多。”，盛田站直了身，扫视了一圈诸大亨与议员，“我奉劝诸位能够理性权衡利弊，否则我相信大众会对谁是自己的朋友，谁是自己敌人有清晰的判断。”\n\n“混账，你在威胁我们吗？！”，一直一言不发的驹井似乎被话语中蕴含的挑衅点燃了怒火，而正当他还想再说些什么时，李嘉诚打断了他。\n\n“驹井先生，你可以尽管自己对号入座，但是到时候你的麻烦肯定是最大的。”\n\n驹井的脸色顿时变得更为难看，但是他却无法反驳。\n\n“请诸位投出真正契合自己，以及广东全体利益的一票。”"
 DOP_GNG_event.100.a: "一次有惊无险的虎口夺食"
 DOP_GNG_event.101.t: "建设公共邨屋"
 DOP_GNG_event.101.desc: "难民危机、人口的增长使得住房问题日益严峻且难以忽视，一座座贫民窟再次拔地而起，且预期内这个趋势将不断走高。\n\n作为大东亚战争的副产品之一，新一轮的住房危机无疑被套上了政治的外衣:华人难民占据了这些贫民窟人口的绝对多数，成为了一道道撕裂我们社会和谐与秩序的伤痕。更糟糕的是甚至有人想要在这些伤痕上撒上盐，他们私自搭建起危险且有法律问题的拥挤住宅楼，榨取着他们昔日同胞的最后一滴血汗。\n\n我们不能坐视这个问题毁掉我们长期以来维护秩序与稳定的努力，房屋司将设立新的机构，以制定和执行一个大规模、永续性的住房供给计划……\n\n优待人才？\n\n好吧，尽管这一次的社会立法并不会对巨头们的商业收支产生什么实际影响，但他们，尤其是井深那个家伙依然对为社会上的“浮渣”而徒增如此巨额的财政支出而心怀异议。但也许，除了语重心长的说教以外，我们还可以提出额外的条件，让他们能够从中得益，也许这样，他们就会对这个计划心生赞许了。\n\n在面向普罗大众的公共出租住房和补贴购置住房项目之外，增添专供中层管理及技术人员、知识分子的优质住房廉租及补贴购置项目，这不仅可以让我们的宏大社会计划得到各企业内占据相当话语权的群体的支持，更能吸引周边国家和地区郁郁不得志的人才为广东服务。"
 DOP_GNG_event.101.a: "1、不，增加额外支出太冒险了"
 DOP_GNG_event.102.t: "两个愿望，一次实现"
 DOP_GNG_event.102.desc: "全国公共住房条例通过！\n\n出人意料，而又意料之中。\n\n这就是盛田昭夫在看到立法会诸议员的反应时，脑海中所想:哪怕是历来反对声音最为强烈的富士通系议员，也对全国性公共住房标准化立法和阶段性公共住房大幅度扩建的整体没有太大异议，只是咬文嚼字一样针对其中一些条款的可行性和会导致的问题提出质疑。毕竟，只要不是双目失明，或是两耳不闻窗外事，就会对如今遍布广东的贫民窟社区群落与日益尖锐的租客与房东之间的矛盾感到迫在眉睫的威胁。\n\n“我想你应该很清楚，行政长官，你提出的这个所谓“十年建屋”计划，是我们从未敢于设想，逞论施行的政策。”，松下摩挲着手上的复印纸，“十年，在全国范围内建设五百万套公共住房……这耗费的财政预算将会是天文数字。”\n\n“财政司方面已经做过算表，在不发生不可抗力事件的情况下，民政府有能力在不改变公共财政收支项目的前提下为此提供足够的资金，算表在附件的第二页，诸位可自行翻阅。”\n\n尽管部分富士通系议员依然就他们那部分真切，部分生硬的怀疑对提案发起了攻讦，但往日与盛田针锋相对的井深，此时却一言不发，其他人甚至不能透过镜片后的目光 猜测出他现在在想些什么。\n\n在先后打退了来自松下系与富士通系的车轮攻势后，盛田将目光移向了驹井——以及与他一道的日立系议员，而他们那像是画作上的群像一样的神态，已经表明了他们无论如何都会抵制这项立法的通过，因此，对他们也没什么好说的。"
 DOP_GNG_event.102.a: "“广东曾是我的容身之所，现在也将继续成为其他人的容身之所。”"
 DOP_GNG_event.103.t: "沧海一粟"
 DOP_GNG_event.103.desc: "老孙在索尼工厂干了二十多年了，人到中年，总有疲倦的时候。虽然日复一日的生活让他感到无聊而又窒息，但好歹他是索尼的员工，而索尼向来注重员工福利——即使是安田危机和石油危机这样的大灾难，索尼也尽力确保不裁员，工资也比其他几家开得高，像现在这样风平浪静的日子，在索尼做工比在其他家做工好得不是一星半点。\n\n但他怎么也没想到，今天他要被开了。\n\n听到这个消息的时候，车间里所有人都以为这是玩笑话。直到带有盛田昭夫亲笔签名的通知书摆到了他们面前。“非常抱歉，各位。但富士通要求必须将包括我们在内的一百个车间按他们的想法采用自动化生产。盛田先生对此也表示十分遗憾，但如果我们可以顺利通过培训的话，或许可以作为机械操作和管理人员留下……”\n\n面前的官员话说得好听，实际上大家自己也心知肚明。富士通对机械的严格要求本就让这些东西操作起来极为复杂，而他们是一天学都没上过的所谓的“文盲”，更别提写什么编程之类的了。于是，包括老孙在内近一半的工人，只能垂头丧气地走出工厂，接受自己被裁员的命运。\n\n老孙失魂落魄地走在街上，他这个年纪本就比不上那些年轻人，而且随着北边难民的涌入，企业根本不缺底层劳动力。这也就意味着他彻底失业了。他看向不远处的富士通总部大楼，巨大的霓虹招牌上显示着蓝色的“富士通引领未来”的标语。难道所谓“自动化”的未来就是以他们这些大字不识一个的人为代价么？那他和他的家人又如何在这里生存下去？盛田行政长官又为何作出这样的选择？难道他以前一直是个伪善的人吗？\n\n老孙思来想去，觉得以前他对盛田昭夫的一切认知都被颠覆了。但现在，他还有一件重要的事要考虑。那就是在他这个家里唯一的顶梁柱丢了饭碗后，家里人的吃饭问题该怎么办。"
 DOP_GNG_event.103.a: "但在珠三角，面临这个问题的可不止他一人"
 DOP_GNG_event.104.t: "道阻且长"
 DOP_GNG_event.104.desc: "行政长官办公室中，盛田和李嘉诚、何鸿燊二人对坐着，但三人都一言不发。办公室里就算掉了根针都听得见。\n\n“呃……”盛田率先打破沉默。“我知道你们俩对今天这个局面……不太满意，但至少广东还在我们手上，咱们还能为广东的人民保驾护航。”李嘉诚叹了口气：“行了，还是进入正题吧，昭夫。”“好，那么第一点就是难民问题。”盛田拿出一张图表放在两人面前。“这张是对难民数量的最新估计。北边已经基本成了片白地，跑出去的华人为了生计又大量回流到广东——但是满洲也遇到了难民潮，老天，他们怎么想到去那种地方的？”三人不约而同地翻了个白眼，去满洲怎么看都是自杀式行为。“那你要我们做什么？”李嘉诚盯着图表，眉毛扬了起来。“你帮我通知松下、井深和……驹井，我们需要开个会讨论一下。”听出盛田的语气中有丝厌恶，李嘉诚知道他不愿意，但又不得不把驹井拉过来，只好点点头。\n\n“第二件事是民族问题。我没想过我们的所作所为居然会诱发这么严重的问题……现在珠人群体分化很严重，不少人呼吁我们帮助他们的华人同胞，而且一些激进派似乎倒向了极端组织。有时候我挺好奇那帮家伙为什么会接纳这群……汉奸？”听到最后两个字，李嘉诚和何鸿燊都感觉一阵恶心。“这个问题也麻烦政务司先去研究一下，毕竟这还关系到华人的政治地位——我们这可有不少华人公务员。贸然全面推动珠人化，恐怕会出乱子。接下来是……”\n\n“接下来我说吧。”何鸿燊打断了盛田。“经济上我们倒没什么问题，只是丢去中国市场的损失实在太大了，但关于新的市场我要和松下聊聊，要让外务司帮我们把把关。另外就是你好心接纳的那帮难民的问题。那些难民和大圈帮有不少来往，以至于我的手下没能搞定他们。现在大圈帮基本都逃到粤北，甚至逃出了广东。但据线人的消息，他们打算煽动难民的民族情绪来对付我们。”“那就是说后边可能要对难民动武……”盛田轻声念了一句，随即瘫在了办公椅上。“天哪，广东怎么成了这个样子……”\n\n李嘉诚站起身来，走到他身边，把手放在他的肩膀上轻拍了拍。“打起精神来，昭夫。全广东的人民就靠着我们了。就像十年前一样，我们仍需要为保护他们而和那些嗜血的日企作斗争。”"
 DOP_GNG_event.104.a: "“他们是你我最后的堡垒，我们不能放弃他们。”"
 DOP_GNG_event.105.t: "人世无常"
 DOP_GNG_event.105.desc: "“去他妈的，这帮家伙凭什么拆我们的家啊？”安川良子被面前的男人吓得往后退了一步，但她还是很快镇定下来，记录着男人话语的大致内容。“我们在这里住了好几年了，现在为了什么‘城市建设’就像1962年一样把我们赶走？”一旁的林巧川听着男人喋喋不休的抱怨，思绪又回到了十几年前。那年他帮一户新来的人家解围，他家的大儿子——如果他没猜错的话——好像在暴乱时期也和他见过，也许是那个李骏？\n\n林巧川沉思时，良子已经采访了三四个人了。这些华人从被赶到广州以来，就住在这座被称作“城寨”的贫民窟里。现在行政长官却下令拆除这些贫民窟，在他们看来这跟铃木时期干的事没有任何区别。正在这时，几名穿着西装的公务员走了过来，领头的人举着大喇叭对居民们喊道：“各位！这片区域涉及到新的开发项目，你们必须尽快搬离！请各位放心，我们会等到你们收拾好东西再……”“屌你老母！”居民们立刻围了上来，吓得有两个西装男瘫倒在地，用人们听不懂的日语骂着。\n\n“各位！各位！我代表政务司向各位担保，长江实业会负责你们的住房问题……”即使把李嘉诚的名号报了出来，很多人还是不愿意离开，有人甚至踢了倒在地上的两人几脚。“请不要攻击富士通的……”“他们是富士通的？”人群立马炸开了锅，纷纷上前准备和富士通的雇员们“讲讲道理”。还好，林巧川朝天开了一枪，才勉强维持住了秩序。\n\n在政务司代表同民众们谈判时，良子采访了另一位随行的长实雇员。“嗯……实际上，政府并无想把居民们驱逐出家、强制他们从事工作的打算，但这些贫民窟……无论如何都要被改造，而长江实业愿意为所有被征用了家园的人提供住处。”良子记完笔记后略加思索，开口问道：“那么，政府为何将开发计划全部规划在贫民窟聚集地区呢？”"
 DOP_GNG_event.105.a: "“抱歉，记者小姐，这恐怕要让富士通的人回答了。”"
 DOP_GNG_event.106.t: "又一届峰会"
 DOP_GNG_event.106.desc: "自从中日决裂以来，共荣圈峰会便停办了许久，毕竟东亚之主和几个主要国家都已经被折腾得筋疲力尽，忙着处理国内的主要事务，根本无心讨论什么“共荣”问题。\n\n随着共荣圈整体经济的复苏，高岛领事也给盛田带来了一个好消息，那就是下一届共荣圈峰会将在香港举办。作为亚洲最大的金融中心和最繁华的城市之一，香港绝对是向世人展示共荣圈的最好选择。\n\n会议如期举行，日本首相（首相名）在致辞中大力赞扬了广东在援助中国和推进共荣圈发展中的贡献，而这让满洲代表大为光火，但他们自己也知道华北地区的经济远不如华南地区。\n\n作为东道主的盛田昭夫则向世人展示了广东雄心勃勃的未来发展计划，芯片、新电子设备、全面城镇化……这些无不在放出一个信息：广东将跻身世界前列。但就在此时，台下的（日本首相名）却皱起了眉头。\n\n之后的经济会议上，大多数议题都有广东参与甚至直接由广东提出，与1962年铃木参加的泛亚经济会议截然不同。那时的铃木只能忍气吞声，如今的盛田却是扬眉吐气。\n\n在会议结束后，盛田昭夫在他索尼总部的办公室里开了一瓶香槟，站在窗边俯视繁华的香港，内心的自豪感油然而生，而登上游轮准备回日本的（日本首相名）则正吩咐自己的秘书，似乎有什么计划……但至少目前，除了首相和他的秘书，没人知道这是什么。"
 DOP_GNG_event.106.a: "而广东的未来似乎也渐渐清晰……"
 DOP_GNG_event.107.t: "子弹上膛"
 DOP_GNG_event.107.desc: "“真是有够操蛋的。”\n\n林巧川把烟头丢掉，随后指着面前地图上的一个红点：“这个点有人负责吗？”“报告督察，自卫队的人已经过去了，但他们可能需要点时间。”“没事，有人就行。”\n\n虽然当初也经历过治安战，但如今坐在指挥官的位子上，林巧川还是感觉有些头大，毕竟当初还能靠宣传怀柔政策来分化出不少人，现在在这些地方躲着的都是铁了心要反抗的，处理他们的唯一方式只有干掉他们。对于林巧川来说，这是个令人痛苦的差事。\n\n不过警务处的人大多和他有着同样的感受，毕竟现在的警队高层大多是珠人，有几个还是华人，他们都受了盛田改革的恩惠，自然对军队的命令心生不满，让他们参与镇压游击队也让一些人不愉快，因此他们大多数时候都避免爆发枪战，尽可能生擒游击队员。\n\n几小时后，林巧川带着自己的一队人前往西边的一个游击队据点帮忙，驻扎在当地的自卫队人手不足，被游击队偷袭，打得落花流水。他本以为现场会是枪声四起，但当他赶到时，在那里的只有堆积成一座小山的尸体、弥漫在空气中的血腥味和腐臭味，和一队穿土黄色军服的人——日本帝国陆军。\n\n日本人告诉他们，自卫队的人已经撤离，这里没事了，让他们赶紧离开。林巧川指挥队友往基地方向走，而当他们离开时，日军已经在尸堆上点了火，走在最后的林巧川隐约听到了两个日本人的闲聊："
 DOP_GNG_event.107.a: "“这村子应该没活口了吧……”"
 DOP_GNG_event.108.t: "虽笼中之虎……"
 DOP_GNG_event.108.desc: "“有什么消息，及时联系附近的驻军，好吗？”\n\n“好好，老总，慢走啊……”\n\n年过古稀的老人看着远去的军官的背影， 长出一口气，这是这个月的第三次扫荡，或者用他们的说法来说，叫“治安强化”。\n\n至少……他们不是日本人？他可不是两耳不闻窗外事的呆子，他从那些一度藏匿在村中的游击队员的口中听闻过别处发生的事情：日本人对“疑似存在敌对活动”的村落实施炮击与轰炸。\n\n一丝荒谬的庆幸在他的脑海中萌生：也许这就是结束了？一切的结束？不知道几时开始再也没有游击武装来到村里征募人马和物资，连绵不断的枪声似乎也已经沉寂下去，只有偶尔的来自天空的轰鸣和这些昔日“同胞”的来访——他们说那些在周边的山林里负隅顽抗的人已经溃不成军。\n\n老人拄着拐，侧目望去，是兴高采烈地分享着“兵叔叔”们带来的食物的孩子们，他们可太爱那些巧克力了。\n\n……\n\n“他们全部吗？一个都没剩下？”\n\n“是的，阁下，恐怕他们从一开始就知道我们想干什么。”\n\n“他妈的……他们不能就这样扣押我们的人，他们属于帝国陆军！”，永野几乎把桌面上的东西一扫而空，台灯落在地上摔得粉碎。\n\n“他们给我们两个选择：要么，阁下您亲自去跟大森宽交涉，表示一下歉意和合作的诚意。他们再把我们的人放了……”\n\n永野脸上的青筋几乎快要凸起：“什么？要我去向这群吃里扒外的家伙低头？告诉他们想都别想！”\n\n“……要么他们就会把问题公开，让外务省和陆军省来处理这个问题。恕我直言，阁下，您的举动一旦暴露，恐怕对您和整个共荣圈军事协作的前景都……”\n\n拳头重重地落在桌面上，赌徒必须咽下自己种下的苦果：尽管东京可能也和他一样不希望看到广东的武装力量不断膨胀，但是私自窥探泛亚盟邦的机密，只会让帝国蒙羞。"
 DOP_GNG_event.108.a: "……亦不可侵扰"
 DOP_GNG_event.109.t: "繁荣而又繁忙的港口"
 DOP_GNG_event.109.desc: "胜利港的扩建翻修工程完成后，港口吞吐量达到了原先的两倍左右，所产生的经济效益自然也比原先更大。\n\n在此基础上，广东政府又规划了胜利港周边地区基础设施改造工程，要求构建一个以胜利港为中心的交通网络，方便原材料和产品的运输，避免出现堵塞等情况。\n\n随后，财政司又宣布暂时减少各国对广东的贸易关税，从长远来看，这对广东的经济起到了极大的促进作用。\n\n现在胜利港的工人们工作量比以前大了不少，但不可否认的是，广东的发展离不开他们的汗水，他们流的汗越多，广东的发展就越快。"
 DOP_GNG_event.109.a: "而他们的生活也会越好！"
 DOP_GNG_event.110.t: "密会"
 DOP_GNG_event.110.desc: "“干杯！”两个玻璃杯碰在一起，杯中的酒因为晃动溢出，洒落在桌面上。“驹井，虽然你的手段有些……不光彩，但我们这下总算扳回一局。”\n\n坐在驹井健一郎面前的是松下正治，几个月前二者还互相看不惯，现在已经成了盟友。“手段倒是无所谓，毕竟在你们眼里，日立就是只会耍下流手段的公司嘛。”驹井又给松下满上一杯。“但今时不同往日啦，我现在和满洲那边已经彻底断绝联系了，这些黑锅可不能让我一个人背。”\n\n松下表面笑嘻嘻，心里直骂娘。本来日立政变就给包括松下在内的几家巨企打得够呛，石油危机时候还硬要冲进自家工厂无差别屠杀，直接导致了广东暴乱。松下为此损失了不少财产。但后来，驹井就像变了个人似的。井深才和松下闹掰，他就过来献殷勤，摆明了非奸即盗。不过松下没心思管他，他可没盛田那么锱铢必较，天天盯着工人福利、人民地位说事。松下只讲究利益，所以之前看到盛田改革带来的利益后，他果断跳了反。只是他想不通，驹井求的是什么。\n\n“那么……接下来你有什么打算？”松下试探性地问道。驹井大笑着回答：“利用我们在满洲的经验，可以让我们两家都赚得盆满钵满。抓住这个机会，松下和日立将成为比索尼还要耀眼的存在！”\n\n“满洲的经验……”松下在心里嘀咕道，但明面上还是与驹井把酒言欢。驹井的野心明显不小，松下的情报网显示日立在广东的产业或多或少都有了些福利上的改革，但随之而来的是工厂以各种名义大量迁移。盛田自然没心思去查这种反常行为，但现在看来，驹井的目的已然暴露无遗。不过松下现在跟他是一条绳上的蚂蚱，且此事几乎是公开的事实。所以现在决不能把他捅出去，否则松下在政治和经济上的资源都会因丑闻而受到极大损失。\n\n驹井走后，松下仍坐着一个人喝酒，但桌上多出了一个笔记本，上边只写了一段话：“盯死日立”。"
 DOP_GNG_event.110.a: "与虎谋皮"
 DOP_GNG_event.111.t: "大逆不道"
 DOP_GNG_event.111.desc: "在何鸿燊的印象中，内阁会议室的气场从未如此紧张而古怪过，啊，除了战争的气息扑面而来、大家都为自己的身家性命和广东的未来而焦头烂额的那个时候。\n\n至于是什么让这群身居高位者彼此之间互不退让，那便是行政长官试图推行的《国家公营事业条例》——不同于立法会十多年前通过的《地方市政事务条例》，这个新的立法尝试将允许广东民政府在国家层面设立并管理公营事业企业，而这无疑给广东的富贾们的带来了恐慌和忧虑。\n\n“让我再重复一遍，我推行这个条例仅仅是为了给我们接下来要做的事情提供法律依据，广东是一个法治国家，这一点相信松下司长你也明白。”\n\n而松下的脸上却丝毫不见退让的神色，“我明白你的意图，你想要让这个国家也从蒸蒸日上的矿产资源事业上获利，你的正派让人佩服，但是你是否想过这个立法意味着什么？”松下顿了顿，“你在给国家资本干扰自由市场提供通行证，这会给我们……给广东的市场活性和创新能力一记重拳。”\n\n“哦，得了吧。”，开口的是李嘉诚，“你很清楚我们为什么要这么做，我们，不，广东和它的国民都需要更多的资金，我们离走出这片烂摊子还远得很呢。”\n\n“我只是在表达自己合理的忧虑，而我相信不止我会这样想。”\n\n事实证明松下是对的，自他说出这句话后不到几分钟，一通电话就被打进了会议室。当一旁的秘书接起话筒时，他的神情顿时僵硬了，只是默默把电话递给一旁的盛田昭夫，而他接起话筒的一瞬间，就听到了井深愤怒的咆哮。\n\n“炮弹是把你的脑子震坏了吗？你这家伙，我知道你这家伙一直对广东引以为傲的企业自主权和市场竞争不屑一顾，但你这次绝对是太过分了！让政府的专断和暴政去取代企业的自然生长和经济的自然活动，这是社会主义！你这满脑子赤色思想的傻逼不配待在行政长官的位置上，收拾收拾就滚蛋吧！喂……”\n\n此时的松下则像是抓到了进攻的好时机，开口道：“这样吧，我们可以接受政府在这些收益上分一杯羹，但是要合理，而且不能留下让国家资本挤占市场的漏洞。我相信我们可以得出一个好的结果的，行政长官阁下？”\n\n而盛田则陷入沉默，手上捏着话筒，久久不语，而最终，他那镜片后的双眼再度聚焦在前方，对着话筒、也是对着松下开口。"
 DOP_GNG_event.111.a: "1、“你们说得对，我们都是为了这个国家着想。”"
 DOP_GNG_event.111.b: "“我不会在这个至关重要的问题上退让。”"
 DOP_GNG_event.112.t: "行政命令第387号"
 DOP_GNG_event.112.desc: "根据《广东国基本法》及相关法律授予行政长官的权力，我发布以下命令：\n\n近来的战争对我国及共荣圈诸国的经济活动与国民生活产生巨大冲击，由于供应链的断裂、外国投资的削减和中断、原材料成本的飙升和战时经济的转型，我国国民日前正面临着广泛的失业、物价高涨等困境，其中华人人口所受影响尤为严重。因而，我们应迅速向广大国民、中小企业及地区提供救济与帮助。各政府机关、地方政府及公共事业实体应在其职能及法律许可范围内竭力为上述群体提供帮助，纾解当前国民经济生活和国家经济活动的困境。\n\n财政司及相关下属机构应尽快研究并采取相关行动，以缓解当前我国国民消费能力不足的现象、维持国民基本生活，应以直接方式提高国民收入，并为失业人口及其他特殊困难人口提供保障性收入。\n\n财政司及相关下属机构应采取措施恢复我国经济运行，为我国广大的中小企业渡过难关提供必要的帮助，保障其收支状况的可持续性，以遏制日前的企业破产及失业率上升趋势。\n\n财政司及相关下属机构应积极作为以缓解国民失业状况，以扩大政府支出的形式刺激我国就业市场，及促进国家重建事业及公共工程事业的发展。\n\n财政司及相关下属机构应对此采取措施以保障在此困难时期，我国公共雇员及各相关民间志愿团体成员享有相应的权益待遇。\n\n劳工事务署应加大对劳工工作环境及工作待遇的监督力度，保障我国劳工享受《劳动基准条例》所保障的诸多权益，在处理劳资纠纷事件过程中应切实保障劳工合法权益。\n\n财政司及卫生署应强化协作，与各医疗行业实体沟通合作，在当前的特殊情形下，为我国国民提供基本的医疗服务。"
 DOP_GNG_event.112.a: "署名：盛田昭夫"
 DOP_GNG_event.113.t: "更进一步？"
 DOP_GNG_event.113.desc: "广工联的几位代表受邀与盛田和李嘉诚谈话。在工会问题上，广工联代表认为必须要确立工会独立于企业与政府的地位，避免工人权益受到损害。\n\n这个提议在暴乱时期恐怕还能靠对驻军下场或者革命的恐惧让议员们同意，但现在驻军、暴乱和南京政府都成了过往云烟，东京的影响力又导致财界派日益张扬跋扈，本身工会问题就很敏感，倘若再强调这一地位，恐怕立法会对这一条例将再无支持。\n\n休会时，李嘉诚向盛田表明了他的想法：“工会肯定要保持独立性，这一点毋庸置疑。否则的话，和不设立工会没有区别。”\n\n盛田当然知道由企业掌管工会的结果，松下、井深和驹井会直接把工会当装饰品一般，只在世人面前装个样子。但是直接提出独立工会，恐怕立法会不会同意。那么也许可以考虑一个国家管理的工会？这样可以打消一些人对于“工人暴动”的疑虑。"
 DOP_GNG_event.113.a: "不行，还是独立工会管用些"
 DOP_GNG_event.113.b: "工会由国家控制更保险"
 DOP_GNG_event.114.t: "布局"
 DOP_GNG_event.114.desc: "“所以你的意思是，我们可以把难民送往广西搞开发？”盛田看着地图上被红圈圈着的广西地区，而一旁的高岛则用手指在整个“中华民国改组政府”的领土上画圈：“不，是整个南方。你们可以把劳动力派往南方以援助重建。强调广西只是因为你们在当地有资源开发权和使用权。”听闻此言，盛田突然两眼一亮——这可真是个好消息！夏威主政广西以来，这一地区矿产资源基本都在反复的地质勘探中被发现、开采以用于军工产业，其产量在中国地区名列前茅。如果能接管广西的矿场，那就不需要过度开发广东的农村地区了，这对广东严重的农业问题起到了极大的缓解作用。\n\n“只是……满洲国也拿到了华北的开发权——整个华北，比你们广得太多了。当然，这和你们自身性质有关。”高岛扶着额头。“老实说，我不知道东京为什么还要给满洲这个效率低下的国家这么多东西，难道就因为它是共荣圈的长子么？也许是因为东京也不想花自己的钱来重建中国地区就是了。”\n\n华北地区？盛田虽然不知道华北有多大潜力，但他知道满洲也不是什么省油的灯。倘若掌权的有脑子的领导人，那很难说满洲的经济是否会凭这股好风直上青云。满洲的计划经济对这种需要政府命令的工作可有着极大优势。但计划经济自有其弊端，满洲不可能步步都走对，即使吃下华北这块肥肉也是垂死挣扎。就让满洲国继续颓废地躺在那钢铁和烈火铸就的王座上吧，广东将用电子管和硅晶创造未来。"
 DOP_GNG_event.114.a: "竞争仍在继续"
 DOP_GNG_event.115.t: "将解锁决议开发中国南部地区"
 DOP_GNG_event.115.desc: ""
 DOP_GNG_event.115.a: "……"
 DOP_GNG_event.116.t: "国情咨文"
 DOP_GNG_event.116.desc: "“阿晞，开电视啊，七点啦。”\n\n“哦！知啦。”\n\n特丽珑电视短暂地闪过一阵雪花，而后，映出那每日新闻的常客——立法会的面貌，但，这次不一样。\n\n李慧端着饭碗，李晞坐回到餐桌旁，李骏像是陷入了自己的回忆之中，一旁的阿爸阿妈只是若无其事般夹着菜。\n\n“诸位司长、立法会议员，广大的国民同胞们。我，共和国的行政长官，与往常一样在这里向你们传达我的问候和敬意，感谢你们日复一日为这个国家的付出，尤其要感谢我们的国民每日辛勤的劳作，以及那些为这个国家奉献了一辈子的人们。”\n\n李骏看了看自己的父亲，而这个已经退休的老家伙只是愣了一下，便继续动起手上的筷子。但李骏知道，他的父亲也知道，退休这个概念，如果放在二十年前，他怕是想都不敢想的，但这个劳碌一生的男人现在为他自己赚得了老来的清闲，这是他应得的，当然也离不开电视上那慷慨陈词的家伙。\n\n“我们脚下的土地，由生活在这里的每一个人耕耘。我们的国家不只有一种声音，我们当中有世世代代在这里生活的人们，有的为了追求更好的生活、或是免于各样的灾祸而来到这里的人们，我们将这里打造成供所有人生存的避风港，并对后来的不幸者伸出援手……”\n\n收音机传出的声音让安川良子那在键盘上敲个不停的手指刹那间定格，她是什么时候来到这里的呢？是二十多年前的那次风暴吧，它把父亲从自己身边夺走，又将自己甩到异国他乡……但是，她在这里找到了自己的一席之地，现在，不会再有什么东西可以再让她背井离乡了。\n\n“……而萦绕在我们国家上空的阴霾依然没有消散，族裔偏见和社会不平等孕育着下一场政治暴力。在这不到十五年的时间里，我们的国家就遭受了两次来自内部的重大威胁：而第二次尤其令人发指，依然抱有不切实际的政治愿景与民族仇恨的激进分子将我们国民中最脆弱也是最富有活力的部分当作他们发泄自己愤恨的目标。那些本该享有我们无法想象的未来的孩子们，却成为一场政治血祭的牺牲品，这我们将会、也必须永远铭记，不要忘记孩子们的名字，亦不要让他们的悲剧重演。”\n\n觥筹交错间，林巧川放下了装满啤酒的玻璃杯，一旁的下属和同僚们也无一例外地失去了脸上的笑容：这片刻的停顿让紧追在他们身后的昔日梦魇得以将他们扑倒，将那日的场景完完整整地在他们的脑海中重映，一遍又一遍，直到他们把黑暗和自己一同关进棺材里，否则他们永远无法走出那间粘满血的礼堂了——那能让自认为不近人情的人都提交调职申请的见闻。\n\n“……自我就任以来，我一直在恳求我国的国民，团结一致，不要让来自过往的阴影和仇恨在我们的社会构筑壁垒。历史给我们每个人都带来了不同程度但都不愿回顾的伤痛，己所不欲，勿施于人，不要再让痛苦扩散、传递下去。我尤其对我们的下一代抱以厚望，他们生长在这个复杂而又相互磨合的时代，其彼此之间的理解与包容，是过往任何时代都无法比拟的。”\n\n“我在此向各位国民，请求你们的帮助，帮助我完成这未竟的事业，助我扶持那些依然困顿而迷茫的人们，助我弥合一切割裂我们社会的沟壑，助我抚平历史的伤口，助我将这个国家的繁荣和进步延续……”"
 DOP_GNG_event.116.a: "“助我与你们一道，继续前行。”"
 DOP_GNG_event.117.t: "南腔北调"
 DOP_GNG_event.117.desc: "“新的语言政策一出台就面临着诸多非议，有人指出这是为了虚无缥缈的东西浪费时间和钱财，亦有人认为这种举措只是民政府为掩饰自身外交及内政上的道德困境所采取的伪善……”\n\n安川良子的手指在打字机的键盘上跳动，从潮州出差回来，到现在已经是深夜了，但是为了能让这份田野调查性质的报道第一时间出现在最新的《广东妇人公论》上，她还是选择了给自己加夜班。\n\n“目前，以汕头为中心的粤西地带及以韶关为核心的粤北地带，都已经开始广泛地将潮州语与客家语接纳入公共服务与广播当中，而相关政府部门的官员则声称：预计在将来，将会将这些地区的本土语言教育纳入教育课纲当中。”\n\n她跃动的手指停顿了一刹那，她的脑海中浮现出在潮汕的见闻：一群年逾古稀的老人，在树下收听着新闻广播，而她却几乎完全不知道那收音机所传出的声音究竟意味着什么。真是世道变了，她一个受过良好教育的从本岛来的笔杆子，却听不懂一群没受过什么教育的老人都能听的入神的广播。\n\n这是当然，她可没有去特地学过潮州话，而她也是第一次切实感受到广东各地文化的悠久——与根深蒂固，这群老人里面竟然没有一个人会说粤语或是日语！因为他们平日里根本不需要用到这两门语言就能正常生活！\n\n而当她想要开口说些什么时，也发现自己根本没办法吐出一个让对方听得明白的字词，最后还是要靠随行翻译和向导来与他们交流：“你们对这事有什么看法？”\n\n迎来的则是排山倒海的“旧时孬睬孬挈，今下正来假有心咩？”、“哎哟，往摆坐车净听广府话佮日本话喔。”、“几十冬来，外爿乜事啊，阮拢听无半句啊……”……诸如此类的抱怨。\n\n安川良子叹了口气，重新开始敲击键盘，纸张上弹出一串字句，“而根据部分疑似来自政府雇员的流言，为适应当下的人口流动状况，汉语官话也将在全国范围内被使用，以进一步为移民及难民人口提供便利……”\n\n毫无疑问，这是一种收买人心的做法，但是说实话，无论是从功利目的还是它的正当性上来说，它都显得那么无懈可击，她想道……"
 DOP_GNG_event.117.a: "“毕竟，语言就是你的故乡。”"
 DOP_GNG_event.118.t: "劳资关系协调条例通过！"
 DOP_GNG_event.118.desc: "李骏站在一栋大楼前，这是新的工会办事处。尽管工会这种东西本身并不新奇，但李骏还是惊讶于它在广东的出现。而且据说，这个新的工会是前广东工商联合会改组而来的。\n\n对这个组织，李骏的记忆还停留在1971年，那时候华人和珠人全在暴动，尝试颠覆广东的秩序。后来暴乱结束，华工委转入地下，成为了战时的游击队之一；广工联则成了一个被边缘化的群众组织，其存在感弱到连李骏都忘了他是其骨干之一。如果不是上司希望他能用这层关系来跑手续，在他们厂建立工会，他甚至以为广工联已经解散了。\n\n他花了一点时间找到相关负责人的办公室，然后很快就获得了批准。从那负责人给的指导方针上广东政府的公章来看，政府还挺鼓励工会的发展。只是工会开始和企业甚至政府作对的时候，政府会不会又出尔反尔？"
 DOP_GNG_event.118.a: "管他的呢，反正是他们自己的决定。"
 DOP_GNG_event.119.t: "劳资关系协调条例未通过！"
 DOP_GNG_event.119.desc: "盛田知道这个注意糟透了，但他没想到立法会反应居然这么激烈。日立代表明显一副想吃了他的样子，在那大吵大嚷着骂盛田是不是“被共匪灌了迷魂汤”。话虽如此，驹井却如同事不关己一般，从始至终都没说一句话。 代替他“冲锋”的是井深，他表示这和鼓励工人造反没什么两样，还大骂盛田是在把广东导向毁灭的道路，并要求收紧对劳动力的控制。虽然这也遭到了一些议员的质疑。\n\n松下罕见地炮轰了盛田的政策，他认为广工联作为暴乱时期的主要反对派组织，不能被予以信任。但在工会问题上，他却认为要“企业自行组织工会”，并且“受企业领导和监督”，这又让议员们陷入了争执中。\n\n即使李嘉诚和盛田麾下不少议员支持这项法案，但松下明显得到了更多的支持。"
 DOP_GNG_event.119.a: "他们到底在怕什么？"
 DOP_GNG_event.120.t: "新鲜血液"
 DOP_GNG_event.120.desc: "找个空地，搭几个篷，立块牌子，所谓的“人才市场”就这么开放了。盛田昭夫改革教育体系后，华人和珠人中的佼佼者们逐渐被发现，广东也终于摆脱了过度依赖日本工程师的情况。李晞就是这群人中的一个代表。\n\n今天，李晞顶着“项目工程师”的头衔来人才市场招人。这里全是刚毕业的华人和珠人，偶尔有本岛来的日本人，而招工的只有索尼、松下、富士通和日立，以及在他们庇护下的几家公司。\n\n“这时候我就挺希望自己是长实的人，毕竟他们业务和这些大企业不怎么冲突，也不用来抢人……”李晞旁边的青年人趴在桌上昏昏欲睡，现在已经是下午了，人群大部分已经散去，只有几个人还在排队等收简历。不过还好，这段时间收到的简历很多，大部分也是有才能的人，想必接下来一段时间，各大公司都会有新项目上马。"
 DOP_GNG_event.120.a: "那看来自己也要想办法跟上节奏"
 DOP_GNG_event.121.t: "……黑暗笼罩一切"
 DOP_GNG_event.121.desc: "施华很累，也很恐惧。自从那天来到工厂后，他们每天真的要工作16个小时以上，才能得到片刻的安眠。这日复一日的高强度工作让施华感觉全身神经紧绷，骨头和肌肉仿佛已不是他的一般，动的时候竟有一种不适应感。\n\n其他人也大差不差，体质弱一些的甚至顶着倒下去的冲动在工作。但老人和一些年龄偏小的孩子可没这种意志力——是的，日立甚至连老人和小孩都“雇佣”——他们的身体素质更不比年轻人。日立并不太在乎这些人是否还能工作，他们只知道这些人是他们的劳动力，理应由他们自由支配。\n\n施华所在的钢铁厂算活比较轻的，矿井虽然休息时间多些，但是是两班倒，而且只有班组达到指标了才允许换班。天哪，他们当初怎么就被日立骗来了？\n\n随着高强度工作的持续时间越来越长，悲剧终于接二连三地发生：最先是一个老年工人不慎掉进了铁水中，接着是不少人因疲倦导致操作失误，被机器弄断了手脚，再之后是因为“消极怠工”被监工叫来安保打到咽气……当初和施华他们一起来钢铁厂的上百人，现在只有二三十个还能正常工作。\n\n当又一个下午，施华等人还在工作时，他瞥见工厂外的数辆卡车，从车上下来上百人，被一个西装男领去宿舍。他看着那群人中的一个青年男子，仿佛看到了数个月前的自己。但现在的他早已骨瘦如柴、眼眶深陷，失去了往日作为一个“人”的模样。\n\n他看着那个男人，最终只能凄然一笑。在那些新人被领进钢铁厂、抗议他们被欺骗时，他看着下方的铁水，此时的他虽然无比精神，但还是向前倒了下去，在众人惊讶的目光中落入了铁水中。"
 DOP_GNG_event.121.a: "欢迎来到地狱"
 DOP_GNG_event.122.t: "忍耐，直至转折点"
 DOP_GNG_event.122.desc: "“……，以上。谢谢您的提问。下一个问题？”\n\n霎时间，会议厅中再次回荡起了此起彼伏的“行政长官阁下！”。\n\n……\n\n随着盛田将手指指向第二排的第四个座位，那名记者瞬间从椅子上弹了起来。\n\n“行政长官阁下，有诸多报道指出，接连不断的低烈度冲突和战争导致的严重破坏，不仅导致边境地带的重建工作面临超乎预期的困境，也使得其混乱局面久久不得平息。而社会上有关非法难民涌入的传言，更让公众相信目前我国边境地带已经陷入危机。请问您对此有何回应？”\n\n“关于边境地区目前面临的困境，政府日前依然在着手恢复其正常秩序，并正有序地对被破坏的地区进行重建，但目前我们面临边境危机的说法实在是言过其实。谢谢您的提问。最后一个问题？”\n\n在嘈杂的人群中，一只略显纤细的手在人群中挥动着，而那只手的衣袖上，正别着《广东妇人公论》的袖标。\n\n……\n\n“行政长官阁下，战前得到通过的《紧急权力条例》的终止目前依然遥遥无期，而当前您做出的关于成立整合各行政部门权力的新政府部门的决策，已经引发社会公众及舆论界对目前民政府所掌握的前所未有的权力的担忧。其中公众尤其关心的是，当下民政府愈发走向权力集中，这是否会威胁到立法会的法定职权以及《广东国基本法》的尊严。请问您可否就这个问题对国民作出回应？”\n\n“我想国民没有必要对目前政府的决策作出不必要的猜忌或感到无谓的担忧，民政府设立重建司的目的无非是要以更高的效率利用行政权力及手上的资源，更好地引导国家重建和促进经济复苏与社会安定。至于一些关于民政府是否会架空立法会、以至于视《基本法》为无物的流言与揣测，则纯属无稽之谈。《紧急权力条例》以及重建司本身，都是特殊时期、特殊情况下的特殊产物，一旦国家重新走上正轨，广东的国家权力运行就会恢复正常。谢谢您的提问。”\n\n“感谢诸位参与今天的新闻发布会。”\n\n顷刻间，台下的人群便再度陷入了沸腾。"
 DOP_GNG_event.122.a: "“再问一个问题，行政长官阁下！”"
 DOP_GNG_event.123.t: "静夜"
 DOP_GNG_event.123.desc: "一阵密集的脚步声踏过夜间的街道，皮鞋在地上踏得哒哒作响，而当铺的老板只是盯着柜台旁的特丽珑电视，上面播放着一卷来自满洲的电影录像带，因为他知道来者何人。\n\n“欸，林警官，又带住帮手足来帮衬啊？（嗨，林警官，又带着兄弟们来照顾我生意啊？）”\n\n“系啊，最近都要搞到夜夜噶啦，老陈。（是啊，最近都要加夜班的了，老陈。）”，一边寒暄着，林巧川毫不客气地直接拉开一张椅子，他身边的同事们也轻车熟路地陆续入座。\n\n“你地有咩要改噶？（你们有什么要改的吗？）”，在得到周围一圈同事们否定的回答后，林巧川转过头去，喊道：“仲系好似以前咁！（还是和以前一样！）”\n\n“好既，车仔面同冻柠。”\n\n……\n\n“来，林警官，哩份你既。上齐噶啦，你地慢慢，哈。（来，林警官，这份是你的，都上齐了，你们各位慢用啊。）”\n\n“唔该晒。（谢谢。）”\n\n林巧川拿起餐叉，卷起一串面条，送入口中，说实话，大排档的快餐算不上美味，但却是他们这些近来要加班到次日凌晨的警察们生活中不可或缺的慰藉，尤其是在当下这个紧张的时节。\n\n“最近生日应该唔错喔，老陈？（最近生日应该不错吧，老陈？）”，林巧川头也不回地又卷起一串面条。老板也一样，依然把目光放在刚刚又重新开始播放的录像带上，“比之前好好多啦，宜家大家荷包入边滴钱点讲都比打完仗果阵时多，滴客都慢慢翻返来啦。（比之前好多了，现在大家钱包总归是要比刚打完仗的时候充盈些，客人也慢慢回来了。）”\n\n“不过哩，一霖起阿杰仔我就心都赤，唉，偏偏系要被自己既同胞，炸死佐……佢读书果阵时仲成日来我哩度吃野……（不过，一想起小杰我就心痛了，唉，偏偏是给自己的同胞炸死了……他上学的时候还经常来我这吃东西呢……）”\n\n短暂的沉默后，随着话题的转移，对话又有一搭没一搭地进行着。\n\n当林巧川把嘴边最后一个字抛出，他便将玻璃杯里的冻柠茶饮尽，此时，门外又传来一阵来自皮鞋的脚步声。\n\n“又系你班伙记喔，行夜街果滴。欸，开工！（又是你的同事，夜巡的那些。哎哟，开工了！）”，老板按停了电视画面，起身拿起纸笔。而林巧川则笑了笑，“好了，我地都吃完了，唔阻住你做生意了。（好了，我们也吃完了，不妨碍你做生意了）”，说着，便招呼着一圈同事们起身准备离去。\n\n“多得你地班同事，我今晚有排做了。（有你这帮同事，我今晚要干的事就多了。）”，老板与林巧川擦肩而过，笑道。\n\n而林巧川只是笑着答道。"
 DOP_GNG_event.123.a: "“嗯，大家都仲有好多野做。（嗯，大家都还有很多事要做。）”"
 DOP_GNG_event.124.t: "得而复失"
 DOP_GNG_event.124.desc: "村民们眼睁睁看着一台台设备被搬到车上，然后由工人捆绑好，被卡车拉走。许多年轻人知道这意味着他们丢掉了工作，而老人们也意识到过去的生活即将告终了。\n\n在同一旁的经理确定了这就是厂房的所有财产后，官僚随即坐上轿车准备离开，却被村长拉住了：“请问你们为什么拉走这些设备？那厂区怎么办？我们的人呢？”\n\n官僚嫌弃般地将袖子从老人手上扯开，随后坐进了车里：“为配合产业群发展，厂区搬进广州城，想继续干的就进城去。”一旁的翻译将话翻译给老人听后，老人吃了一惊。“这……这位太君，这是行政长官亲自批准建在这里保障我们工作的……”\n\n老人拍打着车窗，想让官僚下来再商量商量，结果被旁边的壮汉一把推开，轿车趁此机会开走了。\n\n年轻人们大为不解，但现在他们都知道，他们面临着失去工作的危机。他们冲到卡车边想阻止那些人，但迎接他们的是保镖的警棍和拳脚。设备还是被拉走了。\n\n几天后，十来个人——都是老弱病残、妇女儿童——哭哭啼啼地来到村子里，请求村民们的接济。村长认出这是山另一头的村子的居民，连忙让村民们想办法做两桌饭菜接待他们。\n\n吃饭时，村长问道他们准备去哪。“村长，不好意思哈，我们……就打算住你们村了。”\n\n村长连忙问怎么回事，一个老人骂道：“还不是那群狗日的小鬼子！说咱们那有什么矿，把我们从村里边赶出来，又把村子拆了，还把男丁都留下来帮他们挖山！他们让我们滚，有人不肯，一枪就崩了！去他妈的小鬼子！操！”\n\n在许多人记忆里，这似乎是十多年前才会发生的事。有些乐观的人暗自庆幸他们村子没什么价值，但他们不知道，他们自己本身也是价值。"
 DOP_GNG_event.124.a: "他们不值得优越的待遇，因为他们只是工具"
 DOP_GNG_event.125.t: "阳光所不能及之处……"
 DOP_GNG_event.125.desc: "施华是逃亡到广东的千万难民的一员。像他这样的难民实在太多，以至于他和不少人一样，每天靠着政府的救济过日子，等着几乎不可能的招聘。但广东的企业早已经招人招到饱和了，以至于没有岗位能让他们上班。\n\n但情况迎来了转机——有公司要大量招聘劳工！这可把施华高兴坏了，他急忙去打听招工的是哪家企业，但得到的回答却让他背后一凉：是日立。日立的恶行就被南京当成“广东财阀压榨人民”的罪证之一，施华也知道前几年闹得沸沸扬扬的广东暴乱就是因为这帮家伙草菅人命导致的。因此在不少人眼中，估计只有疯了才会考虑给这家企业打工。\n\n不过很快，日立公司就派来了一位说粤语的高管，这种人在广东似乎被称作珠人？那珠人高管用粤语告诉他们，日立公司在广东暴乱后痛定思痛，已经作出了一定让步，现在日立工人们的生活待遇都有所改善。他甚至带大家参观了一座日立工厂，里面的设施并没有之前中国政府宣传的那么老旧，反而闪闪发亮。对工人的安全保护也做得很到位，他们甚至在午餐时间和这些工人们交流了日立的现状。这些职工在暴乱前就跟着日立干了，对日立的变化感触最深。\n\n施华和其他来参观的难民心动了，纷纷希望能加入日立公司。高管也来者不拒，和他们一一签订了劳务合同。但第二天，他们就被要求上车前往广西地区。去外边工作也许不错？或许工资照开呢？于是他们不假思索地上了车。\n\n到了广西的工厂后，他们被告知每天至少要工作16个小时，中途没有休息时间，且工资按工时计算。这巨大的反差让施华等人不知所措，有人很快站出来表示这跟劳务合同上写的不一样，却被一旁的安保一拳打得鼻血横流。“哼，你觉得那些监察员会跑广西来看你们的工作条件吗？别说他们了，正常人都不会为了几个劳工的所谓‘权利’跑来这片荒凉的土地。”监工轻蔑地笑着。“明天开始上工，不服从的，交由安保队处置。”\n\n监工和安保离开了，而施华等人被刚才一幕吓得不轻，但当他们回过神来时，只能在阴暗潮湿的“宿舍”里痛哭流涕，后悔自己轻信了日立的谎言。"
 DOP_GNG_event.125.a: "体面的作秀会让世界更美好"
 DOP_GNG_event.126.t: "何以为家？"
 DOP_GNG_event.126.desc: "“你想申请成为珠人？”林巧川有些不可思议，因为他几乎没有听说过日本人申请成为珠人的事，虽然他觉得身无一物的良子和珠人已经没什么区别了。“嗯……我始终觉得如果还保留我的日侨身份的话，我就没办法彻底融入这里。很多人因为我是日侨就对我有偏见，特别是现在很多华人和珠人都不喜欢日侨……”\n\n对于林巧川来说，这没必要。现在一些珠人也和日侨一样，被民族意识极强的华人当作“汉奸”来攻击——在林的印象里，上次听到这个词还是广东才被分离出来那会儿。而良子即使被承认为珠人，她的日侨出身也不会改变，但珠人有不少给自己起日本名字的，或许可以靠这个让她背负的骂名少一些？\n\n“林先生，你说，广东真的能成为三个民族的家园么？”良子望着车窗外高大的广告牌，上面写着一句令人发笑的话：广东是华人、珠人与日本人共同的家园！即使是林巧川这种经历了二十多年宣传攻势的人也不禁摇了摇头。盛田难道认为凭他的劳资关系改革，就能掩盖日益剧增的民族矛盾吗？也许在中国和日本撕破脸前，这招还算好使。现在他该怎么面对华人民族主义者呢？\n\n李家的晚饭相较于十年前来说已经很丰富了，今天的白切鸡和叉烧做得很下饭，让李骏大快朵颐了一通。“大哥，你看到今天宣传栏里的那个……”“那个宣传画是吧，我看见了。”李骏仍嚼着口里的鸡肉。“我最近也接到通知，说是政府在鼓励转珠人身份的申请，但珠人身份标准可一直没定下来呐！现在又说日侨也可以申请当珠人……”\n\n李梁叹了口气，又夹起一块豆腐。“话虽如此，你们之前申请珠人身份，爸也没反对。但我还是希望你们不要忘了自己的根在哪，我听说很多华人一成了珠人，就反过来歧视、压迫自己的同胞，还和家里人闹掰了……爸妈都知道你们是好孩子，你们可不能忘记，你们还是中国人。”\n\n三兄妹咀嚼的动作逐渐慢了下来，他们艰难地咽下嘴里的饭菜，对着满脸忧虑的父亲和母亲作出了承诺。"
 DOP_GNG_event.126.a: "“我们保证，我们还记得我们的根……”"
 DOP_GNG_event.127.t: "外事会议"
 DOP_GNG_event.127.desc: "“我再重申一遍——我没在开玩笑！这绝对要出大问题！”\n\n松下的咆哮连门外的保安都听得见，但他们不知道会议内容，只以为是要牺牲松下的利益。其实是要松下干一件更头疼的事情：让外务司运作起来，为广东外交奠定基础。\n\n“松下，你先听我说……”“不行，这太冒险了！和德国、美国直接接触，共荣圈没几个国家能这么做吧？”“我们是日本承认的独立国家……”“满洲也是啊！”\n\n盛田昭夫擦了擦喷到他脸上的唾沫，用松下不太熟练的粤语低声骂了一句后，用不可辩驳的语气对松下说：“好了，我知道你这么小心、谨慎，无非是担心日本因为这个把我赶下台，对你松下名誉不利。但我向你保证，这绝对不会有什么问题的。我现在需要的就是你出访东南亚，先给咱们的外交打响第一枪。”\n\n“……那么，如果真出事了怎么办？”“行了，真出事我把索尼赔给你行不行？”“我……”\n\n松下一时无言以对。盛田这句明显是气话，但这也点燃了李嘉诚的怒火：“行了，昭夫，不必跟他废话，他松下在东南亚和那些高官往来频繁，长实在东南亚一样有人！大不了我去！”\n\n盛田对李摆摆手，随后直视着松下：“行了，一句话，你去还是他去？”\n\n松下犹豫再三，给出了答复："
 DOP_GNG_event.127.a: "“……我还是不太敢冒险。”"
 DOP_GNG_event.128.t: "旋风外交"
 DOP_GNG_event.128.desc: "李嘉诚说长实在东南亚有影响力，也不是空话，其一是三合会本来在东南亚就是根深蒂固的黑道团体，华人在东南亚的经济上也有很大话语权；其二是长实的金融产业借着盛田上台的机遇快速发展，东南亚的高官和富豪多多少少都和长实有着生意上的联系，这成了李嘉诚出使东南亚的资本。\n\n在此之前，他需要先去一趟南京，恢复与中国的外交关系。当汽车驶入南京城时，李嘉诚看到了破败的房屋和衣不蔽体的人民，有的人甚至面黄肌瘦，这政府还真是演都不演了，直接把他们丑恶而又悲惨的一面暴露在世人面前！\n\n在走完流程后，李嘉诚便匆匆离开令他作呕的南京，前往东南亚的共荣圈各国。他在曼谷和昭南停留了相对较长的时间。\n\n泰国是共荣圈最初的成员国之一，其政治地位在共荣圈也有较高地位，经济、军事和外交也相对自主，因此广东在曼谷的外交具有重要意义，在日本可能反对广东与德国或美国建立外交关系的情况下，在曼谷的走私网络就显得很重要。李嘉诚也和华人商会进行了交谈，这一事件被他拿来宣传索尼与长实的政绩。\n\n昭南则是共荣圈最重要的港口之一，李嘉诚在此地不仅与昭南当局建立了联系，还协调了相关的贸易事项。对于广东来说，昭南这个“共荣圈门户”关系到中东贸易，相当于掌握着生命线，也应当废些心思。\n\n随后，李嘉诚回到香港，在一周内结束了对东南亚的访问。"
 DOP_GNG_event.128.a: "快刀斩乱麻"
 DOP_GNG_event.129.t: "再进一步？"
 DOP_GNG_event.129.desc: "李嘉诚刚下飞机，就看到盛田昭夫和何鸿燊正站在车旁等他，看到他就招呼他上车。\n\n“昭夫，有什么事快说吧，我得去休息会儿……”“没事，我们送你回家，你可是我们的大功臣啊。”盛田拍了拍李嘉诚的肩膀。“我们正好也想听听你的意见。”“什么？”\n\n何鸿燊给两人分别递了根烟：“我们这两天在计划对美国开展外交活动，只是不知道要做到什么程度，是建交，还是只通商，还是只允许人员往来。”“……但是我记得之前我们商量的时候，是要让高岛去给东京通气的。”“高岛让我们别搞得太大，不然东京会怀疑美国别有用心。”\n\n李嘉诚思索了一下：“既然这样，我觉得可以和美国通商，毕竟如果能打进美国市场，咱们肯定赚翻。”“我是觉得可以只让人员流动，保守一点，民间贸易也够我们赚了，东京也不会怎么样。”\n\n盛田在一旁默默无言，但他的话却让李嘉诚和何鸿燊都吃了一惊：“我觉得可以直接考虑建交。”\n\n“啊？那真不考虑东京的态度了？”“协定可没限制我们的外交权，我觉得无所谓。”“如果真出事了怎么办？”“……你们俩好好想想，直接与美国建交，那意味着我们能和整个OFN建交，政治上咱们获得了一个大国及其盟友的承认，经济上也能同加拿大等国建立更深的联系，何乐而不为呢？本岛来问，就拿协定去堵嘴，而且凭我们在共荣圈的地位，他们也不敢轻举妄动。”\n\n三人都陷入死一般的沉寂。最后，在车子快开到李嘉诚家门口时，盛田又让大家再讨论一次，而结果是……"
 DOP_GNG_event.129.a: "三人一致同意了何鸿燊的提案"
 DOP_GNG_event.130.t: "职责所在"
 DOP_GNG_event.130.desc: "在长久的争论后，松下终于半推半就地坐上飞机，开始履行外务司司长的职责，而他的第一站就是南京。\n\n松下对南京的巨大变化很震惊，这地方看起来就跟废墟一样，很难想象首都都是这样，其他大城市得是什么样子。在提交国书后，松下立刻带着随行人员离开了这里，如果是李嘉诚来这，他恐怕想直接掀桌子。\n\n之后便是对东南亚各国的访问。松下在共荣圈内发展多年，考虑到家用电器价格不菲，能买松下产品的非富即贵，松下的东南亚之行也因为这些“大客户”而顺风顺水。\n\n在曼谷和昭南两地，松下靠着这些关系构建起了有着“保护伞”的走私网络，在广东和美国、德国没有建交的情况下，这些走私据点可以充当贸易的中转站，至少能捞到钱。\n\n之后，松下坐上了回国的飞机。他的这次外交成功向世界宣传了广东，为将来的外交奠定了坚实基础。"
 DOP_GNG_event.130.a: "外务司终于名副其实了"
 DOP_GNG_event.131.t: "打开魔盒"
 DOP_GNG_event.131.desc: "松下一下飞机就风尘仆仆地赶到盛田的办公室，在登机前盛田就给他来过电话，让他回广东后就赶紧去他办公室一趟。\n\n到了办公室，才发现几位巨头都在，办公桌上还摆着一张德国地图。“松下回来了啊，辛苦了，但这件事你必须在场。”盛田说着，站起身来指着桌上的德国地图。“我们正在计划和德国建交。”\n\n“当前的问题在于，由于冷战，德日之间联系逐渐减少，难度不亚于同美国建交，但有旧轴心国的关系在，日本对我们的德国之行应该没有意见，关键在于谁去。”\n\n众人面面相觑，李嘉诚则直接表示他不想和德国人打交道，无论他们是什么立场。“和那些人谈生意真的很折磨。他们不同于美国人，他们既要钱，还要保证他们的地位。”\n\n松下则表示，如果德国目前的统治集团没那么咄咄逼人，他可以考虑去一趟。在他看来，一个拥抱资本主义和自由市场的德国会成为很好的合作对象。\n\n井深大并不在乎统治的是谁，他知道德国官僚们都面临统治德国及其广袤的殖民地的问题，而只要德国人愿意，他将带着富士通最好的计算机去和他们谈合作。\n\n驹井站在一旁什么都没说，但盛田替他说了——如果松下和井深都不愿意去德国，那么驹井必须去。当然，作为回报，日立会得到优先与德国进行贸易的机会，但这也就意味着，如果到了驹井去德国的地步，恐怕德国已经陷入了混沌。"
 DOP_GNG_event.131.a: "那么，谁会出马呢？"
 DOP_GNG_event.132.t: "不忠的密谋"
 DOP_GNG_event.132.desc: "大森宽面色凝重地走进饭店包间，里面只有一张小桌子，赤城宗德和栗栖弘臣都在，还有一个让大森头皮发麻的家伙——永野茂门。\n\n“请坐吧，大森处长。”赤城做了一个请的动作。如果连这位自卫队中温和派的代表也参与其中，那么只有两种可能：要么军队看不下去了，要么永野看不下去了。\n\n大森坐下后，赤城示意大家可以用餐，随后叹了口气：“现在外面局势也很乱啊……今天把几位请过来，是为了商讨个解决方案，不然广东早晚要被那些暴徒……”\n\n在座众人都沉默不语，就连永野也罕见地没有大喊大叫，说要把所有人拉出去枪毙。“额……各位，其实我和栗栖司令已经商讨出了一个方案。”\n\n赤城的话勾起了大森和永野的兴趣，他们的筷子停在半空中，而栗栖接过话来：“两位，我和赤城司长认为，盛田和他的内阁已经很难维持广东的稳定了，这还是在他们对华人可以说有恩的情况下。因此，我认为我们，也就是广东的安保力量，可以考虑接过广东政权，以更好地镇压暴乱。”\n\n“你们疯了？”大森几乎跳了起来，而永野的眉毛也向上扬了几分——他没想到自卫队居然也有夺权的想法。“如果因此触发更强烈的反弹，你们谁来负责？”\n\n栗栖无视了大森的质问。“……所以今天叫各位来，就是为了解决这个问题。永野将军如果同意的话，还请代我们向东京上报。至于大森处长……”栗栖扭头看向大森，后者仍然有些恼怒。“我希望你手下的警察们可以服从命令。”\n\n在永野同意后，大森意识到情况已经不可逆转了。他最终还是同意了军管的方案，但他希望局势稳定后可以还政给文官政府。赤城对此表示认可，栗栖则没有明确的答复。至于永野，他并不关心局势稳定后如何，因为他知道只要他想，那到达广东的帝国陆军会轻易粉碎广东所有的武装力量——前提是东京准许。而如果他们搞砸了，东京不可能会再容忍下去的。"
 DOP_GNG_event.132.a: "自此，广东的未来便已成了定数"
 DOP_GNG_event.133.t: "刀刺在背"
 DOP_GNG_event.133.desc: "立法会如往常一样陷入了无休止的争执中，而这次所有人都把怒火撒在了执政的民政派上，指责他们引起了第二次广东暴乱。民政派议员虽然一直在为自己辩护，但部分人也开始对盛田不满，因为他们觉得盛田是在把自己往火坑里送。\n\n“够了！我们现在只要一个解释，那就是什么时候这场混乱才会结束，以及盛田昭夫是否要为此付出代价！”井深大俨然成为了意见领袖，就连驹井也不得不佩服他在讲话时的狂热，而驹井打算让盛田也和几年前的自己一样在立法会难以立足。\n\n一旁的松下撇了撇嘴，他不想掺和进这个烂摊子，哪怕他是内阁成员之一；与之相比，盛田的坚实盟友李嘉诚则为了反驳每一项指控而焦头烂额。\n\n只是，盛田昭夫并没有到会。\n\n哪怕是紧急会议，他也该出席，毕竟这是他下令召开的。那么他去哪了？李嘉诚想着，心中有些不安。\n\n就这么吵了半小时后，盛田昭夫终于出现了——带着大森宽、栗栖弘臣和赤城宗德。众人都有些震惊，而鱼贯而入的士兵证实了他们的猜想：一场军事政变！\n\n众人都以为是盛田打算鱼死网破，但他只是走到台前宣布了一个消息：“诸位，考虑到近期的局势对广东社会稳定和经济发展造成了重大影响，本人特引咎辞去行政长官一职。经我和防卫司、警务处商议，我在此任命田村秀昭将军为行政长官，希望各位理解。”\n\n在李嘉诚和松下不可思议的目光中，在井深愤怒的辱骂声中，在驹井的不知所措中，盛田昭夫离开了会场，而台上的三人则神色凝重地看着混乱的立法会。"
 DOP_GNG_event.133.a: "料不到的一手牌……"
 DOP_GNG_event.134.t: "穷途末路"
 DOP_GNG_event.134.desc: "作为山崎电子厂的工会主席，老胡几乎每天都是在处理劳资纠纷。在政府更替后，工会的事不减反增，很多工人都担心新政府会威胁自己的利益，而给这些工人讲解政策也是他的职责之一。好在，考虑到稻叶承诺暂不干预法律，再加上山崎电子厂是索尼旗下的子公司之一，所以工人权益好歹是有保障的。\n\n但今天，有一位政府官员前来拜访。那人自称是劳工处的办事员，今天来是为了协调工会事务。\n\n老胡用怀疑的眼光打量着这人，而这位官员则是将一份政府公文递给了他，眼里似乎满是玩味。“胡先生，劳工处最近新颁布了一些工人权利标准，考虑到和盛田政府颁布的有所不同，我今天就是来给你讲解的。有什么不懂的，您可以问我。”\n\n“什么叫‘工会主席选举后要交由国家报备’？”老胡皱起了眉头。官员思索了一下答道：“这么说吧，比如胡先生你，如果下一届工会主席选举你也参选，那么政府不仅要派人参与整个选举过程，而且还要对你进行背景审查；如果你当选，政府也要确定对你的任命，你才能行使权力。”\n\n老胡一听，当即变了脸色：“这是不是意味着政府要接管工会？”那人呵呵笑了两声，随即把公文收走：“看来胡先生很聪明，那想必我也没什么要解释的了，告辞。”\n\n官员走后，老胡立马意识到事情不对。他刚想拿起电话打给山崎，电话铃声却自己响了。“喂？”老胡只想赶紧把这通电话应付过去，让山崎问问索尼那边，政府到底是什么情况。不料来电的正是山崎。“最近有没有政府的人来过？”山崎听起来很慌张。“刚来了个，怎么了？”老胡的心里此刻也吊起了一块石头。“妈的，政府突然把我们原材料供应商的东西全包了！拿给那几家国营厂子了！我必须问问这是什么情况……他刚走是不是？”“是。”“妈的！”电话挂断，而老胡已经愣在了原地。"
 DOP_GNG_event.134.a: "以上情景正在广东各处发生"
 DOP_GNG_event.135.t: "殊死搏斗"
 DOP_GNG_event.135.desc: "混乱席卷了立法会。无论是民政派还是财界派，这似乎是大家意见最为统一的一次投票：反对。然而，最终结果却让众人大为震惊——产业重组与反垄断法通过了。\n\n所有人都在互相攻讦，都认为是对方投下了赞成票，助力了法案的通过。然而，台下的五巨头出乎意料地团结一致，共同呼吁本派系的议员拒绝执行该条例，并弹劾在台上的稻叶秀三。\n\n稻叶宣布法案通过的声音被愤怒的声浪盖过，五巨头冷眼看着面前这个老头，这个和他们作对的家伙，一如当年的铃木贞一一样。只是这家伙可能比铃木还难对付——因为他并没有属于自己的安田，但他却能孤军奋战到如此境地。\n\n“那么，稻叶行政长官，可以解释一下你现在的这一系列荒唐行为，并告诉我们这一切什么时候终止吗？”井深大率先开口质问道。“哪怕是铃木贞一，他也没有想着什么解散立法会，或者企图拆分大企业。”\n\n稻叶的脸抽动了一下。他很讨厌被拿来和铃木贞一那个与虎谋皮的家伙相比较。他压着怒火回答：“不，井深先生。我所做的一切，都是为了广东国的利益。我希望几位先生都能理解我所做的一切……”\n\n“放屁……”李嘉诚暗自骂道。一旁的松下嘀咕着对稻叶翻了个白眼。井深大仍在对稻叶滔滔不绝地输出他那套“自由竞争”的理论，并说稻叶现在做的一切无疑是破坏自由竞争。突然，稻叶冲他怒吼：“够了吧，井深大！你们五个还要执迷不悟到什么时候！还看不清局势吗？你们的好日子到头了！我现在是在救你们！一旦东京彻底看不惯你们，你们迟早会……”\n\n稻叶突然支吾了。他现在不敢放什么狠话，因为东京甚至连是否审判盛田昭夫都拿不定，会不会支持他推翻五巨头更不确定。“算了，反正我会申请重提这份条例。”\n\n台下议员仍在自相争斗，五巨头在井深说完“乐意奉陪”后便一齐离开会场。而稻叶也怒不可遏，狠狠啐了一口唾沫后离开了会场。"
 DOP_GNG_event.135.a: "自此，战争开始了"
 DOP_GNG_event.136.t: "警务处报告"
 DOP_GNG_event.136.desc: "发自：大森宽，广东警务处\n\n发向：盛田昭夫，广东行政长官\n\n李嘉诚，广东政务司\n\n何鸿燊，广东财政司\n\n我们最近发现，广东出现了一些皮包公司，而根据我们顺藤摸瓜查到的人员来看，这些公司很可能与极道有关。\n\n考虑到极道和横井英树的关系，我们对后者展开了调查，最终虽然没有查出他和这些皮包公司的联系，但我们注意到此人正在广东境内扩展房地产业务，不排除他有借正规渠道回归广东的可能。\n\n横井在台北峰会后便仓皇撤离广东，其产业大多被我们查封以用于维持战时经济，横井本人很可能因此对政府实施报复性行为。鉴于此，希望财政司可以时刻监控另一张报告上的相关企业，同时建议李司长和长实公司注意相关业务，避免横井发动攻击。"
 DOP_GNG_event.136.a: "有位老朋友要回来了……"
 DOP_GNG_event.137.t: "争分夺秒"
 DOP_GNG_event.137.desc: "“就我上次去南京的情况来看，中国似乎在准备一场大战。”\n\n李嘉诚说着将眼镜摘下，用纸擦了擦。他依稀记得上次在南京城看到的景象。怒视着他的群众，满街飘舞的青天白日满地红旗，还有一些振奋人心但又感觉蕴含深意的口号……一切仿佛回到了三十多年前，日本人打进中国时，那种狂热的民族主义情绪和对日本的极端厌恶席卷着整个国家。\n\n在窗边的何鸿燊点了支烟，看着窗外：“三合会的弟兄们最近也是蠢蠢欲动，不少人都和国军或者日军搭上线，想给自己保命了。”\n\n盛田昭夫叹了口气：“中日必有一战，就算不打，梁子也要结下。好在南京和东京还不敢公开对峙，我们还有时间作点准备。”\n\n其他两人点点头，他们的时间已经不多了。盛田昭夫拿起桌子上的电话，拨给了内阁中的其他两人，通知他们明天上午在会议室集合。"
 DOP_GNG_event.137.a: "我们要考虑点特殊事项了"
 DOP_GNG_event.138.t: "未雨绸缪"
 DOP_GNG_event.138.desc: "“我今天叫诸位来，主要是讨论政府接下来的工作重心。”盛田昭夫站在办公桌前，双手撑着桌子。“我相信你们应该都看得出来，北方的局面不会持续太久，早晚都要起冲突。为了保证广东不会因为战争而立马崩溃，我们需要抓住这个空档期，处理好一些事情。”\n\n说罢，盛田昭夫看向何鸿燊，后者缓缓开口：“如果我们在这个时候在经济上进行备战，投资者定然大量撤资，那么广东经济又会迅速崩溃。所以我们只能尽量减少开支，同时维持日常的经济秩序。那么第一件事就是……外贸。”\n\n何鸿燊将一个小笔记本从衣兜里拿出，递给松下：“松下先生，这些公司是现在还和我们保持联系的中资或日资企业，具体的合作就交给您去谈了。”\n\n松下打开笔记本翻了几页，点了点头。何鸿燊又看向大森宽：“大森，为了避免突发情况，我们要对警察部队做一些小小的改革，你应该清楚吧？”\n\n大森双手抱胸，略加思索后点了点头。之前他和盛田就讨论过战争爆发的可能性，在那之后他就制定了一个规模不大的警队武装计划，现在看来派上用场了。\n\n“而最后，我认为还有些事要办。”李嘉诚环视四周，其他几人正用疑惑的眼光看着他。“其一是暴乱的善后问题，这件事对广东的影响太大了。其二么……”"
 DOP_GNG_event.138.a: "“暂时保密。”"
 DOP_GNG_event.139.t: "席卷全球"
 DOP_GNG_event.139.desc: "在里约的一家商店里，安东尼奥正在挑选收音机。对于他这个整天坐办公室的职员来说，听听收音机算是一种放松。虽然最近经济衰退让他的预算不多，但好在商店里有一款物美价廉的收音机，甚至能让他省点钱。他毫不犹豫的拿走了这台产自广东的TFM-110。\n\n在罗马的一户人家里，安德烈亚正和妻女坐在沙发上，面前摆着新买的特丽珑。这台来自东方的彩电不仅精致，而且更重要的是没花多少钱。不得不说，自从索尼进入意大利市场以来，安德烈亚就越来越喜欢这个品牌了——毕竟他不需要花很多钱，一样能享受到高质量的产品。\n\n在安卡拉的车站里，埃夫伦则拿着CF-2500音响，这是他和朋友们凑钱买的派对用品。尽管他们还是学生，但把手上的零花钱省点出来，竟然还能买到这么便宜又音质上乘的产品，他不敢相信这就是东方那个叫广东的地方造出来的，但他的几个同学都买了DR-4-A耳机，好像也挺便宜的，也许自己也该去买一部？"
 DOP_GNG_event.139.a: "索尼会为所有人带来实惠"
 DOP_GNG_event.140.t: "阴影下的“共荣”"
 DOP_GNG_event.140.desc: "“随着泰国总理和广东政务司司长李嘉诚在协议上签下他们的名字，一个由广东主导的环泰国湾经济区正式成立……”\n\n电视被关掉。高岛益郎扭头看向坐在桌对面的盛田昭夫，他的后面是神情冷峻的永野茂门。\n\n“行政长官阁下，”高岛皱着眉头先开了口。“尽管东京已经收到了照会，但首相还是希望我问问你，这场会议是否真的只是经济合作？”\n\n“是。”盛田点头。\n\n高岛的表情有些放松了，他示意永野出去。等到永野不情愿地将门关上，高岛才彻底放下架子：“盛田，不是东京不信任你们，但你也知道，东南亚一直局势不稳，中国近年来对共荣圈态度也有些捉摸不透。你们和中国关系还算不错，东京担心中国借你们干预东南亚。”\n\n盛田表面表示理解，实际上心里早就发毛，看来中日之间确实起了矛盾，居然连他们都要提防。\n\n“盛田。”高岛起身走到窗边。“我作为朋友还是要告诉你，之前我们的想法很可能是真的，中日之间的冲突已不可避免。”\n\n他转过身，阳光正好打在他的背上，让盛田有些看不清他的脸。"
 DOP_GNG_event.140.a: "“因此，希望你万事务必谨慎处理。”"
 DOP_GNG_event.141.t: "脏货"
 DOP_GNG_event.141.desc: "郭鹏蹲在集装箱旁，等待着来接头的黑帮大佬。走私这种活他干了几年了，在三合会里头也算有头有脸的人物，经常负责墨西哥的市场。\n\n今天这批货据说是上头的大人物们亲自要求送的，郭鹏自然不敢懈怠，亲自把货运到了墨西哥来。只是货物让他有些摸不着头脑：收音机、电视、电脑、空调……谁家黑帮要这些东西？\n\n午夜一刻，黑帮的人来了，为首的是一个戴墨镜的高个子。高个子的英语听上去口音很重，但郭鹏勉强听懂了他在说什么。郭鹏指了指集装箱，告诉他货在集装箱里，高个子一招手，他的手下便开箱取货。\n\n“我想问问，这些货是卖去哪？美国吗？”郭鹏用他同样蹩脚的英语问道。高个子点了点头，随后走进集装箱内验货。\n\n郭鹏看着他们留下的两口袋美金，不由得笑了笑，看来黑帮也喜欢干这种倒卖的生意。"
 DOP_GNG_event.141.a: "很快，这些货会以各种方式流入美国"
 DOP_GNG_event.142.t: "再度扩张"
 DOP_GNG_event.142.desc: "“目前，我们和长实集团的主要业务还是亚洲和拉丁美洲地区，在北美和欧洲的市场则相对来说小一些，主要原因还是国际环境紧张……”\n\n听完下属的汇报，盛田昭夫心里盘算着该怎么打入这两块市场。北美倒是不难，墨西哥就是个最好的跳板，索尼在美国的市场已经有了一定规模，只要经营稳妥便无大碍。\n\n至于欧洲，情况则更复杂些。意大利、伊比利亚和土耳其三国本就对德国怀有敌意，德国本土政策也影响着市场。如果想打入团结协定，恐怕要多花些心思。\n\n“我觉得可以考虑一下从英国或者法国入手，有没有可能？”李嘉诚指着地图问。“李总这个想法我觉得不错……”\n\n董事们七嘴八舌地谈论起来，也有人提出从北欧入手，还有人提议利用莫斯科专员辖区和俄罗斯地区之间的走私网络……\n\n市场开拓的方向有很多，但盛田昭夫知道，稳住当下的基本盘才是重中之重。"
 DOP_GNG_event.142.a: "毕竟，他没有多少时间了。"
 DOP_GNG_event.143.t: "打破常规"
 DOP_GNG_event.143.desc: "研发部的蓝图散落一地，工程师们围在桌边，将还在桌上的几张蓝图拿起看看，又扔到了一边。\n\n“该死的，这些想法目前实现起来都有困难，我们明天拿什么汇报！”一个秃顶的老男人骂道。\n\n助手们将又一批蓝图搬了过来，工程师们又把希望寄托在这批蓝图中。在看完一大半后，几位工程师已经摆出了放弃的架势。\n\n“我觉得这个可以！”听见一名年轻人这么说，几位资深工程师立马夺过他手上的蓝图，细细端详起来。很快，几人露出了如释重负的笑。\n\n第二天，这几名工程师就将具体的设计方案交给了盛田昭夫。盛田托着下巴：“所以这就是你们的最新设想？一个便捷式的磁带放音机？”\n\n“是的，它最大的特点就是随身携带，目前世界上还没有任何公司能坐到这点！此外，它还有收音、录音等功能……”\n\n耐心听完工程师的介绍后，盛田昭夫满意地点点头。“那么，这小东西叫什么名字？”\n\n工程师说出了一句英文。"
 DOP_GNG_event.143.a: "“Walkman”"
 DOP_GNG_event.144.t: "让金钱流动"
 DOP_GNG_event.144.desc: "“李总！又涨了！又涨了十个点！”\n\n秘书的欢呼雀跃并没有让李嘉诚也一起兴奋起来，这位坐在金钱与股市之上的操盘手已经从复苏的股市中赚得盆满钵满。但把股市再炒热才是他的目的——广东经济正在复苏，急需外部资金充当一针强心剂。\n\n他看着股市上一条条红色曲线，涨得最高的自然是他的长实，之后是索尼、松下、富士通、日立……虽然很不想提后面两家，但他们作为五巨头之二，广东经济照样离不开他们。\n\n“通知下去，让那些新公司继续发新股，把股市炒起来。”\n\n秘书跑出门外，李嘉诚则仍旧盯着面前的屏幕。现在日资力量衰弱，大量新成立的公司都由珠人或者华人创办。也许能凭借这个天赐良机，改变一下广东的经济架构，让珠人和华人的声音更大些？"
 DOP_GNG_event.144.a: "若能如此，那不妨再迈一步……"
 DOP_GNG_event.145.t: "善后计划"
 DOP_GNG_event.145.desc: "“那么，你又有什么计划？”\n\n昏暗的办公室里，盛田昭夫、李嘉诚和何鸿燊围在办公桌边，桌上只有一份报告。\n\n“很简单。”李嘉诚笑着指向报告的其中一行。“这里，‘茂名日企较1971年初复工率仅47％’。如果抓住这个机会，我们说不定能介入当地的石油生产……”\n\n两人的眼神马上变得警觉。“嘉诚，我必须提醒你，这个计划很危险。”何鸿燊指着报告上的另一行。“这里同样提到，当地产业大多与帝国陆军有关，咱们摆平了宪兵队，不代表能摆平永野茂门。”\n\n李嘉诚只是淡然一笑：“我不觉得他有胆子敢干涉商业活动。好了，还有一件事。虽然我们已经搞定了两个暴乱组织，但还有些独立于他们的小团体，或者有一些人有其他诉求。”\n\n盛田叹了口气：“直说吧，你打算怎么做？”\n\n“我打算把他们拉来，讨论出一份最终协议，然后让其通过立法会，彻底解决暴乱的问题。”\n\n见两人仍犹豫不决，李嘉诚有些着急了：“这两件事对我们都很有利啊！拿下石油产业，日后和永野起冲突时能多个筹码；解决了暴乱的遗留问题，人民也站在我们这边，何乐而不为呢！”\n\n盛田和何鸿燊低头思考着，半晌后，他们给出了答案。"
 DOP_GNG_event.145.a: "“好吧，我们支持你。”"
 DOP_GNG_event.146.t: "公平竞争"
 DOP_GNG_event.146.desc: "“你是说有其他企业在介入石油的事？”\n\n阳光洒在永野茂门的办公桌上，却没有照到他的脸。此时的他正听着竹田五郎的汇报：广东本土企业正在茂名开办产业，填补日企离开留下的市场真空。\n\n“不，不要干涉他们，一旦干涉就是我们理亏……我知道东京会保我们，但现在东京更希望能快点恢复广东经济……”\n\n他拿起一旁的清酒喝了一口，随后抿了抿嘴。\n\n“这样，把这个事交给立法会，就像那个什么博彩业牌照一样……你放心，这一次我会安排人去打点。先陪他们玩玩，如果真通过了，我们还有办法能处理他们。”\n\n他翻开一张地图，上面用红圈标记着石油产地，蓝点则代表着和他们合作的日企。\n\n“你可以先让一部分企业转移他们的资产，集中控制几个大的石油产地，具体情况我稍后再安排……记住，动作小点。”\n\n挂掉电话，永野叹了口气。他很不愿意这么做，东京明显更在乎经济上的利益，他考虑的则是保证对广东的直接控制。倘若让石油产业这一命脉被拿走，谁敢保证盛田昭夫一定忠于日本？但现在，他只能在规则内行动。"
 DOP_GNG_event.146.a: "但他自然有规则内的手段"
 DOP_GNG_event.147.t: "一劳永逸？"
 DOP_GNG_event.147.desc: "谈判陷入了僵持中。\n\n抗议者代表提出的条件很多，但李嘉诚只能硬着头皮表示，想要让立法会通过这些条件很困难，只能逐步将其确定下来。毕竟，现在这些人不成气候，那立法会自然也没必要妥协。\n\n在长久的沉默后，一位代表看向自己的同僚们，随后问道：“如果我们同意您的方案，您又有几成把握可以落实下来？”\n\n李嘉诚立马抓住机会：“索尼和长实的联盟——再算上一部分松下议员——在立法会属于多数派，只要能让松下里面的那些中间派倒向我们，那么法案通过自然不是问题。”\n\n对面的代表们面面相觑，随后提出休会。在十五分钟后，他们告诉李嘉诚可以让步。“李司长，你为我们做的事我们都知道，我们信任你。但我们希望第一件事是先解决失业救济的问题，很多人失业了得不到生活保障，日子难过啊！”\n\n李嘉诚松了一口气，他拍了拍面前这位代表的肩膀：“放心，这份法案我一定据理力争。”"
 DOP_GNG_event.147.a: "就这样，谈判大功告成"
 DOP_GNG_event.148.t: "不甘平庸"
 DOP_GNG_event.148.desc: "李骏拿起餐盘，在食堂中四处张望着——他因为处理一些事务，耽误了吃饭的时间，现在倒好，又要到处找空位了，所幸今天他只是一个人来吃饭。\n\n啊，那边！\n\n他快步走过去，拍了拍一旁有些无精打采的穿着流水线工服的小伙的肩膀，“哩张有没人坐？（这张椅子有人坐吗？）”\n\n年轻人没回话，只是摇了摇头。李骏便放下餐盘，毫不客气地坐了下去，开始享用今天的午餐，要说这日本人的吃食还真的和广东本地人不太一样，这荞麦面都是凉的。\n\n他夹起一串面条，放入盛了汤汁的碗中，他的余光瞥到一旁年轻人的脸庞，“阿曾？”\n\n一旁的年轻人才好似如梦初醒般反应过来旁边的人是谁，“哦！骏哥！”，脸上浮现出带有一丝尴尬的笑容。\n\n李骏记得这个年轻人，当初新员工入职培训的时候他就注意到他了，勤劳肯干，也谦虚好学。只不过，他的个人档案上，学历一栏依然只有“小学”二字，但，他已经比许多同事要强，尤其是一些年近半百的“老坑”们，他们那会儿可连小学都没得上呢。\n\n刚和他对上眼，李骏就注意到他脸上那若隐若现的黑眼圈，“哇，衰仔，寻晚做贼来啊？（哇，小子，昨晚去做贼了啊？）”，他笑着打趣道，把筷子上那团面条送入口中。\n\n“唉，咪都系温书咯。（嗨，不也就是在那读书嘛。）”，小伙扒了一口米饭，又夹起一块炒菜心。\n\n“咪你唔系小学毕业佐了咩？仲要跟住班老坑去上咩夜间补习班？（你不是小学毕业了吗？怎么还要跟着那帮老家伙去上什么夜间补习班？）”，李骏愣了一下，而后又拍了一下他的肩膀，“喂，你唔系诈傻扮懵去上课霖住赚加班费啊吗？咁好泄底噶喔。（喂，你不是打算装傻充愣去上课赚那点加班费吧？这样不值当啊。）”\n\n阿曾笑了，但还有些不好意思地开口道，“唔系勒，骏哥。我系霖住自己去考个中学文凭，咁样以后都多条路行啊嘛，唔通成日屈系个流水线生命咩。（不是啊，骏哥。我是想自己去考个中学文凭，这样以后也多条路可以走嘛，难道整天困在那流水线上吗。）”\n\n李骏闻言，轻松地笑了笑，开始专心对付眼前的荞麦面，但是他的思绪，已经回到了不知道多少年以前，他还在某个血汗工厂的流水线上挣扎的时候。"
 DOP_GNG_event.148.a: "“咁你实得啦，你醒目仔来噶嘛！”"
 DOP_GNG_event.149.t: "一往无前"
 DOP_GNG_event.149.desc: "哗啦一声，门被利落地推开。\n\n“怎么样？1点多了，去吃个午饭……？”\n\n盛田的声音骤然变小，脚步也变得轻缓，慢慢走近那尊20世纪的沉思者，当然，还有一个原因是这家伙最近迷上了叠纸牌屋，要是自己一个疏忽把他的杰作毁了，那他可要闹腾好一阵子。\n\n“喂，井深……井深大！”\n\n“啊……啊！你这家伙，进来怎么一点声音都没有！”\n\n那尊雕像被声音所唤醒，沉思的模样也消散得无影无踪，取而代之的是幼稚的抱怨。\n\n“发布会结束了？”，井深拧开一旁的水杯，往自己嘴里灌了一大口。\n\n“嗯，虽然我怀疑那些人能不能理解你想要做什么。”，盛田哑然失笑，自上任以来，这位新的二号人物在颠覆潜规则和胆大妄为的创新方面从未停歇，以至于让自己生怕哪一天当他的纸牌小屋倒塌时，这个国家也会被他的狂妄摧毁。\n\n“走吧。”，井深理了理身上的衬衣，拿起挂在晾衣架上的外套，绕过了办公桌，头也不回地向门口走去。\n\n盛田刚挪动脚，又不禁回过头瞥了一眼办公桌上那显得有些高耸的纸牌屋——还有下面压着的一张公文纸，被部分遮掩的标题只是写着“补全”等等零散的字句。\n\n……\n\n林巧川快步走在警察厅本厅的长廊上，他的内心是忐忑还是激动？他不知道，但是他告诉自己自己做了应该做的事情，也是这个国家目前需要的事情。一项新的国家安全情报分析机制企画被他递交给了警视总监本人，在当前的公安和警备警察高层中也已经引起了相当的轰动。\n\n该死，他什么时候开始和公安那群混蛋为伍了？也许就是东亚学院那件事以后？无所谓了，他的企画案一旦落实，这些悲剧大概就不会再有发生的可能……\n\n……\n\n李慧拿着餐盘，在食堂的边角处找了个位置，别误会，并不是她找不到人一起吃饭，只是她现在还想安静地独处一会儿思考工作上的事罢了。在她的头脑疯狂运转之际，一句来自不知道何方的话语直击她的脑门，让她一时间停止了思考：“金融厅那帮扑街听日又要过来检查喔。（金融厅那帮混蛋明天又要过来检查。）”片刻的呆滞后，李慧放下了手中的餐具，“屌，又要加班执资料了。（操，又要加班整理资料了。）”\n\n……\n\n安川良子抿了一口咖啡，在她面前的计算机屏幕上，是她手下的新进记者的关于近来的“社会服务公共雇员扩招”的报导，她微微皱眉：这事对于现在的政务厅长官来说可谓是反常至极甚至“大逆不道”。怎么？他不再热衷于让他那些电子元件组成的玩意取代“落后劳动力”了？亦或者说，他有什么新的社会实验？"
 DOP_GNG_event.149.a: "冲破所有障碍……"
 DOP_GNG_event.150.t: "走向世界？"
 DOP_GNG_event.150.desc: "良子今天上班时，被高崎叫去了办公室，说有一份重要任务交给她，于是下午她就坐在外务司的接待处了。\n\n《广东妇人公刊》最近得到消息，说盛田政府有意拓展外交渠道，与亚洲乃至全球绝大多数国家建立正式外交关系。这个流言在民间也广为传播，几家报纸已经靠着所谓的“内幕消息”赚得盆满钵满，而高崎也顺应这一趋势，决定为《广东妇人公刊》开“国际视角”板块，由良子担任主编。\n\n虽然良子不知道有多少女性会关注国际新闻，但既然是上司的意见，那就照着办。\n\n外务司的发言人明显也有些摸不着头脑，答问题也是打官腔。当问道广东目前的外交重心时，他回答道：“广东自然会将共荣圈内的兄弟国家摆在第一位，除了已经与我们有外交关系的日本，以及我们准备恢复外交关系的中国，我们会优先和东南亚国家建立外交关系，然后是亚洲其他国家和拉丁美洲……”\n\n“那么，松下司长会亲自出访这些国家吗？还是会派其他人？”良子还是问出了这个问题，毕竟盛田也有可能会让李嘉诚去出访东南亚，这个和他出生入死的好伙伴在各种事务上更能和他达成一致。但发言人的回答也在她的意料之内。"
 DOP_GNG_event.150.a: "“抱歉，无可奉告。”"
 DOP_GNG_event.151.t: "北境孤城"
 DOP_GNG_event.151.desc: "自己上一次是什么时候来到这里的？\n\n盛田昭夫已经不记得了，但是他还记得，这座城市就像上天有意为之一般，像一枚钢钉，死死地钉在广东北部的山峦之中，几乎成为了任何北方来者的必经之路。\n\n而这座名为韶关的城市也确确实实地成为了战火之中的必争之地，也成为了在北方寒潮侵袭之时庇护广东的城墙——以它本身为代价。\n\n市中心的建筑群中不乏有几乎与这个国家同龄的楼宇，而如今这些建筑已经被炮弹与航弹所摧残至摇摇欲坠，就像这个孕育了它们的国家一样。而在这些残破的阴影之下的，不是昔日的繁华，而是一眼望不到头的挣扎。\n\n过往频繁往来的出入境货运卡车，随着对北贸易往来的终止，被载着警察与民兵的车辆取代。繁华的市场如今只有供“业主”维持生计的小买卖。而侥幸存活的建筑中，也只能看见些许光亮，因为市政府如今在限制供电，以提供夜间的基本照明。\n\n“那水呢？”\n\n一旁的市政官员一时间还未反应过来：“抱歉，您说什么？”\n\n“净水供应，这个有出问题吗？”\n\n“不幸中的大幸，供水设施依然能正常运转。”\n\n盛田不语，但是内心已经松了口气。\n\n“但我们还有其他的问题：很多必需品，因为道路被炮击和轰炸，运输的效率比预想的要慢得多。还有那些被损毁的设施和住宅，我们也因为手头的人员和资源捉襟见肘，连提供临时替代方案都头疼得很……”\n\n“人力当然捉襟见肘。”，盛田心中想到，这一路上他已经见到不知道多少辆载满警察和民兵的车辆在巡逻，当然，这其中肯定有因为他的到访的缘故，但是，这个城市的境况也由此可见一斑。\n\n“让我把话说明白吧，行政长官阁下。”，市政官员顿了顿，“我们需要帮助，我们需要修复公路、我们需要恢复供电、我们需要物资救济……我们需要有人来帮助我们维持秩序，在一切都崩塌之前。”\n\n“嗨，放轻松，我们处理过的糟糕的事情已经太多了。”，盛田摆出一副轻松的神情，拍了拍一旁的市政官员，尽管这种违反尊卑秩序的举动让他很不自在，但他还是尴尬地笑着点了点头。\n\n而盛田昭夫又开口了，“我们会有办法的……”"
 DOP_GNG_event.151.a: "“……在那之前，你们要撑住。”"
 DOP_GNG_event.152.t: "零点时分"
 DOP_GNG_event.152.desc: "真是久违了啊，霓虹灯。\n\n自这座千年商都，变为异国企业的游乐园以来，霓虹灯照耀下的广州，就成了不亚于上海的不夜城——直到弥漫的硝烟将那灯光遮蔽——灯光管制、电力配给、宵禁，将这座城市乃至广东拉入了不分昼夜的死寂。\n\n还不仅如此，财政赤字、外汇见底、资本外流，以及迟迟不见结束的社会动荡，都让这颗本来正在冉冉升起的共荣圈新星在刹那间从高空跌入了深海，失去了其璀璨的光环，还即将被周遭的重压碾碎。\n\n“这会是广东实验的终末吗？”，从社交酒会上的窃窃私语，到投资人和证券交易所的电话和通信，乃至于本岛的报纸的财经栏目，无一不在或焦头烂额或幸灾乐祸地等待着“不可避免的结局”。\n\n“是自己哪里做错了吗？”，这个念头不知道从何时起就一直盘踞在行政长官的脑海里，如同梦魇一样挥之不去。自己让这个地方超越了满洲，成为了新的共荣圈明珠。自己让这个地方从跨国资本和巨型企业的乐园变成了它所承载的数千万国民的家园。自己让“广东实验”从一个摇摇欲坠的笑话，变成了一个严肃而被广泛讨论的事实。\n\n不，他没有做错什么，什么都没有。否则，命运怎么会一次又一次地在危难关头向他展露微笑？无论是流落他乡后的东山再起，还是在行政长官特别选举中成为那匹冲线的黑马，再到挫败满洲代理人的阴谋和平息滔天的民怨，以及现在，自己实验的产物经过了历史的考验。\n\n而他势必不会辜负这份恩情，更不会辜负如今更为宽厚的“实验场地”：如今整个岭南都在民政府的掌控之下，正等待着技艺精湛的手艺人以此为舞台，表演他点石成金的绝技。\n\n盛田昭夫只感觉到一股热血正在从体内涌向他的头顶，眼前那仍萦绕着硝烟气息的霓虹灯下熟悉又陌生的景观已经被他抛之脑后，取而代之的是一副全新的愿景。\n\n他依然有机会——或者说，从未有如此珍贵的机会，去以自己的意志，让广东乃至整个岭南焕然一新。\n\n让世界见识“广东模式”真正的伟力。"
 DOP_GNG_event.152.a: "牢笼已破，雏鸟展翅"
 DOP_GNG_event.153.t: "修订民族融合条例通过！"
 DOP_GNG_event.153.desc: "“我是《广东妇人公刊》的安川良子，新出台的《民族融合条例》规定珠人为广东的主体民族，请问政府对华人和日侨是什么态度？”\n\n台上的人明显是位老练的官僚。他清清嗓子：“广东国政府鼓励华人和在广东长久居住的日侨申请珠人身份。广东过去的民族政策，不能完全维护到所有人的利益。行政长官对珠人身份作出明确定义、严格制定审核标准，正是为了给法律在民族上定一个标准，确保最大程度的公平。”“有小道消息说政府有意强制进行珠人化，是真的吗？”官僚明显变了脸色，但还是十分镇定：“不会，广东国政府尊重每个人的意愿。”\n\n良子坐下后，脑海里还在想着官僚的那句话。广东真的会尊重每个人的意愿吗？她倒是早就有申请成为珠人的想法，但其他人——比如沙龙里面那些趾高气昂的阔太太们——会接受这种“自降身份”的命运吗？政府又是否会为了“公平”而干预他们的选择呢？\n\n“林警司，你说这事会牵扯到咱们吗？”一位珠人警司将咖啡递给林巧川，随后坐在了他的对面。“这还能怎么牵扯？你不是珠人？”“不不，我是说新的民族条例……他们说警务处在开会，讨论什么时候采取怎样的措施去促进珠人化。不会让我们去抓人吧？”“怎么可能，你想多了。”\n\n林巧川嘴上说得轻松，实际上他心里也没谱。站在他的角度来说，珠人身份和地位的确立确实是件好事，有一个统一的行政标准也是件好事。但是，如果真的要对那些外来的华人和日本人动用强制手段，将他们转化为珠人，真的是“一劳永逸”吗？\n\n李家今天的晚饭沉默无言，即使现在不是华人，众人还是惊讶于政府的新规定。要把占广东人口近70％的、观念几乎截然不同的两个种族转化为同一个种族，怎么想都难如登天。“哥，我不理解。”李晞突然扭头看向李骏“为什么行政长官会……颁布这么具有争议的条例。我听说法国那古时候也是这样解决民族矛盾的，该不会……”“别想这些有的没的，和我们没关系。快吃饭吧。”李骏打断了妹妹的话，招呼家里人尝尝他做的叉烧。\n\n不过他自己也不信自己说的话，毕竟他们家才申请珠人没几年，如果自己当初犹豫了，他是否也会和那些劳工一样，害怕传说中的“强制措施”到来呢？如果真的有“强制措施”，那盛田昭夫还对得起当年和他站在一起的华人吗？"
 DOP_GNG_event.153.a: "是改革的阵痛，还是病急乱投医？"
 DOP_GNG_event.154.t: "这么做可能是扬汤止沸……"
 DOP_GNG_event.154.desc: "《修订民族融合条例》\n\n在经过立法院审议后，行政长官颁布了修正后的《广东民族条例》，并冠以“融合“之名，正式确立了申请成为珠人的标准，并明文规定珠人为广东的主体民族，颁布了一系列促进和规范广东的华人及日侨等“临时身份”问题妥当解决的规章，以期解决广东日益加剧的种族矛盾。只有时间证明这是否有效。"
 DOP_GNG_event.154.a: "……"
 DOP_GNG_event.155.t: "抱歉，没有闲钱"
 DOP_GNG_event.155.desc: "自从戒严令颁布后，大街上到处都是巡逻的警察和士兵，城市人心惶惶，除了购买日用品和食物，没人会在大街上闲逛，因此白老三的小吃店也开不下去了。\n\n白老三的小吃店不是什么大产业，但在当地还是小有名气的，如今面临着破产的命运，确实和以前的欣欣向荣天差地别。但没办法，自从暴乱开始以来，生意都不好做，他只能自认倒霉。\n\n背负的债务这个时候成了问题，但临时政府没有对广东法律作大幅度修改，这也就意味着他还能靠申请破产来获取一些补助。他心里希望政府别第二天就宣布废除了破产法，毕竟盛田政府很重视他们这些小买卖，补助能有效减轻他的债务负担。\n\n然而等待了几天后，政府的回答对他无疑是晴天霹雳——政府的财政吃紧，至少目前不会给他任何援助。\n\n他找到市政府询问，但市政府的工作人员告诉他，这是临时政府的命令，他们划拨到的预算也很吃紧。\n\n而当他上访民政府时，那个摆着一张臭脸的军官则直接告诉他，财政部门已经收回了绝大部分地方预算，用于维持这段时间实行戒严令的支出。“我们也知道这会对你们的生活造成影响，但为了广东所有人的利益，你还是先挺过这段时间吧。”\n\n军官扔下这句话就走了，而白老三愣在沙发上，望着军官远去的背影。"
 DOP_GNG_event.155.a: "必要的牺牲"
 DOP_GNG_event.156.t: "片刻欢愉"
 DOP_GNG_event.156.desc: "广州松下工厂的华人劳工们大多一到休息时间就急匆匆地跑到所谓的“娱乐室”中——其实这种房间很常见，他们被视作工人正当权利的一部分。但以往这里就是桌椅、咖啡饮料和一些零食，前两天却来了几台雅达利的游戏机。这些美国货因为各种原因，连日本人都很少见过，更别提广东的华人了。他们经常一玩就玩到休息时间结束，有人还因此发生了争吵。但玩完游戏机后，他们的干劲就更猛了，对现状的抱怨也随之烟消云散。有谁会想着把现在的美好全部打破呢？\n\n香港的珠人公务员们在中午都会打开松下的空调和索尼的电视，看自己最喜欢的电视节目。很多人都对综艺感兴趣，看那些容貌姣好的女明星唱歌又何尝不是一种享受？当然，一些女性公务员可能对男明星更感兴趣一些，但那不重要。哪怕广东本土的节目看腻了，这电视也能转播到日本频道。就这样，一台空调、一台电视、再加上一杯咖啡，公务员们的疲劳立马烟消云散。至于上星期对现行政策的不满？现在过得挺舒服的，有什么不满的呢？\n\n澳门的灯红酒绿让日侨们流连忘返，数千万日元在一小时内便通过赌桌易手。这里是广东最公平的地方——如果忽略一些出老千的家伙的话。但来这里的人都坚信这是个靠运气发财的地方。他们从本岛带来大量资金准备投入商业，却又在赌桌上几乎输个精光。但没人会想着把他们钱包里的最后一点钱榨干，因为赌场是用来给日侨娱乐的，不是让日侨希望破灭的。不过他们自己也清楚，来这里只有两个结局：一无所有，或是赢下所有。而当他们沉迷于反复无常的输赢时，自然无暇顾及商业活动，给五巨头吞并他们创立了便利的条件。但这也没什么坏的，谁不想当个甩手掌柜然后去玩上几把老虎机呢？"
 DOP_GNG_event.156.a: "无论是谁，都有自己的“舒适圈”"
 DOP_GNG_event.157.t: "似是而非"
 DOP_GNG_event.157.desc: "黄浩辉坐在政务司司长的办公室中，等待着李嘉诚的到来。尽管他是索尼高层的一员，但现在索尼和长实的关系还未完全破裂，大部分人都知道盛田和李嘉诚出现了分歧，不过两家公司的联盟关系依然存在。因此，他还敢来给李嘉诚“进谏”，让他举起平等的旗帜，而不是让盛田和松下把它撕个粉碎。\n\n一顿饭的功夫，李嘉诚就进来了。“抱歉，因为一些事耽搁了……有什么事吗？”“李司长，我对最近的政策转向有一些看法，索尼内部有很多人也是一样。因此，我们希望能和长实以及政务司……”\n\n黄浩辉话还没说完，李嘉诚就以一声长叹打断了他。“很抱歉，黄先生。我现在能做的只有维持现行秩序，但如果你们要我和松下，甚至盛田在立法会对抗，恕我直言，我做不到。”李嘉诚的脸上满是忧郁，随后转变成愤怒。“昭夫，他为什么……我不知道他为什么会和松下他们走到一起，甚至让松下提出《企业效能条例》那么混账的提议。长实没有多少政治资本，索尼和松下在立法会占了大头，井深现在只是隔岸观火，搞不好还偷着乐……这一切他妈是怎么走到这一步的？”\n\n见李嘉诚明确表达了拒绝的意愿，黄浩辉的心中也涌上了一股失落感。他加入索尼董事会那天可没想过事情会成这样，盛田现在的所作所为和他认知里那个为民请命的盛田可谓天差地别，而唯一的希望李嘉诚此刻也无能为力。“就在刚刚，盛田还让人来，希望政务司能组织一批人去搞宣传活动，为松下的一些小动作开脱，并想办法平息民众的怒火……老实说这糟透了，但哪怕我不去干，索尼和松下也会派自己的人去干。”此时李嘉诚的声音微小到几乎是喃喃自语。“我不会让任何一个人去的——如果我还能命令他们的话。我现在坐在这的唯一用处，就是维护我和……我以前的成果。”"
 DOP_GNG_event.157.a: "在此时的两人眼中，过去的盛田昭夫已然渐行渐远"
 DOP_GNG_event.158.t: "自废武功"
 DOP_GNG_event.158.desc: "“盛田，你可真是……给我搞了个难题啊……”\n\n何鸿燊艰难地睁开自己的眼皮，为了处理好盛田的这个“要求”，他可两天没合眼了。前线缺人从三合会补，但还要经过筛查，“避免亲华情绪蔓延”。拜托，三合会哪来这么多混日子的啊？大部分人就是冲着华人之间互帮互助来的，盛田这么搞和直接拆解三合会有什么区别？\n\n他这两天电话打了不少，话也说了一堆，凡是能挑拨的、能说服的，他都拼了命去把事情办成。至于那些人买不买账，他自己也不清楚。到时候哪怕给盛田讲一句“我尽力了”，他也问心无愧。\n\n现在他在等的是炸药桶爆炸。只有在族裔问题上做文章，才有可能分化三合会，把民族主义分子完全踢出去。只是这样，三合会的影响力也大打折扣了，不过好在他应该能当事实上的“大佬”而非三合会各派的“共主了，这也算小捞了一笔……？\n\n正当他几乎要睡过去的时候，电话终于响了。他立刻打起精神接通电话：“喂？有什么事吗？”\n\n电话那头的人有些惊恐，从他的话中，何鸿燊听出来了怎么回事：计划很成功，但有些成功过头了。帮派内各派系发生了火并，不少人带走了资产，甚至疑似有给中国军队通风报信的行为。虽然镇压得及时，但三合会的人员大幅减少，资产损失也比较大，但至少能保证留下来的三合会成员都无比忠诚了。\n\n何鸿燊安抚了那人几句，随后下令稳定三合会，挂断电话后就向后一倒，靠着椅背睡着了。两天来，他终于能睡个好觉了。"
 DOP_GNG_event.158.a: "至于负面影响，明天再去处理吧"
 DOP_GNG_event.159.t: "午间休息"
 DOP_GNG_event.159.desc: "“五、十、张。”赖柜员办公桌上的新式点钞机一字一顿地报出了将要被在下一刻划入“已清点”一栏的万圆纸币的张数。“11时58分入库五十万日元……得了，放工。（行了，下班）”他做完记录，把方才清点好的纸币齐齐整整地放进金库里，打了退勤卡，走出办公室，向员工饭堂进发。“喂，老赖，去食饭啊？（喂，老赖，去吃饭啊？）”肩膀上猛然传来一阵下压的力道，回头一看，是比他晚些结束工作的老曾那张叼着牙签的贱脸。“屌，讲多次冇咁叫我啦，你唔惊我仲惊触霉头噶。（靠，说好多遍了别那么叫我啦，你不怕我还怕触霉头的。）”他当即就笑骂回去，只是可惜他这位朋友的名字并不为人着想，方便其他人取一个那么类似的外号。“一起？”“一起咯。喂，你话上边那些人点想噶，突然就催紧我哋清点全部嘅日元储备？（喂，你说上边那些人怎么想的，突然就催我们清点全部的日元储备？）”老曾走到与赖柜员并排的位置，习惯性地要给自己点烟的手在看到走廊里“禁止吸烟”的告示时僵在了半空，撇了撇嘴，悻悻把烟盒放回口袋里。赖柜员此时脑子里还在想自己早上经手的那些被送至银行，被要求清点的“外汇储备”，甚至忘了找老曾讨一支烟抽，不过那也无所谓，毕竟烟雾报警器红色的眼睛始终盯着他们，“我点知啊，我又唔系李嘉诚佢老豆，佢哋搞搞阵同我哋有乜关系啊？要我讲，要办就干脆把嗰个广东圆冚巴揽废咗佢，省得我哋一天到晚喺呢度算算算，屌，都彻底同埋日本佬一伙咗，干脆用日元算啦。（我怎么知道啊，我又不是李嘉诚他爹，他们搞事情和我们有什么关系啊？要我说，要办就干脆把那个广东圆整个废除掉，省得我们一天到晚在这里算算算，靠，都彻底跟日本佬一伙了，干脆用日元算啦。）”“嗨，你唔知我话俾你听咯，我早先几个月就料定佢地要对货币动手，记唔记得？今早我喺楼道吸烟阵就听到我哋领导，就嗰个鬼死咁臭屁嘅日本佬，同人倾计，话……（嗨，你不知道我就跟你讲咯，我几个月之前就料到他们要对货币动手，记不记得？今早我在楼道吸烟的时候就听到我们领导，就那个特别臭屁的日本佬，和人聊天，说……）”“……行政长官似乎乘班机去咗东京。（行政长官似乎坐飞机去东京了。）”“……依家喺银行外面用广东圆已经换唔到日元了。（最近长实股价涨得厉害。）”"
 DOP_GNG_event.159.a: "……"
 DOP_GNG_event.160.t: "一场普通的外事访问"
 DOP_GNG_event.160.desc: "这是一场再普通不过的正常外事访问，至少名义上如此，盛田没有在这件事上下太多的宣传笔墨，以免造化弄人，时运不济，在共荣圈内出丑不说，还会给在商界、政界虎视眈眈的那群家伙留下不必要的把柄。因此，这必须是一场普通的外事访问，也只能是一场普通的外事访问。\n\n回到这片名义上是他家乡的故土并没能给他带来怀旧的感觉，他的全部过去早已经汇聚成一个名为井深大的实体，在立法会等着他的失败，等着对他大呼小叫，痛骂他的决策要多白痴有多白痴。\n\n他坐在车上，翻阅着日程表，逐一清点着待办事项，作为行政长官和作为社长的事情混成一团，鳞次栉比地排列在他手中的文件上。上午要去为索尼日本的新工厂剪彩，下午又要出席共荣圈各国的多边会谈，他几乎要质疑自己是否还有足够的精力去面对这次出访真正的正题了。文件被随车的秘书重新收好，他摘下眼镜，靠着窗凝望着东京的街景，满心都是随着电子时钟上数字的跳动而逐渐靠近的，他与大藏省官员都会参与的晚宴。\n\n作为一个企业国的领导人与这种经济部门进行私会，并不符合约定俗成的外交礼法，也难免会要惹人非议，可要是要进行货币改革，就非得试探清楚他们的态度不可，看看他们到底是惧怕广东脱离控制，还是乐得看着泛亚主义的造物结出硕果，再据此对于货币政策进行微妙的调整，才能免于激怒这群选择性保守的官僚们，让广东赢得它应有的未来。\n\n他将在暗里觥筹交错，一次又一次。"
 DOP_GNG_event.160.a: "……"
 DOP_GNG_event.161.t: "工作前的会议"
 DOP_GNG_event.161.desc: "稍早一些的时候，李嘉诚坐在会议室的主座上，环视着坐在房间内的几位董事。这不是什么公开会议，甚至连日程栏上都没有这条，入席的几位也大多都是潮汕人，和他一起从塑胶制品厂开始摸爬滚打的亲信。\n\n在被窗帘遮盖的巨大落地窗之外，朝阳才刚刚升起，如果有一位花边小报的记者能赶得上趟，坐在太阳上，借着日光从窗帘的缝隙中向内偷拍一张的话，无疑是对“深层政府秘密会议”云云的报道最好的注脚了。\n\n“这里都是自己人，一会儿也都还有别的工作，我就开门见山地长话短说了。”李嘉诚摘下他的眼镜，放在手边，轻轻敲了敲桌子以示意会议的开始，“我们觉得我们要调动市场，尤其是股市的积极性，来吸引更多投机者把日元换成广东圆入场投资。算是变相加强投资者对广东圆的信心，你们的意见呢？”\n\n“同意。”，“对。”几声稀稀拉拉的应和声传来。\n\n似乎是本就没有预留什么时间给其他人，李嘉诚只是顿了一顿，便继续往下讲，“所以我认为我们所有人，得着手推高几支大头股票的股价，放出利好做多的消息。颂声，你怎么想？千和？好，假如没人有其他的什么意见的话，那就这么定了，我希望在一个星期内能看到结果，这是为了广东，也是为了我们自己，就这样。”李嘉诚戴上眼镜，站起来环视一圈房间，对着他的亲信点点头，就这么推门出去了。\n\n只留下心事重重的执行者们。"
 DOP_GNG_event.161.a: "……"
 DOP_GNG_event.162.t: "逸散在空气中的问答"
 DOP_GNG_event.162.desc: "红裕美是数着路灯下盲道的格子到家的。\n\n从楼下就能清楚地看到家里并没有点灯的事实，她是一家三口里第一个到家的。学校要开教职工大会，自己的母亲要晚些回来，这她是知道的，至于父亲的情况……她大概也能猜到一二。\n\n这个猜测很快地就被客厅餐桌上的一张便利贴以及那之下的几张广东圆证实了——“出去同交易所的朋友们吃饭，妈没回来你自己下楼买点吃的”。她把便利贴扯下来，揉成团，丢进垃圾桶，点了点钱，比想象中多些，是因为最近股市行情好吗？\n\n红裕美没有那个运气生在东京或是大阪，就算她年纪尚小，对于股票也不甚关心，多少也会有些耳濡目染，近日里，高年级生们似乎也常常聚成一团，盯着报纸上的股票行情打着口水仗。生在广东就是这样的，不能说她已经习惯于这种生活了，但至少也算是习以为常了。\n\n她把包放下，拿着钱下楼，两个路口外的冰厅算不上人满为患，但几乎一半的人都在探讨着什么“主力做多”、“国家队救市”或者是自己看上了哪支好股这类她所不关心的话题，还时不时就要瞥一眼挂在店里的电视播着的晚间新闻，想从里面找到任何与股市相关的消息，而后再长篇大论一番，吹嘘自己是多么地有先见之明。红裕美显然对这种环境相当不满，只能趴在桌子上，一口一口地往嘴里塞着果汁猪扒饭，眼睛直勾勾地盯着收银台，心想自己以后要是靠写东西赚不到钱的话，干脆就来冰厅打工吧……至少能蹭员工餐呢。\n\n胡思乱想着担忧着不知道是否存在的未来，她的视线一直飘到西装革履的顾客递出的广东圆上，是因为电视里在说着的那些事情的原因吗？好像最近大家又不兴用日元结账，喜欢用广东圆了。\n\n她摇摇头，把奇怪的疑问甩入嘈杂的冰厅之中，并不期待那些讨论着股票的家伙们能有一个有闲暇来给她解答，继续吃她的果汁猪扒饭。\n\n即使是漠不关心的人，也会被牵扯其中。"
 DOP_GNG_event.162.a: "……"
 DOP_GNG_event.163.t: "今日头条"
 DOP_GNG_event.163.desc: "“‘奉旨炒股，长实快牛气冲天’……《广东妇人公论》什么时候需要用这样的标题来吸引眼球了？”良子翻看着新一期的报纸样刊，满心是要问高崎编辑的话。\n\n“还不是最近大街小巷都在传什么李嘉诚亲自带着长实下场炒股了，几份其他的报纸上周就已经在登这种报道了，我们还算靠谱的，等到政府做了新闻发布会才正式做报道。考虑到我们的用户群体大多不会太关心股市，才出此下策，试着拓展拓展读者，不也挺好？再说了，这不就是泛亚实践大获全胜的最好证明嘛，我们的读者会喜欢听到经济欣欣向荣的话的。”高崎坐在椅子上，歪着身子整理着桌面上散乱的资料，心不在焉地回答着良子的话，时不时还要瞥一眼钟，双眼随着指针转动。\n\n“哎呀，快开市了，抱歉啊，安川，我得失陪一会儿，你要是有空的话，要不去审审看那些新人的稿子？”分针指向五个字，高崎腾的一下站了起来，匆匆忙忙地向良子道着歉，一只手上的报纸还没来得及放下，一只手就急着拿起听筒，歪着头夹在颈窝里，再娴熟地按起打给交易所的电话，随时准备询问最近股价。似乎是发觉自己于上班时间在下级面前这么干有失体统，高崎不好意思地笑了笑，补上一句，“大家都在关心这个呢。”\n\n良子彬彬有礼地鞠躬，决定不再打扰高崎编辑在这会儿进行他的炒股大计，她回到自己的办公位上，坐下后盯着那份写着“李嘉诚出面回应近期长实股价牛市：系政府为新货币政策打基础过程中合理技术调整”的报道，出神许久。虽然写得如此冠冕堂皇，但至少也在新闻战场上搏杀许久的良子多少也能看得懂潜台词：长实意图暗中操控股价，结果露了马脚，被迫在明面曝光，结果股民们闻着味儿就跟上来了，要是不想股市转入利空的局势的话……\n\n她猜长实要大出血。"
 DOP_GNG_event.163.a: "……"
 DOP_GNG_event.164.t: "巨蛛食鼠"
 DOP_GNG_event.164.desc: "“全部踎低，双手抱头(全部蹲下，双手抱头)！”离得远远的，林巧川便听见空阔的屋内传来粗犷的叫喊声。他大步流星地走进眼前那个已经站满了刑事局搜查二课的刑警们、还有他在警备局一课的手下的仓库。面对一路上那毕恭毕敬的一声声“一课长好！”，他总是以微笑回应，毕竟，这么多年来的平步青云，已经将右迁带来的新鲜感与兴奋消磨殆尽，剩下的只有感叹：曾几何时，他也曾经是这些低着头兢兢业业的小人物呢？“林课长！”，一声呼唤将他从回忆拉回了现实，那是刑事局搜查二课的后藤课长——那个总是一脸让人捉摸不透的神情的家伙，而现在，他的脸上却是喜形于色，炽热的眼神透过镜片都能让林巧川感受到他的兴奋。“后藤君，现在情况怎么样？”，虽然脸上还是挂着微笑，但是说实话，林巧川并不喜欢眼前这个四眼：这个家伙很细致谨慎，但这份细致入微和洞若观火却不总是放在本职工作上，能走到今天这个位置，你根本不知道他靠收集人事情报和黑材料把多少人挤下了独木桥。“你的部下果然名不虚传，行动很迅捷，这些人渣根本来不及清理掉他们的罪证。”，后藤得意地随手拿起一本账目，翻开一页，“你看，兑换，美元、马克、日元，应有尽有啊，啧啧啧。你看这个兑换比率……”，他一边翻阅着，一边微微摇头，完全不掩饰嘴边的鄙夷，但林巧川明白，这并不完全是对金融犯罪的憎恨，更多的可能是这个自视清高而刻薄的家伙对自己手下败将的嘲弄罢了。然而不管林巧川对眼前这个四眼田鸡有多不爽，这也不会改变他的仕途似乎将一路坦途的事实：如今随着立法会与民政府的新决策，执法部门的打击矛头指向了广东那荼毒甚远的地下黑市和货币网络，这势必意味着金融与企业犯罪应对部门会得到加倍的器重。而后藤这个嗅觉敏锐的家伙也许也将借这场东风将自己送上刑事局局长的位置，更何况，他现在指挥捣毁了全广东最大的地下货币兑换网络呢……“对了，林君。今晚我和澳门这边的刑事部的伙计们有场聚餐，你要不要也一起来喝点？”，后藤终于抬起眼，看向眼前的林巧川。“不了，”林巧川微笑着摆摆手，“我还要赶回广州，公安那边又给我们找活干了。”，这也算不上推脱，毕竟打击金融经济犯罪并不是他的本职工作，他现在可还得应付公安那边的混蛋，这才是每周最头疼——也最违心的活。\n\n“幸好这家伙和我不是一个系统的……”"
 DOP_GNG_event.164.a: "……"
 DOP_GNG_event.165.t: "央行新布告"
 DOP_GNG_event.165.desc: "长江实业的金融部门总是要开会，还是大会，哪怕李慧只是一个小小的文书，也必须按时出勤，没办法，谁叫她在一个一切以经济数据为重心发展的国家呢？每一项经济措施都和他们的生活与事业息息相关，对于广东两大巨头之一的长江实业而言更是如此。\n\n央行派来的经济顾问正在台上，敲着白板介绍着央行近日来推行的“汇率保证制度”，也不知道到底是为了向这些早就知道这是个什么制度的人把它拆开了，揉碎了复读一遍，还是特别来向他们这些金融业者做思想工作，让他们想办法多拉几份投资的。\n\n“因此，央行需要保持足够的总结余，至少在近几个月内要减少资金外流的可能性，并考虑向我们的合作伙伴们发行适当份额的债权或是基金，以保证在货币改革之后较长的一段时间内，能将日元和广东圆的相对汇率维持在一个相对稳定的区间内……”\n\n那个顾问还在讲这个讲那个，像是有说不完的废话，而李慧的思路已经早就飞到九霄云外去了，她手边没有资料，做不了太过精密的计算，只能根据过往自己的经历尝试着去推算，去推算政府的公信力到底是否足以做出这样的“保障”，去推算过去数年的GDP增长率，通胀率，赤字，外债，如此这般，如此那般，她像是一个初出茅庐的投资者，站在广东之外，细细地审视着它与它的二十余年发展历程。\n\n她最终得到了一个结论，她大概有六成把握的结论——她相信那位顾问的结论与自己的应该大体相同，说不定把握还要更大些？无论如何，面对势必到来的货币改革，她眼中的央行公信力……\n\n……足够这么一项措施的推行。\n\n……也许不足以取信于投资者。"
 DOP_GNG_event.165.a: "……"
 DOP_GNG_event.166.t: "事前准备"
 DOP_GNG_event.166.desc: "这并不是出井第一次坐飞机。自从他从欧美的索尼支部回来，升任对外事务部部长之后，他除了汽车之外坐的第二多的交通工具就是飞机。今天飞华盛顿，明天就飞日耳曼尼亚，后天或许又要去里约热内卢或是布宜诺斯艾利斯，再加上时不时就要突然从东九区传来的紧急通讯，他的生物钟几乎就没有过一天安稳假，也只有像今天这样的短程飞行，才能让他在从香港飞向东京的航程中好好地在飞机上打一个不用于调整时差的小盹儿，以保证他能完整地进行将要在不久后发生在港区索尼分部大楼会议室的高强度谈判。\n\n盛田——确切来说，盛田昭夫行政长官，而非盛田昭夫社长，此时已经赶往千代田，忙他的“外事访问”工作，和那群年纪赶得上做他父辈的老家伙们打着太极，与诸财阀派出的代表交涉的任务也便自然而然地落在了出井的身上。\n\n坐在专车上从机场赶往分部大楼的出井此时正聚精会神于手上那厚厚一沓的资料，过去几年间索尼在日本市场的成就，三井、住友、三菱这三大在安田危机后依然屹立不倒的财阀对他们的态度，关于它们派出的谈判接洽代表的调查报告……诸如此类。\n\n半个小时后，他会到达位于分部大楼的办公室，开始在电脑上根据最新的信息修订他的谈判草案。\n\n一个小时后，他会打开有关央行外汇储备的内部文件，再次重新估算这次谈判索尼方的底线是否还有任何其他的调整空间。\n\n两个小时后，他已经翻阅完了近期三大财阀旗下各子公司以及那些被附庸的大企业的最新产品，与索尼目前主营业务的比对已经完整，这次谈判所能达到的预期成果上限已经初有眉目。\n\n两个半小时后，他打开了会议室的门。"
 DOP_GNG_event.166.a: "……"
 DOP_GNG_event.167.t: "虎落平阳"
 DOP_GNG_event.167.desc: "“出井先生，贵方的需求我们已经基本清楚了。”三菱代表冷清的声音把出井从紧张地快速计算中拉回现实，看来他们已经结束了商讨，决定给出一个答复了。\n\n在此前的某个刹那，公司年会的记忆曾在出井喘息的空隙中一闪而过，那是65年还是66年来着？他那时候还年轻，进入索尼干了五六年，勉强算是个中层管理，听着盛田社长在台上谈论着建立日本分部的不易——住友和三井不屑一顾，三菱派来了一个无名小卒，在电视业上与它们针尖对麦芒的东芝特地派来了两名代表来看乐子。他是在那场年会之后坚定自己要在对外事务部里好好干，积极帮索尼拓宽海外市场，不使盛田社长的创想被那些食古不化的本岛财阀所掣肘的决心的。\n\n已经过去十年有多了，索尼的触角遍及世界各地，几乎可以称得上是享誉全球了，可是唯独在这里，索尼社长的出生地，索尼所统治的国家的友邦，由索尼的高新技术所制造出来的产品却难以在盘根错节的财阀网络中找到自己的位置。是的，盛田在这儿有些许旧怨，但在商言商，倘若索尼的产品真的无可替代，即使是东芝那种家伙也会对着盛田卑躬屈膝，而不是像现在这样，一切仿佛都是可有可无的，索尼的产品在日本可有可无，索尼的计划在日本可有可无，这场谈判当然也是可有可无。\n\n“遗憾的是，在一些关键问题上，我们也许仍然需要一些考虑的时间。让我说直白些吧，相当一部分的投资人在怀疑贵方是否真的有达成一些特别的政治性目标的能力……希望我们能在未来的会议中进一步地探讨相关的问题。现在，请容我先失陪了，我还有另外的事物需要处理。”\n\n他头也不回地与其他代表一同离开了。"
 DOP_GNG_event.167.a: "……"
 DOP_GNG_event.168.t: "一手交钱，一手交货"
 DOP_GNG_event.168.desc: "“我得说，盛田社长在过去几年间的努力与成就是我们有目共睹的。”三井代表推了推他的金丝眼镜，一副公公正正的样子对出井笑着点了点头，“就算是我们旗下的东芝引以为傲的产品在有本土优势的情况下，有时候也不得不承认盛田社长的胜利呀。”\n\n先示敌以弱，再借着嘴皮子上的便宜来在谈判中得到实际的好处，出井已经见过不知道多少个惯于使用这招的笑面虎了，自然不会因此就飘飘然。不过借着这个话题，他倒是有机会预先抛出一项他早就准备好的价码——所有人都知道，日本的电视制造业这几年来完全就是一副龙虎相争的态势，索尼日本分部与东芝的职员没有一刻是不想把对手生吞活剥的。\n\n出井并不是不在意索尼日本的那些员工的心态，可在广东的利益面前，分公司所面临的困难也只能稍稍往后几步了，不，他更喜欢称其为“以退为进”，毕竟，要是广东能进行一次成功的货币改革，其连带影响也足以再让一个就在总部势力范围内的分部的业务再攀高峰。为了更大的利益，适当地出让一些市场份额完全在可接受范围之内。\n\n“您过誉了，索尼的理念一直都是以和为贵，我们与东芝之间应当少点隔阂与争斗，多点合作，为人们提供更好的产品才是。”他对着三井代表使了个眼色，“为了表达诚意，如果诸位有意愿的话，我们愿意与诸位一起组织一次技术合作交流会，以实现互利共赢。以及在这里，这里，还有这块地区……”\n\n出井向几位代表规划起了利益分配。"
 DOP_GNG_event.168.a: "……"
 DOP_GNG_event.169.t: "和气生财"
 DOP_GNG_event.169.desc: "“这次出井先生能拨冗出身前来与我们探讨，真是再荣幸不过，依我看，我们这些本岛企业有时也要多跟你们这些优秀的广东企业来往，这才算得上是搞泛亚经济嘛。”大腹便便的住友代表一上来就打起了官腔，打断了刚要开口的三井代表与他那一脸有些勉强的笑。\n\n“哪里哪里，索尼还只是新生的企业，近几年也不过是正好赶上了好时代才做出了点成绩，要我说，我们也应该跟诸位前辈多多互通有无才是。”出井倒也不介意在这时候谦虚一些，毕竟，就算是那个四大——现在是三大——财阀之首的住友也没能阻碍索尼在日本大展身手，如今还破天荒地派人主动来谈合作，这就已经是一种谈判成功的征兆了。余下的工作不过是尽可能压低索尼开出的价码，而抬高索尼得到的好处罢了，最好是不伤及分部在这里的产业，还能变相地让索尼获利，也卖这些本岛财阀一个人情，好把他们也一并绑上索尼的船。\n\n“要是那样的话就再好不过啦。”住友代表乐呵呵地点点头，“我和这两位代表在出井先生到之前也简单谈过了，大家也是都希望多多交流合作，和气生财嘛。”\n\n“和气生财，和气生财。”出井一面招呼着秘书向几位代表分发资料，一面也笑着跟住友代表打着太极。他在来之前便已经跟盛田几次谈过这次谈判可能的几种发展方向，眼前的这种也不在例外，在索尼想要把三大财阀拉上战车，为自己的改革铺路的同时，这帮人也想着从日头正盛的索尼名望里分一杯羹。他依稀记得，他们最后的讨论结果是……\n\n三菱的经验会对自卫队的发展很有帮助。\n\n拿下三井旗下的半导体技术也许大有裨益。\n\n我们需要住友的更多投资。"
 DOP_GNG_event.169.a: "……"
 DOP_GNG_event.170.t: "最后一场大会"
 DOP_GNG_event.170.desc: "开会，开会，还是开会，从决定开始推进货币改革一事开始，盛田和李干的最多的事情就是开会，要不就是派人出去开会。这会是近期内的最后一场大型会议了，如果不出什么意外的话，他们所有为了推进人们对于广东圆的信心，以不使它们成为可有可无的巨企游乐园代币的努力，将会在今天被验证。\n\n与会者很多，想进入会议房间而不得的家伙们更多，盛田和李此前的几天几乎已经完全不在公众场合出面，生怕被哪位渴求着搞出个独家大新闻来的记者逮住。\n\n行政长官，政府内各司司长，央行行长，日本驻广大使，大藏省来的官员，诸如此类的十余人就坐在会议厅中，面对着一份又一份的资料与报告，将要敲定广东圆这一即将迎来重生的货币的结局。这甚至也许是这群人聚在一起时最不“政治”的那么一个瞬间了，消费者对于广东圆的信心以及最终经过一番分析和讨论拿出来能让各方都满意的结果始终是相对客观的，不以改革意图有多激进或是本岛有多么想当那个把控一切的大家长做转移。\n\n会议持续了多久？盛田自己也没算时间，唯一能确定的是，当他有闲暇抛开思考，指挥着自己的手给自己来上一口水时，他已经快要走出门外，面对媒体的长枪短炮了。\n\n稍微润了润喉咙，就又是马不停蹄的即兴新闻发布会。挤在人堆前列的那几个把话筒和摄像机举得最高的记者他各个都眼熟，想必只要他一开口——甚至都不用开口，毕竟“沉默无言”也可以写进头版头条——关于这一切的报道就会传遍广东的大街小巷。\n\n仔细斟酌了一下用词，他最终还是决定在此时此刻宣布结果。\n\n我们达成了一些初步成果。\n\n广东圆将在未来有着更广阔的前景。\n\n我们将不日对外开始发行国债。"
 DOP_GNG_event.170.a: "……"
 DOP_GNG_event.171.t: "家校沟通"
 DOP_GNG_event.171.desc: "说实话，和子一点都不想接她父亲的电话，一点都不想，她想都不用想就知道那家伙一定又要端起“成功人士”的什么架子，来对自己好好说教一番。\n\n话是这么说，电话还是得解，毕竟老师就在她面前，殷勤地看着她呢，要是待会儿因为心烦意乱而用错了敬语，指不定那个老家伙还得执行执行作为一家之主的权力，把说教时间延长数倍呢。\n\n“和子啊？听得到吗？诶，听得到就好咯。爸爸跟你讲啊，最近广东要有大变化啦。盛田先生最近进行了一次货币改革，现在广东圆可是个宝咯，走出了国门，在欧美兴许比日元还要招人喜欢呢。你呀，在学校也要多多关心这种事情，不能只顾着死读书，也要多多结交朋友，了解了解一些很有必要的消息，这在以后都是你的资本啊。”电话的那头是大仓昭彦不厌其烦的唠叨，她每听一句，都得花上好些意志力来劝自己不要打断他，并用“爸，你就别管这么多了”作答。\n\n“好的，父亲大人，我会努力的。”她只是这么说，她只能这么说，即使她早已知道——或者说，她以为自己知道——盛田行政长官新推出了个浮动汇率制了，在答复她的父亲时，还是得演出一份毕恭毕敬的模样，满足他照顾子女，指导子女的这一精神需求。\n\n昭彦又说上了几分钟才让她走，内容从打听她在学校所交的朋友到询问最近一次数学考试的成绩不一而足，话还是翻来覆去那么几句，她的耳朵都几乎要听得起茧子了，要不是上课铃声终于响起，把她从地狱里解放出来，她还指不定要听更久的唠叨呢。\n\n她赶忙迈开腿，向老师鞠了一躬告别之后就往教室的方向跑，进门时正巧赶上对于货币改革一事兴奋不已的数学老师对此滔滔不绝地发表着看法，得益于此，她安全地回到了自己的位置上。\n\n也许每个人都能从改革中得到点好处。"
 DOP_GNG_event.171.a: "……"
 DOP_GNG_event.172.t: "釜底抽薪"
 DOP_GNG_event.172.desc: "李嘉诚给盛田倒上一壶茶，随后将他起草的《修订广东民族条例》递过去。“我必须提醒你，那个被我用红墨水圈出来的部分，最好不要有什么改动。”盛田的目光随即看着红墨水圈着的一句话：“广东国内拥有正式身份的华人和珠人不论血缘与地缘，一律被视为广东国公民，享有平等权利。”\n\n“你的意思是要把那些外地华人也算进公民的行列？”盛田扬了扬眉毛。“没错，只有这样，他们的权利才能得到保障。我们经不起第二次、甚至第三次潮汕事件带来的冲击了。这是我和广工联、华工委的那些人，甚至还有何鸿燊手下那帮恶棍商讨来的结果，他们都希望广东能把外来华人当成亲兄弟一样容纳进来。”\n\n见李嘉诚态度很坚决，盛田放下草案，一言不发。“昭夫，这份条例本就是为了解决外来人口进入带来的民族问题而修订的，你既然决定承认将华人视为主体民族之一，你就不可能分化这个有着民族认同的群体。”\n\n盛田依然靠在椅子上，思索着什么。\n\n“……现在很多人，包括一部分本地华人，都歧视这些外地人。甚至有人认为他们是‘外国人’，不受广东法律保护。昭夫，我们承担不起第二个、第三个潮汕事件了。如果不在法律上保护这些外地人的权利，他们的怒火也足以吞噬整个广东，那不就正中那些恐怖分子下怀了？到时候那些游击队发展壮大，东京又会怎么看待我们？永野会不会又带着日军去搞什么‘清乡运动’？到时候就是真的两头不讨好了！”\n\n见盛田还是一言不发，李嘉诚陪着他“静坐”了一会儿。“你不说话，我就当你同意了？”李嘉诚试探性地发问，而回应他的还是沉默。"
 DOP_GNG_event.172.a: "直到李嘉诚离开，两人都再没说一句话。"
 DOP_GNG_event.173.t: "见见你的新上司"
 DOP_GNG_event.173.desc: "重提安保改革一事让很多人感到惊慌。不少人知道这又是一场大规模的清退和人事调动，而林巧川做梦也想不到，他这个职位居然也是调动的对象。\n\n按照新规定，现在督察以上的职位需要定期轮换，低层的警员们同样会被打乱分散到各地，这无疑是想让警察之间兵不识将、将不专兵。归根到底，还是为了防止警队里边搞小团体，威胁到稻叶的统治。\n\n林巧川这次轮到澳门。警局内的老友们都在互相道别，林巧川和几个老伙计告别，再跟留在警局的朋友们交代了几句后，就准备回去打包行李。但他还是想到了一个人——安川良子。\n\n林巧川开车去编辑部找良子，正好在路上就碰到她在采访几个站岗的警察。待她采访完后，林巧川走到她面前，告诉她他被调到澳门的事。\n\n“啊？我以为你还留在广州……”良子的神情有些失落。“不过，珠三角之间有新干线，澳门也不算太远。”\n\n这句话不知道是良子在安慰自己还是在暗示林巧川什么。\n\n“呃……总之接下来一段时间我可能都不在广州，你自己照顾好自己，有问题的话继续打之前那个电话号，电话机我会一起带走。还有……”林巧川拍拍她的肩膀。“我放假会回来看你的。”\n\n在又安慰了会儿良子后，林巧川回到公寓打包好行李，坐上了去澳门的新干线。\n\n坐进新办公室，林巧川多少感觉有些不自在，警局内的人大部分也不认识。理论上每三个月要轮换一次，而以林巧川的经验来判断，三个月大家最多能喊上名，至于要发展出默契什么的，那绝对不可能。\n\n他下班时，门外的警员们见他出来，都纷纷敬礼喊“长官好”——以前林巧川在广州时候，很多熟悉他的人不论官职大小，都没这么机械般地喊过他。或许这就是政府里那些大人物要的效果吧？"
 DOP_GNG_event.173.a: "如果是这样，那他们办得还真有一套"
 DOP_GNG_event.174.t: "新的王储？"
 DOP_GNG_event.174.desc: "松下和盛田的聚餐不那么频繁，因为松下更喜欢把时间和精力花在扩大松下的业务上，而非处理政务——或者说随着松下幸之助的身体越来越差，他必须尽快发展松下广东支部，以让自己手里的筹码更多。而今天的聚餐是松下主动提出的，说有要事与盛田商量。\n\n这顿饭很简约，只有几道广东菜和两份寿司，而且还是在松下家里。老实说盛田很少去别人家里，即使是李嘉诚家他也只去过几次，所以他见到幸子时很拘谨，让松下看了乐子。\n\n饭间，松下终于说出了这顿饭的目的：“盛田，我要离开广东了。”\n\n“啊？”盛田有些惊讶。“幸之助老爷子准备退休了？”松下点点头：“没错，再过几天就会有人来接替我经营松下在广东的所有业务，我希望你能把外务司司长的位子也留给他。”\n\n盛田思索了一下：“给我个理由。”“此人心思缜密，足智多谋，唯一的缺点就是自命不凡。虽然我知道你和这种人很合不来，但我还是希望你能和他打交道。他比井深和驹井好应付，对吧？”\n\n确实如此。盛田答应了下来。“时光真快啊，一转眼都有三十年了……突然要离开这还有点舍不得。”松下略有些尴尬地笑笑。“得了吧，你是舍不得这里的钱！”盛田开了个玩笑，松下也识趣地笑起来。“对了，你还没告诉我这人的名字呢，新来的这家伙是谁啊？”盛田问道。"
 DOP_GNG_event.174.a: "“他叫山下俊彦，松下董事会成员之一”"
 DOP_GNG_event.175.t: "蒙旧日恩泽"
 DOP_GNG_event.175.desc: "“叮铃铃……叮铃铃……”等到电话响了三下后，盛田才举起话筒：“喂？”盛田并未将话筒对着自己的耳朵，而是摆在桌上以让对面的松下正治也能听见。\n\n“是盛田行政长官吗？”电话那头传来一个有些虚弱，但还算得上精神饱满的老人的声音。“在下松下幸之助，久仰大名。犬子正治已经将阁下的合作申请交到松下大阪总部了，董事会对与索尼合作一事很感兴趣，特别是关于数码相机的研发工作，以及合作研发的录音机发布这两样东西。他们希望靠这些狠捞一笔。”幸之助的声音有些愉悦，很明显他也是这么想的。“那承蒙各位关照了。”“行政长官就不要说这些客套话了……对了，正治在旁边吗？”\n\n盛田抬头看向松下，而松下则在疯狂摇头。“呃……他不在。”盛田忍住笑意回道。“唉，正治这小子。盛田啊，我实话告诉你，你当年那台TR-56可是把所有人都整惨了——包括正治。”盛田马上准备开口转移话题，但松下只是轻声说了句“不需要”。“……1956年后，他就在广东拼了命地干活，想让松下可以超越索尼和富士通，成为广东乃至中国市场的霸主。虽然现在看来他做不到，但每次我看到松下广东分部的营业额持续走高时，我还是很开心。”幸之助说着，语速越来越慢，仿佛陷入了回忆中。“按之前几任行政长官的任期来看，一个企业主导立法会，定然会排挤其他企业，但今天索尼和松下却能达成战略合作。盛田长官，你是个善良的人。正治应该也会感谢你，因为你让他更有信心在我退休那天，回到日本来接管松下。但老实说，除了他，我还有谁可以信赖呢。”\n\n几分钟后，电话挂断，盛田看着面前苦笑着的松下，给他倒了杯水：“好啦，幸之助老爷子这么信任你，你估计待不了几年也要回大阪了。就按咱们的计划走，你安分一些，我可以考虑再从其他地方扣点资源给你。”"
 DOP_GNG_event.175.a: "松下点了点头，将水一饮而尽"
 DOP_GNG_event.176.t: "国际舞台上的广东"
 DOP_GNG_event.176.desc: "“伊朗的石油已经运到胜利港了……”\n\n“对，对，这批货要发到罗马去……”\n\n“……什么？土耳其又加购五十台计算机？他们下次能不能一次性买完？”\n\n“你他妈告诉我这批货是运到俄罗斯的？”\n\n外贸署的每天都是忙得不可开交，这主要是因为广东与全球各国的邦交正逐步正常化，原先仅仅只靠公司拓展的海外业务，也逐渐上升为国家间的贸易。\n\n在五巨头都同意后，各公司的销售网络就被整合成了广东的贸易网络，以让广东从中获益。但这并非没有代价的，松下、富士通和日立会因此得到一定的税额减免作为补偿，但这总比让他们把钱全吃进肚子里好。\n\n此外，广东已经被国际上视作华人最后的聚居地，主要是因为难民和盛田政府的政策，导致大量华人涌向广东，而盛田政府也向海外华人商会或其他组织表示，广东会尽可能保障境内所有华人的生计问题。"
 DOP_GNG_event.176.a: "让全世界都认识广东吧！"
 DOP_GNG_event.177.t: "市场监管"
 DOP_GNG_event.177.desc: "“我是广东放送协会的记者吉田，现在我身后是松下旗下一家涉嫌偷税漏税的子公司，目前警务处和其他相关部门人员已经进入公司内部……”\n\n松下关掉了电视，随后瘫在沙发上。自从盛田下令全面审查广东企业以来，松下的影响力都在逐渐减小。一家家公司被处罚甚至关停，有时候甚至要牵扯到松下自己，盛田那家伙在搞什么东西？\n\n电话响了，他漫不经心地接起话筒：“喂？”“松下，你那边什么情况？”冷冰冰的声音，是井深没错了。“两周之内十九家公司，你呢？”“……十三家。”“……那你还真是够清白的。”“咱们比驹井好，驹井自己都被立案调查了。”\n\n好啊，现在连总裁都没法保全自己了，看来五巨头又要变回四大巨企了。“……没事，盛田不敢直接拆掉日立，毕竟东京和财阀们和日立有关系。我不想花时间去骂盛田昭夫那个混账，那么长话短说，你觉得我们该怎么办？”\n\n怎么办？反正自己给山下俊彦下令他也听不进去，估计他会嘴上答应几句，挂掉电话后又在想一套自己的方案出来。“中国人有句老话叫‘不在其位，不谋其政’，你要是有什么事，就去找山下谈吧。”言毕，松下挂掉了电话。\n\n“操。”井深低声骂了一句，他知道山下是个独行侠，肯定不会和他合作。但出乎意料的是，山下在半小时后就出现在了他的办公室里。\n\n“井深先生，我记得我之前说过，我这个人以松下利益为先，谁的议题有利于松下，我就站谁那头。”山下的眼睛透出一股精明。“所以，我现在需要和你，还有驹井健一郎先生谈谈。”\n\n“驹井一时半会儿来不了，我想我们俩可以先谈谈。”\n\n“那我们就谈谈怎么搞垮盛田吧。”\n\n“……你认真的？”"
 DOP_GNG_event.177.a: "“放心，机会马上就会出现了”"
 DOP_GNG_event.178.t: "人工心脏"
 DOP_GNG_event.178.desc: "井深缓缓摇下车窗，微微探出头去，在车队的四周，是一片尚且处于发育阶段的钢筋水泥丛林。\n\n一想到这，他就不由得被自己那古怪而又阴暗的联想逗笑了，既然这里是丛林，那那些在脚手架上爬上爬下的大老粗岂不是大猩猩吗？不对，不能这样想，那个家伙告诫过自己要“设身处地地为国民着想”。\n\n这也便是为什么他要出这趟远门的原因之一：盛田反复要求他亲近、关心大众，至少应该看起来像是这样。但是更重要的是：他要亲自看看自己作为新任政务司司长到目前为止最大的杰作——也许会塑造这个国家几十年甚至百年的命运的新城建设。\n\n“司长阁下，这边就是产业园区对应的住宅社区，按照我们的规划，这一带的住房将针对工程师和高级技术人员以及中层以上的行政管理雇员。而相关的公共设施和服务也将按照我们的规划进行布置……”\n\n他一边听一边微微点头，谁也不知道他究竟听进去没有，或者听进去了多少。虽然距离较远，但是他却冥冥之中有一种感觉：那些工地上忙活的人看得见自己，就像自己看得见他们一样。\n\n他们是怎么看待自己这个走马上任的“政权二号人物”的？哪怕是他也知道，在许多人的印象、以及华人人口的心目中，政务司司长依然是李嘉诚那个潮州佬，他为奋斗者带去了繁荣，为弱者提供了庇护所。而相比较之下，他简直是一个魔头，用堂皇冠冕的“时代进步”的话语和新兴的工业机器，将许多人的饭碗摔得粉碎。\n\n“蠢货们就走着瞧吧……”，井深捏了捏拳头，但他也回忆起这份规划方案最终敲定前的情形：他和自己的亲信们一度固执地要求要按照居民职业和产业类别将人口的分布切割成精细而紧密连接的板块，而这却遭到了盛田的当头呵斥甚至一众下属挖苦般的劝解。而自诩天才的他们却在为自己的辩护过程中将自己的“不食人间烟火”暴露得一览无余。\n\n一想到这里，他便绷紧了神经。这场闹剧最后以一个相对折衷的“个人意愿优先”收尾，该死，还附带上了一大堆旨在促进“同质人口”的激励性条款。\n\n罢了，至少这件伟业将得以推进，待到这世间罕有的巨构完成，它将成为广东甚至亚洲技术进步的引擎，甚至就像那方舟一样，承载着来自全国各地的火种，在危难时刻成为唯一的炬火。"
 DOP_GNG_event.178.a: "自上而下建立的城市？闻所未闻。"
 DOP_GNG_event.179.t: "官逼“民”反"
 DOP_GNG_event.179.desc: "如果有人看到井深大坐在索尼总部的会议室里和盛田昭夫谈话，那他大概会觉得自己疯了。但今天这确实成真了。\n\n井深这时刚发完脾气，坐在他面前的盛田则黑着个脸——不仅是因为自己淋了井深两小时的口水，还因为精神带来了一个令人恼怒的消息：今后政府的产品研发将投标决定。关键在于，这不是巨头间相互投标，而是全广东的公司共同竞争——至少明面上是大家一起竞争，可只要结合这段时间稻叶的种种行为就知道，这几乎是拒绝将开发资金交给巨头们。\n\n“盛田，我没想过我会这么说，但我觉得我们该联手了。稻叶这家伙绝对是冲着我们来的，你觉得呢？”井深看着一脸无可奈何的盛田。“我也这么想，但……咱们能成吗？”盛田摸了摸下巴。“一定能成！我、你、再算上李嘉诚和松下……鬼知道那家伙什么态度。驹井那混蛋搞不好也要加入，咱们有的是办法跟他斗！”\n\n在盛田记忆里，井深上次跟他这么说话已经是大概三十年前准备创立索尼的时候了。他确实没想过和井深联手，但既然有家伙爱管闲事，那他们就尽管来吧！\n\n“好，我去和嘉诚讲讲，你去试探一下山下，驹井那家伙让他自己来找我们，我才懒得找他。”盛田说罢，伸出了一只手：“井深，希望这一次 你我别再因为什么鸡毛蒜皮的小事就又起矛盾了，这可能关系到我们的性命。”\n\n井深瞥了一眼，握住了盛田的手："
 DOP_GNG_event.179.a: "“当然不会”"
 DOP_GNG_event.180.t: "“弃暗投明”"
 DOP_GNG_event.180.desc: "监牢的大门被拉开，松田起身看着站在门口的狱警，咧嘴笑了笑：“呵，怎么，终于要把我处理掉了吗？打仗要打输了？是要杀了我？还是要把我拉去当炮灰？”\n\n狱警脸上露出厌恶的神色，但还是把他从床上拽了下来：“别贫嘴了，现在确实要把你送上前线，但我们会给你提供装备、食宿和训练。”“哦？条件这么好，怕是只给我一杆枪、几个弹夹，可能还有几个手榴弹，就这么把我打发走了吧？”\n\n“……不，到地方你就明白了，起来吧！”狱警把松田一把拉起，然后拉着他出了监狱。\n\n军营和监狱也没什么区别，无非就是把平常的工作换成了军事训练，以及在这里不会平白无故地和其他人互殴。但是松田并没有什么惊奇的，这在他意料之内。盛田昭夫现在和东京站在一起，那定然要和他们这些极道分子打好关系——天知道他干这些事，三合会会不会平白无故给他一巴掌。但对于盛田昭夫来说，这已经是无奈之举了。\n\n在军营里，松田果然找到了不少以前的“兄弟”们，他们大多是跟着自己一起入狱的，现在又跟着自己一起放出来。还有的人他认识，也是极道的人，虽然从未入狱但还是被拉进了军队，看来盛田昭夫确实没人可用了。而且战后要是给他们授个勋啥的，还能让日本对他有些好脸色。这么干属于是一石二鸟了。\n\n那些军官的训话听着也有些意思。什么“洗心革面重新做人”啦，“再给你们一次改过自新的机会”啦，这些肯定都不是重点，无非就是给他们灌输一些“感恩”之类的观念，让他们上战场跟拼命些。笑死，谁会信啊？不过现在就是所谓的“人在屋檐下，不得不低头。”，也不知道打完这一仗，他们会不会直接出狱。"
 DOP_GNG_event.180.a: "三合会对此又是怎么想的呢？"
 DOP_GNG_event.181.t: "两难境地"
 DOP_GNG_event.181.desc: "“你怎么看？”松下惬意地躺在皮革椅里，看着盛田沉默地审阅面前的那份条例草案。“说实话，我不认为延长数百万劳工的工时和引进日资会对广东的经济有什么帮助，尤其是考虑到我们的人民正在度过最艰难的时刻...”盛田紧蹙眉头，“他们需要的是政府的救济资金，而不是大公司的加班通知单，或者第二天醒来发现自己的店铺要和一大堆更时尚，更廉价的外国货做竞争...”“但政府拿不出钱，不是吗？”松下正治的尖利话语让盛田沉默了。“如果广东政府拿得出你所说的那笔‘救济资金’，现在你就不会在这里，而是去找李嘉诚了。”\n\n盛田继续保持着可疑的沉默，端详着这份条例草案，最终，他决定了：\n\n“我们把目光看得长远一点，中国也是外国，在条例中补上这一部分。”"
 DOP_GNG_event.181.a: "“……我没什么好说的了，就这样吧。”"
 DOP_GNG_event.181.b: "“日本的投资会让我们的经济得到更快的恢复，至于满洲，让他们滚。”"
 DOP_GNG_event.182.t: "来自昨日的同盟……"
 DOP_GNG_event.182.desc: "“二十几年了？哈？”\n\n“如果我是你，我绝对不会有脸再问这个问题……你把那个家伙从满洲拉过来的时候，又有没有想过对这个国家、对我们所有人会是什么结果？”\n\n面对眼前气势汹汹的盛田，井深大捏紧了手上的刀叉，强行让自己冷静下来——为了更恶毒地反击：“我说的哪里有错？你现在有哪怕一个朋友吗？那个姓李的蠢材现在在哪？承认你就是会惹恼身边每一个人吧！每个人都会认识到你就是个两面三刀的混蛋然后往你脸上狠唾一口……”\n\n“你他妈的混球！”，盛田本想大声呵斥，但是他不得不承认，只有在1952年那次会议时，他才未感受到过如此刺骨的悲凉：他没有再去见李嘉诚，而李也没有再来找过他，两人共同签署的那份法律文书就像是二人从此井水不犯河水的誓约，虽然它并不是，但是他们都知道有些东西已经不可挽回。\n\n见盛田怔住而一语不发，井深大的脸上浮现出得胜的微笑，但口舌之快之余，又掩藏不住一丝对眼前人的悲悯，还有来自过往的苦涩。\n\n“可怜的虫豸。”井深端起酒杯抿了口酒，白葡萄酒甚是浑浊，掩住了眼前人的身影，“想必你找我，不会只是为了和“朋友”吃饭叙旧，也不会是想要找一个哭鼻子的对象，你还没那么废物。”\n\n“如果你真是那么窝囊，早就被风暴撕碎了。”，他把这话憋在心里。\n\n盛田的嘴角勾起一丝像是释然又像是无奈的笑，“我在向你提供一个机会，一个用你的方式去塑造这里的一切的机会。”\n\n像是赢得了赌约一般，井深的笑声在夜空中回荡，一开始他还试图收敛自己的得意，渐渐地，他便狂笑不止，“你……你这家伙，哈哈，哈哈哈哈……，除你之外最有权势的四个人，一个和你一刀两断，一个是反目成仇的旧友，一个是懦弱胆小的蠢货，还有一个彻头彻尾的人渣杂种。你完全没得选了，哈哈哈哈哈……”\n\n盛田没有反驳，只是看着眼前那孩子一样大笑的井深，他转过头，俯瞰那片霓虹星空，“我们需要让这个国家继续前进，不管付出什么代价。”\n\n而后，他又看向正从方才的疯狂中缓过神来的井深，“我相信除了我和嘉诚，还会这么想的人，也只有你了。”\n\n井深坐直了腰，“你这……是要我去收拾那个潮州人留下的烂摊子，给你打下手啊，凭什么呢？行政长官阁下……？”\n\n“除了我，谁还能让这几千万人无条件信任、把身家性命都嘱托到他身上？”\n\n闻言，井深认输般鼓了鼓掌，“好啊，行政长官阁下，那么，什么时候开始？”\n\n盛田切下一块烤得有些脆了的牛肉，“先去弄一套像样点的衣服，你得去参加新闻发布会。”"
 DOP_GNG_event.182.a: "……航向明日的舵手"
 DOP_GNG_event.183.t: "黑色遗产"
 DOP_GNG_event.183.desc: "此时李嘉诚的脸上布满了难以置信与苦涩的神情，他实在想不到，也不愿意去相信自己这么多年的老友、商业和政治上的伙伴会变得如此老谋深算而无情。\n\n“孩子，对吧？你把他们当作你可悲的社会实验的目标。”，李嘉诚的嘴角抽了抽，将那一叠文书抛到桌面上。\n\n“嘉诚，话不要说得那么难听。”，盛田昭夫抿了口茶，“这个决定也让我寝食难安，但是你知道的，有时候，我们不能戴着白手套做事。”，言毕，他顿了顿。\n\n“更何况……我们是在为一个本不应该存在的国家注入灵魂。而这对那些孩子也有好处，他们将在幼年时就受到我们主流文化和生活方式的熏陶，等到他们走出校园，他们便不会再像他们可怜的长辈一样，与我们的世界有那么大的隔阂。”\n\n李嘉诚瘫坐在沙发上，脸上是苦涩的微笑，“你用了多久去编造这些谎话来麻痹自己？你知道我们如果真的这么做了，就是在诱导他们与自己的过往、自己的兄弟姐妹还有他们的记忆划清界限。几十年后，这里除了粤语和日语，就不会再有其他的声音。”\n\n盛田还想说什么，却被李嘉诚直接打断：“你想要抹杀一切“不够广东”的文化。但我告诉你，我也是潮州人，我扑你阿母！”\n\n在一旁久久一言不发的何鸿燊忙走上前来，“李生，唔好咁劳气，哈。（李先生，不要那么生气，好吗。）”，他走到二人之间，“盛田，你应该知道于公于私，我们都不能用国家强制力去改变他们的文化传承，对吧？”\n\n盛田没有说法，但他眼神的变化无疑是默认了这个说法。何鸿燊又开口道：“既然如此，我们的做法也无非是在现有的文化政策基础上加以推进，引导国民去积极融入符合我们价值观和所有人的利益的生活方式，让他们不仅仅将广东当作一个容身之所，而是切切实实与他们命运相戚的共同体。”他又回过头来看了看李嘉诚，“当然，在部分条款上我们还需要进一步商榷，比如在珠人身份申请带来的福利和权益方面……”\n\n“不用再说了。”，李嘉诚摆摆手，“说再多，最终的目的都是一样的：让一个杂交的文化取代这片土地上原有的文化成为主流。好，我不阻止你们了。”\n\n正当盛田紧绷的脸庞放松下来，对自己的老友伸出手时，李嘉诚却吐出一句让他背脊发凉的话语。"
 DOP_GNG_event.183.a: "“这件事之后，我会辞去政务司司长的职务。”"
 DOP_GNG_event.184.t: "东亚的“中转站”"
 DOP_GNG_event.184.desc: "由于中国的铁路、港口和机站在崩溃后完全停摆，共荣圈直接出现了一块“空白区域”。而现在，广东将填补这一空白。\n\n在工人们的劳作下，以广东为中心的交通网络正逐步形成，铁路从两广地区向东南亚和长江沿岸延伸，新建的机场也投入使用，在汕头等沿海城市，港口已经开始接纳四面八方来的贸易船只。\n\n广东自身的运输能力也因此得到了很大改善，尤其是珠三角地区，距离的大大缩小让人们可以来去自如。环珠三角高速全程只需将近两小时便可跑完全程，甚至有人开玩笑说，以后可以开个旅游项目叫“珠三角一日游”。"
 DOP_GNG_event.184.a: "如果交通网是血管，那么广东就是就是心脏。"
 DOP_GNG_event.185.t: "野火渐熄之后……"
 DOP_GNG_event.185.desc: "“泛亚事业又一次战胜了来势汹汹的……”\n\n“中华民国临时大总统周佛海已于日前……”\n\n“帝都百万人胜利大游行……”\n\n镜片上倒映着特丽珑电视那快速切换的画面，至于镜片后的那双眼睛到底有没有留心上面的走马花灯，就只有它们的主人知晓了。\n\n带着老茧的手掌摩挲着手上的遥控器，不知道握笔签署了多少条立法条例和行政命令的手指在上面的按键上来回跳动。\n\n接连不断的“胜利。”、“胜利！”、“胜利……”，把他的思绪拽回到那日午间，他和与他同生共死、一道踏上这条一旦出错便万劫不复的道路上的同僚们举杯共饮，庆贺这个年轻的国家从卷土重来的中华民族主义浪潮中捍卫了她的独立与自由——以无数人的生命为代价。\n\n他回想起终战日的夜晚，广州、香港和澳门的日侨社区的胜利游行，那高高飘扬的旭日旗与在夜空绽放的花火，好似回到了太平洋战事结束的那几十年前。而那些劫后余生的珠人，也喜上眉梢，庆贺着他们的灭顶之灾没有到来。而对于这个国家那千百万华人来说，尽管神州再一次陆沉，但至少现在，他们不用再为天上的两个太阳碰撞发散的炽热光芒而担忧。\n\n一切都结束了……\n\n但这一切又留下了什么？\n\n边境人口内迁和华人人口流失、已经几乎荡然无存的财政纪律和让人触目惊心的财政报表、被炮击和落下的航弹搅得天翻地覆的边境地带、日用品的短缺和高企的物价、早已不知所踪的投资和几乎窒息的原材料供应链……还有因为所有的这些该死的事情导致的汹涌的民情，也会随着战争结束而失去枷锁。\n\n真是一刻不得闲！\n\n有那么一瞬间，他几乎想把手上的遥控器用力一掷，砸在眼前那响个不停的嘈杂的屏幕上，好让自己不要再想这些堆积如山的压力和依然惨淡的现实，十多年来，他发誓、并竭尽心力想要让过去的诅咒和阴影远离这个国家和她的国民，但是现在，这些妖魔又全部趁虚而入了！\n\n但还是那个念头，很快又重新占据了他思绪的高地：还有很多事要做。"
 DOP_GNG_event.185.a: "……是凄冷的黎明"
 DOP_GNG_event.186.t: "呼吁"
 DOP_GNG_event.186.desc: "“年轻人们，你们只是被一些别有用心的家伙蛊惑了，你们现在还可以弃暗投明！”\n\n“广东政府已经决定，对主动投诚的暴乱分子宽大处理！”\n\n“快点回家吧，你们的亲人、朋友无不希望你们尽快回到正常生活中来！”\n\n这样的广播在珠三角以外的地区几乎是反复播放，目的就是为了把那些有些动摇的人拉回来。虽然没多少人跑回政府控制区，但他们的情报很有用，政府军也借此捣毁了数个据点。\n\n不过长时间运作，偶尔也会出故障，这时候就需要工程师来维修。刚好，李骏被安排带着李晞一起行动，于是两人便开着一辆货车四处奔波。\n\n一天中午，他们修完喇叭后在村旁的田埂上吃饭。李晞听着喇叭里传来的呼吁，摇了摇头：“骏哥，我觉得这也没啥用啊，听说好几天没人投降了。”“管他的呢，咱们只管完成自己的工作就行。”李骏低头吃饭，没有在意他弟弟的观点。“不过你要我说的话，这些话拿去给几年前的广工联听，可能效果还要好点。”\n\n李骏这话确实没说错，广工联本身只是一群珠人企业家组成的商会，是为了自保而存在的，让他们组织人手去参与暴乱本身已经很困难了，被煽动起来的人肯定也有些动摇。在林子里的游击队明显更坚定些，但李骏并不觉得他们能成事，毕竟他们太年轻太简单，不知道这么做的代价是什么。"
 DOP_GNG_event.186.a: "也许对他们来说，死去是光荣的"
 DOP_GNG_event.187.t: "会见贵宾"
 DOP_GNG_event.187.desc: "盛田很难想象一个快九十岁的老头子居然还在政坛上死撑，换作是他恐怕早就想着退休了。这次去南京，他正好想看看这位“总统”到底是什么情况。上一次两人见面时，周佛海的投机几乎就写在脸上，让盛田有些厌恶，他的贪得无厌又加深了这一印象。如今过去快十年，他不知道这个老人是否已经变成了一摊烂肉。\n\n果然，周佛海已经快走不动路了，必须有人扶着他才能勉强起身。都这样了还打算挥霍他能捞到的一切，盛田不禁佩服面前这人的贪婪。\n\n接下来的会谈本身也很空洞，因为盛田觉得和这种人没什么好谈的，毕竟从一开始盛田也是拿巨大的经济效益才说服了他，现在只需要把钱的大致数目给他算一下，他心里就做决定了。难道南京政府是没人能当这总统了吗？居然还让这种虫豸来掌管国家大事。\n\n不过这也让盛田开始思考起广东的未来，自己早晚有天要离开行政长官的位子，自己或许能让李嘉诚来接班，但其一是他还得考虑索尼的问题，尽管索尼和长实亲如一家，但李嘉诚恐怕没精力管理这么多事务，两家公司合并也不太现实；其二是华裔行政长官上台恐怕会让东京不满，李嘉诚面临的困难也会比现在更大。如果不能让李嘉诚顺利接班，那自己的继承人问题得从长计议。"
 DOP_GNG_event.187.a: "那么，他的继业者会是谁呢？"
 DOP_GNG_event.188.t: "哀鸿遍野"
 DOP_GNG_event.188.desc: "不知何时开始，广东的边界进入了第一个难民，随后一个、两个、一队、一群……等到警务处反应过来，加大边境管控力度时，无数难民已经逃到了广东境内。他们逃亡的原因也很简单——对他们来说，北边已不再是家。\n\n“根据难民的描述，日军在前高宗武政府的统治区开展了大规模的扫荡，大部分农民家破人亡，被迫离开其家乡；随后由于城市经济萧条，加上华北关东军的行为更为恶劣，更多人选择继续南逃。我们宽松的政策和相对温和的态度，让他们选择到我们这儿来。”\n\n盛田昭夫和李嘉诚正听取大森宽的汇报，他们三人正为了难民的事发愁。“我去视察的时候，难民营的环境很糟糕。到处都是恶臭味，不知道是烂掉的食物还是难民身上的味道；秩序很混乱，时不时会发生盗窃和斗殴事件；一些难民甚至打算逃跑，以为我们会遣返他们。”\n\n“……这情况很严重，我想我得亲自去一趟。”盛田昭夫说着就打算起身，但被李嘉诚按住了。“昭夫，你先别急。大森给的消息还是很可信的，这事我看还是绕不开立法会，毕竟只有出台相关法律，才能有效保护这些难民。而且最重要的是，我们不能把一群可能对我们心怀仇恨的人放进来。”"
 DOP_GNG_event.188.a: "“你说得对，我会考虑这事的。”"
 DOP_GNG_event.189.t: "润滑剂"
 DOP_GNG_event.189.desc: "林巧川很久没休假了，自从组建了正儿八经的特警部队后，他们这群参与过数次镇压暴乱还打过仗的老兵们就被拉去给新人作训练，就连自己的办公室他都没待很久。很快第一批人也到了能教下一批人的程度，他这把老骨头也可以歇歇了。于是他回到家里，而良子已经给他准备好了饭菜。\n\n良子告诉他，广东现在都是华人和珠人干第一线工作，只有会粤语的日本人才可以申请基层岗位。“早该这么办了。”他这么评价，毕竟他教日本人——包括良子——学粤语时几乎快把他逼疯了，更要命的是有些日本人还不乐意学，在广东普及日语更是天方夜谭。\n\n之后他和良子一同去采访了几个社区，社区内的政府工作人员都说粤语，有些日本人蹩脚的粤语还被良子纠正了过来，让林巧川有点想笑，但出于尊重和理解他还是憋住了。\n\n不过这么做确实让行政效率高了不少，这些华人和珠人几乎都很清楚他们生活的社区有什么问题，和他们的邻居们也熟悉，有共同语言也更便于交流，总比让一个只会说日语的办事员在这和一个只会说粤语的老人扯半天好。\n\n在采访几个路人时，他们也表示把日本人清出基层是一个好决定。“要是给那些家伙配翻译，这不又是一笔钱？到时候财政不好了又要扣我们的经费。”一位退休的教师这么说道。\n\n“不过，日本人又怎么想呢？以前当官的日侨大部分都是纨绔子弟。”回去的路上，林巧川这么问良子。“我不知道。”良子回答。“但我觉得东京应该不会管这些了，本土应该有地方给他们待。”"
 DOP_GNG_event.189.a: "“总之不可能为了这个就要把盛田昭夫赶走吧？”"
 DOP_GNG_event.190.t: "修订民族团结条例通过！"
 DOP_GNG_event.190.desc: "“诸君！我在此提出强烈抗议！行政长官到底置日侨的利益于何处？为何会允许把珠人和华人居于主导地位，而忘却了这个国家真正的主人？”没人对驹井的大吼大叫感到奇怪，或者说，他不为这个条例火冒三丈才奇怪。“我同意，盛田昭夫完全是在偏袒华人，让这些家伙在广东安居乐业，谁敢保证民族团体不会借此机会渗透广东？”井深大紧随其后提出提出反对意见。这两人的双簧很快动摇了在立法会中占多数的日侨，他们已经开始犹豫是否跟着投下反对票。\n\n松下和他的议员们这次闭上了嘴，不管他们的真实想法如何，这个问题都太过于敏感。他们今天在这里投票、辩论都无所谓，但如果让竞争对手抓到把柄，拿去给媒体添油加醋……那后果他们可想都不敢想。 李嘉诚和长实议员正极力反击每一项指控，坚持声称这份条例的修订有利于广东的长治久安和经济繁荣，但日立和富士通的人仍然坚持要将日侨视为主体民族，削弱珠人与华人的政治地位。索尼议员则陷入了分裂，开始党同伐异起来。\n\n在嘈杂声中，盛田下令开始投票，无视了在场九十九个人的争论，也无视了驹井和井深的反对。“我相信诸位都明白解决民族问题的重要性，这是我们能交出的、能让广东人民最满意的答案。”盛田说道。“我希望诸位能权衡利弊，想想是自己的地位重要，还是一个稳定的环境更重要。”"
 DOP_GNG_event.190.a: "最终，绝大多数人咬牙投下了赞成票"
 DOP_GNG_event.191.t: "只有时间才会证明这是否有效……"
 DOP_GNG_event.191.desc: "《修订民族团结条例》\n\n在经过立法会审议后，行政长官颁布了修订后的《广东民族条例》，并冠以“团结”之名，正式确立了申请成为珠人的标准，并明文规定华人和珠人为广东的主体民族，无论血缘与地缘关系一律平等，以期解决广东日益加剧的种族矛盾。只有时间证明这是否有效。"
 DOP_GNG_event.191.a: "……"
 DOP_GNG_event.192.t: "对症下药"
 DOP_GNG_event.192.desc: "盛田决定召开紧急会议来讨论民族问题，主要是为了听听松下和李嘉诚的意见，他们之前就为民族问题争论不休。 会上，盛田先提出了申请成为珠人的新标准——双语测试。也就是说只要熟练掌握粤语和日语，便可通过审核成为珠人。这个标准对于生活在广东数年的人来说聊胜于无，实际上也是如此。如果要解决民族问题，在这些问题上就不能设置太多门槛。面临日益增长的贫困华人问题，倘若还按照原先以财产和职业为主的标准，那无异于自杀。\n\n他本希望松下和李嘉诚能在民族政策问题上提点意见，结果两人反而先吵了起来。松下吼得面红耳赤：“我认为我们这一点确实该学学满洲，要构建起属于广东的民族认同！最好的办法就是要加速珠人化，彻底消除华人的民族意识！”“放屁！”李嘉诚反驳道。“你要是让这群人吃不饱饭，民族意识自然是‘野火烧不尽，春风吹又生’的！我们真正要做的是政治上保证他们的地位！”“那日侨怎么办？”“日侨才占广东常住人口的一成，现在加上难民，华人可占将近六成，你……”\n\n“够了！”盛田很久没发过这么大的火了，上一次似乎是东京通信被收购的时候。“我是让你们两个来提建议的，不是让你们两个来这里吵架的！我现在想知道的是，你们有什么方案来解决困扰了我们二十年的问题？”\n\n松下用手帕擦了擦头上的汗：“简单。正如我说的，要构建属于广东的民族认同。要尽快将华人转化为珠人，抹除他们对中国的认同。”\n\n李嘉诚摇摇头：“我觉得还是不能太操之过急。广东目前已登记的华人就有近两千万人，这两千万人定然不可能全面转化为珠人。因此我们必须承认，华人也是广东的一份子，他们也应该享有一定的政治权利，他们的文化也该得到保护。”\n\n两人的建议都有可行之处。松下的想法虽然很激进也有些……不太现实，但确实能在根本上解决问题；李嘉诚的主张看上去有些大逆不道，但对华人的保护能有效缓解矛盾，至少能把这个定时炸弹的时间放慢许多。那么，该怎么做呢？"
 DOP_GNG_event.192.a: "华人不能再承受更多苦难了"
 DOP_GNG_event.192.b: "哪怕不现实，我们也不能治标不治本"
 DOP_GNG_event.193.t: "局外人"
 DOP_GNG_event.193.desc: "松下正治和夫人提着大包小包的行李，把它们勉强塞进后备箱后上了车。就在上周，松下收到了大阪总部的通知，让他和幸子回大阪去，和松下幸之助见面，并参与董事会。\n\n松下喜出望外，他知道这标志着老丈人要公布自己的继承人了，而这个人毫无疑问就是他。自己在广东奋斗了将近三十年，等的就是这份认可——他成为名副其实的“继承人”的消息。\n\n当他来到机场时，盛田和巨头们早已准备为他送行，对于这位纵横广东的大亨，很多人其实或多或少都还是敬重的。而且在民政派独大之前，松下在立法会的实力也还算可观，无论是从铃木手上争取利益还是推进民政派改革，松下都多少出了力。于情于理，几位巨头都决定来和他告个别。\n\n除了驹井只是来走个过场外，其他三人和松下寒暄了几句。盛田赞扬他为改革所作的努力；李嘉诚则祝贺他的晋升；井深大仅作为政治盟友表示了祝福，实际上他心里还是在想该把松下当哪路人看待；驹井也只出于礼仪表示了问候，但松下对他的态度也没之前那么热情。\n\n飞机降落在停机坪上，一个戴眼镜的谢顶男人走出舱门，面带微笑地和松下握了握手。“诸位，我介绍一下，这就是接替我管理松下在广业务的山下俊彦先生。”\n\n盛田打量着这人，脑海里思索着昨晚松下和他的对话：野心勃勃，富有才华却又刚愎自用……松下幸之助就这种人来广东？恐怕早晚得被孤立。但他还是面带笑容地和山下握了手。\n\n松下和夫人带着行李上了飞机，而山下的脸色明显有些不好看。盛田注意到了这一变化，但他并没有声张。这个家伙很可能也是被“流放”的，至于这是为什么，恐怕就要问问松下父子了。"
 DOP_GNG_event.193.a: "看起来不太好揣摩的家伙……"
 DOP_GNG_event.194.t: "当断不断"
 DOP_GNG_event.194.desc: "“你好，我是《广东妇人公刊》的安川良子，从到警务处公布的数据来看，广东国内犯罪率已大大降低，大部分地区也已经停止军事戒严，那么请问政府有没有停止紧急状态和废除戒严令的准备？”\n\n大森的嘴唇动了两下，但他什么都没说，台下的记者则翘首以盼，想看看临时政府怎么回答这个问题。半晌，大森才说出了引爆全场的一句话：“对不起，无可奉告。”\n\n记者们立刻七嘴八舌地提出了各种问题，摄像头不停闪烁着，就连一旁的安保人员也慌乱了起来。“各位，请安静一下！”大森在台上的话被记者们当成了耳旁风，有几个记者的声音盖了其他人一头：“军队是否准备彻底接管政府？”“临时政府有和东京方面的人员协商过吗？”“立法会的无限期关闭是否也会继续？”\n\n一个又一个问题让大森感觉头疼，他昨晚上就已经吃了几片头疼药了，栗栖突然要求政府继续维持紧急状态，不惜和赤城起了争执；永野在一旁口头支持，也让田村和他争论了好一阵子。最终的结果是从午饭后开始的会议，到晚饭都没处理好哪怕一件事，导致今天大森“一问三不知”。\n\n记者们的询问还在继续，这时赤城突然走上台，对大森耳语道：“先下来吧，我们后边再想办法应付记者。”于是大森借口有紧急事项，先行下台，留下了群情激愤的记者和拼命阻拦记者的保安。"
 DOP_GNG_event.194.a: "……必受其乱"
 DOP_GNG_event.195.t: "荣辱与共"
 DOP_GNG_event.195.desc: "已经很久没到过这里了。\n\n李嘉诚下车走向那家自己熟悉的店铺，盛田昭夫就在门口，笑着向他挥手示意。在盛田当上行政长官前，他们在这里碰头，商谈捍卫本地人权利的每一项事务，绞尽脑汁和财政派作对。尽管后来两人的餐饮条件显著提升，但他还是怀念以前和盛田在这里吃面的日子。\n\n又是一碗打卤面，又是那张桌子，两位老友没有说什么重要的事，只是互相寒暄了几句。\n\n一碗面吃完，盛田递给李嘉诚一瓶汽水：“嘉诚，今天这顿饭吃完，明天就要开始工作了。这一次还是按你的想法来，放手去干吧。”\n\n李嘉诚接过汽水，拉开瓶盖后和盛田碰了个杯，随后一口饮下大半瓶。\n\n“谢谢你，昭夫。说真的，你听松下的建议时那副认真的样子，我还有些担心你是不是要听他的，和我闹掰。”李嘉诚的话让两个人发疯似的笑了好一会儿，毕竟两个一起奋斗了快三十年的人分道扬镳，怎么想都不可能。\n\n“那么你接下来有什么想法？”临走前，盛田问道。“老实说，想法很多。我能告诉你的是，我的计划很可能要让有些人气得咬牙切齿……你最好做点心理准备。”\n\n李嘉诚轻松地笑了笑，试图借此缓解盛田的担心，但在他走后，盛田看着远处的立法会大楼，陷入了沉思。"
 DOP_GNG_event.195.a: "但他很快又下定了决心"
 DOP_GNG_event.196.t: "漫步人生路"
 DOP_GNG_event.196.desc: "广东行政长官几乎不会公开进行什么活动，几乎都是靠电视、收音机和广播来向公众宣布政策和安抚民心。但今天，盛田和内阁成员们公开露面，在广州市中心的广场向公众讲话。\n\n现场除了来自五湖四海的记者，还有不少广州市民和香港、澳门的居民。所有人手上都拿着小型的广州旗帜，即使是流亡到此的华人，大多也跟着人群挥舞小彩旗。\n\n“各位，”盛田昭夫用粤语说道。“欢迎今天的所有记者朋友和广东市民，今天我组织这次集会，是希望能和广东居民们聊一聊。”\n\n盛田的话让台下开始讨论起来，他们不知道行政长官的话是不是有什么深层含义。“广东独立建国已经有将近十年了，我成为广东行政长官也有将近二十年了，在这期间我的改革，都是建立在我和我的老友，李嘉诚司长对现状的认识上。然而我们都忽略了广东人民的感受，我们没去问过广东的居民现在需要什么。现在我们决定弥补这个错误。所有到场的居民今天可以现场向我提意见，不在现场的，我也吩咐准备了电话。无论是我们的政策有什么问题还是你要举报哪个官员，今天都可以提出来。”\n\n此言一出，现场的所有人都大吃一惊。很快便有人询问起新实施的政策，而一旁的李嘉诚则给出了答复。\n\n几小时后，集会到了尾声，公务员们将所有还没来得及提出而写在纸上的意见交给盛田，而盛田则露出了微笑。“你说，这会不会太大胆了？”他看着李嘉诚。“难说，得看东京那些老爷们怎么想。”李嘉诚也莞尔一笑。“不过我可不在乎这些，毕竟我们的独立地位是他们承认的，他们没资格管我们怎么做。一会儿去咱们最爱的那家饭店吗？有段日子没去吃了。”"
 DOP_GNG_event.196.a: "盛田点了点头，随后将所有的纸张放进公文包里。"
 DOP_GNG_event.197.t: "通往南宁的漫漫长路"
 DOP_GNG_event.197.desc: "随着最后一批运输机飞离深圳的空港，广东境内就只剩下了我们的老朋友——“广东通”永野茂门，以及他手下那群曾经一度谋划着颠覆这个新生的国家的军官们。虽然很难接受，但是风云的突变不仅让他逃避了进一步的追责与惩戒，还逼迫我们对他笑脸相迎。\n\n虽然华南方面军的撤出让国民最终松了一口气，而东京方面竭尽所能搜刮一切可用的军事资源以投入北方的反叛乱战争中的举措也让人对这尊泥菩萨忍俊不禁，但是，日本人的撤离，却给我们留下了空前的麻烦：广西境内的叛乱分子和乘机作乱的暴民们就像是发疯的野犬一样撕咬着我们向广西伸出的援手。\n\n而就在不久之前，依然效忠于那个该死的前总统的一撮残兵，还妄图在桂林发动大规模的武装叛乱，把城市拖入了残酷的巷战之中，我们最终不得不调动大量的特殊警察部队以我们最不想看到的方式逐步将这座早已被轰炸和地面作战蹂躏得千疮百孔的城市夺回。\n\n尽管我们目前倚靠部署我们的特殊警察部队依然可以堪堪维持对广西脆弱的管辖，但是，面对依然对我们的统治充满敌意的居民，以及藏匿在阴影之中的煽动分子，我们现今部署的力量根本无法对他们进行有效的消除，大规模的抗议和骚乱、爆炸、枪击事件，还有肆意地在这片无序中浑水摸鱼的罪犯，都让行政长官的写字台上每天都收到令人不安的报告。\n\n如果我们想要实现对广西的有效管辖，和对其各类资源的有效利用，而不是反过来将大量的时间和资源投入到这个无底洞般的治安维持中的话，我们就必须积极主动地改变现状，而我们必须决定下一步棋该如何落定。\n\n当然，我们可以像现在东京和新京在北方想要做的那样，投入更多的军事资源，将我们闲置待命的特殊警察部队投入到广西的维安行动中去，清扫藏匿在山野中的叛乱分子、威慑在街头为非作歹的暴民。\n\n而我们的警务官僚们则给出了不同的答案：就像我们建立警务处一样，在广西组建一支辅助警察部队，如果我们愿意投入足够的资源，那么我们将得以从繁重的“琐事”中解脱出来，大幅降低对军事资源的需求。"
 DOP_GNG_event.197.a: "“长街”作战草案将被送至特殊行动处"
 DOP_GNG_event.198.t: "待哺的众生"
 DOP_GNG_event.198.desc: "“老板，俾份今日既报纸！（老板，来份今天的报纸！）”\n\n“好既！呐。（好的！给你。）”\n\n一手交钱，一手交货，阿华将那一沓报纸夹到腋下，闲庭信步地从报刊亭边上走开，找了个有瓦遮头的地，点了一根烟，将打火机和烟盒塞回自己的裤兜，将报纸扬开，双目瞳孔聚焦，口鼻喷出一股白烟。\n\n如果忽视他身上挎着的一支索尼生产的自动步枪、那一身制服和防弹衣还有头上的大檐帽的话，他大概能完美融入街头的万象中去吧。但他现在确实正享受着难得的清闲：广西的叛乱活动大幅减少、街头的秩序也逐渐恢复。如今，尽管离恢复到战前的生气与安定还有很长一段路要走，但南宁的大街上，往日频繁的骚乱几乎已经绝迹。\n\n“等我睇下先……（让我看看……）”\n\n他的眼睛在报纸的版面上来回扫视着，毕竟，他的工作让他几乎总要错过晚间新闻，想要了解佛山老家的情况，大概也只能倚靠那边送过来的报纸了。\n\n“新热电厂建设……境外投资日渐恢复……哇，仲修路啊，政府咁有米唔干脆直接益下我地班穷鬼？（新热电厂建设……境外投资日渐恢复……哇，还修路啊，政府那么有钱怎么不分点给我们这帮穷人？）”\n\n阿华又吐出一口白烟，一想起家里的破事他就头疼：他那原本在某个小工厂工作的弟弟因为厂子破产而失业了，现在在打零工维持家用，自己现在每个月还得把一大半工资寄回去，真是……也是得亏了特种联队的特别津贴这该死的战斗部署津贴够丰厚，不然他手头估计根本留不下多少钱。\n\n但别的地方，又好到哪里去呢？或许只会更糟罢了……他回忆起自从自己第一次“出国”以来的所见所闻，那些在破败的楼宇间的呻吟、那些在矿井里的挣扎，还有那些街头巷尾卖力吆喝着和干着苦力活的男男女女——还有孩子。\n\n阿华摇摇头，将这些事情甩于脑后，将思绪转回到眼前的报纸上，“政府计划投入巨额资金……”"
 DOP_GNG_event.198.a: "1、“……致力于广西经济复苏。”"
 DOP_GNG_event.198.b: "2、“……为广东工业注入活力。”"
 DOP_GNG_event.199.t: "开门红"
 DOP_GNG_event.199.desc: "香港证券交易所人头攒动，马上就到开盘的时候了，因为有几家新股的潜力很被看好，股民纷纷跟进，就像看看那些“金融大师”的预测如何。\n\n上午十点整，电子屏幕上开始显示所有上市公司的今日股票情况。“涨了！真涨了！”“赚啦！”“妈的，早知道多买点了！”欢呼声不绝于耳，粤语和日语交杂着庆祝自己豪赌的又一次胜利。\n\n一些遇到股票下跌的股民仍按兵不动，因为跌得不是很严重，应该能再涨回来；有人开始急着卖出，便被身边人嘲笑为胆小鬼。\n\n一旁的几个人喝着咖啡，看着欣喜若狂的人群，其中一人推了推眼镜：“股票涨这么疯……这些人看来可赚翻了。”“那么老黄，你也去给咱试试水？”一旁的女生开了个玩笑，大家便笑着怂恿黄浩辉去买几只股票试试。“不了，我看连续多日上涨，未必是什么好事。”\n\n“小黄说得对。”众人吃了一惊，回头才发现是乔装走访的何鸿燊。“何……何先生？”“不错，不愧是财务司的人，明察秋毫，这都认得出我来。”何鸿燊笑了笑。“刚才您说老……黄浩辉是对的，是因为什么呢？”\n\n何鸿燊抬头看着巨大的电子屏，上面的股票大多数都是一条向上的红色折线。“就像一个馒头不可能卖出市场价的十倍一样，股票所代表的东西也不会超出它实际价值的太多，如果有一日因为外部原因，股票突然暴跌，这些欢呼的人群又会如何？”\n\n众人背后突然有些发毛，他们不敢想象自己一无所有的情景。\n\n“所以，别看他们赢钱轻松，其实他们和我一样都是赌徒，只是无论在政治上还是赌桌上，我都可以输很多次。”"
 DOP_GNG_event.199.a: "“但他们输一次，便再无机会了。”"
 DOP_GNG_event.200.t: "打开魔盒"
 DOP_GNG_event.200.desc: "盛田昭夫独自一人在珠江岸边站着，晚风吹拂着他的脸，但他并没有感到丝毫惬意，反而是一阵悲凉。\n\n他输了，输的很彻底。李嘉诚和他大吵一架后决裂，井深大也看不上他的那份愿景。虽然经过多年耕耘，索尼在立法会已经是根深蒂固，但他还是需要一位盟友帮他分担政治压力。\n\n尽管他自己心里清楚还有一个选项，但他本能地否决了——开什么玩笑，松下？那个贪得无厌的家伙？盛田心里清楚他是个什么态度，只要有钱赚且对松下无害，他可以支持包括驹井在内的每个人。\n\n但是，自己也只能找他了。现在的情况无异于政府停摆，单靠索尼也不可能保证完全通过法案，更别提现在正在流失的群众支持了。如果他不能挽回与李嘉诚决裂带来的华人支持下降，那他只能索求与松下的同盟，稳固日侨对自己的支持。\n\n时候不早了，他在夜色中独自一人行走着，一步步走回了自己的办公室。桌上的电话就在那摆着，只要自己愿意就可以打给松下。但那么做的代价又是什么呢？\n\n时钟走到十二点，办公室内依然一片死寂。不多时，盛田拿起了电话，打给了那个他唯一的选择。"
 DOP_GNG_event.200.a: "“松下先生，我想和你谈谈。”"
 DOP_GNG_event.201.t: "同是天涯沦落人"
 DOP_GNG_event.201.desc: "“哩份系你既包裹，请摞好。（这份是你的包裹，请拿好。）”\n\n接过沉甸甸的包装袋，老张没有再去看那张堆着不知道是真诚抑或是营业本能的笑脸，转过身向出口走去，身边的队列排的挺长，他不由得庆幸自己来的挺早，不然可能就得耽误晚上做饭了。\n\n说真的，他现在还是吃不惯这里的什么伊面和豆豉鲮鱼，但是免费的东西，不拿白不拿嘛。更何况，家里除了两小孩，还有自家的爹娘呢……虽然现在每个月又有了什么育儿补贴和最低收入补贴，但是就算加上他和他媳妇在纺织厂打工的这点收入，想要养活一家六口人，也还是颇为困难的。虽然不知道那两个四眼鬼子是不是良心发现了，居然开始给包括像他这样的连粤语都说不利索的归化难民发补助和物资，但是生活总归是好过了些，至少他不用时时刻刻都为每一笔支出精打细算了。\n\n“哎，阿张！”\n\n他侧过头去，叫他的人是一个本地的阿伯，“老陈，勿你又系度？（老陈，你也在啊？）”但这只是寒暄，他和陈伯也算熟络，毕竟不仅他就是自己工作的纺织厂以前的保安，他们还是同一栋公共屋邨的邻居。现在他虽然退休了，但是他并没有什么积蓄，他和他媳妇两人的养老金只能堪堪维持生活。不过，那也比他自家的爹娘强，因为没在广东干过活，养老金都没他们的份。\n\n几句寒暄下来，他们又说到了他们对面的一户人家。那一家的男主人几年前因为交通事故而丢下了母子二人撒手人寰，这么多年全靠一个单亲妈妈撑起来，现在倒是好些，政府减免了她的税，还给她发了那些有的没的补助。\n\n收买人心？抑或是良心发现的赎罪？老张搞不清楚，他也不觉得自己能搞清楚，哪怕是赎罪，他也不认为自己会原谅盛田昭夫这个只会用蝇头小利来掩盖自己的恶行的伪君子。操他八代祖宗的，他可是好不容易带着一家子一个不落地从信阳跑到了这里，受的苦、被抛之脑后的家乡的一切，现在只需要几爹钞票和一袋吃的就想要让他忘记吗？而像老陈这样的给这个“国家”付出了半辈子的老家伙，就因为小时候没读过几天书，就要被赶去当看门狗？穷了一辈子，老了活得还像个乞丐，向着这个“国家”乞讨！\n\n但自己的孩子们呢？他想，那可就未必了，现在他们住的地方，吃的东西，哪个不是直接或间接来自于那高高在上、每天在公众面前摆出道貌岸然的模样的行政长官和他身边的那个好像是老交情还是什么玩意的一样是个四眼的鬼子？连学校教的，都是他们想让孩子们相信的东西。"
 DOP_GNG_event.201.a: "伤口既成，只得遗忘"
 DOP_GNG_event.202.t: "有备无患"
 DOP_GNG_event.202.desc: "“快！快！不要乱！”\n\n李嘉诚正在汕头的一所中学视察自然灾害应急处理培训情况，当他看到校领导指挥学生逃离教学楼时，他虽然感到欣慰，但还是在心里边打了个问号：真要发生了地震或者其他什么灾难，学生们会这么冷静吗？校领导会不会自己先跑了？\n\n很快，全校师生都安全离开了教学楼，校长跑过来向李嘉诚和防灾署代表们汇报演习情况。“花了大概三分钟么……很好，但还是要尽可能再快一些，地震这种事谁也说不准。”李嘉诚扭头看向旁边的代表。“你们觉得呢？”\n\n“司长，要在三分钟内疏散完上千人的学校可不容易，不过我们会在预测上下功夫的。”一旁的代表摊了摊手。“就是希望计算机和通讯设备不会出问题……”\n\n李嘉诚叹了口气，随后又嘱咐他们要尽力而行。在上台致辞并鼓励了全校师生后，他又乘车前往下一个被抽查的学校视察。\n\n“很难相信井深先生对这事会这么上心。”何鸿燊看着面前的一台台计算机，都是富士通最新推出的型号，性能自然也是最好的。盛田轻敲了两下显示屏：“因为灾难来了一样会摧毁他的钱和厂子，而他给我们提供这些，我们就有能力为他提供保护。对了，这些东西他开价多少？”“上次报给你的那个数目上又打了八折，说表示井深对这事的赞同。”“……看来他还是能想明白些东西的。”\n\n这些计算机明天一早就会被安装进防灾署的办公室里边，广东未来能否抵御自然灾害带来的破坏，就全要靠这些铁疙瘩了。"
 DOP_GNG_event.202.a: "但愿这一切能起作用……"
 DOP_GNG_event.203.t: "何为正义？"
 DOP_GNG_event.203.desc: "陆康是逃亡广东的无数华人中的一员，他原本是个知识分子，中国战败后本打算自杀，在朋友和父母劝说下才半推半就地以难民身份在广东定居。他本来不喜欢这里，因为这地方对于中国来说是国耻一样的存在，奈何要赡养父母，他也暂时打消了自杀的念头，打算等父母驾鹤西去后再自寻短见。\n\n待了几年后，他发现自己的生活正慢慢改善：政府安排工作，虽然吃力但能赚钱，算解决了温饱问题；随后他和家人又登记成了广东公民，父母能领到养老金，他也可以享受医疗保险等职工福利。现在他和家人长实相对低廉但条件不差的公共住房里，每月除去日常开支还能省点钱下来。\n\n和他一起进来的难民们也陆陆续续过上了这样的生活，广东政府确实把他们当作公民看待，待遇也不差，日本人也不敢拿他们怎么样，因为广警真的会追究日本人的责任。\n\n但就像许多中国人一样，他也会听说过去的事情：剥削劳工、法律上的不平等和歧视、对抵抗势力的残酷镇压……不过这些事，据很多人的说法，被那个盛田昭夫和他的朋友李嘉诚解决了，现在的广东有了很大的改变。但也有人说，盛田不过是收买人心，本质上还是为日本服务，但当他追问作为“侵略者”的盛田为什么会对华人这么好时，那些人也答不上来。"
 DOP_GNG_event.203.a: "那么那些人和盛田，哪一边才是对的呢？"
 DOP_GNG_event.204.t: "新官上任"
 DOP_GNG_event.204.desc: "在几天前，稻叶秀三接到任命后，他便想到去拜访铃木贞一，这位曾主导日本战时经济却折戟广东的老将。\n\n铃木听说他要去广东，只是一阵苦笑，随后意味深长地说了一句话：“在战场上，没有任何一个人可以相信。”而在首相本人亲自交给他的情报中，日立公司不满于当局统治，且对本岛毕恭毕敬，可以作为盟友。\n\n稻叶思索再三，决定信铃木的话，毕竟首相没去过广东，但铃木可是实打实地在那“战斗”过。\n\n在和高岛领事会面后，他终于见到了盛田昭夫，此人的大名在共荣圈可谓如雷贯耳，毕竟广东的经济奇迹和他离不开关系。但在报纸和电视上笑容满面的他，此刻却六神无主，心有不甘地接受自己的命运，交出了行政长官之位。\n\n那么接下来，稻叶秀三就要开始他雄心勃勃的改革计划，让广东脖子上的锁链更沉重一些，让自己代表帝国驯服这块狂野不羁的土地。"
 DOP_GNG_event.204.a: "最重要的是，这是他一个人的功绩"
 DOP_GNG_event.205.t: "关于广东当前局势的报告"
 DOP_GNG_event.205.desc: "发自：高岛益郎，大日本帝国驻广东总领事\n\n发向：（首相名），大日本帝国首相\n\n从目前情况来看，广东为了安抚战后接收的大量华人难民，已经开始推行激进改革。同时，广东在国家建设中的一些方面已经超出我们的预料，大有与米、独勾结之势，亦含自立为王之心。\n\n考虑到广东的特殊性，不可能在无事发生的情况下对此采取包括军管在内的强制性措施，可考虑包括撤换行政长官在内的较为温和的方案。内阁此次要求上报广东政军商之情况，已提交至大东亚省，可供参考。\n\n至于现任行政长官盛田昭夫，我认为可不对其立即逮捕并进行审判。其一，广东为大日本帝国承认之独立国家，若此时公然行动，恐国际舆论于我等不利；其二，盛田在广东深得人心，政府大多为其党羽，广东也高度政商一体化，逮捕盛田会引起恐慌，新任行政长官也将无立足之地；其三，铃木贞一的经验告诉我们，不可意气用事，需温水煮青蛙，伺机而动。\n\n因此，我个人有两点意见：其一是联合日立，分化企业联盟，其实力虽不如安田于铃木，但也可帮助新任行政长官迅速站稳脚跟，也可以方便我们打入广东政商两界；其二是新任行政长官一定要温和施政，不可与民争利，否则恐群众反弹，引起更大混乱。\n\n综上，往内阁再三考虑后，方制定对广方案。否则，恐广东之繁华，将成泡影。"
 DOP_GNG_event.205.a: "回电：同意，我会亲自处理此事"
 DOP_GNG_event.206.t: "东京来电"
 DOP_GNG_event.206.desc: "紧急会议对于立法会来说是家常便饭，自从安田危机以来，铃木、松泽和盛田或多或少都召开过此类会议，来让他们的方针得以实施。\n\n但今天，盛田昭夫和李嘉诚都没有露面，就连松下也缺席了。井深虽然嘴上抱怨民政派打乱了他的时间规划，但他还是在和驹井谈话时表现了他的忧虑。\n\n大概十分钟后，松下才三步并成两步地走进来，头上似乎还有几滴汗。“喂，盛田和他的中国朋友呢？”井深问道。\n\n松下用手擦了擦头上的汗：“这下全完蛋了，天知道索尼和长实还会不会被允许待在立法会……反正盛田应该是不能了。”\n\n松下的声音不是很大，但被一旁的民政派们听到了。民政派议员们顿时陷入混乱，有几个和松下走得比较近的议员询问发生了什么，而松下只是摇摇头：“你们马上就知道了。”\n\n又过了大概半小时，盛田昭夫终于出现了，跟他来的除了李嘉诚，还有日本驻广总领事高岛益郎。\n\n高岛和松下谈话时告诉他，盛田这次犯的错不一定会被宽恕，最好情况下他也肯定要被拉回本岛一段时间，以向大东亚省汇报他干了些什么、影响如何以及广东现状，以为新的行政长官作参考——这意味着东京可能要直接干预广东局势。\n\n盛田走上台，平静地宣布了自己引咎辞职的消息。没人对此感到惊讶，只有一些议员担心盛田会被东京问责。而高岛则抛出了一个大炸弹：来自东京的官僚稻叶秀三将接任行政长官，而考虑到盛田的政绩，大东亚省决定暂时不针对盛田举行听证会或其他任何形式的问询，待稻叶就职并进行实地调查后再考虑是否审判盛田。\n\n立法会的平静让高岛感觉不太妙，尽管许多人都面无表情，但高岛作为外交人员的敏锐告诉他，广东今后要变天了。"
 DOP_GNG_event.206.a: "又来一个？"
 DOP_GNG_event.207.t: "大幕落下"
 DOP_GNG_event.207.desc: "“……综上，经首相和天皇陛下批准，现任广东行政长官盛田昭夫将被罢免，并以渎职罪等候特别法庭发落。任命稻叶秀三为临时行政长官，待局势稳定后再组织新任行政长官的选举。”\n\n高岛宣读完通知后，便扭头走出了会议室，留下广东的高层们面面相觑。\n\n另一边，永野茂门正率队准备迎接稻叶秀三的到来。老实说他对文官没什么好感，但军部也同意了这项任命，所以他只能硬着头皮去干这事。\n\n飞机离机场越来越近了。这时一辆黑色轿车到达现场，是高岛。“快到了吗？”他问道。“快了，飞机已经在下降了……”永野强忍着厌恶回答。“希望他不是第二个铃木贞一。”\n\n几分钟后，一位西装革履的男人从机舱中走出，身后还跟着数名穿黑色西装的中年人。“欢迎，稻叶阁下。”高岛迎上去与稻叶握手，永野则敬了个军礼。“是高岛领事吧？首相已经跟我说明情况了，大藏省也派来了几位官僚来协助稳定经济，希望领事能提供较为详细的经济数据，好让他们开展工作……”\n\n永野皱了皱眉头，果然又是一个听从东京命令的官僚，但他在安保上是什么态度还不明确。“啊，当然。不过我们还是要去和政府的高层们打个照面……”\n\n几人随即上车，前往立法会大楼。一路上，稻叶都显得有些急躁不安。直到高岛将提前准备好的资料拿过来，他才冷静地审视了一遍。但自始至终，他都没说一句话。\n\n待稻叶下车，高岛才忧心忡忡地摇了摇头，在他看来，这位新的行政长官似乎很清楚自己是来干什么的，但他看起来不喜欢这份差事……希望并非如此。"
 DOP_GNG_event.207.a: "新的一天开始了"
 DOP_GNG_event.208.t: "盛田昭夫退休"
 DOP_GNG_event.208.desc: "稻叶秀三将成为新的行政长官"
 DOP_GNG_event.208.a: "……"
 DOP_GNG_event.209.t: "新约"
 DOP_GNG_event.209.desc: "高岛和永野站在立法会的发言台上，一旁是行政长官盛田、政务司司长李嘉诚和外务司司长松下。五人今天要向立法会宣布新的《广东-日本地位协定》，这份协定据说对广东有着深远的影响。\n\n议员们以为这意味着永野麾下的驻军会获得更大的权力，以应对扑朔迷离的中国局势。但事情的发展远超他们的想象。当高岛宣布新的地位协定承认广东拥有自卫队时，在座众人甚至惊讶得说不出话来。一位日裔议员站起身来，吞吞吐吐地问道：“请问这件事是日本政府亲自批准的吗？我们又怎么敢确定他们不会变成索尼甚至行政长官的私兵？”\n\n高岛则板着脸解释道：“目前的情况表明，广东确实需要一支常备军来应对突发情况。鉴于此，帝国政府同意广东建立自卫队，但严格限制规模。此外，广东防卫司司长和自卫队总司令人选也已知会帝国政府，你们无需担心。”\n\n在众人窃窃私语时，高岛则继续宣布了日本驻军的新任务。永野的“凰”师团继续驻扎在广东提供军事援助，并负责训练和监管广东自卫队，其军费开支由广东政府承担。\n\n尽管这一消息让大家都松了口气，但一旁的盛田和永野却是表情复杂。两人都不希望与对方共事，但现在他们成了一根绳上的蚂蚱：永野不可能离开广东，而广东也需要永野。即便如此，二人也和众人一同鼓掌，庆祝着新协定的签定。"
 DOP_GNG_event.209.a: "毕竟，他们没得选"
 DOP_GNG_event.210.t: "搬迁"
 DOP_GNG_event.210.desc: "“你要走吗？”\n\n李晞咽了口唾沫，问饭桌对面皱着眉的大哥。现在制造业正大规模向广西转移，李骏所在的车间估计也不能幸免，但无论是爸妈还是李慧和他，都不希望大哥跟着去那片废墟。\n\n李骏一时回答不上这个问题，因为他也说不准。他前几天提交了调职申请，希望自己能转个行政岗位，不至于被拉去广西和家人分离。但现在通知还没下来，如果申请没通过，那他大概率是要走的。\n\n家里的气氛顿时沉重起来，李薇夹菜的手甚至有些颤抖，吞咽也仿佛很困难。李慧和李晞忍住看向大哥的冲动，眼睛渐渐变得有些模糊。李梁则一言不发地喝了口酒，脸上的表情有些阴沉。即使身处1962年那种悲惨的境地，一家人都没分开，可如今他们手足无措。\n\n突然，敲门声传来，李骏艰难地起身去开门。门外是个邮递员，跑得满头大汗：“先生，您的邮件。”他把邮件递过来时如释重负。\n\n李骏拆开信封，是调任申请通过的通知，他虽然职务没调整，但工作地点却转到了索尼的一个产业园区内，至少一段时间内不会离开。\n\n他将这个好消息告诉家人，屋内又回到了平常的温馨。但没人注意到，通知最后“回复人”那里，签着盛田昭夫行政长官的名字。"
 DOP_GNG_event.210.a: "但那不重要，对吧？"
 DOP_GNG_event.211.t: "扬眉吐气"
 DOP_GNG_event.211.desc: "理论上，出席这次会议的应该只有行政长官和外务司司长，但今天五巨头都到齐了。所有人都只为了一个目标而来：展现他们的优越。对于盛田来说这更是大好事，因为他们的优越一定程度上也是广东的优越。\n\n最先到场的自然是日方代表，这些人在高岛的带领下踏入金碧辉煌的宴会厅，队伍中隐约传来感叹的声音。盛田同有些呆滞的代表团团长交谈几句后，知道肯定套不出什么，竟让高岛带他们自由活动了。\n\n第二到场的是中方代表，出人意料的是，他们直接由宋之光带队。他们并没有展现出过多的正面情感，有人甚至皱了皱眉头，也有人只是莞尔一笑。“看来你们下了些功夫。”同盛田交谈时，宋之光微笑着说道。“南京依然关切着广东的境地，看来这场宴会足以让总统安心，我在此代表总统阁下感谢行政长官和诸位的努力。”\n\n不卑不亢的中方代表让盛田和李以外的三人都有些不满，但他们仍等待着最后的惊喜——最晚入场的满洲代表团。他们的入场时间不是意外或刻意安排，而是自己选择的。\n\n即使这些人再怎么掩饰他们的恐慌和震惊，盛田依然用嘲讽的语气感叹广满之间的物是人非，加上驹井同样在回忆自己的满洲生涯时暗戳满业的低效，让代表团团长尴尬而又愤怒。可那又怎么样？现在的满洲和广东之间，早已是天差地别。"
 DOP_GNG_event.211.a: "待满洲人心灰意冷地离开时，五巨头开怀大笑"
 DOP_GNG_event.212.t: "会议当日"
 DOP_GNG_event.212.desc: "共荣圈经济峰会成了广东的舞台。各种音像设备、家用电器和计算机纷纷被拿出来进行展览，一些外宾则得到了最新款产品作为礼物。东南亚国家对广东充满了好奇，但盛田不在乎他们。他更想知道日本、中国和满洲的态度。\n\n峰会上，最先发言的日本代表简要的赞扬了广东的经济成就，随后他公布的投资计划才让盛田露出胜利的微笑。按照公布的计划，日本将来会有大把资金砸进广东，这对广东无疑是天大的好事。\n\n中国代表的发言很滴水不漏，看不出他们的立场，但宋之光早已私下告知盛田，南京对广东的现状很满意，盛田会得到他们的全力支持，只要他依然坚持自己的民政方针。只是宋之光的话语隐约有种令盛田不安的感觉，是威胁还是拉拢，他也说不明白。\n\n满洲代表没有发言倒让盛田很意外，他看到那些满洲人坐在自己的座位上，面色铁青，有的人更是心不在焉。或许他们还沉浸在自己的旧日荣光中。"
 DOP_GNG_event.212.a: "看来，攻守之势异矣"
 DOP_GNG_event.213.t: "拉开帷幕"
 DOP_GNG_event.213.desc: "粤西各地的政府大楼又重新“开张”，但大多是本地人走进楼内开始办公。许多人把这当作新鲜事，毕竟之前有很多位子还是日本人坐着。\n\n这些新上任的官僚比起先前的大部分人都卖力得多，服务态度也不错，加上和他们沟通很方便，许多人对这种变化感到满意。尽管不断有传单在大街小巷中流通，说这是“以华制华”的重现，但目前没人在乎这些——这些人明显比北边的贪官污吏更能干。\n\n在广州则又呈现一番新景象：日裔们坐在办公室里，开始着手恢复各部门的日常工作。尽管也有一些本地人同他们共事，但大部分工作都由日本人来干。\n\n与先前的酒囊饭袋们不同，这些人是经过筛选的，不仅有能力，还有办事的热情。他们很多人在广东长期居住，思想上和民政派虽然略有分歧，但大多持正面态度。广东之所以启用他们，也是在向日裔们传达一个信息：效忠自有奖赏。\n\n时间来到下午三点，政务司宣布行政部门重组工作的完成，广东这台机器的零件终于齐全，而现在它将比以往更高效、稳定地运行。"
 DOP_GNG_event.213.a: "与此同时，舞台上的灯光再度亮起"
 DOP_GNG_event.214.t: "强攻"
 DOP_GNG_event.214.desc: "立法会今天太安静过头了。这地方三天两头就要爆发一场激烈的争执，哪怕天崩地裂，这里也在为了几个子的问题大动干戈。但今天不一样。今天所有人都在等稻叶秀三这个杀千刀的家伙，他们都知道今天的议题是什么，而他们也都做好了准备——当年他们怎么对铃木的，现在就怎么对稻叶。\n\n稻叶大步走上讲台，扫视台下的一百名议员后，吸了口气：“诸位，今天我想就立法会本身的问题向各位提出一个倡议。我认为立法会运行到今日，腐败和低效始终困扰着这个机构，也困扰着广东，所以我在此提出立法会重组一事……”\n\n“去你的吧！”台下不知道是谁喊了一声，随即演变成对稻叶的口诛笔伐。稻叶不慌不忙地看着台下声嘶力竭的议员们，直到最后一个人闭嘴，他才继续说下去：“……因此，希望各位可以辞去目前议员一职，并暂停立法会运行，待政府深思熟虑后再决定立法会的新运行模式。”\n\n先前的风暴很快再次席卷了立法会，议员们已经不分派系地向稻叶开火，随后盛田昭夫率先站起：“诸位！我认为稻叶长官没有权力要求立法会关闭！我们也绝不应该通过这份条例！”\n\n稻叶在心里暗暗咒骂这个通缉犯，但很快松下就起身表示赞同盛田的意见，并呼吁日侨“保卫自己的自由与权利”；李嘉诚也呼吁在场的珠人和为数不多的几名华人，让他们珍惜并捍卫自己最后的发声渠道；井深大则分析了行政长官独自决策可能造成的后果，认为稻叶是在妄自尊大；出人意料的是，驹井健一郎这次也和他们站在同一战线，并以他的老东家满洲为例，称稻叶是在葬送广东的未来。\n\n眼看众人的呼声越来越高，稻叶意识到他可能操之过急了，现在确实不是强行关闭立法会的时候。看来此事得从长计议。"
 DOP_GNG_event.214.a: "在保安的保护下，稻叶离开了会场"
