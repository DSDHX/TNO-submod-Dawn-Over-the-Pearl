l_simp_chinese:
 DOP_GNG_debug_flow_01_opening:0 "§MDOP流程调试 01§!：进入战后开局"
 DOP_GNG_debug_flow_01_opening_desc:0 "重新调用战后内容入口并载入§Y开局国策树§!。§R不会回滚已经发生的战争、领土或外交变化。§!"
 DOP_GNG_debug_flow_02a_yunnan_prewar:0 "§MDOP流程调试 02A§!：YUN推进至战前"
 DOP_GNG_debug_flow_02a_yunnan_prewar_desc:0 "直接完成§YYUN与GUZ合并§!，让§Y龙绳武§!领导护国军，载入§Y护国军国策树§!与本体军队模板并生成§Y10个护国军师§!，同时初始化政府、经济和对广东的进攻倾向。§G不会§!恢复被阻断的本体事件链，不会采用本体日期，也不会宣战；战争仍由§Y流程调试 02§!按DOP方式触发。"
 DOP_GNG_debug_flow_02_southwest_crisis:0 "§MDOP流程调试 02§!：触发西南危机"
 DOP_GNG_debug_flow_02_southwest_crisis_desc:0 "触发【Placeholder】§Y西南危机开场事件§!；若尚未执行§Y流程调试 02A§!，正式效果会先自动准备YUN。确认事件选项后，云南将按DOP设计吸收广西与海南并发动叛乱。"
 DOP_GNG_debug_flow_03_enter_war:0 "§MDOP流程调试 03§!：广东正式参战"
 DOP_GNG_debug_flow_03_enter_war_desc:0 "若危机尚未开始则先初始化危机，随后触发【Placeholder】§Y广东参战事件§!。"
 DOP_GNG_debug_flow_04_maoming_countdown:0 "§MDOP流程调试 04§!：启动茂名十四日倒计时"
 DOP_GNG_debug_flow_04_maoming_countdown_desc:0 "确保西南战争已经开始，并把§Y日本参战倒计时§!设为§Y14日§!。若日本已经参战，本决议不会撤回或重复生成部队。"
 DOP_GNG_debug_flow_05_japanese_reinforcements:0 "§MDOP流程调试 05§!：日本立即参战"
 DOP_GNG_debug_flow_05_japanese_reinforcements_desc:0 "确保西南战争已经开始，随后让§Y中国与广东重返共荣圈§!，使§Y日本§!加入对§YYUN§!的战争。等待§Y12小时§!刷新军事通行权后，将在§Y广州§!生成§Y12个日本装甲师§!并启用进攻AI；广州不可用时每12小时重试。战后这些部队会被清除。"
 DOP_GNG_debug_flow_06_postwar_settlement:0 "§MDOP流程调试 06§!：触发战后结算"
 DOP_GNG_debug_flow_06_postwar_settlement_desc:0 "确保广东已经参战，随后触发【Placeholder】§Y昆明胜利与战后安排事件§!；确认选项后执行停战、领土与附庸结算并载入重建树。"
 DOP_GNG_debug_flow_07_restore_legco:0 "§MDOP流程调试 07§!：恢复立法会"
 DOP_GNG_debug_flow_07_restore_legco_desc:0 "调用正式流程效果，使£GNG_legco_texticon §S广东国立法会§!恢复运作。"
 DOP_GNG_debug_flow_08_restore_map:0 "§MDOP流程调试 08§!：恢复区域治理地图"
 DOP_GNG_debug_flow_08_restore_map_desc:0 "调用正式流程效果，恢复区域地图，并纳入§Y海南、湛江与钦州§!数据。"
 DOP_GNG_debug_flow_09_unlock_construction:0 "§MDOP流程调试 09§!：开启岭南建设总署"
 DOP_GNG_debug_flow_09_unlock_construction_desc:0 "调用正式流程效果，初始化§Y岭南建设总署§!并开放项目12与13。"
 DOP_GNG_debug_flow_10_restore_product_cycle:0 "§MDOP流程调试 10§!：恢复产品周期"
 DOP_GNG_debug_flow_10_restore_product_cycle_desc:0 "调用正式流程效果，恢复£GNG_product_quality_texticon §f产品质量§!、£GNG_product_interest_texticon §m市场兴趣§!与产品周期界面。"
 DOP_GNG_debug_flow_11_unlock_scw:0 "§MDOP流程调试 11§!：开启三微米冷战"
 DOP_GNG_debug_flow_11_unlock_scw_desc:0 "调用正式流程效果，初始化§m三微米冷战§!市场、两个页面及4项初始可重复决议。"
 DOP_GNG_debug_flow_12_unlock_gsa:0 "§MDOP流程调试 12§!：开启广东科学院"
 DOP_GNG_debug_flow_12_unlock_gsa_desc:0 "调用正式流程效果，初始化£GNG_research_texticon §m广东科学院§!及其研究进度。"
 DOP_GNG_debug_flow_13_restore_economy_compare:0 "§MDOP流程调试 13§!：恢复GDP对比"
 DOP_GNG_debug_flow_13_restore_economy_compare_desc:0 "调用正式流程效果，恢复£GNG_actual_gdp_texticon §SGDP比较§!并把中华民国加入图表。"
 DOP_GNG_debug_flow_14_enter_core:0 "§MDOP流程调试 14§!：进入核心国策树"
 DOP_GNG_debug_flow_14_enter_core_desc:0 "重新调用第四阶段入口并载入§Y战后发展核心国策树§!。"
 DOP_GNG_debug_flow_15_lee_ending:0 "§MDOP流程调试 15§!：进入长实正面结局"
 DOP_GNG_debug_flow_15_lee_ending_desc:0 "设置§C李嘉诚/长实§!路线标志并载入对应结局树；不会自动完成结局国策。"
 DOP_GNG_debug_flow_16_ibuka_ending:0 "§MDOP流程调试 16§!：进入富士通正面结局"
 DOP_GNG_debug_flow_16_ibuka_ending_desc:0 "设置§m井深大/富士通§!路线与9点井深点数，并载入对应结局树；不会自动完成结局国策。"
 DOP_GNG_debug_flow_17_finance_ending:0 "§MDOP流程调试 17§!：进入财界结局"
 DOP_GNG_debug_flow_17_finance_ending_desc:0 "设置§L财界§!路线与0点井深点数，并载入对应结局树；不会自动完成结局国策。"
