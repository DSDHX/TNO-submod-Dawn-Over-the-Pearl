l_simp_chinese:
 DOP_GNG_year_of_the_rain: "风雨飘摇的时代"
 DOP_GNG_year_of_the_rain_desc: "虽然暴乱已经结束，石油危机带来的影响也在逐渐减退，但我们依然要堤防即将到来的风暴。\n\n在北方的中华民国，反日情绪正在蔓延，甚至有传闻称南京正推进着绝密计划，以求能与日本一战之力。尽管没有证据表明传闻的真实性，但我们应当对此予以重视……"
 DOP_GNG_res_from_oc: "拨云见日"
 DOP_GNG_res_from_oc_desc: "中日之间的关系确实日益紧张，但至少还没完全撕破脸。在那一天到来之前，广东应当作好完全准备，首当其冲的就是恢复经济秩序，使其回到石油危机前的水平。此外，我们应当考虑组建起应急部队，避免广东被可能到来的战火波及。\n\n准备开干吧，接下来有得忙了。"
 DOP_GNG_regen_econ: "重连经济网"
 DOP_GNG_regen_econ_desc: "五大企业的销售网络遍布全球，广东的贸易网（不管是合法的还是不合法的）亦是如此。为了重振我们的经济，恢复与全球的商业联系至关重要。我们会作出一系列决策，恢复我们的对外贸易。"
 DOP_GNG_wrecking_world: "全球的残垣断壁"
 DOP_GNG_wrecking_world_desc: "石油危机不仅对我们造成了破坏性影响，在全球亦是如此。全球的经济总体呈现下滑趋势，但很多国家和我们一样，正在逐步摆脱这恐怖的恶魔。\n\n在这一局势下，索尼亲民低廉的价格和长实对轻工产业的把握可谓占尽优势，再加上三合会的走私网络，我们可以比其他竞争者更快回归全球市场，并尽可能吃下最大的份额。"
 DOP_GNG_deal_w_labors: "暴乱的尾声"
 DOP_GNG_deal_w_labors_desc: "我们的收尾工作将进入最后阶段。现在要解决两个问题，其一是受影响最深的项目之一——茂名石油开采的重启，其二是解决暴乱爆发的遗留问题——残存的抗议人士。只有把这两个问题解决好，广东才能做更多事来应对紧张的局势。"
 DOP_GNG_more_jobs: "诱之以利"
 DOP_GNG_more_jobs_desc: "茂名的石油开采一直由帝国陆军管辖，这意味着日企和军队彻底掌握了这一命脉。在石油危机期间，当地石油产业虽仍在运行，但已元气大伤，暴乱期间更是全面停工。现在我们决定重启石油开采，但这次我们要想办法入局。"
 DOP_GNG_legal_compromise: "动之以情"
 DOP_GNG_legal_compromise_desc: "尽管盛田行政长官实行了诸多应急政策，但我们很清楚这还不够，许多华人和珠人由于石油危机失业或破产，而由于资金问题，我们没能对他们施以援手。\n\n为了稳定这部分人的情绪，体现我们解决暴乱的诚意，便于拉拢他们，我们会同他们进行谈判，并尽可能满足他们的经济需求。尽管这对我们的财政没太大好处，但长远来看，这是笔不错的投资。"
 DOP_GNG_save_unemp: "广东失业救济法"
 DOP_GNG_save_unemp_desc: "第一份法案的内容已经敲定，我们对参差不齐的失业救济政策进行了统一，同时要求企业对此负责。许多人——比如井深大和驹井健一郎——会对此大发雷霆，但这是我们必行之事。\n\n愿我们所做的这一切能有所回报……"
 DOP_GNG_maoming_ins: "石油自主化计划"
 DOP_GNG_maoming_ins_desc: "日企对当地产业掌控的削弱给了我们一个机会，我们得以将当地的石油收入囊中。但考虑到日本意图收紧对华控制，加上日企与军方的关系，我们需要慎重推动这一进程，尤其是注意我们和驻军日益紧张的关系……"
 DOP_GNG_pan_thai_bay: "环泰国湾经济合作"
 DOP_GNG_pan_thai_bay_desc: "共荣圈内除了日本、中国以及和我们水火不容的满洲，最值得我们投资的应该就是东南亚地区了。泰国、柬埔寨等国原本就存在大量日资或中资企业，而在石油危机中，不少人黯然退场。在其他巨头反应过来之前，我们应当迅速出击，抢占市场。\n\n索尼会联合长江实业和松下，一同进军东南亚地区，特别是环泰国湾国家——他们具有良好的运输条件和经济潜力。广东的其他企业也会在这里投资建厂，为当地提供就业机会的同时增加我们的收益，可谓共赢。"
 DOP_GNG_gd_mex_col: "跨越太平洋的朋友"
 DOP_GNG_gd_mex_col_desc: "美国和日本在冷战中对峙，但这也意味着有中间人的存在。墨西哥，这个国家一直左右逢源，在美日之间充当着调停人的角色，美国和日本商界的联系也大多依赖这条渠道。\n\n美国从石油危机中恢复的速度很快，而我们也决定依靠墨西哥渠道打开北美市场。其他企业尚未占据的市场，将全部被我们吃干抹净。"
 DOP_GNG_expand_d: "索尼，以旧换新"
 DOP_GNG_expand_d_desc: "不可否认的是，井深确实说对了：创新和卓越是广东经济的动力来源。客户们明显对常规的产品失去了兴趣，而我们要满足市场需求的话，就必须在科研上取得突破。让工程师们的脑袋转起来吧，索尼也要走在时代的最前列！"
 DOP_GNG_lower_barrier: "翻热股市"
 DOP_GNG_lower_barrier_desc: "股票一定程度上反映了市场的稳定和投资人的信心，在石油危机期间，证券交易所就因为大量抛售陷入混乱，股票也一跌再跌。\n\n为了提振经济，我们将发行新股，让更多投资者参与进来。我们和他们的腰包会一同鼓起来。"
 DOP_GNG_rightous_def: "正当防卫"
 DOP_GNG_rightous_def_desc: "好吧，我们必须承认，情况有可能正走向失控。\n\n我们在南京的信源正忧心忡忡地谈论我们北方的兄弟境内发生的异动，来自民间社会团体甚至地方政府的共荣圈怀疑言论层出不穷、官员们也日益自行其是。按理来说我们不应该过度关心这些事情，但是，他们离我们实在是太近了。\n\n城池失火，殃及池鱼。我们必须做些什么，否则当火焰燎原时，我们只会像无助的孩子一样听天由命。\n\n当然，我们不能引起投资者和客户们的恐慌……"
 DOP_GNG_rearm_pol: "警务处再武装化"
 DOP_GNG_rearm_pol_desc: "作为广东立国之本之一的《地位协定》，一方面将我们置于日升之国的庇佑之下，同时也像一道道铁索，束缚着这个年轻而又愈发强壮的健儿发挥其力量。\n\n诚然，我们并没有理由在当下去质疑他们的好意，但我们迫切地需要提升自身的国防实力，以应对最坏情况的发生。而我们只得将目光转向我们唯一称得上强有力的部门——警务处。\n\n自近十年前的改革以来，警务处虽脱胎换骨，但为凸显其扎根于本土的亲民属性，我们将杀伤性武器束之高阁。但如今，我们需要我们警察再度拿起武器，为那我们不愿看到的未来做好准备，当然，我们不会从发霉的地下室里将那些爷爷辈的古董重新启用。"
 DOP_GNG_cps_info_co: "共荣圈情报协作"
 DOP_GNG_cps_info_co_desc: "无描述"
 DOP_GNG_fill_resp_troops: "充实对策部队"
 DOP_GNG_fill_resp_troops_desc: "为应对跨地域事态，我们设立了紧急事态对策部门，这些由警力充沛的地区的人员组成的队伍一直以来都在为这个国家赴汤蹈火，奔走于平原与山丘，城市与村落。\n\n如今我们依然需要他们，我们将以这些单位作为种子，初步组建我们的防卫力量，我们将为他们提供准军事化的武器装备及训练课程，对其组织形式进行改组，以便其能在必要时发挥出我们所需要的作用。"
 DOP_GNG_reiterate_our_pos: "重审《地位协定》"
 DOP_GNG_reiterate_our_pos_desc: "无描述"
 DOP_GNG_army_of_gadfly: "袭扰与阻滞"
 DOP_GNG_army_of_gadfly_desc: "无描述"
 DOP_GNG_faux_opening: "新的十字路口"
 DOP_GNG_faux_opening_desc: "在索尼与长实的努力下，广东扫清了国土上的碎石与瓦砾，恢复了往日的元气，大东亚战争宛如昨日的幻梦，而从噩梦中惊醒过来的行政长官深知，在风云变幻的战后共荣圈内，小小的企业国需要再一次为未来做出抉择。倘若他能活用执政以来的英明远见，使得这片土地保持十年前的冲劲，广东仍能远东的碧空之上翱翔。但请行政长官先生小心，倘若棋差一步，广东和您本人则将粉身碎骨……"
